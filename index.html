: "rz23", "cat": "po_bv", "page": 0, "pages": [], "title": "Как отключить БВ", "steps": ["Переключить тумблеры «МПК1» / «МПК2» (или наоборот)."], "notes": [], "kind": "fault", "imgs": [{"k": "r013", "c": "Слайд 13"}], "src": "Ружино 2022"}, {"id": "rz24", "cat": "po_vm", "page": 0, "pages": [], "title": "ДП: нет запуска ДП и вспомогательных машин на одной секции", "steps": ["Проверить SF23, SF25.", "Кратковременно включить «Возврат реле».", "Переключить МПК1 на МПК2.", "На виртуальном пульте перезапустить ДП. Не помогло — отключить ДП, в работе оставить один из МВ."], "notes": [], "kind": "fault", "imgs": [{"k": "r014", "c": "Слайд 14"}], "src": "Ружино 2022"}, {"id": "rz25", "cat": "po_vm", "page": 0, "pages": [], "title": "МВ: нет запуска МВ1", "steps": ["Под пультом машиниста подать «+» на провод Н25 (правая рейка)."], "notes": [], "kind": "fault", "imgs": [{"k": "r014", "c": "Слайд 14"}, {"k": "r015", "c": "Слайд 15"}], "src": "Ружино 2022"}, {"id": "rz26", "cat": "po_vm", "page": 0, "pages": [], "title": "МВ: нет запуска МВ1 или МВ2 на одной секции", "steps": ["На блоке 8 неисправной секции перемычка «+» КМ11 (Н148) – Н150 («+» КМ12).", "Чтобы МСУД не разбирал схему, перемычка «+» КМ41 (Н422) – Н423 («+» КМ42)."], "notes": [], "kind": "fault", "imgs": [{"k": "r014", "c": "Слайд 14"}], "src": "Ружино 2022"}, {"id": "rz27", "cat": "po_vm", "page": 0, "pages": [], "title": "МВ: нет запуска МВ1 или МВ2 без захода в ВВК", "steps": ["На клеммной рейке Х70 в трансформаторном помещении за пом. машиниста перемычка Н25 – Н26.", "В зажимы рейки можно вкрутить саморезы или вставить гвозди, чтобы зацепить стандартные зажимы перемычки."], "notes": [], "kind": "fault", "imgs": [{"k": "r014", "c": "Слайд 14"}], "src": "Ружино 2022"}, {"id": "rz28", "cat": "po_vm", "page": 0, "pages": [], "title": "МН: не включается маслонасос", "steps": ["На блоке 8 больной секции заклинить КМ15 и его низковольтную блокировку.", "На больных секциях перемычка «+» КМ15 (Н156) – «+» КМ11 (Н148) или КМ12 (Н150); управление МВ1, МВ2.", "Или на головной/задней секции перемычка «+» КМ15 (Н156) – «+» KV51 (Н354) или KV52 (Н355), управлять тумблерами «Печи ступень 1, 2» (на задней — из своей кабины).", "Если МН не включился или включился, но тяга не собирается: на клеммной рейке тягового трансформатора Х56 159-02 перемычка Н258 – Н393, на виртуальном пульте включить МН.", "Если МН не нужен (зима) или неисправен, а тяга нужна: КМ15 расклинить в отключённом положении, блокировочные контакты подклинить (или перемычка Н635 – Н166). На Х56 159-02 перемычка Н258 – Н393. МН на виртуальном пульте должен быть включён. Масло не греть выше 90 °С. Тяга не собирается — переключить SF23."], "notes": [], "kind": "fault", "imgs": [{"k": "r016", "c": "Слайд 16"}, {"k": "r017", "c": "Слайд 17"}], "src": "Ружино 2022"}, {"id": "rz29", "cat": "po_vm", "page": 0, "pages": [], "title": "МН подключён, давление есть, горит лампа «ТР»", "steps": ["На клеммной рейке тягового трансформатора Х56 159-02 перемычка Н023 – Н258."], "notes": [], "kind": "fault", "imgs": [{"k": "r018", "c": "Слайд 18"}], "src": "Ружино 2022"}, {"id": "rz30", "cat": "po_vm", "page": 0, "pages": [], "title": "SP10: отключение ВБО и «запрет включения ГВ» при 80 °С масла", "steps": ["Для охлаждения масла и освобождения перегона: на Х56 159-02 перемычка Н258 – Н393.", "При включении ВБО «Запрет включения ВБО»: F → 2 → 1029 → 4 → 1 → Е (ESC)."], "notes": [], "kind": "fault", "imgs": [{"k": "r018", "c": "Слайд 18"}], "src": "Ружино 2022"}, {"id": "rz31", "cat": "po_vm", "page": 0, "pages": [], "title": "МК: нет питания (без захода в ВВК)", "steps": ["Выключить кнопку «Компрессор».", "Под пультом машиниста две клеммные рейки: перемычка Н025 или Н023 с левой рейки на Н027 правой рейки.", "МК работает штатно; перед НВ «крокодил» снять."], "notes": [], "kind": "fault", "imgs": [{"k": "r019", "c": "Слайд 19"}], "src": "Ружино 2022"}, {"id": "rz32", "cat": "po_vm", "page": 0, "pages": [], "title": "МК: подключение от тумблера «Освещение тележек»", "steps": ["На больной секции зайти в ВВК с блока 9; с обратной стороны блока 8 перемычка «+» КМ14 (Н154) – Н532 (KV78) блок 9 (длинной перемычкой из двух).", "Проверить питание KV78 по горящим светодиодам. Не горят — на клеммных рейках Х55 и Х57 ниже перемычка Н023 – Н014.", "При «Запрет включения ГВ» после включения ВБО: F → 2 → 1029 → 4 → 1 → Е.", "На пульте пом. машиниста включить «Освещение тележек». МК включать при работающих МВ1, МВ2 (генерация третьей фазы)."], "notes": [], "kind": "fault", "imgs": [{"k": "r019", "c": "Слайд 19"}, {"k": "r020", "c": "Слайд 20"}], "src": "Ружино 2022"}, {"id": "rz33", "cat": "po_tyaga", "page": 0, "pages": [], "title": "QT не перешли в режим «Тяга»", "steps": ["По МСУД в контроле оборудования определить секцию.", "Открыть шторы ВВК. В блоке А11 с торца на средней клеммной рейке Х58 кратковременно соединить провода 38 и 26; в блоке А12 то же на средней рейке Х56.", "Нет перевода — перевести вручную: нажать крайний ЭПВ (разводным ключом Х19 на правой лобовине или ногой) для включения крайних силовых контактов."], "notes": [], "kind": "fault", "imgs": [{"k": "r021", "c": "Слайд 21"}], "src": "Ружино 2022"}, {"id": "rz34", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Движение без КЛУБ и ЭПК", "steps": ["Получив приказ ДНЦ на следование с отключёнными ПБ, на пульте машиниста перевести тумблер S4 «ЭПК».", "Схема не собирается — под пультом машиниста подать питание на Н10 (правая рейка)."], "notes": [], "kind": "fault", "imgs": [{"k": "r022", "c": "Слайд 22"}], "src": "Ружино 2022"}, {"id": "rz35", "cat": "po_tyaga", "page": 0, "pages": [], "title": "КМЭ: в «0» не загорается «ВИП», после отключения ГВ нет его включения (подгар 15-16, нет питания Э20 на KV9)", "steps": ["Признак: при отключении МВ1, МВ2 загораются «ВИП» и «ТД1–ТД4».", "Вариант 1: на головной секции на ПР-855 перемычка Э20 («+» KV9) – Э27 (KV9), управлять тумблером «Возврат защиты».", "Вариант 2: на всех секциях заклинить KV9; на головной на блокировках KV9 изоляция в Н023 – Н7 и перемычка Н7 – Э27, управлять кнопкой «Возврат защиты» (для БВ — КМЭ в «0», кратковременно; перед выходом из «0» включить, в зоне отпустить).", "Вариант 3: KV9 заклинить на всех секциях (на бустерной KV9 на блоке 8); на головной изоляция Н023 – Н7 и длинная перемычка Н7 (KV9) – Э29 (KV44) блок 8, управлять кнопкой «Токоприёмник передний»; на головной перекрыть кран КН41.", "Вариант 4 (без захода в ВВК): в шкафу клеммных реек за пом. машиниста перемычка Э20 – правый нож рубильника SA3 шкафа питания А25. Так же можно запитывать другие аппараты и вспомогательные машины."], "notes": [], "kind": "fault", "imgs": [{"k": "r022", "c": "Слайд 22"}, {"k": "r023", "c": "Слайд 23"}], "src": "Ружино 2022"}, {"id": "rz36", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Нет нагрузки на одной секции, после смены МПК нагрузки нет", "steps": ["Признаки: в кадре «Сигнализация» лампы неисправной секции не горят; в «Диагностике МСУД» секция серая.", "На блоке 1 больной секции выключить и включить SF47 (МПК1), SF48 (МПК2). На головной они в кабине у пом. машиниста, верхний ряд.", "На блоке 8 проверить KV14 и контакторы КМ63, КМ64. Если выключены — запитать один: КМ63: провод 049 («+» катушки) – Н023 (правый верхний силовой контакт КМ63); КМ64: провод 050 – Н023 (правый верхний силовой КМ64). Не включается — подклинить якорь.", "На шкафу А2, А3 должен гореть зелёный «МПК1» или «МПК2», в кадре «Сигнализация» появятся лампы."], "notes": [], "kind": "fault", "imgs": [{"k": "r024", "c": "Слайд 24"}], "src": "Ружино 2022"}, {"id": "ch1", "cat": "po_tkp", "page": 0, "pages": [], "title": "Токоприемники не поднимаются, необходимо проверить.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c044", "c": "Альбом, стр. 44"}, {"k": "c045", "c": "Альбом, стр. 45"}], "src": "Чита 2024", "paras": [{"t": "Проверить включение автомата SF21 «Токоприемники», напряжение в цепях управления не менее 35 В, давление воздуха в цепях управления не ниже 5 атм. По манометру МН6, открытие крана КН41 и давление в пневмоприводе токоприемника не менее 2,4 атм по манометру МН8, в силовых блоках А11 и А12 проверить отключение разъединителей QS5 и QS8, на блоке 9 проверить отключение разъединителей QS28 и QS27, на всех секциях проверить выход блокировок штор ВВК. На электровозах с №1000 при включении блокировки тормозов 367 (SQ1) на головной секции получает питание реле KV7 расположенное на блоке 8 (на головной секции включено, на задней выключено).", "b": false}]}, {"id": "ch2", "cat": "po_tkp", "page": 0, "pages": [], "title": "Токоприемники не поднимаются, штока ПБ не вышли.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c045", "c": "Альбом, стр. 45"}, {"k": "c046", "c": "Альбом, стр. 46"}], "src": "Чита 2024", "paras": [{"t": "Штока не вышли на всех секциях.", "b": true}, {"t": "На блоке 8 головной секции перемычка с Э26 (KV12) на Э29 (KV44), для поднятия переднего токоприемника включить на пульте машиниста кн. «Главный выключатель».", "b": false}, {"t": "Или на блоке 8 головной секции перемычка с Н354 (+KV51) на Э29 (KV44), включить тумблер S49 «Печи ступень 1».", "b": false}, {"t": "ПРИМЕЧАНИЕ: на электровозах 3ЭС5К №434 и 4ЭС5К с №001 по №003 реле KV12 и KV44 расположены на панели 7.", "b": false}, {"t": "Штока не вышли на одной секции.", "b": true}, {"t": "На «больной» секции вентиль защиты Y1 включить вручную. Или на блоке 8 всех секций заклинить реле KV44, поднять тот токоприемник где вышли блокировки штор ВВК.", "b": false}, {"t": "ПРИМЕЧАНИЕ: на электровозах 3ЭС5К №434 и 4ЭС5К с №001 по №003 реле KV12 и KV44 расположены на панели 7.", "b": false}]}, {"id": "ch3", "cat": "po_tkp", "page": 0, "pages": [], "title": "Токоприемники не поднимаются, штока ПБ вышли.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c047", "c": "Альбом, стр. 47"}], "src": "Чита 2024", "paras": [{"t": "На всех секциях на блоке 8 проверить положение переключателя Q6 (включен вверх), на блоке 9 проверить положение разъединителей QS28 и QS27 (отключены), на пульте машиниста проверить блокировку SQ6. На блоке 8 всех секций проверить включение реле KV44.", "b": false}, {"t": "Если реле KV44 не включилось, то на блоке 8 всех секциях заклинить. Или на блоке 8 головной секции перемычка с Э29 (KV44) на Э36 (+KV44), включить кн. «Токоприемник передний».", "b": false}, {"t": "ПРИМЕЧАНИЕ: на электровозах 3ЭС5К №434 и 4ЭС5К с №001 по №003 реле KV12 и KV44 расположены на панели 7.", "b": false}]}, {"id": "ch4", "cat": "po_tkp", "page": 0, "pages": [], "title": "При проезде нейтральной вставки отключается ГВ и опускается токоприемник.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c047", "c": "Альбом, стр. 47"}], "src": "Чита 2024", "paras": [{"t": "Сгорела или неисправна катушка Г вентиля защиты Y1 на одной из секций, вентиль защиты Y1 включить вручную.", "b": false}]}, {"id": "ch5", "cat": "po_tkp", "page": 0, "pages": [], "title": "При включении кн. «Токоприемник задний или передний» срабатывает автомат SF21 «Токоприемники».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c047", "c": "Альбом, стр. 47"}, {"k": "c048", "c": "Альбом, стр. 48"}], "src": "Чита 2024", "paras": [{"t": "Автомат SF21 не восстанавливать, кн. «Токоприемник передний и задний не включать.", "b": false}, {"t": "На блоке 8 головной секции на реле KV44 изоляция в проводах Э26 – Н236.", "b": false}, {"t": "На блоке 8 головной секции перемычка с Э26 (KV12) на Н236 (KV44).", "b": false}, {"t": "На блоке 8 всех секций реле KV44 заклинить.", "b": false}, {"t": "На головной (или всех секциях) вентиль защиты Y1 включить вручную.", "b": false}, {"t": "Для подъема токоприемника включить кн. «Главный выключатель».", "b": false}, {"t": "ПРИМЕЧАНИЕ: на электровозах 3ЭС5К №434 и 4ЭС5К с №001 по №003 реле KV12 и KV44 расположены на панели 7.", "b": true}]}, {"id": "ch6", "cat": "po_gv", "page": 0, "pages": [], "title": "ГВ не включается на всех секциях, необходимо проверить.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c050", "c": "Альбом, стр. 50"}], "src": "Чита 2024", "paras": [{"t": "Проверить включение автоматов SF22 «Главный выключатель», SF23 «Тяга»; напряжение в цепях управления не менее 35 В; давление в цепях управления не менее 5 атм; включения блока А23 сигнального табло; включение блока А78 индикации МСУД; поднятие токоприемника и включения ГВ; на панели ПР-855 проверить включение реле KV9 всех секций, на блоке 8 головной секции проверить включение реле |KV8.", "b": false}]}, {"id": "ch7", "cat": "po_gv", "page": 0, "pages": [], "title": "Не включено реле KV9 всех секций, нет включения ГВ.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c050", "c": "Альбом, стр. 50"}, {"k": "c051", "c": "Альбом, стр. 51"}, {"k": "c052", "c": "Альбом, стр. 52"}, {"k": "c053", "c": "Альбом, стр. 53"}], "src": "Чита 2024", "paras": [{"t": "Признак: нет включения ГВ на всех секциях, в кадре БИ МСУД «Контроль оборудования» горит серым строка «KV9 – SM1 в положении «0» или «П» - Н7», при осмотре панели ПР-885 реле KV9.", "b": false}, {"t": "нет питания на реле KV9.", "b": true}, {"t": "На головной секции перекрыть кран КН41 на токоприемник. На клеммной рейке Х66 в коридоре на стенке за пом/машинистом перемычка с Э29 на Э20, включить кн. «Токоприемник передний». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить кн. «Токоприемник передний» и перевести контроллер в зону регулирования. При постановке КМЭ в положение «П» включить кн. «Токоприемник передний».", "b": false}, {"t": "Выход на электровозах до №986 (панель ПР-855 в БСА1): На всех секциях на панели ПР-855 заклинить реле KV9. На реле KV9 поставить изоляцию в проводах Н023 – Н7. На головной секции на панели ПР-855 перемычка с Н384 (+КМ24) на Н7 (KV9) и включить тумблер «Калорифер1». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить тумблер «Калорифер1» и перевести контроллер в зону регулирования. При постановке КМЭ в положение 0 включить тумблер «Калорифер1».", "b": false}, {"t": "Выход на электровозах с №986 (панель ПР-855 в БСА2): На всех секциях на панели ПР-855 заклинить реле KV9. На реле KV9 поставить изоляцию в проводах Н023 – Н7. На головной секции перекрыть кран КН41 на токоприемник. На блоке 8 поставить перемычку с Э29 (KV44) на Н7 (KV9 – панель ПР-855) и включить кн. «Токоприемник передний». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить кн. «Токоприемник передний» и перевести контроллер в зону регулирования. При постановке КМЭ в положение 0 включить кн. «Токоприемник передний».", "b": false}]}, {"id": "ch8", "cat": "po_gv", "page": 0, "pages": [], "title": "При включении блокировки тормозов 367 нет запуска МСУД, не горит блок сигнализации А23, нет включения ГВ. Причина не включилась реле KV8 (и KV7 на электровозах с №1000).", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c054", "c": "Альбом, стр. 54"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 головной секции перемычка с Э26 (KV12) на Н4 (+KV8), включить кн. «Главный выключатель». При смене кабин управления перемычку убрать.", "b": false}, {"t": "ПРИМЕЧАНИЯ: при постановке перемычки дополнительно можно заклинить реле KV8 и KV7.", "b": true}]}, {"id": "ch9", "cat": "po_gv", "page": 0, "pages": [], "title": "ГВ не включается на всех секциях, определить, где нет питания в нет питания в кн. «Главный выключатель» (провод Э26) или в кн. «Возврат защиты».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c055", "c": "Альбом, стр. 55"}, {"k": "c056", "c": "Альбом, стр. 56"}, {"k": "c057", "c": "Альбом, стр. 57"}, {"k": "c058", "c": "Альбом, стр. 58"}], "src": "Чита 2024", "paras": [{"t": "В основном кадре БИ МСУД нажать клавишу 6 «Контроль оборудования» и смотрим при включенной кн. «Главный выключатель» строка 15 «Главный выключатель в S20» горит «серым» значит нет питания в проводе Э26, если горит черным – питание есть. После нажимаем на БИ МСУД клавишу 4 « Выбор платы» и нажимаем кн. Возврат защиты» строка 5 «Возврат защиты в S20» горит «серым» значит нет питания в проводе Э27, если горит черным – питание есть.", "b": false}, {"t": "В основном кадре БИ МСУД нажать клавишу 6 «Контроль оборудования» и смотрим при включенной кн. «Главный выключатель» строка 15 «Главный выключатель в S20» горит «серым» значит нет питания в проводе Э26, если горит черным – питание есть. После нажимаем на БИ МСУД клавишу 4 « Выбор платы» и нажимаем кн. Возврат защиты» строка 5 «Возврат защиты в S20» горит «серым» значит нет питания в проводе Э27, если горит черным – питание есть.", "b": true}, {"t": "ГВ не включается на всех секциях, нет питания в проводе Э26.", "b": true}, {"t": "На блоке 8 головной секции перемычка с Э36 (+KV44) на Э26 (KV12), включаем кн. «Токоприемник передний или задний» (токоприемник поднялся) и для включения ГВ на 2-3 секунды нажимаем кн. «Возврат защиты». Для отключения ГВ кратковременно отключаем кн. «Токоприемник передний или задний».", "b": false}, {"t": "Можно на головной секции на блоке 8 перемычка с Н354 (+KV51) на Э26(KV12), включить тумблер «Печи ступень 1» и для включения ГВ на 2-3 секунды нажимаем кн. «Возврат защиты». Для отключения ГВ отключить тумблер «Печи ступень 1» (летом на ЩПР отключить автомат SF5 «Печи ступень 1», чтоб не грели).", "b": false}, {"t": "ГВ не включается на всех секциях, нет питания в проводе Э27.", "b": true}, {"t": "На клеммных рейках за пом/машинистом поставить перемычку с Н30 (Х70) на Э27 (Х66), для включения ГВ на пульте машиниста включить кнопку «Главный выключатель» и кратковременно на 2-3 секунды кнопку «Возврат реле».", "b": false}, {"t": "Если результата нет, то на блоке 8 головной секции На головной секции на блоке 8 перемычка с Н354 (+KV51) на Н205 (+KV43), для включения ГВ включить кн. «Главный выключатель» и на 2-3 секунды тумблер «Печи ступень 1».", "b": false}]}, {"id": "ch10", "cat": "po_gv", "page": 0, "pages": [], "title": "ГВ не включается на одной секции.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c059", "c": "Альбом, стр. 59"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 «больной» секции осмотреть реле KV43 и KV41 на предмет заедания и подгара блокировочных контактов, при необходимости зачистить.", "b": false}, {"t": "На блоке 8 «больной» секции перемычка с Н205 (+KV43) на Н210 (KV41), ГВ включать обычным порядком.", "b": false}, {"t": "Если результата нет, ГВ включить принудительно под воздухом.", "b": false}]}, {"id": "ch11", "cat": "po_gv", "page": 0, "pages": [], "title": "Включение ГВ принудительно под воздухом.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c060", "c": "Альбом, стр. 60"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 «больной» секции перемычка с Э26 (KV12) на Н204 (KV43) и расклинить реле KV2, в кабине машиниста включить кн. «Главный выключатель» и с соблюдением Т.Б. зайти в трансформаторный отсек и нажать на шток включающего эл/магнита вакуумной камеры ГВ. После включения ГВ закрыть шторы ВВК, поднять токоприемник и включить ГВ на остальных секциях. После включения ГВ на всех секциях сменить комплект МПК.", "b": false}]}, {"id": "ch12", "cat": "po_gv", "page": 0, "pages": [], "title": "ГВ включается и отключается на одной секции.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c060", "c": "Альбом, стр. 60"}, {"k": "c061", "c": "Альбом, стр. 61"}], "src": "Чита 2024", "paras": [{"t": "Повторное включение ГВ ЗАПРЕЩЕНО. Пом/машиниста должен осмотреть неисправную секцию и доложить состояние аппаратов блинкерной защиты: РЗ – KV1 блока А161 и А162, КА1-6; КА8; КА9. Машинист проверяет при помощи архива МСУД. При помощи архива МСУД проверить срабатывание РМТ.", "b": true}, {"t": "Если РМТ и аппараты блинкерной защиты не сработали, то в трансформаторном отсеке перемычка с Э28 (центральная клеммная рейка) на Н212 (КА9). ГВ включается обычным порядком. ПОСТОЯНЫЙ КОНТРОЛЬ ЗА АППАРАТАМИ", "b": false}, {"t": "БЛИНКЕРНОЙ ЗАЩИТЫ НА ТОЙ СЕКЦИИ ГДЕ УСТАНОВЛЕНА ПЕРЕМЫЧКА, ПРИ СРАБАТЫВАНИИ ЗАЩИТЫ ГВ ОТКЛЮЧАТЬ КН. «ТОКОПРИЕМНИК ПЕРЕДНИЙ ИЛИ ЗАДНИЙ».После чего перемычку убрать.", "b": true}]}, {"id": "ch13", "cat": "po_gv", "page": 0, "pages": [], "title": "ГВ отключается на одной или всех секциях, БИ МСУД выдает информацию «Запрет включения ГВ системой МСУД – недопустимый уровень напряжения в контактной сети».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c061", "c": "Альбом, стр. 61"}], "src": "Чита 2024", "paras": [{"t": "В трансформаторном отсеке на «больной» или всех секциях на главном вводе тягового трансформатора отсоединить фишки от счетчика электроэнергии СЭПТ-04.", "b": false}]}, {"id": "ch14", "cat": "po_gv", "page": 0, "pages": [], "title": "При включении блокировки тормозов 367 срабатывает автомат SF22 «Главный выключатель».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c061", "c": "Альбом, стр. 61"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 головной секции поставить изоляцию в проводах Н022 – Н135.", "b": false}, {"t": "На блоке 8 всех секций заклинить реле KV12, Если МСУД предусматривает работу на МПК2, то на блоке 8 всех секций заклинить реле KV14.", "b": false}, {"t": "ГВ включать обычным порядком.", "b": false}]}, {"id": "ch15", "cat": "po_gv", "page": 0, "pages": [], "title": "При включении кн. «Главный выключатель» срабатывает автомат SF22 «Главный выключатель».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c062", "c": "Альбом, стр. 62"}], "src": "Чита 2024", "paras": [{"t": "ДЕЙСТВИЕ:", "b": false}, {"t": "На пульте пом/машиниста отключить все тумблера С1-4 «Отключения секций», восстановить автомат SF22 и включить кн. «Главный выключатель».", "b": false}, {"t": "Если автомат сработал, то К.З. в проводе Э26.", "b": false}, {"t": "Если автомат не сработал, то поочередным включением тумблера «Отключения секций» определить «больную»", "b": false}, {"t": "секцию.", "b": false}, {"t": "К.З. в проводе Э26.", "b": true}, {"t": "Автомат SF22 восстановить, кн. «Главный выключатель» не включать.", "b": false}, {"t": "На блоке 8 всех секций изоляция в проводах Э26 – Н202 на реле KV12.", "b": false}, {"t": "На блоке 8 всех секций перемычка с Э36 (+KV44) на Н202 (KV12).", "b": false}, {"t": "Для включения ГВ поднять токоприемник и на 2-3 секунды включить кн. «Возврат защиты».", "b": false}, {"t": "Неисправная секция отключение определяется поочередным включением тумблеров «Отключение секций».", "b": true}, {"t": "НЕИСПРАВНУЮ СЕКЦИЮ НЕ ИСПОЛЬЗОВАТЬ.", "b": false}, {"t": "ПРИМЕЧАНИЕ: можно на «больной» секции на блоке 8 на реле KV12 поставить изоляцию в проводах Э26 – Н202 и на реле KV43 в проводах Н204 – Н209. В трансформаторном отсеке на реле перегрузки КА9 отсоединить провод Н212 и соединить его перемычкой с проводом Э28 (клеммная рейка трансформатора). На блоке 8 перемычка с Н205 (+KV43) на Н209 (KV43). ГВ включать при поднятом токоприемнике обычным порядком. При постановке перемычки с Н212 на Э28 сработает автомат SF21 «токоприемники», секцию отключить. ДАННЫЙ СПОСОБ ИСПОЛЬЗОВАТЬ В КРАЙНЕМ СЛУЧАЕ.", "b": false}]}, {"id": "ch16", "cat": "po_gv", "page": 0, "pages": [], "title": "При включении кн. «Возврат защиты» срабатывает автомат SF22 «Главный выключатель».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c062", "c": "Альбом, стр. 62"}, {"k": "c063", "c": "Альбом, стр. 63"}], "src": "Чита 2024", "paras": [{"t": "ДЕЙСТВИЕ:", "b": true}, {"t": "На пульте машиниста отключить кН. «Главный выключатель», восстановить автомат SF22 и нажать кН. «Возврат защиты».", "b": false}, {"t": "Если автомат сработал, то К.З. в цепи реле KV43.", "b": false}, {"t": "Если автомат не сработал, то К.З. в цепи включающей катушки ГВ.", "b": false}, {"t": "К.З в цепи реле KV43.", "b": true}, {"t": "________________________________________________________________________________________________________ ________________________________________________________________________________________________________ ________________________________________________________________________________________________________ ________________________________________________________________________________________________________ ________________________________________________________________________________________________________ ________________________________________________________________________________________________________", "b": false}, {"t": "К.З в цепи включающей катушки ГВ.", "b": true}, {"t": "При помощи тумблеров «отключение секций» определить «больную» секцию. На «больной» секции на блоке 8 на реле KV43 изоляция в проводах Н204 – Н209, ГВ включить принудительно под воздухом (смотри пункт 5).", "b": false}]}, {"id": "ch17", "cat": "po_bv", "page": 0, "pages": [], "title": "ГВ включается на всех секциях, но нет включения БВ (на БИ МСУД в кадре сигнализация горит индикация ТД1-4 на всех секциях).", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c065", "c": "Альбом, стр. 65"}], "src": "Чита 2024", "paras": [{"t": "На панели ПР-855 (расположена или в БСА1 или в БСА2 на задней стенке) головной секции осмотреть реле KV9, обратив внимание на блокировочный контакт в приводах Н023 – Н7, при необходимости зачистить. Если результата нет, то на реле KV9 головной секции на панели ПР-855 изоляция в проводах Н023 – Н7 и перемычка с Э20 (+KV9) на Н7 (KV9). БВ включать обычным порядком.", "b": false}]}, {"id": "ch18", "cat": "po_bv", "page": 0, "pages": [], "title": "Не включается БВ на одной секции, включение принудительно под воздухом.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c065", "c": "Альбом, стр. 65"}], "src": "Чита 2024", "paras": [{"t": "При не включении БВ сменить комплект с МПК1 на МПК2 или наоборот.", "b": false}, {"t": "Если результата нет, то на «больной» секции БВ включить принудительно под воздухом. В силовых блоках А11 и А12 на разъединителях QS5 и QS8 обвести перемычкой нормально разомкнутые блокировочные контакты в проводах Н023 – Н605 (A11-QS5), H023 – H606 (A11-QS8) и Н023 – Н625 (A12-QS5), H023 – H626 (A12-QS8). На пульте машиниста включить кн. «Главный выключатель» и нажать на шток включающих катушек БВ.", "b": false}]}, {"id": "ch19", "cat": "po_vm", "page": 0, "pages": [], "title": "Нет запуска пускового двигателя при включении кнопок вспомогательные машины на пульте машиниста.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c066", "c": "Альбом, стр. 66"}, {"k": "c067", "c": "Альбом, стр. 67"}], "src": "Чита 2024", "paras": [{"t": "Проверить включение автоматов SF23 «Тяга» и SF25 «Вспом. машины». Взвести ТРТ при помощи кн. «Возврат реле» на пульте машиниста.", "b": false}, {"t": "На пульте машиниста переключить тумблера «МПК1» на «МПК2» или наоборот.", "b": false}, {"t": "На блоке 8 «больной» секции осмотреть контактора КМ1, КМ2, КМ3, КМ11, КМ12, КМ13, КМ14. Контактора должны быть отключены, блокировочные и силовые контакты не должны иметь сильного подгара и перекоса.", "b": false}, {"t": "Восстановить ТРТ вручную.", "b": false}, {"t": "Если все нормально, то на виртуальном пульте отключить пусковой двигатель, запустить один из вентиляторов.", "b": false}, {"t": "Вентилятор работает постоянно.", "b": false}]}, {"id": "ch20", "cat": "po_vm", "page": 0, "pages": [], "title": "Нет запуска компрессора на всех секциях.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c067", "c": "Альбом, стр. 67"}, {"k": "c068", "c": "Альбом, стр. 68"}], "src": "Чита 2024", "paras": [{"t": "Проверить включение автоматов SF23 «Тяга» и SF25 «Вспом. машины». Взвести ТРТ при помощи кн. «Возврат реле» на пульте машиниста.", "b": false}, {"t": "На пульте машиниста переключить тумблера «МПК1» на «МПК2» или наоборот. На виртуальном пульте сделать «перезапуск».", "b": false}, {"t": "Под пультом машиниста на клеммных рейках поставить перемычку с Н025 (левая клеммная рейка) на провод Н27 (правая клеммная рейка). На электровозах с версией МСУД 2.5 после постановки перемычки необходимо нажать кнопку S9 «Компрессор», в пути следования контроль за давлением по манометру ГР (компрессорами", "b": false}, {"t": "управлять кнопкой S9 «Компрессор»).", "b": true}, {"t": "Если результата нет, то на блоке 8 головной секции на контакторе КМ14 изоляция в проводах Н025 – Н165 и перемычка с Н354 (+KV51) на Н154 (+КМ14), компрессором управлять тумблером «Печи ступень1». В пути", "b": false}, {"t": "следования контроль за давлением по манометру ГР.", "b": true}, {"t": "ПРИМЕЧАНИЕ: Если электровоз работает без замечаний на МПК1, то можно запустить все компрессоры. Для этого на блоке 8 всех секций расклинить реле KV14, на контакторах КМ14 изоляция в проводах Н025 – Н165 и перемычка с Н137 (+KV14) на Н154 (+КМ14), компрессором управлять переключением всех тумблеров с МПК1 на МПК2 (при переключении одного тумблера – запускается один компрессор). В пути следования контроль за давлением по", "b": false}, {"t": "манометру ГР.", "b": true}]}, {"id": "ch21", "cat": "po_vm", "page": 0, "pages": [], "title": "При включении кн. «Вентилятор 1» или «Вентилятор 2» на пульте машиниста, нет запуска одного из мотор вентиляторов на всех секциях.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c068", "c": "Альбом, стр. 68"}], "src": "Чита 2024", "paras": [{"t": "На клеммной рейке Х70 в коридоре на стенке за пом/машинистом перемычка с Н25 на Н26. При включении исправного вентилятора с выдержкой времени запускается неисправный.", "b": false}]}, {"id": "ch22", "cat": "po_vm", "page": 0, "pages": [], "title": "При включении кн. «Вентилятор 1» нет включения одного из вентиляторов на одной секции. Нет включения КМ11.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c070", "c": "Альбом, стр. 70"}], "src": "Чита 2024", "paras": [{"t": "Восстановить ТРТ при помощи кн. «Возврат реле».", "b": false}, {"t": "На «Виртуальном пульте» сделать перезапуск.", "b": false}, {"t": "На блоке 8 осмотреть ТРТ, восстановить ТРТ вручную и контактор неисправного вентилятора.", "b": false}, {"t": "На блоке 8 «больной» секции на контакторе КМ11 поставить изоляцию в блок. контактах Н025 – Н162. И поставить перемычки с Н148 (+КМ11) на Н150 (+КМ12) и с Н422 (+КМ41) на Н423 (+КМ42). Вентилятор 1 запускается совместно с вентилятором 2, на расшифровочном табло не будет гаснут красная лампа «В1».", "b": false}]}, {"id": "ch23", "cat": "po_vm", "page": 0, "pages": [], "title": "При включении кн. «Вентилятор 2» нет включения одного из вентиляторов на одной секции. Нет включения КМ12.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c071", "c": "Альбом, стр. 71"}, {"k": "c072", "c": "Альбом, стр. 72"}], "src": "Чита 2024", "paras": [{"t": "Восстановить ТРТ при помощи кн. «Возврат реле».", "b": false}, {"t": "На «Виртуальном пульте» сделать перезапуск.", "b": false}, {"t": "На блоке 8 осмотреть ТРТ, восстановить ТРТ вручную и контактор неисправного вентилятора.", "b": false}, {"t": "На блоке 8 «больной» секции на контакторе КМ12 поставить изоляцию в блок. контактах Н025 – Н163. И поставить перемычки с Н148 (+КМ11) на Н150 (+КМ12) и с Н422 (+КМ41) на Н423 (+КМ42). Вентилятор 1 запускается совместно с вентилятором 2, на расшифровочном табло не будет гаснут красная лампа «В2».", "b": false}, {"t": "6 Нет запуска маслонасоса на одной секции, нет включения контактора КМ15.", "b": true}, {"t": "Восстановить ТРТ при помощи кн. «Возврат реле».", "b": false}, {"t": "На «Виртуальном пульте» сделать перезапуск.", "b": false}, {"t": "На блоке 8 осмотреть ТРТ, восстановить ТРТ вручную и контактор неисправного маслонасоса.", "b": false}, {"t": "На блоке 8 «больной» секции поставить перемычки с Н150 (+КМ12) на Н156 (+КМ15). Маслонасос запускается совместно с Вентилятором 2..", "b": false}]}, {"id": "ch24", "cat": "po_vm", "page": 0, "pages": [], "title": "Неисправность датчика температуры SK10 тягового трансформатора или блока теплового контроля ВК154 (Отключается ГВ).", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c072", "c": "Альбом, стр. 72"}], "src": "Чита 2024", "paras": [{"t": "На БИ МСУД будет информация номер неисправной секции по ходу движения и «Запрет включения ГВ системой МСУД: перегрев масла тягового трансформатора (ВК154). Возможно будет выводится такая информация «Предупреждение температура масла т. тр-ра или перегрев масла т. тр-ра», будет ограничение тока якоря 810А или разбор схемы тяга.", "b": true}, {"t": "На «больной» секции в трансформаторном отсеке отсоединить фишку от датчика SK10 (датчик находится рядом с маслонасосом на крышки бака тягового трансформатора), на панели ПР-855 расклинить реле KV2 и на клеммной (центральная) тягового трансформатора перемычка Н023 – Н393.", "b": false}]}, {"id": "ch25", "cat": "po_vm", "page": 0, "pages": [], "title": "Неисправность датчика температуры SР10 тягового трансформатора.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c072", "c": "Альбом, стр. 72"}], "src": "Чита 2024", "paras": [{"t": "На БИ МСУД будет информация номер неисправной секции по ходу движения «Маслонасос: отказ датчика SP10,давление масла тр-тр» на расшифровочном табло не гаснет сигнальная лампа «Тр-р».", "b": true}, {"t": "На «больной» секции на панели ПР-855 расклинить реле KV2 и на клеммной (центральная) тягового трансформатора перемычка Н023 – Н258.", "b": false}]}, {"id": "ch26", "cat": "po_vm", "page": 0, "pages": [], "title": "При запуске вентиляторов не гаснет лампа «Тр-р», на БИ МСУД будет информация номер неисправной секции по ходу движения «Обрыв цепей контроля (Н166) контактора КМ15».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c073", "c": "Альбом, стр. 73"}], "src": "Чита 2024", "paras": [{"t": "На неисправной секции визуально убедиться в работе маслонасоса.", "b": false}, {"t": "На блоке 8 визуально убедиться во включении контактора КМ15 и на тяговом трансформаторе по манометру маслонасоса визуально убедиться в создании давления масла.", "b": false}, {"t": "Если контактор КМ15 включен и по манометру маслонасоса есть давление, то на блоке 8 на контакторе КМ15 поставить изоляцию в проводах Н025 – Н166 (двойной блок контакт) и поставить перемычку с Н150 (+КМ12) на Н166 (КМ15). Запустить с начало Вентилятор 1, после запустить Вентилятор 2.", "b": false}]}, {"id": "ch27", "cat": "po_tyaga", "page": 0, "pages": [], "title": "При постановке КМЭ в положение «П» не гаснет лампа «ВИП» на всех секциях. В зоне регулирования отключаются все БВ с загоранием ламп «ТД1-4», задание тока есть.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c075", "c": "Альбом, стр. 75"}], "src": "Чита 2024", "paras": [{"t": "Необходимо определить в каком проводе нет питания в Н5 или Э2. При помощи кн.", "b": true}, {"t": "«Контроль оборудования» и «Выбор блока» на БИ МСУД.", "b": true}, {"t": "Если в кадре БИ МСУД в строке", "b": false}, {"t": "«SM1 в положении «Тяга» - Н5» горит серым – нет питания в проводе Н5.", "b": true}, {"t": "Если в кадре БИ МСУД в строке", "b": false}, {"t": "«Реверсор вперед (задания с SM1 по пр. Э2)» горит серым – нет питания в проводе Э2.", "b": true}, {"t": "Выход: на клеммных рейках Х65 и Х69 в коридоре на стенке за пом/машинистом перемычка Н5 – Э2.", "b": true}]}, {"id": "ch28", "cat": "po_tyaga", "page": 0, "pages": [], "title": "При постановке КМЭ в положение «П» гаснет лампа «ВИП» на всех секциях, в зоне регулирования нет нагрузки на всех секциях и нет задания тока (задание скорости есть). В зонах регулирования БВ не отключается.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c077", "c": "Альбом, стр. 77"}, {"k": "c078", "c": "Альбом, стр. 78"}], "src": "Чита 2024", "paras": [{"t": "На панели ПР-855 головной секции осмотреть реле KV9 на предмет заедание штока блокировочных контактов, проверить и зачистить блокировочные контакты в проводах Н023 – Н7.", "b": false}, {"t": "Если результатов нет, то на реле KV9 головной секции изоляция в проводах Н023 – Н7 и перемычка с Э20 (+KV9) на Н7 (KV9).", "b": false}]}, {"id": "ch29", "cat": "po_tyaga", "page": 0, "pages": [], "title": "При постановке КМЭ в положение «П» не гаснет лампа «ВИП» на всех секциях. На БИ МСУД выводится информация «Работа силовой схемы. Схема разобрана по причине: Ключ ЭПК не в рабочем положении».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c079", "c": "Альбом, стр. 79"}], "src": "Чита 2024", "paras": [{"t": "На пульте машиниста переключить тумблер S4 «ЭПК».", "b": false}, {"t": "Если результата нет, то на клеммных рейках Х65 в коридоре на стенке за пом/машинистом перемычка Н5 – Н12.", "b": false}]}, {"id": "ch30", "cat": "po_tyaga", "page": 0, "pages": [], "title": "При постановке КМЭ в положение «П» не гаснет лампа «ВИП» на всех секциях. На БИ МСУД выводится информация «Работа силовой схемы. Схема разобрана по причине: тормозная магистраль не заряжена» или «Отказ в работе датчика ВP17».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c080", "c": "Альбом, стр. 80"}, {"k": "c081", "c": "Альбом, стр. 81"}], "src": "Чита 2024", "paras": [{"t": "На пневмоблоке головной секции отсоединить фишку от датчика ВP17. Если в пути следования на БИ МСУД снова будет выводится информация «Отказ в работе датчика ВP17», то на пневмоблоке задней секции отсоединить фишку от датчика ВP17, тогда контроль за давлением тормозной магистрали будет контролировать датчик ВP10 «Контроль давление в ТМ в схеме КЛУБ-У.", "b": false}, {"t": ".", "b": false}, {"t": "В кадре БИ МСУД «Пневматическое оборудование» обратить внимание на работу и показание датчиков ВР17 и ВР10. При непонятных показаниях или неисправности отсоединить фишку от неисправного датчика. При неисправности одного из датчиков сделать запись в ТУ-152.", "b": false}]}, {"id": "ch31", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Электровоз запущен, на ТЭД всех секций есть нагрузка. При переводе КМЭ в положение «0» на сигнальном табло не загорается лампа «ВИП», при отключении МВ1 и МВ2 загорается лампа «ВИП» и отключаются БВ всех секций с загоранием ламп «ТД1-4». После отключение ГВ нет его включения.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c082", "c": "Альбом, стр. 82"}, {"k": "c083", "c": "Альбом, стр. 83"}, {"k": "c084", "c": "Альбом, стр. 84"}, {"k": "c085", "c": "Альбом, стр. 85"}], "src": "Чита 2024", "paras": [{"t": "Признак: возможен подгар контактов 15-16 КМЭ нет питание в проводе Э20 не включено реле KV9, в кадре БИ МСУД «Контроль оборудования» горит серым строка «KV9 – SM1 в положении «0» или «П» - Н7».", "b": false}, {"t": "нет питания на реле KV9.", "b": true}, {"t": "Выход: На головной секции перекрыть кран КН41 на токоприемник. На клеммной рейке Х66 в коридоре на стенке за пом/машинистом перемычка с Э29 на Э20, включить кн. «Токоприемник передний». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить кн. «Токоприемник передний» и перевести контроллер в зону регулирования. При постановке КМЭ в положение «П» включить кн. «Токоприемник передний».", "b": false}, {"t": "Выход на электровозах до №986 (панель ПР-855 в БСА1): На всех секциях на панели ПР-855 заклинить реле KV9. На реле KV9 поставить изоляцию в проводах Н023 – Н7. На головной секции на панели ПР-855 перемычка с Н384 (+КМ24) на Н7 (KV9) и включить тумблер «Калорифер1». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить тумблер «Калорифер1» и перевести контроллер в зону регулирования. При постановке КМЭ в положение 0 включить тумблер «Калорифер1».", "b": false}, {"t": "Выход на электровозах с №986 (панель ПР-855 в БСА2): На всех секциях на панели ПР-855 заклинить реле KV9. На реле KV9 поставить изоляцию в проводах Н023 – Н7. На головной секции перекрыть кран КН41 на токоприемник. На блоке 8 поставить перемычку с Э29 (KV44) на Н7 (KV9 – панель ПР-855) и включить кн. «Токоприемник передний». После того как запустили электровоз, в положении «П» КМЭ погаснет лампа «ВИП» отключить кн. «Токоприемник передний» и перевести контроллер в зону регулирования. При постановке КМЭ в положение 0 включить кн. «Токоприемник передний».", "b": false}]}, {"id": "ch32", "cat": "po_tyaga", "page": 0, "pages": [], "title": "В положении «П» КМЭ не гаснет лампа «ВИП» на всех секциях. На БИ МСУД выводится информация «Работа силовой схемы. Схема разобрана по причине: - кран машиниста в положении 6 «Экстренное торможения» (SQ3)», срабатывает Тифон.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c086", "c": "Альбом, стр. 86"}], "src": "Чита 2024", "paras": [{"t": "На клеммной рейке под пультом машиниста перемычка с Н023 на Н132", "b": false}]}, {"id": "ch33", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Не гаснет лампа «ТМ», нет сбора схемы тяга. Через меню дополнительных функций нет возможности погасить лампу «ТМ».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c087", "c": "Альбом, стр. 87"}], "src": "Чита 2024", "paras": [{"t": "На электровозах оборудованных магнитными кассетами на клеммной рейке под пультом машиниста отсоединить провод Н251.", "b": false}, {"t": "На электровозах не оборудованных магнитными кассетами на клеммной рейке на задней стенке локомотива (где компрессор) отсоединить провод Н251.", "b": false}]}, {"id": "ch34", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Не гаснет лампа «ВИП» на одной секции, в зоне регулирования отключается БВ с загоранием ламп «ТД1-2» или «ТД3-4».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c087", "c": "Альбом, стр. 87"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 «больной» секции поставить перемычку с Н422 (+КМ41) на Н423 (+КМ42).", "b": false}]}, {"id": "ch35", "cat": "po_tyaga", "page": 0, "pages": [], "title": "Не переводятся тормозные переключатели или реверсора из режима Рекуперация в Тягу. На БИ МСУД выводится информация «Управление реверсорами QТ1 и QP1: вышло время ожидания переключения QT1 или вышло время ожидания переключения QР1».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c088", "c": "Альбом, стр. 88"}, {"k": "c089", "c": "Альбом, стр. 89"}, {"k": "c090", "c": "Альбом, стр. 90"}, {"k": "c091", "c": "Альбом, стр. 91"}], "src": "Чита 2024", "paras": [{"t": "Проверить напряжение ЦУ, АБ — должно быть 50-60 В, при необходимости---АБ на АР.", "b": false}, {"t": "Проверить давление в ЦУ по манометру МН-6 -должно быть не менее 5 кгс/см2, в зимнее время увеличить до 5,5- 6 кгс/см2 при помощи редуктора КР4.", "b": false}, {"t": "При помощи контроллера несколько раз сделать переход из ТЯГИ в РЕКУПЕРАЦИЮ и обратно, возможно ТЯГА соберётся не с первого раза.", "b": false}, {"t": "На пульте машиниста переключить тумблера «МПК1» на «МПК2» или наоборот.", "b": false}, {"t": "Если на БИ МСУД выводится информация «Управление реверсорами QТ1 и QP1: вышло время ожидания переключения QT1», что говорит о неисправности тормозного переключатели. Включить кнопку «Независимое возбуждение» на пульте машиниста.", "b": false}, {"t": "Если из кабины устранить неисправность не удаётся, то осматриваем БСА-1 и БСА-2. Если на бустерной секции санузел находится впереди по ходу движения, значит секция едет ВПЕРЁД. Если на бустерной секции санузел находится в конце секции по ходу движения, значит секция едет НАЗАД. На поосниках в режиме независимого возбуждения в «ТЯГЕ» QT1 стоят как в «ТОРМОЖЕНИИ», т.е. замкнуты средние контакты.", "b": false}, {"t": "Если открутилась соединительная трубка к тормозному переключателю или реверсору, то трубку прикрутить или заглушить. Тормозной переключатель или реверсор перевести вручную.", "b": false}, {"t": "При осмотре тормозных переключателей QT и реверсивных переключателей QP с заходом в ВВК обязательно осматриваем:блокировочные контакты 50 В (подают сигнал в МСУД), которые расположены на корпусе QP и QT слева:", "b": false}, {"t": "1) Если на QP и QTзамкнуты крайние силовые контакты, то на блокировках должны быть замкнуты 2 правых контакта!!! 2) Если замкнуты средние силовые контакты QP и QТ, то на блокировках должны быть замкнуты 2 левых контакта!!!", "b": true}]}, {"id": "ch36", "cat": "po_msud", "page": 0, "pages": [], "title": "При включении блокировки тормозов 367 нет запуска МСУД (блока индикации), нет включения табло Сигнализации, нет включения ГВ.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c096", "c": "Альбом, стр. 96"}, {"k": "c097", "c": "Альбом, стр. 97"}], "src": "Чита 2024", "paras": [{"t": "На блоке 8 головной секции проверить включение реле KV8 (KV7).", "b": false}, {"t": "Если реле KV8 не включилось, то на блоке 8 головной секции перемычка с Э26 (KV12) на Н4 (+KV8).", "b": false}, {"t": "Включить кнопку «Главный выключатель», при включении получает питание реле KV8 и запускается МСУД.", "b": false}, {"t": "Если при постановке перемычки реле KV8 не включилось, то на блоке 8 головной секции его заклинить.", "b": false}, {"t": "ПРИМЕЧАНИЕ: при смене кабин управления перемычку убрать.", "b": true}]}, {"id": "ch37", "cat": "po_msud", "page": 0, "pages": [], "title": "Нет запуска вспомогательных машин на одной секции, на БИ МСУД в кадре «Сигнализация» не сигнализирует не одна лампа, в кадре «Диагностика МСУД».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c097", "c": "Альбом, стр. 97"}, {"k": "c098", "c": "Альбом, стр. 98"}], "src": "Чита 2024", "paras": [{"t": "Проверить включение автоматов SF17, SF18, SF19, SF20 «МСУД»; SF47 «МПК1», SF48 «МПК2».", "b": false}, {"t": "На блоке 8 «больной» секции проверить включение контактора КМ63 (МПК1) или КМ64 (МПК2), осмотреть блокировочные контакты реле KV14", "b": false}, {"t": "Если не включились контактора КМ63 или КМ64, то запитать один из контакторов:", "b": false}, {"t": "МПК1 – на блоке 8 «больной» секции перемычка с Н023 (КМ63) на Н049 (+КМ63).", "b": false}, {"t": "МПК2 – на блоке 8 «больной» секции перемычка с Н023 (КМ64) на Н050 (+КМ64).", "b": false}]}, {"id": "ch38", "cat": "po_msud", "page": 0, "pages": [], "title": "Порядок отключение неисправной секции тумблером «Отключение секций С1-С4».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c098", "c": "Альбом, стр. 98"}, {"k": "c099", "c": "Альбом, стр. 99"}], "src": "Чита 2024", "paras": [{"t": "Перед отключением неисправной секции тумблером «Отключение секции» на ЩПР (блоке 1) включить тумблер S66 «Резервное питание МСУД».", "b": false}]}, {"id": "ch39", "cat": "po_msud", "page": 0, "pages": [], "title": "Снятие запретов МСУД. Снятие запрета включения ГВ. Заходим в основной кадр, нажимаем F, нажимаем 2 «Конфигурация", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c099", "c": "Альбом, стр. 99"}], "src": "Чита 2024", "paras": [{"t": "электровоза», вводим пароль 1029, нажимаем кнопку 4 «Снятие установленных блокировок оборудования», и нажимаем кнопку 1, далее ESC.", "b": false}, {"t": "Снятие ограничения по зонам ВИУ. F*4*6 Снятие ограничения по току. St+F*1029*3*0E Перезагрузка МСУД St+F*0*E Снятие запрета включения ГВ St+F*1029*4*1E", "b": true}]}, {"id": "ch40", "cat": "po_akb", "page": 0, "pages": [], "title": "На расшифровочном табло горит лампа «ЗБ», на мониторе МСУД мигает «ОБ».", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c101", "c": "Альбом, стр. 101"}], "src": "Чита 2024", "paras": [{"t": "А) На шкафе питания А25 проверить включения тумблера S1 «Включение ШП» и целостность предохранителя F3, если он сгорел сменить.", "b": false}, {"t": "Б) На блоке 8 проверить целостность предохранителя F16, если он сгорел сменить. При повторном перегорании предохранителя F16 на шкафе питания А25 переключатель SA1 поставить в положение «Аварийно».", "b": false}, {"t": "В) Проверить включение контактора КМ (с обратной стороны шкафа питания А25), если не включился, то переключатель SA1 поставить в положение «Аварийно».", "b": false}, {"t": "Г) На блоке 8 проверить включение контактора КМ5, если не включился, то переключатель SA1 поставить в положение «Аварийно».", "b": false}]}, {"id": "ch41", "cat": "po_akb", "page": 0, "pages": [], "title": "Нет тока зарядки АКБ, лампа «ЗБ» не горит.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c101", "c": "Альбом, стр. 101"}], "src": "Чита 2024", "paras": [{"t": "На шкафе питания А25 проверить целостность предохранителей F1 или F2. Возможно не открылся тиристор V7. Предохранители F1 или F2 заменить. На шкафе питания А25 переключатель SA1 поставить в положение «Аварийно».", "b": false}]}, {"id": "ch42", "cat": "po_akb", "page": 0, "pages": [], "title": "При проезде нейтральной вставки гаснет сигнализация, КЛУБ и опускается ТКП.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c101", "c": "Альбом, стр. 101"}], "src": "Чита 2024", "paras": [{"t": "На головной секции перегорели предохранители F1 или F2 на шкафе питания А25. На головной секции на шкафе питания А25 переключатель SA1 поставить в положение «Аварийно».", "b": false}]}, {"id": "ch43", "cat": "po_akb", "page": 0, "pages": [], "title": "Батарея разряжена до 30-35 вольт – последовательное соединение АКБ, для увеличения напряжения.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c102", "c": "Альбом, стр. 102"}], "src": "Чита 2024", "paras": [{"t": "А) Под левый нож SA3 положить изоляцию и включить его.", "b": false}, {"t": "Б) Поставить перемычку (потолще) с левого нижнего вывода правого ножа SA1 на правый подвижный нож SA3.", "b": false}, {"t": "В) После включения ГВ перемычку и изоляцию убрать.", "b": false}]}, {"id": "ch44", "cat": "po_akb", "page": 0, "pages": [], "title": "Малая емкость батареи, напряжение нормально, но при включении нагрузки АКБ быстро садится – параллельное соединение АКБ.", "steps": [], "notes": [], "kind": "fault", "imgs": [{"k": "c102", "c": "Альбом, стр. 102"}], "src": "Чита 2024", "paras": [{"t": "Поставить перемычку с правого нижнего ножа SA1 на среднюю правую пластину SA1 или перемкнуть их отверткой.", "b": false}]}, {"id": "cr1", "cat": "po_ref", "page": 0, "pages": [], "title": "Памятка: действия бригады при пожаре на локомотиве", "steps": [], "notes": ["Согласно распоряжению №2627р от 25 октября 2024 г."], "kind": "info", "imgs": [{"k": "c002", "c": "Альбом, стр. 2"}], "src": "Чита 2024", "ft": "Памятка по порядку действий локомотивной бригады при возникновении пожара (согласно распоряжения №2627р от 25 октября 2024 г.) При возникновении пожара на тепловозе и электровозе машинист должен: - перевести в нулевое положение контроллер машиниста, остановить поезд, выключить вспомогательные машины, отключить главный выключатель (на локомотивах переменного тока) или быстродействующий выключатель (на локомотивах постоянного тока), опустить токоприёмник (на электровозе), остановить дизель-генераторную установку (на тепловозе); - подать звуковой сигнал пожарной тревоги и сообщить о пожаре диспетчеру поездному или дежурным по железнодорожным станциям, ограничивающим перегон; - после закрепления поезда на месте отключить приборы управления и рубильник аккумуляторной батареи локомотива; - на электровозе убедиться, что токоприёмник опущен, и контактный провод не касается крыши или имеющегося на ней оборудования и, если очаг возгорания расположен не ближе 2 метров к контактному проводу, исключая риски для собственной жизни принять посильные меры по ликвидации пожара, используя имеющиеся первичные средства пожаротушения, систему автоматического пожаротушения (в зависимости от конструкционных особенностей локомотива). После запуска системы пожаротушения кабину необходимо покинуть за время задержки, установленной для конкретной системы. Запрещается находиться в помещениях локомотива при приведении в действие автоматической стационарной установки пожаротушения; - если пожар не может быть ликвидирован своими силами и имеющимися средствами, отцепить локомотив и отвести его от состава поезда на расстояние не менее 50 метров и после этого, при опасности распространения огня с горящей секции на другую, расцепить их с отводом на безопасное расстояние, предварительно закрепив горящую секцию тормозными башмаками."}, {"id": "cr2", "cat": "po_ref", "page": 0, "pages": [], "title": "Общие рекомендации перед поиском неисправности", "steps": [], "notes": [], "kind": "info", "imgs": [{"k": "c004", "c": "Альбом, стр. 4"}], "src": "Чита 2024", "ft": "Для устранения возможных неисправностей или для выхода из положения при повреждении узлов электровоза, машинист в поезде должен иметь: 1. Контрольную лампу. 2. Изоляционную ленту. 3. Пять – шесть проводов с зажимами на концах. 4. Голую медную проволоку для шунтирования блокировок и замены предохранителей: на 5А - 0, 19 мм 10А - 0, 21 мм 20А - 0, 35 мм 25А - 0, 53 мм 5. Шесть – восемь клиньев для включения реле и контакторов. Обычно неисправность появляется на одной из секций электровоза. Машинист, используя показания сигнальных ламп, блинкеров и контрольно – измерительных приборов, должен эту секцию определить. Чтобы легче было /определить/ решить эту задачу, при срабатывании защиты, отключите зарядный агрегат головной секции. При срабатывании защиты на стоянке остерегайтесь пережога контактного провода, чтобы предупредить пережог – поднимайте второй пантограф."}, {"id": "cr4", "cat": "po_ref", "page": 0, "pages": [], "title": "Назначение аппаратов: блок автоматов, ПР-855, R55", "steps": [], "notes": [], "kind": "info", "imgs": [{"k": "c013", "c": "Альбом, стр. 13"}, {"k": "c014", "c": "Альбом, стр. 14"}, {"k": "c015", "c": "Альбом, стр. 15"}], "src": "Чита 2024", "ft": "Назначение аппаратов Блок автоматов в кабине машиниста и блока №1 SF29 SF37 SF30 SF31 SF34 SF32 SF33 SF36 SF51 SF21 SF22 SF25 SF23 SF28 SF47 SF48 SF52 SF35 Автоматы в кабине машиниста X57 X56 S19 S107 S93 S96 S16 S66 SF38 SF81 SF82 SF83 SF1 SF2 SF3 SF4 SF60 SF5 SF6 SF7 SF8 SF17 SF18 SF19 SF20 SF65 SF75 SF76 SF40 SF38 SF58 SF59 SF43 SF44 SF41 SF66 SF70 SF71 SF53 SF54 X55 Верхний ряд автоматов 1 SF21 – Токоприемники 2 SF22 - Главный выключатель. 3 SF25 – Вспомогательные машины 4 SF23 -Тяга 5 SF28 – Радиосвязь аварийно 6 SF47 – МСУД МПК1 7 SF48 – МСУД МПК2 8 SF52 – Резерв 9 SF35 – Радиосвязь нормально Верхний ряд автоматов 1 SF75 – ТСКБМ 2 SF76 - ТСКБМ 3 SF40 – Освещение ВВК 4 SF39 – освещение коридора 5 SF58 – Подогрев МСУД 6 SF59 – Подогрев МСУ следовательное» на пульте машиниста: - ПОСЛЕДОВАТЕЛЬНОЕ - ПВ (отключенное положение кнопки на пульте машиниста); - НЕЗАВИСИМОЕ - НВ (включенное положениекнопки на пульте машиниста). В режиме тяги «Последовательное возбуждение» применяется во всем диапазоне рабочих скоростей. В режиме тяги «Независимое возбуждения» применяется: - в режиме «Авторегулирования» (при установке тумблера S3 в положение АВТОРЕГУЛИРОВАНИЕ); - при всех работающих ВИП (ВИУ) или ТЭД на секции электровоза; - при полном поле ТЭД с регулированием напряжения на выходе ВИУ (ВИП) от первой до четвертой зоны до скорости (50±10) км/ч (в зависимости от напряжения контактной сети). Движение электровоза со скоростью выше (50±10) км/ч должно осуществляться МСУД-015 с переводом ТЭД на «ПВ». При работе электровоза с «НВ» ТЭД системой МСУД-015 реализован автоматический переход с «НВ» на «ПВ» при достижении скорости 65 км/ч, при дальнейшем снижении скорости до 55 км/ч выполняется автоматический переход с «ПВ» на «НВ». Переход с НВ на ПВ происходит по секционно со снятиям нагрузки с секции, поэтому при следовании на подъем во избежание замедления или буксования кол. пар в режиме НВ скорость не должна превышать 60 км/ч или следовать на ПВ. ВНИМАНИЕ!  При эксплуатации электровоза в режиме независимого возбуждения ТЭД не задавать токи якоря выше 950 А при скоростях движения выше 49 км/ч.  Управление контакторами ослабления поля в режиме «ПВ» осуществлять только в ручном режиме. Имеется следующее временное ограничение:  Трогание с места поезда на руководящих подъемах необходимо выполнять на «ПВ» ТЭД! Памятка машинисту по порядку пользования МСУД-015 Использование визуальной и диагностической информации МСУД-015 Программное обеспечение блока индикации (БИ) предназначено для отображения в реальном времени графической и звуковой информации о заданных и истинных величинах, контролируемых параметрах, состоянии оборудования и системы управления, режиме работы оборудования и т.д., а также ввода команд с многофункциональной клавиатуры. Запуск программы Программное обеспечение БИ запускается автоматически, при опускании рукоятки БУ-367 вниз в кабине управления включается блок питания. По окончании загрузки на экране БИ появится окно «ОСНОВНОГО КАДРА», рис. 1-3, в зависимости от режима работы электровоза. Выполнение программы МСУД реализует аварийно-предупредительный контроль и вывод на экран параметров, характеризующих состояние основного оборудования в виде диагностических кадров, или в виде всплывающего окна на фоне «ОСНОВНОГО КАДРА», на котором сформирована текстовая информация о возникшей ситуации и рекомендации по её устранению. На диагностических кадрах БИ при отображении транспарантов с сообщениями, используется три основных фоновых цвета: - сообщение на красном фоне или выведенные красным шрифтом информирует об отказе или сбое в работе оборудования (выполнения заданного режима работы), название которого присутствует в отображаемом тексте; - сообщение на черном фоне информирует о нормальной работе оборудования или режиме, название которого присутствует в отображаемом тексте; - сообщение на сером фоне информирует о неактивном (отключенном) состоянии оборудования или режима, название которого присутствует в отображаемом тексте. Памятка машинисту по порядку пользования МСУД-015 Основной кадр МСУД-015 «ОСНОВНОЙ КАДР» функционально разбит на три зоны. Независимо от режима и состояния силовой схемы (постоянно), отображается зона «ОСНОВНОГО КАДРА», содержащая: 1) «Контроль оборудования» – оперативная информация о состоянии оборудования и систем - «С1» «С4» ; «ТЦ»; «МК»; «В3»; «ВМ»; «ДП»; «РЗ»; «ОВ»; «ВИУ»; «ТД»; «НВ»; «СИ»; «АГС»; «МСУД»; «Р» ; 2) «Режим» – заданный режим управления: «АВТОРЕГУЛИРОВАНИЕ», «РУЧНОЕ», «МАНЕВРОВЫЙ»; 3) «Силовая схема» – состояние цепей электровоза («ЗАДАНАЯ СКОРОСТЬ», «ЗАДАНЫЙ ТОК», «ЗАДАНОЕ НАПРЯЖЕНИЕ», «СИЛА ТЯГИ ИЛИ ТОРМОЖЕНИЯ», «ОСОБЛЕНИЯ ПОЛЯ» 1 2 3 Памятка машинисту по порядку пользования МСУД-015 Кадр «Ток-скорость» МСУД-015 Дополнительные кадры, рекомендуемые в использовании при движении электровоза, собраны в разделе «ТОК/ СКОРОСТЬ». При нажатии в «ОСНОВНОМ КАДРЕ» клавиши [4] – «Ток/Скорость» на экране отображается кадр «ТОК/СКОРОСТЬ», который позволяет машинисту оценить токи и напряжения всех ТЭД , скорости колёсных пар всех секций электровоза на одном кадре (рис. 5), Возврат в «ОСНОВНОЙ КАДР» осуществляется нажатием клавиши [1] – «ОСНОВНОЙ КАДР». Памятка машинисту по порядку пользования МСУД-015 Кадр «Блок сигнализации» МСУД-015 При нажатии в кадрах «ОСНОВНОЙ КАДР», «ТОК/СКОРОСТЬ», «УПРАВЛЕНИЕ ОБОРУДОВАНИЕМ» или «КОНТРОЛЬ ОБОРУДОВАНИЯ» клавиши [S] – отображается кадр «БЛОК СИГНАЛИЗАЦИИ» В кадре «БЛОК СИГНАЛИЗАЦИИ» отображены индикаторы отражающие информацию о состоянии основного оборудования каждой секции электровоза. Индикаторы кадра соответствуют индикаторам блока сигнализации БС-008, но на кадре информация выводится с привязкой к конкретной секции. Отображение последовательности секций идет относительно ведущей секции, обозначенной на кадре как «Секция 1». Если секция электровоза отключена, но при этом включен МСУД тумблером S66 «Резервное питание МСУД», у надписи «Секция N» отображается надпись «отключена» красным цветом. На отключенной секции могут подсвечиваться только индикаторы: «МК», «ДП», «РКЗ», «ТЦ», «ТМ», «ПС» и «ДМ». В случае если отключен вывод информации на БС-008, на кадре, в нижней его части, выводится надпись красным цветом: «Тумблер S54 “Сигнализация” отключен». Возврат в кадр, из которого был осуществлен переход в кадр «БЛОК СИГНАЛИЗАЦИИ», осуществляется по нажатию клавиши [Esc]. Памятка машинисту по порядку пользования МСУД-015 Кадр «Силовая схема» МСУД-015 При нажатии в «ОСНОВНОМ КАДРЕ» клавиши [3] – «Силовые цепи» отображается кадр «СИЛОВАЯ СХЕМА». При этом на экране отображается схема "}, {"id": "cr9", "cat": "po_ref", "page": 0, "pages": [], "title": "Положение реверсоров и контакты КМЭ (КМ34)", "steps": [], "notes": ["Положение реверсоров в зависимости от положения секций; монт ": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 5", "paras": [{"t": "1.1 Настоящий документ устанавливает основные правила и нормы по техническому обслуживанию тормозного оборудования и управлению тормозами железнодорожного подвижного состава железных дорог (далее – Правила), за исключением самоходного специального подвижного состава в рабочем состоянии.", "b": false, "n": "1.1"}, {"t": "1.2 Настоящие Правила распространяются на железнодорожный подвижной состав, курсирующий на железных дорогах государств участников Содружества, Грузии, Латвийской республики, Литовской республики и Эстонской республики, и являются обязательными для всех работников, связанных с техническим обслуживанием тормозного оборудования и управлением тормозами железнодорожного подвижного состава.", "b": false, "n": "1.2"}, {"t": "1.3 Организация работ, технология технического обслуживания и управления тормозами железнодорожного подвижного состава устанавливается владельцем инфраструктуры и возлагается на предприятия (организации), обеспечивающие эксплуатацию и техническое обслуживание подвижного состава в соответствии с национальными законодательствами.", "b": false, "n": "1.3"}, {"t": "1.4 Контроль соблюдения требований настоящих Правил возлагается на руководителей подразделений владельца инфраструктуры, обеспечивающих эксплуатацию железнодорожного подвижного состава, а также работников и руководителей подразделений владельца инфраструктуры, отвечающих за безопасность движения поездов.", "b": false, "n": "1.4"}, {"t": "1.5 Технология обслуживания тормозного оборудования и управления тормозами конкретных типов железнодорожного подвижного состава устанавливается на основе нормативных документов по эксплуатации соответствующего железнодорожного подвижного состава, согласованных владельцем инфраструктуры.", "b": false, "n": "1.5"}]}, {"id": "tb2", "cat": "tm_def", "page": 0, "pages": [], "title": "2 Термины и определения", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 5–12", "paras": [{"t": "2.1 блокировка: Функция механического, электрического или другого устройства в определенном состоянии, обеспечивающая включение узлов и агрегатов только с одного пульта управления.", "b": false, "n": "2.1"}, {"t": "Примечания:", "b": false, "n": ""}, {"t": "включенная блокировка органов управления: Положение ключа блокировочного устройства, при котором органы управления подвижным составом находятся в неработоспособном состоянии и приведение их в действие невозможно.", "b": false, "n": ""}, {"t": "ключ блокировочного устройства: Изделие, служащее для перевода органов управления подвижным составом из неработоспособного состояния в рабочее состояние через промежуточные положения (при наличии).", "b": false, "n": ""}, {"t": "2.2 вагон грузовой: Вагон, предназначенный для перевозки грузов. К нему относятся: крытый вагон, полувагон, платформа, вагон-цистерна, вагон бункерного типа, изотермический вагон, транспортер, специальные вагоны грузового типа.", "b": false, "n": "2.2"}, {"t": "2.3 вагон пассажирский: Вагон, предназначенный для перевозки пассажиров и (или) багажа, почтовых отправлений. К пассажирским вагонам относятся почтовые, багажные, вагоны-рестораны, служебно-технические, служебные, клубы, санитарные, испытательные и измерительные лаборатории, специальные вагоны.", "b": false, "n": "2.3"}, {"t": "2.4 владелец инфраструктуры: Юридическое лицо или индивидуальный предприниматель, имеющие инфраструктуру на праве собственности или ином праве и оказывающие услуги по ее использованию на основании договора.", "b": false, "n": "2.4"}, {"t": "2.5 воздухораспределитель: Техническое устройство, предназначенное для управления давлением в тормозных цилиндрах в зависимости от изменений давления в тормозной магистрали.", "b": false, "n": "2.5"}, {"t": "2.6 время полной зарядки тормозной сети: Время с момента перевода ручки крана машиниста в отпускное положение до момента создания не менее минимально-допустимого давления в тормозной сети хвостового вагона (локомотива) или минимальной выдержки времени, необходимого для зарядки тормозной сети, в зависимости от вида торможения, количества осей и конструкции вагонов в составе поезда.", "b": false, "n": "2.6"}, {"t": "2.7 время полного отпуска тормозов: Время с момента перевода ручки крана машиниста в отпускное положение до полного ухода штоков тормозных цилиндров и отхода тормозных колодок (тормозных накладок) от колес (тормозных дисков).", "b": false, "n": "2.7"}, {"t": "2.8 выщербина: Местное разрушение в виде выкрашивания металла на поверхности катания колеса.", "b": false, "n": "2.8"}, {"t": "2.9 давление зарядное: Установленное давление в тормозной магистрали ведущего (головного) локомотива или вагона моторвагонного поезда (МВПС) при поездном положении ручки крана машиниста и полностью заряженной тормозной сети поезда.", "b": false, "n": "2.9"}, {"t": "2.10 давление сверхзарядное: Повышенное давление в тормозной магистрали локомотива или вагона моторвагонного поезда (МВПС) по сравнению с установленным зарядным давлением при положении ручки крана машиниста «Поездное».", "b": false, "n": "2.10"}, {"t": "2.11 датчик контроля состояния тормозной магистрали: Техническое устройство, предназначенное для информирования машиниста (световое и/или звуковое) о несанкционированном изменении состояния давления в тормозной магистрали поезда.", "b": false, "n": "2.11"}, {"t": "2.12 заклинивание колёсной пары, юз: Отсутствие вращения колесной пары при движении подвижного состава.", "b": false, "n": "2.12"}, {"t": "2.13 истощение тормоза: Снижение давления в тормозной сети поезда, в результате которого после экстренного торможения не обеспечивается полное (максимальное) давление в тормозных цилиндрах (тормозных блоках), необходимое для остановки поезда на расчетном тормозном пути или удержания остановившегося поезда на месте.", "b": false, "n": "2.13"}, {"t": "2.14 компрессорная установка: Техническое устройство, предназначенное для обеспечения подвижного состава сжатым воздухом.", "b": false, "n": "2.14"}, {"t": "2.15 кран вспомогательного тормоза: Техническое устройство, предназначенное для управления изменением давления только в тормозных цилиндрах (тормозных блоках) тягового подвижного состава и МВПС.", "b": false, "n": "2.15"}, {"t": "2.16 кран двойной тяги: Техническое устройство, предназначенное для разобщения воздухопровода источника питания сжатым воздухом с краном машиниста, а на МВПС и для отключения крана машиниста от тормозной магистрали.", "b": false, "n": "2.16"}, {"t": "2.17 кран концевой: Техническое устройство, предназначенное для контролируемого механического (с ручным приводом) перекрытия тормозной, питательной и других воздушных магистралей.", "b": false, "n": "2.17"}, {"t": "2.18 кран комбинированный: Техническое устройство, предназначенное для разобщения тормозной магистрали с краном машиниста на локомотиве при движении двойной или многократной тягой, а также для сообщения тормозной магистрали с атмосферой темпом экстренного торможения.", "b": false, "n": "2.18"}, {"t": "2.19 кран машиниста: Техническое устройство, предназначенное для управления автоматическими пневматическими, а также электропневматическими тормозами.", "b": false, "n": "2.19"}, {"t": "П р и м е ч а н и я:", "b": false, "n": ""}, {"t": "При передаче команды управления от ручки крана машиниста к исполнительным устройствам электрическим или иным способом (кроме механического) обязательно наличие устройства резервного пневматического управления изменением давления в тормозной магистрали (резервный кран управления). Работа одновременно основного и резервного устройств управления должна быть исключена. При невозможности автоматического перехода от основной системы управления к резервной должна быть предусмотрена возможность остановки подвижного состава путем разрядки тормозной магистрали темпом служебного или экстренного торможения.", "b": false, "n": ""}, {"t": "В кране с автоматическими перекрышами должна быть зона служебных торможений или не менее 4 фиксированных положений с фиксированными величинами давлений в тормозной магистрали или в управляющем резервуаре крана.", "b": false, "n": ""}, {"t": "Положение «Зарядка и отпуск» предназначено для временного повышения давления сжатого воздуха в тормозной магистрали до величины, превышающей установленное зарядное давление и отпуска тормозов.", "b": false, "n": ""}, {"t": "Положение «Поездное» предназначено для автоматического поддержания установленного зарядного давления в тормозной магистрали, а также перехода с повышенного (пониженного) давления сжатого воздуха в тормозной магистрали на зарядное давление и отпуска тормозов.", "b": false, "n": ""}, {"t": "Положение «Перекрыша без питания» предназначено для отключения тормозной магистрали от источника сжатого воздуха.", "b": false, "n": ""}, {"t": "Положение «Перекрыша с питанием» предназначено для поддержания в тормозной магистрали давления после торможения и независимо от утечек сжатого воздуха из тормозной магистрали.", "b": false, "n": ""}, {"t": "Положение «Замедленное торможение» предназначено для служебного торможения с разрядкой уравнительного резервуара замедленным темпом (положение VА) и/или управления электропневматическими тормозами (положение (VЭ) без разрядки тормозной магистрали.", "b": false, "n": ""}, {"t": "Положение «Служебное торможение» предназначено для снижения давления сжатого воздуха в тормозной магистрали и управления электропневматическими тормозами с разрядкой тормозной магистрали.", "b": false, "n": ""}, {"t": "Положение «Экстренное торможение» предназначено для прямого сообщения тормозной магистрали с атмосферой через кран машиниста со снижением давления сжатого воздуха в тормозной магистрали до нулевого значения.", "b": false, "n": ""}, {"t": "2.20 кран разобщительный: Техническое устройство, предназначенное для сообщения или разобщения воздухопроводов.", "b": false, "n": "2.20"}, {"t": "2.21 локомотив: Железнодорожный подвижной состав, предназначенный для обеспечения передвижения по железнодорожным путям поездов или отдельных вагонов.", "b": false, "n": "2.21"}, {"t": "2.22 расчетный тормозной коэффициент: Коэффициент, представляющий собой отношение суммы расчетных сил нажатия на ось всех единиц поезда (состава) к весу поезда (состава) и характеризующий обеспеченность поезда (состава) тормозным нажатием.", "b": false, "n": "2.22"}, {"t": "2.23 стоп-кран, кран экстренного торможения, клапан аварийноэкстренного торможения: Техническое устройство, предназначенное для выпуска воздуха из тормозной магистрали железнодорожного подвижного состава и приведения в действие автоматических тормозов для экстренной остановки.", "b": false, "n": "2.23"}, {"t": "2.24 магистраль тормозная: Воздушная магистраль, служащая для питания сжатым воздухом и для управления тормозами поезда посредством изменения в ней давления сжатого воздуха.", "b": false, "n": "2.24"}, {"t": "2.25 магистраль питательная: Воздушная магистраль, служащая для соединения главных резервуаров и крана машиниста, а также для питания сжатым воздухом потребителей состава.", "b": false, "n": "2.25"}, {"t": "2.26 моторвагонный подвижной состав (МВПС): Моторные и немоторные вагоны, из которых формируются электропоезда, дизель-поезда, автомотрисы, рельсовые автобусы, дизель-электропоезда, электромотрисы, предназначенные для перевозки пассажиров и (или) багажа, почты.", "b": false, "n": "2.26"}, {"t": "2.27 навар: Дефект на поверхности катания колеса, характеризующийся образованием сдвигов металла", "b": false, "n": "2.27"}, {"t": "2.28 недостаточный тормозной эффект при проверке действия тормозов: Состояние поезда, при котором после выполненной ступени торможения не достигнуто снижение скорости на установленную величину расстояния (времени), указанном в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "2.28"}, {"t": "2.29 отпуск ступенчатый вспомогательного и электропневматического тормоза: Отпуск тормозов, достигаемый периодическим ступенчатым понижением давления в тормозных цилиндрах (тормозных блоках) независимо от давления в тормозной магистрали.", "b": false, "n": "2.29"}, {"t": "2.30 отпуск полный автоматических тормозов: Отход тормозных колодок (тормозных накладок) от колес (тормозных дисков).", "b": false, "n": "2.30"}, {"t": "2.31 отпуск ступенчатый автоматических тормозов: Отпуск автотормозов, включенных на режим управления ступенями, достигаемый понижением давления в тормозных цилиндрах путем периодического ступенчатого повышения менее зарядного давления с последующим регулируемым прекращением повышения давления в тормозной магистрали.", "b": false, "n": "2.31"}, {"t": "2.32 отпуск полный вспомогательного тормоза: Отпуск тормозов с отходом тормозных колодок (тормозных накладок) от колес (тормозных дисков) достигаемый перемещением ручки крана вспомогательного тормоза в положение отпуска независимо от давления в тормозной магистрали.", "b": false, "n": "2.32"}, {"t": "2.33 отпуск полный электропневматического тормоза: Отпуск тормозов с отходом тормозных колодок (тормозных накладок) от колес (тормозных дисков) достигаемый изменением управляющего электрического сигнала.", "b": false, "n": "2.33"}, {"t": "2.34 опробование тормозов: Последовательность технологических операций, направленных на определение правильности работы тормозов на торможение и отпуск, а также способности торможения не менее определенного времени.", "b": false, "n": "2.34"}, {"t": "2.35 отсутствие тормозного эффекта: Состояние поезда, при котором после торможения поезд продолжает следовать со скоростью не соответствующей профилю пути и/или выполненной ступени торможения.", "b": false, "n": "2.35"}, {"t": "2.36 ползун: Дефект на поверхности катания колеса, характеризующийся образованием плоской площадки.", "b": false, "n": "2.36"}, {"t": "2.37 поезд: Сформированный и сцепленный состав вагонов с одним или несколькими действующими локомотивами или моторными вагонами, имеющий установленные сигналы, а также отправляемый на перегон и находящийся на перегоне локомотив(ы) без вагонов и специальный самоходный железнодорожный подвижной состав.", "b": false, "n": "2.37"}, {"t": "2.38 поезд грузовой повышенной длины: Грузовой поезд с составом длиной 350 осей и более.", "b": false, "n": "2.38"}, {"t": "2.39 поезд грузовой повышенного веса: Грузовой поезд с составом весом более 6000 т.", "b": false, "n": "2.39"}, {"t": "2.40 поезд грузовой повышенного веса и длины: Грузовой поезд с составом весом более 6000 т. и длиной 350 осей и более.", "b": false, "n": "2.40"}, {"t": "2.41 поезд соединенный: Поезд, составленный из двух и более сцепленных между собой поездов с действующими локомотивами в голове каждого поезда.", "b": false, "n": "2.41"}, {"t": "2.42 поезд грузопассажирский: Поезд, формируемый из грузовых и пассажирских вагонов, предназначенных для перевозки грузов и пассажиров.", "b": false, "n": "2.42"}, {"t": "2.43 поезд пассажирский: Поезд для перевозки пассажиров, багажа и почты, сформированный из пассажирских вагонов.", "b": false, "n": "2.43"}, {"t": "2.44 поезд пассажирский повышенной длины: Пассажирский поезд, имеющий в составе более 25 пассажирских вагонов. При этом поезд с составом из 26-40 пассажирских вагонов рассматривается как соединенный.", "b": false, "n": "2.44"}, {"t": "2.45 поезд пассажирский скоростной: Пассажирский поезд, который по участку (отдельным участкам) следования осуществляет движение со скоростью от 141 до 200 км/ч включительно.", "b": false, "n": "2.45"}, {"t": "2.46 путь тормозной: Расстояние, проходимое поездом с момента перевода ручки крана машиниста в тормозное положение или срабатывания устройства экстренного торможения до полной остановки. Тормозные пути различаются в зависимости от вида торможения (тормозной путь служебного торможения, тормозной путь полного служебного торможения или тормозной путь экстренного торможения).", "b": false, "n": "2.46"}, {"t": "2.47 ручка крана машиниста: орган управления краном машиниста.", "b": false, "n": "2.47"}, {"t": "2.48 ручка крана вспомогательного тормоза: орган управления вспомогательным тормозом.", "b": false, "n": "2.48"}, {"t": "2.49 сеть питательная: Объем, заполняемый сжатым воздухом при работе компрессорной установки, расположенный до крана машиниста.", "b": false, "n": "2.49"}, {"t": "2.50 сеть тормозная: Объем, заполняемый сжатым воздухом в заряженном и отпущенном состоянии тормоза, расположенный после крана машиниста.", "b": false, "n": "2.50"}, {"t": "2.51 специальный железнодорожный подвижной состав (СПС): Железнодорожный подвижной состав, предназначенный для обеспечения строительства и функционирования инфраструктуры железнодорожного транспорта и включающий в себя несъемные самоходные подвижные единицы на железнодорожном ходу, такие, как мотовозы, дрезины, специальные автомотрисы, железнодорожно-строительные машины с автономным двигателем и тяговым приводом, а также несамоходные подвижные единицы на железнодорожном ходу, такие, как железнодорожно-строительные машины без тягового привода, прицепы и специальный железнодорожный подвижной состав, включаемый в хозяйственные поезда и предназначенный для производства работ по содержанию, обслуживанию и ремонту сооружений и устройств железных дорог.", "b": false, "n": "2.51"}, {"t": "2.52 сплотка: Поезд, состоящий только из группы сцепленных локомотивов или моторвагонного подвижного состава.", "b": false, "n": "2.52"}, {"t": "2.53 спуск затяжной: Спуск при следующих значениях крутизны и протяженности:", "b": false, "n": "2.53"}, {"t": "крутизной от 0,008 до 0,010, протяженностью 8 км и более;", "b": false, "n": ""}, {"t": "крутизной более 0,010 до 0,014, протяженностью 6 км и более;", "b": false, "n": ""}, {"t": "крутизной более 0,014 до 0,017, протяженностью 5 км и более;", "b": false, "n": ""}, {"t": "крутизной более 0,017 до 0,020, протяженностью 4 км и более;", "b": false, "n": ""}, {"t": "крутизной от 0,020 и круче, протяженностью 2 км и более.", "b": false, "n": ""}, {"t": "2.54 спуск крутой затяжной: Спуск затяжной крутизной 0,018 и более.", "b": false, "n": "2.54"}, {"t": "2.55 ступень торможения: это часть процесса служебного торможения, при котором давление в тормозных цилиндрах (клещевых механизмах) повышается ступенями для плавного снижения скорости или остановки поезда в заранее предусмотренном месте.", "b": false, "n": "2.55"}, {"t": "2.56 тормоз автоматический (автотормоз): Техническое устройство, обеспечивающее автоматическую остановку поезда при разъединении или разрыве тормозной магистрали и (или) при открытии крана экстренного торможения (стоп-крана).", "b": false, "n": "2.56"}, {"t": "2.57 тормоз магниторельсовый: Тормоз, действие которого не зависит от сцепления колес с рельсами, а тормозная сила образуется за счёт магнитного поля.", "b": false, "n": "2.57"}, {"t": "2.58 тормоз стояночный: Техническое устройство с ручным или автоматическим приводом, расположенное на единице железнодорожного подвижного состава и предназначенное для ее закрепления на стоянке от самопроизвольного ухода, а также, при необходимости, для принудительной остановки при наличии ручного или автоматического привода внутри единицы железнодорожного подвижного состава.", "b": false, "n": "2.58"}, {"t": "2.59 тормоз электропневматический: Техническое устройство торможения с электрическим управлением тормозами.", "b": false, "n": "2.59"}, {"t": "2.60 торможение служебное: Торможение одной или несколькими ступенями регулируемой величины, достигаемое снижением давления в тормозной магистрали темпом служебного торможения для плавного уменьшения скорости или остановки поезда, а также наполнение тормозного цилиндра при электропневматическом торможении.", "b": false, "n": "2.60"}, {"t": "2.61 торможение ступенчатое: Торможение служебное, достигаемое снижением давления в тормозной магистрали последующими ступенями для регулирования скорости движения поезда или его остановки.", "b": false, "n": "2.61"}, {"t": "2.62 торможение полное служебное: Служебное торможение, достигаемое снижением давления в тормозной магистрали в од
