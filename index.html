давления в тормозной магистрали, когда причина не установлена;", "b": false, "n": ""}, {"t": "- при смене кабины управления или после передачи управления машинисту второго локомотива на перегоне, после остановки в связи с невозможностью дальнейшего управления его движением из головной кабины.", "b": false, "n": ""}, {"t": "9.5.3 В грузовых и грузопассажирских поездах сокращенное опробование автоматических тормозов дополнительно выполняется:", "b": false, "n": "9.5.3"}, {"t": "- при стоянке поезда, если установлено изменение плотности тормозной магистрали более чем на 20 % от указанной в «Справке об обеспечении поезда тормозами и исправном их действии»;", "b": false, "n": ""}, {"t": "- на стоянке при самопроизвольном снижении давления в тормозной магистрали или подачи визуального светового сигнала о срабатывании датчика контроля состояния тормозной магистрали;", "b": false, "n": ""}, {"t": "- в случае остановки поезда при выявлении нарушения целостности тормозной магистрали.", "b": false, "n": ""}, {"t": "9.5.4 Сокращенное опробование электропневматических тормозов пассажирских поездов выполняется:", "b": false, "n": "9.5.4"}, {"t": "- при смене локомотива;", "b": false, "n": ""}, {"t": "- при смене локомотивных бригад;", "b": false, "n": ""}, {"t": "- при смене направления движения;", "b": false, "n": ""}, {"t": "- при прицепке вагонов с проверкой действия тормоза на каждом прицепленном вагоне;", "b": false, "n": ""}, {"t": "- при отцепке вагонов;", "b": false, "n": ""}, {"t": "- после прицепки поездного локомотива к составу, если предварительно на станции было выполнено полное опробование электропневматических тормозов от стационарного устройства (в том числе и с автоматической регистрацией) или другого локомотива.", "b": false, "n": ""}, {"t": "9.5.5 При проведении сокращенного опробования автоматических тормозов грузовых и грузопассажирских поездов после полного опробования от стационарного устройства (в том числе и с автоматической регистрацией) или локомотива, необходимо проверить:", "b": false, "n": "9.5.5"}, {"t": "- зарядное давление в магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "Для этого произвести установку измерительного устройства для измерения давления в тормозной магистрали хвостового вагона. Замер давления в тормозной магистрали хвостового вагона поезда выполнять после полной зарядки тормозной магистрали всего поезда. Показания давления в тормозной магистрали хвостового вагона при поездном положении ручки крана машиниста не должны отличаться от зарядного давления в голове более чем:", "b": false, "n": ""}, {"t": "а) на 0,03 МПа (0,3 кгс/см2) при длине состава поезда до 300 осей включительно;", "b": false, "n": ""}, {"t": "б) на 0,05 МПа (0,5 кгс/см2) при длине состава поезда более 300 до 400 осей включительно;", "b": false, "n": ""}, {"t": "в) на 0,07 МПа (0,7 кгс/см2) при длине состава поезда более 400 осей;", "b": false, "n": ""}, {"t": "- произвести демонтаж измерительного устройства для измерения давления в тормозной магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "- целостность тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона. Проверку осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана хвостового вагона на 8 - 10 секунд;", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда при поездном положении ручки крана машиниста.", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля (измерения) плотности тормозной магистрали, проверку плотности производить по показанию этого устройства.", "b": false, "n": ""}, {"t": "Проверку плотности производят при поездном положении ручки крана машиниста после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной сети в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов двух хвостовых вагонов на торможение. Для этого необходимо произвести снижение давления по уравнительному резервуару на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием». По истечении 120 секунд (2 минут) осмотрщики вагонов обязаны проверить состояние и действие автоматических тормозов двух хвостовых вагонов и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес.", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда после ступени торможения и перевода ручки крана машиниста в положение «Перекрыша с питанием» выполняют по истечении 120 секунд (2 минут) замером аналогичным плотности тормозной магистрали поезда при поездном положении ручки крана машиниста, которая не должна отличаться от плотности при поездном положении ручки крана машиниста более чем на 10 % в сторону уменьшения.", "b": false, "n": ""}, {"t": "Для грузовых поездов с составом до 100 осей включительно проверка плотности тормозной сети поезда в положении ручки крана машиниста «Перекрыша с питанием» не производится.", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля (измерения) плотности тормозной магистрали, проверку плотности производить по показанию этого устройства;", "b": false, "n": ""}, {"t": "- отпуск автоматических тормозов двух хвостовых вагонов с замером времени отпуска. Выполнять постановкой ручки крана машиниста в положение «Зарядка и отпуск» до зарядного давления в поездах с составом до 100 осей включительно, а свыше 100 осей – повышением давления в уравнительном резервуаре выше зарядного давления на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) и последующего ее перевода в поездное положение при этом осмотрщики вагонов обязаны произвести замер времени отпуска двух хвостовых вагонов (при длине грузового поезда 100 осей и менее замер времени отпуска тормозов двух хвостовых вагонов не производится) и убедиться в нормальной работе двух хвостовых вагонов на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес.", "b": false, "n": ""}, {"t": "Временем отпуска автоматических тормозов двух последних вагонов в хвосте поезда принимается наибольшее время отпуска вагонов.", "b": false, "n": ""}, {"t": "При выявлении, не сработавших на отпуск, воздухораспределителей не разрешается выполнять их отпуск вручную до выяснения причин неотпуска. Все выявленные неисправности тормозного оборудования на вагонах должны быть устранены и действие тормозов у этих вагонов вновь проверено.", "b": false, "n": ""}, {"t": "По окончании опробования машинисту вручается «Справка об обеспечении поезда тормозами и исправном их действии» как при полном опробовании.", "b": false, "n": ""}, {"t": "9.5.6 При сокращенном опробовании автоматических тормозов грузовых и грузопассажирских поездов проверяют:", "b": false, "n": "9.5.6"}, {"t": "- целостность тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона путем открытия концевого крана на хвостовом вагоне на 8-10 секунд;", "b": false, "n": ""}, {"t": "- плотность тормозной сети при поездном положении ручки крана машиниста после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной сети в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил.", "b": false, "n": ""}, {"t": "Измеренные данные плотности тормозной сети поезда должны быть занесены в «Справку об обеспечении поезда тормозами и исправном их действии»;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов двух хвостовых вагонов на торможение после снижения давления в уравнительном резервуаре локомотива на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием» при этом осмотрщики вагонов или работники, на которого эта обязанность возложена владельцем инфраструктуры обязаны проверить состояние и действие автоматических тормозов двух хвостовых вагонов и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов двух хвостовых вагонов на отпуск путем перевода ручки крана машиниста в положение «Зарядка и отпуск» до зарядного давления в поездах с составом до 100 осей включительно, а свыше 100 осей – повышением давления в уравнительном резервуаре выше зарядного давления на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) и последующего ее перевода в поездное положение. При этом осмотрщики вагонов или работники, на которых эта обязанность возложена владельцем инфраструктуры обязаны проверить отпуск автоматических тормозов двух хвостовых вагонов и убедиться в их нормальной работе на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес.", "b": false, "n": ""}, {"t": "9.5.7 При прицепке к грузовому или грузопассажирскому поезду вагона или группы вагонов необходимо произвести:", "b": false, "n": "9.5.7"}, {"t": "- проверку целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда. Проверку осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана хвостового вагона на 8 - 10 секунд;", "b": false, "n": ""}, {"t": "- замер плотности тормозной сети поезда при поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля (измерения) плотности тормозной магистрали, проверку плотности производить по показанию этого устройства.", "b": false, "n": ""}, {"t": "Проверку плотности производят при поездном положении ручки крана машиниста после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной сети в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил;", "b": false, "n": ""}, {"t": "- сокращенное опробование автоматических тормозов с обязательной проверкой действия автоматического тормоза у каждого прицепленного вагона и дополнительно при длине грузового поезда более 100 осей замером времени отпуска двух хвостовых вагонов.", "b": false, "n": ""}, {"t": "Для проверки на торможение необходимо произвести снижение давления в уравнительном резервуаре локомотива на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием» при этом осмотрщики вагонов или работники, на которых эта обязанность возложена владельцем инфраструктуры, обязаны проверить состояние и действие автоматических тормозов у каждого прицепленного вагона и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес. После этого по команде осмотрщика вагонов или работника, на которого эта обязанность возложена владельцем инфраструктуры произвести отпуск путем перевода ручки крана машиниста в положение «Зарядка и отпуск» до зарядного давления в поездах с составом до 100 осей включительно, а свыше 100 осей – повышением давления в уравнительном резервуаре выше зарядного давления на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) и последующего ее перевода в поездное положение. При этом осмотрщики вагонов или работники, на которых эта обязанность возложена владельцем инфраструктуры, обязаны проверить отпуск автоматических тормозов у каждого прицепленного вагона и убедиться в их нормальной работе на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес, а при длине грузового поезда более 100 осей произвести замер времени отпуска двух хвостовых вагонов.", "b": false, "n": ""}, {"t": "Временем отпуска автоматических тормозов двух последних вагонов в хвосте поезда принимается наибольшее время отпуска вагонов.", "b": false, "n": ""}, {"t": "9.5.8 При проведении сокращенного опробования тормозов в пассажирских поездах после полного опробования от стационарного устройства (в том числе и с автоматической регистрацией) или локомотива, то необходимо произвести отключение источника питания электропневматического тормоза на локомотиве и проверить:", "b": false, "n": "9.5.8"}, {"t": "- целостность тормозной и питательной ((в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) магистралей поезда и свободности прохождения сжатого воздуха по ним до хвостового вагона. При проверке целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона необходимо убедиться в свободности прохождения сжатого воздуха по ней и срабатывании не менее двух ускорителей экстренного торможения воздухораспределителей на вагонах в голове и хвосте поезда.", "b": false, "n": ""}, {"t": "При наличии в поезде более трети вагонов с включенными пассажирскими автоматическими тормозами со ступенчатым отпуском перед проверкой целостности тормозной магистрали и свободности прохождения сжатого воздуха по ней до хвостового вагона машинист должен перевести ручку крана машиниста в положение «Перекрыша без питания», а после срабатывания автоматических тормозов, снижения давления в тормозной магистрали и уравнительном резервуаре ручку крана машиниста перевести в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Отпуск автоматических тормозов поезда до зарядного давления производить установкой ручки крана машиниста в положение, «Зарядка и отпуск» и продолжить зарядку тормозной магистрали в поездном положении. Проверку целостности питательной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона при эксплуатации пассажирских поездов с применением питательной магистрали локомотива осуществляют путем открытия последнего концевого крана хвостового вагона;", "b": false, "n": ""}, {"t": "- проверку целостности питательной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона при эксплуатации пассажирских поездов с применением питательной магистрали локомотива проводят при давлении не менее 0,80 МПа (8,0 кгс/см2) путем открытия последнего концевого крана питательной магистрали хвостового вагона. Положительной считается проверка, при которой машинист локомотива фиксирует снижение давления в питательной магистрали;", "b": false, "n": ""}, {"t": "- проверку плотности тормозной сети поезда при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления от органа управления к исполнительным устройствам производится электрическим или иным способом разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста установить в закрытое положение). По истечении 20 секунд после отключения питания тормозной магистрали замеряют снижение давления в тормозной магистрали: снижение давления допускается на величину не более чем на 0,02 МПа (0,2 кгс/см2) в течение 60 секунд (1 минуты);", "b": false, "n": ""}, {"t": "- проверку плотности питательной сети поезда при эксплуатации пассажирских поездов с применением питательной магистрали локомотива проводят при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления к исполнительным устройствам производится электрическим или иным способом, разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста нужно установить в закрытое положение. После отключения питания тормозной магистрали замеряют снижение давления в питательной магистрали с 0,84 МПа (8,4 кгс/см2): снижение давления допускается на величину не более чем на 0,05 МПа (0,5 кгс/см2) в течение 60 секунд (1 минута);", "b": false, "n": ""}, {"t": "- проверку действия электропневматических тормозов на торможение и отпуск двух хвостовых проводят при включенном источнике электрического питания электропневматического тормоза и выключенном переключателе дублированного питания проводов на локомотиве.", "b": false, "n": ""}, {"t": "Проверку производят при нахождении ручки вспомогательного тормоза в первом тормозном положении путем служебного торможения до получения давления в тормозных цилиндрах локомотива 0,10 - 0,20 МПа (1,0 - 2,0 кгс/см2). Во время торможения напряжение источника питания должно быть не ниже 45 В.", "b": false, "n": ""}, {"t": "При положении служебного торможения ручки крана машиниста на световом сигнализаторе пульта машиниста должна загореться лампа «Т», а при переводе ручки крана в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения, лампа «Т» должна погаснуть и загореться лампа «П».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов обязаны проверить действие на торможение электропневматических тормозов во всем поезде и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку действие на торможение электропневматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "Напряжение в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне должно быть более 30 В.", "b": false, "n": ""}, {"t": "После проверки действия на торможение электропневматических тормозов необходимо отключить электрическое питание электропневматического тормоза на локомотиве и оставить ручку крана машиниста в положении «Перекрыша с питанием». Не менее чем через 15 секунд, когда произойдет отпуск электропневматических тормозов в поезде, включить питание электропневматического тормоза на локомотиве.", "b": false, "n": ""}, {"t": "Осмотрщики вагонов должны проверить отпуск тормозов у всех вагонов по уходу штока тормозных цилиндров и отходу тормозных колодок (тормозных накладок) от поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку отпуска электропневматических тормозов допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "После этого машинист должен перевести ручку крана машиниста в поездное положение и отключить электропневматический тормоз.", "b": false, "n": ""}, {"t": "В случае выявления осмотрщиками неотпустившего тормоза у одного из вагонов неисправный электровоздухораспределитель должен быть заменен, а сокращенное опробование электропневматических тормозов выполнено повторно с проверкой действия у отремонтированного вагона;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов двух хвостовых вагонов на торможение и отпуск.", "b": false, "n": ""}, {"t": "Для проверки на торможение необходимо снизить давление в уравнительном резервуаре за один прием на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2) от зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов не ранее чем через 120 секунд (2 минуты) после выполненного торможения обязаны проверить состояние и действие автоматических тормозов двух хвостовых вагонов и убедиться в их нормальной работе на торможение по выходу штоков тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска).", "b": false, "n": ""}, {"t": "По окончании проверки действия автоматических тормозов на торможение с последующим отпуском тормозов поездным положением крана машиниста осмотрщики вагонов должны проверить отпуск тормозов у вагонов по уходу штока тормозного цилиндра и отходу тормозных колодок (тормозных накладок) от колес (тормозных дисков).", "b": false, "n": ""}, {"t": "На вагонах с дисковыми тормозами проверку действия автоматических тормозов и их отпуска допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "В случае выявления при выполнении опробования автоматических тормозов в поезде с вагонами, оборудованными дисковыми тормозами, продолжительного времени выхода воздуха через кран машиниста после ступени торможения и нахождении ручки крана машиниста в положение «Перекрыша с питанием», опробование прекратить до устранения неисправности обратного клапана одного из вагонов.", "b": false, "n": ""}, {"t": "Все выявленные неисправности тормозного оборудования на вагонах должны быть устранены и действие автоматических тормозов у этих вагонов вновь проверено.", "b": false, "n": ""}, {"t": "По окончании опробования машинисту вручается «Справка об обеспечении поезда тормозами и исправном их действии» как при полном опробовании.", "b": false, "n": ""}, {"t": "9.5.9  вагонов необходимо проверить:", "b": false, "n": "9.5.11"}, {"t": "- целостность тормозной и питательной магистралей поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона.", "b": false, "n": ""}, {"t": "При наличии в поезде более трети вагонов с включенными пассажирскими автоматическими тормозами со ступенчатым отпуском перед проверкой целостности тормозной магистрали и свободности прохождения сжатого воздуха по ней до хвостового вагона машинист должен перевести ручку крана машиниста в положение «Перекрыша без питания», а после срабатывания автоматических тормозов, снижения давления в тормозной магистрали и уравнительном резервуаре ручку крана машиниста перевести в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Отпуск автоматических тормозов поезда до зарядного давления производить установкой ручки крана машиниста в положение, «Зарядка и отпуск» и продолжить зарядку тормозной магистрали в поездном положении.", "b": false, "n": ""}, {"t": "Проверку целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана хвостового вагона. При проверке целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда необходимо убедиться в свободности прохождения сжатого воздуха по ней и срабатывании не менее двух ускорителей экстренного торможения воздухораспределителей на вагонах в голове и хвосте поезда.", "b": false, "n": ""}, {"t": "Проверку целостности питательной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона при эксплуатации пассажирских поездов с применением питательной магистрали локомотива проводят при давлении не менее 0,80 МПа (8,0 кгс/см2) путем открытия последнего концевого крана питательной магистрали хвостового вагона. Положительной считается проверка, при которой машинист локомотива фиксирует снижение давления в питательной магистрали;", "b": false, "n": ""}, {"t": "- проверку плотности тормозной сети поезда при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления от органа управления к исполнительным устройствам производится электрическим или иным способом разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста установить в закрытое положение). По истечении 20 секунд после отключения питания тормозной магистрали замеряют снижение давления в тормозной магистрали: снижение давления допускается на величину не более чем на 0,02 МПа (0,2 кгс/см 2) в течение 60 секунд (1 минуты);", "b": false, "n": ""}, {"t": "- проверку плотности питательной сети поезда при эксплуатации пассажирских поездов с применением питательной магистрали локомотива проводят при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления к исполнительным устройствам производится электрическим или иным способом, разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста нужно установить в закрытое положение. После отключения питания питательной магистрали замеряют снижение давления в питательной магистрали с 0,84 МПа (8,4 кгс/см2): снижение давления допускается на величину не более чем на 0,05 МПа (0,5 кгс/см2) в течение 60 секунд (1 минуты);", "b": false, "n": ""}, {"t": "- проверку действия электропневматических тормозов на торможение и отпуск у каждого прицепленного вагона проводят при включенном источнике электрического питания электропневматического тормоза и выключенном переключателе дублированного питания проводов на локомотиве.", "b": false, "n": ""}, {"t": "Проверку производят при нахождении ручки вспомогательного тормоза в первом тормозном положении путем служебного торможения до получения давления в тормозных цилиндрах локомотива 0,10 - 0,20 МПа (1,0 - 2,0 кгс/см2). Во время торможения напряжение источника питания должно быть не ниже 45 В.", "b": false, "n": ""}, {"t": "При положении служебного торможения ручки крана машиниста на световом сигнализаторе пульта машиниста должна загореться лампа «Т», а при переводе ручки крана в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения, лампа «Т» должна погаснуть и загореться лампа «П».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов обязаны проверить действие на торможение электропневматических тормозов у каждого прицепленного вагона и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку действие на торможение электропневматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "Напряжение в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне должно быть более 30 В.", "b": false, "n": ""}, {"t": "После проверки действия на торможение электропневматических тормозов необходимо отключить электрическое питание электропневматического тормоза на локомотиве и оставить ручку крана машиниста в положении «Перекрыша с питанием». Не менее чем через 15 секунд, когда произойдет отпуск электропневматических тормозов в поезде, включить питание электропневматического тормоза на локомотиве.", "b": false, "n": ""}, {"t": "Осмотрщики вагонов должны проверить отпуск тормозов вагонов по уходу штока тормозных цилиндров и отходу тормозных колодок (тормозных накладок) от поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку отпуска электропневматических тормозов допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "После этого машинист должен перевести ручку крана машиниста в поездное положение и отключить электропневматический тормоз.", "b": false, "n": ""}, {"t": "В случае выявления осмотрщиками не отпустившего тормоза у одного из вагонов неисправный электровоздухораспределитель должен быть заменен, а сокращенное опробование электропневматических тормозов выполнено повторно с проверкой действия у отремонтированного вагона;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов у каждого прицепленного вагона на торможение и отпуск.", "b": false, "n": ""}, {"t": "Для проверки на торможение необходимо снизить давление в уравнительном резервуаре за один прием на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2) от зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов после выполненного торможения обязаны проверить состояние и действие автоматических тормозов у каждого прицепленного вагона и убедиться в их нормальной работе на торможение по выходу штоков тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска).", "b": false, "n": ""}, {"t": "По окончании проверки действия автоматических тормозов на торможение с последующим отпуском тормозов поездным положением крана машиниста осмотрщики вагонов должны проверить отпуск тормозов у каждого прицепленного вагона по уходу штока тормозного цилиндра и отходу тормозных колодок (тормозных накладок) от колес (тормозных дисков).", "b": false, "n": ""}, {"t": "На вагонах с дисковыми тормозами проверку действия автоматических тормозов и их отпуска допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "В случае выявления при выполнении полного опробования автоматических тормозов в поезде с вагонами, оборудованными дисковыми тормозами, продолжительного времени выхода воздуха через кран машиниста после ступени торможения и нахождении ручки крана машиниста в положение «Перекрыша с питанием», опробование прекратить до устранения неисправности обратного клапана одного из вагонов.", "b": false, "n": ""}, {"t": "Все выявленные неисправности тормозного оборудования на вагонах должны быть устранены и действие автоматических тормозов у этих вагонов вновь проверено.", "b": false, "n": ""}]}, {"id": "tb9_6", "cat": "tm_test", "page": 0, "pages": [], "title": "9.6 Порядок проведения технологического опробования тормозов в грузовых поездах", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 85–87", "paras": [{"t": "9.6.1 Технологическое опробование автоматических тормозов в грузовых поездах производится на перегонах, станциях, обгонных пунктах, где нет осмотрщиков вагонов или работников, на которых эта обязанность возложена владельцем инфраструктуры, в следующих случаях:", "b": false, "n": "9.6.1"}, {"t": "- после передачи управления машинисту второго локомотива;", "b": false, "n": ""}, {"t": "- при смене кабины управления или после передачи управления машинисту второго локомотива на перегоне после остановки грузового поезда в связи с невозможностью дальнейшего управления движением поезда из головной кабины;", "b": false, "n": ""}, {"t": "- при снижении давления в главном резервуаре ниже 0,55 МПа (5,5 кгс/см2);", "b": false, "n": ""}, {"t": "- при прицепке дополнительного локомотива в голову поезда для следования по одному или нескольким перегонам и после отцепки этого локомотива;", "b": false, "n": ""}, {"t": "- при стоянке более 1800 секунд (30 минут).", "b": false, "n": ""}, {"t": "9.6.2 При технологическом опробовании автоматических тормозов необходимо проверить:", "b": false, "n": "9.6.2"}, {"t": "- плотность тормозной сети при поездном положении ручки крана машиниста, которая не должна отличаться от плотности, указанной в «Справке об обеспечении поезда тормозами и исправном их действии», более чем на 20 % в сторону уменьшения или увеличения (при изменившемся объеме главных резервуаров вследствие передачи управления машинисту второго локомотива изменить эту норму (пропорционально объему главных резервуаров). Если при проверке плотности тормозной магистрали машинист обнаружит изменение более, чем на 20 % от указанной величины в «Справке об обеспечении поезда тормозами и исправном их действии», выполняется сокращенное опробование автоматических тормозов с отметкой в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": ""}, {"t": "Проверку плотности производят после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной сети в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов на торможение и отпуск на вагонах в головной части поезда, конкретное количество которых, но не менее пяти, устанавливается в технико-распорядительных документах владельца инфраструктуры. Проверка действия автоматических тормозов на торможение проводится после снижения давления в уравнительном резервуаре локомотива на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием». При этом помощник машиниста обязан проверить состояние и действие автоматических тормозов на вагонах в головной части поезда и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес.", "b": false, "n": ""}, {"t": "По команде помощника машиниста произвести отпуск автоматических тормозов путем перевода ручки крана машиниста в положение, обеспечивающее повышение давления в тормозной магистрали выше зарядного до зарядного давления в поездах с составом до 100 осей включительно, а свыше 100 осей – повышением давления в уравнительном резервуаре выше зарядного давления на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) и последующего ее перевода в поездное положение при этом помощник машиниста обязан проверить отпуск автоматических тормозов на вагонах в головной части поезда и убедиться в их нормальной работе на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес.", "b": false, "n": ""}, {"t": "9.6.3 Если в хвост грузового поезда прицеплен подталкивающий локомотив, тормозная магистраль которого включена в общую магистраль поезда, и радиосвязь действует исправно или при наличии автоматической системы, позволяющей машинисту контролировать величину давления в тормозной магистрали хвостового вагона, то контроль состояния тормозной магистрали поезда, в указанных выше случаях, соответственно выполняют машинист подталкивающего локомотива по показаниям манометра тормозной магистрали и срабатыванию сигнальной лампы датчика состояния тормозной магистрали или машинист головного локомотива по показаниям индикатора автоматической системы. Целостность тормозной магистрали поезда, свободности прохождения сжатого воздуха до хвостового вагона поезда и плотность тормозной магистрали при этом не проверяется, а также не выполняется проверка действия автоматических тормозов на стоянке.", "b": false, "n": "9.6.3"}, {"t": "9.6.4 Перед отправлением поезда машинист подталкивающего локомотива обязан сообщить по радиосвязи величину давления в тормозной магистрали хвостового вагона машинисту головного локомотива.", "b": false, "n": "9.6.4"}]}, {"id": "tb9_7", "cat": "tm_test", "page": 0, "pages": [], "title": "9.7 Особенности опробования автоматических тормозов в поездах повышенного веса и длины", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 87–89", "paras": [{"t": "9.7.1 Подготовку и полное опробование тормозного оборудования в составе поезда выполнять от стационарного устройства в том числе с регистрацией параметров или локомотивов. Зарядное давление должно быть: 0,48 - 0,50 МПа (4,8 - 5,0 кгс/см2) для порожнего грузового поезда и 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2) – для груженого грузового поезда.", "b": false, "n": "9.7.1"}, {"t": "При раздельной подготовке и полном опробовании автоматических тормозов в двух составах, находящихся на разных путях, от стационарных установок, в том числе с регистрацией параметров, или локомотивов с последующим их соединением зарядное давление для составов должно быть 0,48 - 0,50 МПа (4,8 - 5,0 кгс/см2) для порожних грузовых поездов и 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2) – для груженых грузовых поездов. Такое же зарядное давление должны иметь локомотивы, обеспечивающие маневровые передвижения этих составов при их соединении.", "b": false, "n": ""}, {"t": "9.7.2 В каждом из составов, готовящихся для объединения в поезд повышенного веса и длины на разных путях станции, выполнять полное опробование автоматических тормозов от стационарной установки в том числе с автоматической регистрацией параметров. Зарядку тормозных магистралей и полное опробование автоматических тормозов от локомотивов на разных путях подготавливаемых составов для объединения в поезд повышенного веса и длины выполнять только в случае отсутствия на станции стационарной установки с автоматической регистрацией параметров.", "b": false, "n": "9.7.2"}, {"t": "9.7.3 Полное опробование автоматических тормозов у поездов, подлежащих соединению на станции, выполняется у каждого состава раздельно с выдачей машинистам «Справки об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.7.3"}, {"t": "9.7.4 После объединения предварительно подготавливаемых на разных путях станции составов, прицепки поездного локомотива, соединения рукавов тормозной магистрали и открытия концевых кранов, зарядки сжатым воздухом необходимо проверить:", "b": false, "n": "9.7.4"}, {"t": "- зарядное давление в магистрали хвостового вагона.", "b": false, "n": ""}, {"t": "Для этого произвести установку измерительного устройства для измерения давления в тормозной магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "Замер давления в тормозной магистрали хвостового вагона поезда выполнять после полной зарядки тормозной магистрали всего поезда.", "b": false, "n": ""}, {"t": "Значение давления в магистрали хвостового вагона поезда записать в «Справку об обеспечении поезда тормозами и исправном их действии». Показания давления в тормозной магистрали хвостового вагона должно быть не менее 0,45 МПа (4,5 кгс/см2).", "b": false, "n": ""}, {"t": "Далее произвести демонтаж измерительного устройства для измерения давления в тормозной магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "- целостность тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона;", "b": false, "n": ""}, {"t": "Проверку осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана хвостового вагона на 8 - 10 секунд;", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда при поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля плотности тормозной магистрали, проверку плотности производить по показанию этого устройства.", "b": false, "n": ""}, {"t": "Проверку плотности производят после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной сети в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил;", "b": false, "n": ""}, {"t": "- действие автоматических тормозов пяти хвостовых вагонов на торможение после снижения давления в уравнительном резервуаре локомотива на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием» осмотрщики вагонов обязаны проверить состояние и действие автоматических тормозов пяти хвостовых вагонов и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес;", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда после ступени торможения при нахождении ручки крана машиниста в положении «Перекрыша с питанием». Производится не менее чем через 120 секунд (2 минуты) после ступени торможения при нахождении ручки крана машиниста в положении «Перекрыша с питанием» проверяется плотность тормозной магистрали поезда аналогично установленной проверке при поездном положении ручки крана машиниста. При этом плотность тормозной магистрали поезда при положении ручки крана машиниста в положении «Перекрыша с питанием» не должна уменьшиться более чем на 10%;", "b": false, "n": ""}, {"t": "- действие на отпуск автоматических тормозов с замером времени отпуска. Выполнять путем перевода ручки крана машиниста в положение «Зарядка и отпуск» и повышения давления в уравнительном резервуаре выше зарядного давления на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) и последующего ее перевода в поездное положение. При этом осмотрщики вагонов обязаны проверить отпуск автоматических тормозов пяти хвостовых вагонов с замером времени отпуска двух хвостовых вагонов и убедиться в их нормальной работе на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес.", "b": false, "n": ""}, {"t": "По окончании этого опробования машинисту вручается «Справка об обеспечении поезда тормозами и исправном их действии» как при полном опробовании. Порядок ее выдачи устанавливает руководитель подразделения владельца инфраструктуры.", "b": false, "n": ""}]}, {"id": "tb9_8", "cat": "tm_test", "page": 0, "pages": [], "title": "9.8 Особенности опробования автоматических тормозов в соединённом поезде с объединёнными тормозными магистралями", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 89–90", "paras": [{"t": "9.8.1 Полное опробование автотормозов у поездов, подлежащих соединению на станции, выполняется у каждого состава раздельно с выдачей машинистам «Справки об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.8.1"}, {"t": "9.8.2 После соединения поездов при объединении тормозной магистрали необходимо проверить целостность тормозной магистрали поезда по срабатыванию датчиков контроля состояния тормозной магистрали локомотивов обоих поездов, а также плотность тормозной сети поезда.", "b": false, "n": "9.8.2"}, {"t": "Для проверки плотности тормозной сети поезда при поездном положении ручки крана машиниста принимать следующие допускаемые минимальные значения времени снижения давления в главных резервуарах на 0,05 МПа (0,5 кгс/см2) в зависимости от числа осей в составе на каждые 1000 л объема главных резервуаров. Число осей 351 - 400 401 - 500 501 – 600 601 - 700 701 - 800 Время, с 15 13 10 9 8 При подключении в голову состава локомотива (локомотивов) с большим объемом главных резервуаров указанное время определяется путем пропорционального увеличения в зависимости от увеличившегося их объема.", "b": false, "n": ""}, {"t": "9.8.3 Отпуск автоматических тормозов выполнять с завышением давления в уравнительном резервуаре на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) выше зарядного давления.", "b": false, "n": "9.8.3"}]}, {"id": "tb9_9", "cat": "tm_test", "page": 0, "pages": [], "title": "9.9 Порядок проведения проверки действия тормозов одиночно следующего локомотива", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 90", "paras": [{"t": "9.9.1 Перед отправлением с начальной станции локомотивная бригада обязана проверить действие автоматического тормоза.", "b": false, "n": "9.9.1"}, {"t": "9.9.2 Для подвижного состава, оборудованного воздухораспределителем грузового типа, проверка выполняется на груженом и равнинном режиме работы воздухораспределителя, а на локомотивах, у которых отпуск автоматического тормоза обеспечивается выпуском сжатого воздуха из рабочей камеры воздухораспределителей, – на груженом и горном режиме. Проверку необходимо выполнять снижением давления в уравнительном резервуаре с зарядного давления на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2), а при воздухораспределителе, действующем через кран вспомогательного тормоза – на 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2). После торможения убедиться в том, что давление в тормозных цилиндрах (тормозных блоках) локомотива не менее 0,1 МПа (1,0 кгс/см2) и штоки поршней вышли из тормозных цилиндров, а тормозные колодки (тормозные накладки) прижаты к колесам (тормозным дискам). После окончания проверки необходимо отпустить тормоза поездным положением ручки крана машиниста, а тормозные колодки (тормозные накладки) должны отойти от колес (тормозных дисков).", "b": false, "n": "9.9.2"}, {"t": "9.9.3 Для подвижного состава, оборудованного воздухораспределителем пассажирского типа, проверку необходимо выполнять снижением давления в уравнительном резервуаре с зарядного давления на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2). После торможения убедиться в том, что давление в тормозных цилиндрах локомотива составляет не менее 0,1 МПа (1,0 кгс/см2) и штоки поршней вышли из тормозных цилиндров, а тормозные колодки (тормозные накладки) прижаты к колесам (тормозным дискам). После окончания проверки необходимо установить ручку крана машиниста в поездное положение, при котором тормоз должен отпустить, а тормозные колодки (тормозные накладки) должны отойти от колес (тормозных дисков).", "b": false, "n": "9.9.3"}, {"t": "На локомотивах, оборудованных тормозными блоками, проверку действие на торможение и отпуск тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах локомотивов в видимой зоне.", "b": false, "n": ""}]}, {"id": "tb10_1", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.1 Обязанности и порядок действий локомотивной бригады", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 91–99", "paras": [{"t": "10.1.1 Локомотивная бригада при ведении поезда обязана:", "b": false, "n": "10.1.1"}, {"t": "- осуществлять контроль пределов давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении в соответствии с технической документаций на тяговый подвижной состав, а также не допускать снижения давления ниже установленных норм;", "b": false, "n": ""}, {"t": "- обеспечить поддержание необходимого зарядного давления в тормозной магистрали при поездном положении ручки крана машиниста и не допускать снижения давления ниже установленных норм;", "b": false, "n": ""}, {"t": "- при отправлении со станции убедиться, нет ли в составе поезда искрения или каких-либо других признаков, угрожающих безопасному следованию, а также, не подаются ли сигналы остановки поездной бригадой, станционными работниками или работниками других служб;", "b": false, "n": ""}, {"t": "- иметь тормоза всегда готовые к действию и выполнять проверку их действие в пути следования;", "b": false, "n": ""}, {"t": "- при ведении пассажирского поезда на электропневматических тормозах иметь включенный источник питания, кроме случаев оговоренных настоящими Правилами.", "b": false, "n": ""}, {"t": "При этом напряжение по контрольно-измерительным приборам локомотива пассажирского поезда при поездном положении крана машиниста должно быть не ниже 48 В, а при служебном торможении электропневматическим тормозом - не ниже 45 В, а на пульте управления должна гореть сигнальная лампа контроля состояния цепи электропневматического тормоза.", "b": false, "n": ""}, {"t": "10.1.2 При следовании поезда с локомотивом, оборудованным электрическим тормозом, эксплуатировать с обязательным его использованием. Режимы торможения и места применения электрического тормоза устанавливаются в технико-распорядительных документах владельца инфраструктуры, которые разрабатываются на основании расчетов, результатов опытных поездок и с учетом требований руководства по эксплуатации конкретной серии локомотива. При этом тормозная сила не должна превышать максимально допустимое значение по условиям устойчивости подвижного состава в колее, по его прочности и воздействию на путь.", "b": false, "n": "10.1.2"}, {"t": "10.1.3 Не допускать одновременное применения автоматических тормозов и электрического торможения на локомотивах, не предусмотренных заводской электрической схемой локомотива. При применении электрического торможения вспомогательный тормоз локомотива отпустить.", "b": false, "n": "10.1.3"}, {"t": "10.1.4 Наилучшая плавность торможения поезда обеспечивается разрядкой тормозной магистрали в начале служебного торможения на величину первой ступени.", "b": false, "n": "10.1.4"}, {"t": "10.1.5 Полное служебное торможение применять при необходимости остановки поезда или снижения его скорости значительно эффективнее и на более коротком расстоянии, чем при выполнении ступенчатого торможения.", "b": false, "n": "10.1.5"}, {"t": "10.1.6 Применять экстренное торможение во всех поездах и на любом профиле пути, только когда требуется немедленная остановка поезда. Выполняется оно краном машиниста, а в случае необходимости комбинированным краном или клапаном аварийно-экстренного торможения с ведущего или ведомых (при двойной или многократной тяге) локомотивов.", "b": false, "n": "10.1.6"}, {"t": "После перевода ручки крана машиниста или комбинированного крана в положение экстренного торможения привести в действие приборы пескоподачи, перевести ручку крана вспомогательного тормоза локомотива в последнее тормозное положение и выключить тягу. Ручку крана машиниста или комбинированного крана оставить в положении экстренного торможения (применения клапана аварийно-экстренного торможения), ручку вспомогательного тормоза – в крайнем тормозном положении, а клапан аварийно-экстренного торможения в нажатом состоянии до полной остановки.", "b": false, "n": ""}, {"t": "10.1.7 В случае остановочного торможениях с применением песка на локомотиве подачу песка прекращать при достижении скорости 10 км/ч перед остановкой.", "b": false, "n": "10.1.7"}, {"t": "Если одиночно следующий локомотив остановлен с применением песка, то в течении не более 2 минут необходимо привести в движение локомотив и съехать на чистые рельсы.", "b": false, "n": ""}, {"t": "10.1.8 В случае выполнения торможения со скорости 40 км/ч и менее в поездах, имеющих в составе 50 % и более вагонов, оборудованных композиционными колодками или дисковыми тормозами, тормоза поезда необходимо приводить в действие раньше, чем при чугунных колодках.", "b": false, "n": "10.1.8"}, {"t": "10.1.9 При торможении краном вспомогательного тормоза локомотива со скоростью 50 км/ч и менее для исключения возникновения больших продольно-динамических реакций из-за создания резкого замедления движения локомотива необходимо регулировать торможение и отпуск с выдержками времени ступенями, за исключением случаев экстренной остановки.", "b": false, "n": "10.1.9"}, {"t": "10.1.10 Во всех случаях применения крана вспомогательного тормоза локомотива допускается с созданием давления в тормозных цилиндрах не более 0,22 МПа (2,2 кгс/см2) в течении 150 секунд (2,5 минуты), кроме случаев остановочных торможений и следовании на запрещающий сигнал.", "b": false, "n": "10.1.10"}, {"t": "Торможение вспомогательным тормозом локомотива (кроме маневровых) производить повышением давления в тормозных цилиндрах за один прием не более чем 0,15 МПа (1,5 кгс/см2). При необходимости последующего увеличения давления в тормозных цилиндрах локомотива более 0,15 МПа (1,5 кгс/см2) повторную ступень торможения выполнять до давления 0,22МПа (2,2 кгс/см2) после выдержки в течении 30 - 40 секунд.", "b": false, "n": ""}, {"t": "10.1.11 Не использовать вспомогательный тормоз локомотива для предотвращения боксования (скольжения).", "b": false, "n": "10.1.11"}, {"t": "10.1.12 Во избежание разрыва поезда или возникновения больших продольно-динамических реакций в нем при трогании с места после остановки с применением автоматических тормозов необходимо приводить локомотив в движение только после выдержки времени, указанного в главах 10.3, 10.4, 10.8 и 10.9 настоящих Правил.", "b": false, "n": "10.1.12"}, {"t": "10.1.13 При подходе к станции, где имеется остановка поезда, запрещающим сигналам и сигналам уменьшения скорости необходимо заблаговременно привести в действие тормоза и снизить скорость поезда так, чтобы не допустить проезда установленного места остановки на станции, запрещающего сигнала, предельного столбика, а сигнал уменьшения скорости и место предупреждения проследовать со скоростью, установленной для данного места.", "b": false, "n": "10.1.13"}, {"t": "10.1.14 При подъезде поезда к запрещающему сигналу или предельному столбику не допускать превышение скорости более 20 км/ч не менее чем за 400 м с последующим плавным снижением скорости и остановить поезд перед этим сигналом.", "b": false, "n": "10.1.14"}, {"t": "Для локомотивов, оборудованных устройствами, обеспечивающими контроль допустимой скорости движения в зависимости от расстояния до светофора и эффективности тормозных средств, скорость следования при движении к запрещающему сигналу должна быть указана в техникораспорядительном документе владельца инфраструктуры.", "b": false, "n": ""}, {"t": "10.1.15 При ведении грузопассажирского поезда (сплотки локомотивов, оборудованных и грузовыми, и пассажирскими воздухораспределителями) управлять тормозами таких поездов (сплоток) необходимо как в пассажирских поездах, за исключением опробования тормозов.", "b": false, "n": "10.1.15"}, {"t": "10.1.16 Каждую остановку поезда, одиночно следующего локомотива, следующего поездным порядком, выполнять с применением автоматических тормозов.", "b": false, "n": "10.1.16"}, {"t": "После остановки ручку крана вспомогательного тормоза локомотива необходимо устанавливать в крайнее тормозное положение.", "b": false, "n": ""}, {"t": "10.1.17 При прицепке к составу двух и более действующих локомотивов управление тормозами поезда осуществляет машинист первого локомотива.", "b": false, "n": "10.1.17"}, {"t": "10.1.18 Управление автоматическими тормозами сплотки из недействующих локомотивов или моторвагонного подвижного состава выполнять порядком, установленным настоящими Правилами для соответствующего вида поезда с локомотивной тягой.", "b": false, "n": "10.1.18"}, {"t": "10.1.19 Перед отправлением грузового поезда с промежуточной станции или перегона, при стоянке более 300 секунд (5 минут), машинист обязан проверить плотность тормозной сети поезда при поездном положении ручки крана машиниста с отметкой ее значения и места проверки на обратной стороне «Справки об обеспечении поезда тормозами и исправном их действии». Если при проверке плотности тормозной сети поезда машинист обнаружит ее изменение более чем на 20 % в сторону увеличения или уменьшения от указанного в «Справке об обеспечении поезда тормозами и исправном их действии» тормозами предыдущего значения, выполнить сокращенное опробование автотормозов.", "b": false, "n": "10.1.19"}, {"t": "10.1.20 Если при следовании грузового поезда появились признаки возможного нарушения целостности тормозной магистрали (частые включения компрессоров или быстрое снижение давления в главных резервуарах после выключения компрессоров при неработающих приборах пескоподачи и тифонах, резкое замедление движения поезда, не соответствующее влиянию профиля пути, срабатывание датчика контроля состояния тормозной магистрали или самопроизвольное снижение давления в тормозной магистрали), следует отключить тягу и перевести на 3 – 10 секунд ручку крана машиниста в положение «Перекрыша без питания» и наблюдать за давлением тормозной магистрали.", "b": false, "n": "10.1.20"}, {"t": "При этом в случае если:", "b": false, "n": ""}, {"t": "- не происходит быстрое и непрерывное снижение давления тормозной магистрали и резкое замедление движения поезда, следует выполнить служебное торможение с разрядкой тормозной магистрали на величину первой ступени, затем отпустить автотормоза поезда установленным порядком. При этом включать тягу разрешается только после полного отпуска автотормозов поезда;", "b": false, "n": ""}, {"t": "- происходит быстрое и непрерывное снижение давления в тормозной магистрали или резкое замедление движения поезда, не соответствующее влиянию профиля пути, следует выполнить служебное торможение на величину первой ступени, затем перевести ручку крана машиниста в положение «Перекрыша без питания» и остановить поезд без применения вспомогательного тормоза локомотива.", "b": false, "n": ""}, {"t": "После остановки поезда ручку крана вспомогательного тормоза перевести в последнее тормозное положение выяснить и установить причину.", "b": false, "n": ""}, {"t": "Если при следовании поезда на запрещающий сигнал светофора появились признаки возможного нарушения целостности тормозной магистрали, следует отключить тягу и произвести полное служебное торможение с последующим установкой ручки крана машиниста в положение «Перекрыша без питания» и наблюдать за давлением тормозной магистрали в течении не менее 15 секунд.", "b": false, "n": ""}, {"t": "При этом в случае если:", "b": false, "n": ""}, {"t": "- не происходит быстрое и непрерывное снижение давления тормозной магистрали, то после остановки поезда произвести отпуск тормозов и зарядить тормозную магистраль установленным порядком;", "b": false, "n": ""}, {"t": "- происходит быстрое и непрерывное снижение давления в тормозной магистрали, то после остановки поезда необходимо ручку крана вспомогательного тормоза перевести в крайнее тормозное положение и выяснить причину.", "b": false, "n": ""}, {"t": "В случае остановки поезда из-за нарушения целостности тормозной магистрали (происходит быстрое и непрерывное снижение давления в тормозной магистрали) необходимо выяснить причину нарушения целостности и устранить ее.", "b": false, "n": ""}, {"t": "Затем необходимо зарядить тормозную магистраль установленным порядком, выполнить проверку целостности, свободность прохождения сжатого воздуха до хвостового вагона поезда, плотность тормозной магистрали и произвести сокращенное опробование тормозов и только после этого приводить поезд в движение.", "b": false, "n": ""}, {"t": "Если при выяснении причины остановки поезда обнаружен открытый концевой кран на хвостовом вагоне, необходимо его закрыть. Сверить номер хвостового вагона с данными натурного листа и «Справки об обеспечении поезда тормозами и исправном их действии». При несоответствии фактического номера хвостового вагона с данными натурного листа и «Справки об обеспечении поезда тормозами и исправном их действии» после убеждения имеющимися в распоряжении способами, в отсутствии оставленных на перегоне вагонов, движение может быть возобновлено только по регистрируемому приказу поездного диспетчера.", "b": false, "n": ""}, {"t": "При отправлении поезда локомотивная бригада должна убедиться в отсутствии искрения или каких-либо других признаков, угрожающих безопасному следованию, а также, не подаются ли сигналы остановки поездной бригадой.", "b": false, "n": ""}, {"t": "При обнаружении признаков неотпуска тормозов, искрения или других неисправностей принять меры к остановке поезда с последующим их устранением.", "b": false, "n": ""}, {"t": "При повторении признаков возможного нарушения целостности тормозной магистрали поезда машинист обязан заявить контрольную проверку тормозов в соответствии с главой 17 настоящих Правил.", "b": false, "n": ""}, {"t": "10.1.21 В случае несанкционированного снижения давления в тормозной магистрали пассажирского поезда (срыв стоп-крана, вследствие разъединения тормозной магистрали и др.) необходимо выполнить экстренное торможение.", "b": false, "n": "10.1.21"}, {"t": "В случае остановки поезда из-за нарушения целостности тормозной магистрали необходимо выяснить причину нарушения целостности и устранить ее.", "b": false, "n": ""}, {"t": "Затем необходимо зарядить тормозную магистраль установленным порядком, выполнить проверку целостности, свободность прохождения сжатого воздуха до хвостового вагона поезда, плотность тормозной магистрали и произвести сокращенное опробование тормозов и только после этого приводить поезд в движение.", "b": false, "n": ""}, {"t": "В пассажирских поездах для проверки целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона и проведения сокращенного опробования тормозов привлекаются начальник поезда и проводники.", "b": false, "n": ""}, {"t": "Если при выяснении причины остановки поезда обнаружен открытый концевой кран на хвостовом вагоне, необходимо его закрыть. Сверить номер хвостового вагона с данными натурного листа и «Справки об обеспечении поезда тормозами и исправном их действии». При несоответствии фактического номера хвостового вагона с данными натурного листа и «Справки об обеспечении поезда тормозами и исправном их действии» после убеждения имеющимися в распоряжении способами, в отсутствии оставленных на перегоне вагонов, движение может быть возобновлено только по регистрируемому приказу поездного диспетчера.", "b": false, "n": ""}, {"t": "Если в пассажирском или почтово-багажном поезде в пути следования экстренное торможение выполнено путем срыва стоп-крана, то после полной остановки машинист выполняет отпуск, зарядку автотормозов и, после выяснения причин остановки и их устранения, приводит поезд в движение.", "b": false, "n": ""}, {"t": "При отправлении поезда локомотивная бригада должна убедиться в отсутствии искрения или каких-либо других признаков, угрожающих безопасному следованию, а также, не подаются ли сигналы остановки поездной бригадой.", "b": false, "n": ""}, {"t": "При обнаружении признаков неотпуска тормозов, искрения или других неисправностей принять меры к остановке поезда с последующим их устранением.", "b": false, "n": ""}, {"t": "При повторении признаков возможного нарушения целостности тормозной магистрали поезда машинист обязан заявить контрольную проверку тормозов в соответствии с главой 17 настоящих Правил.", "b": false, "n": ""}, {"t": "10.1.22 В случае перехода на резервное управление краном машиниста необходимо руководствоваться положениями главы 10.13 настоящих Правил.", "b": false, "n": "10.1.22"}, {"t": "10.1.23 При вынужденной остановке поезда на перегоне локомотивная бригада должна руководствоваться порядком действия работников при вынужденной остановке поезда на перегоне Правил технической эксплуатации железных дорог или иных нормативных документов, действующих на территории стран - Содружеств, Грузии, Латвийской республики, Литовской республики и Эстонской республики.", "b": false, "n": "10.1.23"}, {"t": "При обслуживании локомотивов пассажирских поездов одним машинистом выполнение операций по закреплению и ограждению поезда при его вынужденной остановке на перегоне выполняется проводниками вагонов под руководством начальника (механика-бригадира) пассажирского поезда по указанию машиниста, передаваемому по радиосвязи.", "b": false, "n": ""}, {"t": "10.1.24 При возникновении нештатных ситуаций, связанных с остановкой поезда на спуске (подъеме), выводе поезда на станцию после разрыва, остановках на крутых затяжных спусках (подъемах) после применения экстренного торможения руководствоваться главой 17 настоящих Правил.", "b": false, "n": "10.1.24"}, {"t": "10.1.25 Во время стоянок на станции, а также в пути следования необходимо контролировать положения в рабочей кабине локомотива разобщительного крана или крана двойной тяги на питательной магистрали, комбинированного или разобщительного на тормозной магистрали, а на локомотивах, оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом, разобщительного крана на питательной и тормозной магистралях к исполнительному устройству, и не перекрывать данные краны за исключением следующих случаев:", "b": false, "n": "10.1.25"}, {"t": "- при отпуске тормозов в пассажирском поезде до 7 вагонов включительно после экстренного торможения;", "b": false, "n": ""}, {"t": "- при использовании многократной тяги или подталкивающего локомотива, включенного в тормозную магистраль поезда, когда на других, кроме головного, локомотивах ручка крана двойной тяги или комбинированного крана переводится в положение двойной тяги (на локомотивах, оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом, разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста устанавливается в закрытое положение);", "b": false, "n": ""}, {"t": "- в нерабочих кабинах локомотива при отсутствии блокировочного устройства;", "b": false, "n": ""}, {"t": "- при проверке плотности тормозной и питательной сетей пассажирских поездов;", "b": false, "n": ""}, {"t": "- при необходимости устранения неисправности крана машиниста (на стоянке).", "b": false, "n": ""}, {"t": "10.1.26 В случае обнаружения искрения, дымления или других признаков неотпуска тормозов у отдельных вагонов в составе поезда необходимо остановить поезд служебным торможением для осмотра, проверки и устранения причин неисправностей вагонов.", "b": false, "n": "10.1.26"}, {"t": "Перед началом осмотра состава пассажирского поезда выключить электропневматические тормоза, отключить электроотопление поезда.", "b": false, "n": ""}, {"t": "В пассажирских поездах проверки и устранения причин неисправностей вагонов выполняются локомотивной бригадой совместно с проводниками под руководством начальника (механика-бригадира) пассажирского поезда.", "b": false, "n": ""}, {"t": "При обнаружении заторможенного состояния стояночного (ручного) тормоза или неотпустившего воздухораспределителя необходимо перевести в отпущенное состояние стояночный (ручной) тормоз или выключить из работы воздухораспределитель путем перекрытия крана на соединительном трубопроводе между тормозной магистралью и воздухораспределителем и выпустить воздух из резервуаров и камер в соответствии с типом подвижного состава. Убедиться в правильности выполненных операций по уходу штока тормозного цилиндра (или по срабатыванию индикаторов торможения на вагонах с дисковыми тормозами) и отходу тормозных колодок (тормозных накладок) от поверхности катания колес (тормозных дисков). Для обнаружения ползунов (выбоин), наваров тщательно осмотреть поверхности катания колес, при необходимости выполнить протяжку состава.", "b": false, "n": ""}, {"t": "После выключения тормоза машинист на оборотной стороне «Справки об обеспечении поезда тормозами и исправном их действии» обязан указать количество тормозных осей и фактическое нажатие в соответствующих графах. Исходя из фактического нажатия на 100 тс веса поезда (состава), машинист должен определить скорость дальнейшего следования в соответствии с нормами, указанными в приложении 2.", "b": false, "n": ""}, {"t": "10.1.27 При обнаружении ползунов (выбоин) на подвижном составе дальнейшая скорость его следования устанавливается согласно Правил технической эксплуатации железных дорог или иных нормативных документов, действующих на территории стран - Содружеств, Грузии, Латвийской республики, Литовской республики и Эстонской республики.", "b": false, "n": "10.1.27"}, {"t": "10.1.28 В случае срабатывания устройств безопасности (ЭПК, автостопа, КОН) во всех поездах необходимо выполнить экстренное торможение.", "b": false, "n": "10.1.28"}, {"t": "10.1.29 При обнаружении отказа автотормозов в поезде выполнить экстренное торможение и принять все возможные меры к остановке поезда. При безуспешности попытки остановить поезд необходимо подавать сигнал общей тревоги и по поездной радиосвязи, находящейся на локомотиве, сообщить дежурному впереди находящейся станции или диспетчеру о случившемся, чтобы они могли принять меры к свободному приему поезда на станцию или пропуска через станцию. Дополнительно в пассажирском поезде необходимо сообщить начальнику поезда с требованием приведения в действие стояночных (ручных) тормозов.", "b": false, "n": "10.1.29"}, {"t": "Кондуктор или проводники вагона, услышав сигнал общей тревоги или увидев сигналы остановки, подаваемые с пути, обязаны открыть кран экстренного торможения (стоп-кран) и привести в действие стояночный (ручной) тормоз на обслуживаемых вагонах.", "b": false, "n": ""}, {"t": "После остановки поезда выяснить причину неудовлетворительной работы тормозов. Если устранить неисправность или восстановить действие тормозов на месте невозможно, то дальнейшее ведение поезда выполнять порядком, установленным владельцем инфраструктуры.", "b": false, "n": ""}]}, {"id": "tb10_2", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.2 Требования и порядок выполнения проверки действия тормозов в пути следования", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 99–102", "paras": [{"t": "10.2.1 Проверку действия автоматических тормозов в пути следования производить:", "b": false, "n": "10.2.1"}, {"t": "- после полного, сокращенного и технологического опробования тормозов, включения и выключения автотормозов у отдельных вагонов или группы вагонов, прицепки или отцепки вагонов на станциях в соответствии с графиком следования, при переходе с электропневматических тормозов на автоматические;", "b": false, "n": ""}, {"t": "- одиночного следующего локомотива только после опробования автотормозов с начальной станции отправления;", "b": false, "n": ""}, {"t": "- перед въездом в тупиковые пути станции, а также перед станциями, где предусмотрена остановка поезда по расписанию, при наличии спуска к этой станции крутизной 0,008 и более и протяженностью не менее 3 км. В отдельных случаях, исходя из местных условий и обеспечения безопасности движения, организационно распорядительными документами соответствующих подразделений владельца инфраструктуры может приниматься и меньшая крутизна спуска.", "b": false, "n": ""}, {"t": "Перед указанными станциями проверку действия автоматических тормозов выполнять с таким расчетом, чтобы при въезде на станцию автоматические тормоза были полностью отпущены и тормозная сеть поезда заряжена до установленного давления. Если тормоза по условиям ведения поезда отпустить нельзя, то при движении поезда в заторможенном состоянии машинисту надо рассчитать свои действия так, чтобы можно было остановить поезд после усиления торможения в назначенном месте.", "b": false, "n": ""}, {"t": "10.2.2 Проверку действия электропневматических тормозов в пути следования поезда производить после полного или сокращённого опробования электропневматических тормозов.", "b": false, "n": "10.2.2"}, {"t": "10.2.3 В поездах сначала проверять в установленном месте действие автоматических тормозов, а затем электропневматических тормозов.", "b": false, "n": "10.2.3"}, {"t": "10.2.4 Места и скорости движения поездов и одиночных локомотивов, а также расстояния, на которых должно происходить снижение скорости при проверке действия автоматических (электропневматических) тормозов в пути следования, указываются в организационно-распорядительных документах, утвержденных владельцем инфраструктуры. Эти расстояния обозначаются на перегонах сигнальными знаками «Начало торможения» и «Конец торможения» и определяются на основании тяговых расчетов и опытных поездок для каждого рода поезда при их обеспечении исправно действующими тормозами и единым наименьшим тормозным нажатием на 100 тс веса поезда (состава).", "b": false, "n": "10.2.4"}, {"t": "10.2.5 Проверка действия автоматических и электропневматических тормозов в пути следования производится по расстоянию или времени снижения скорости на 10 км/ч в пассажирском, грузовом груженом, грузопассажирском поезде и одиночном локомотиве и на 4 - 6 км/ч в грузовом порожнем и грузовом груженом при преобладании в составе более 50% порожних вагонов поезде.", "b": false, "n": "10.2.5"}, {"t": "В случае необходимости проверку действия автоматических тормозов в неустановленных местах разрешается выполнять на станционных путях или при выезде со станции на перегоне, имеющем площадку или спуск с учетом местных условий. В этих случаях действие автоматических тормозов допускается оценивать по времени снижения скорости на 4 - 6 км/ч в грузовом порожнем поезде (грузовом груженом при преобладании в составе более 50% порожних вагонов) и на 10 км/ч в остальных грузовых поездах и одиночных локомотивах. Это время устанавливается в технико-распорядительных документах владельца инфраструктуры на основании опытных поездок для каждого рода поезда при их обеспечении исправно действующими тормозами и единым наименьшим тормозным нажатием на 100 тс веса поезда (состава).", "b": false, "n": ""}, {"t": "10.2.6 В зимний период при наличии снежного покрова, снегопадах отсчет расстояния, проходимого поездом в процессе снижения скорости на 10 км/ч (4-6 км/ч), производить с момента начала снижения скорости, но не позже проследования поездом расстояния 200-250 м после ступени торможения.", "b": false, "n": "10.2.6"}, {"t": "10.2.7 При проведении проверки действия тормозов применять вспомогательный тормоз локомотива для увеличения давления в тормозных цилиндрах и электрический тормоз на локомотиве во всех поездах запрещается.", "b": false, "n": "10.2.7"}, {"t": "10.2.8 Проверку действия автоматических тормозов в пути следования выполнять снижением давления в уравнительном резервуаре на:", "b": false, "n": "10.2.8"}, {"t": "- грузового груженого поезда и одиночно следующего локомотива, оборудованного воздухораспределителями грузового типа, на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2);", "b": false, "n": ""}, {"t": "- грузового порожнего, грузового груженого при преобладании в составе более 50% порожних вагонов – на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2);", "b": false, "n": ""}, {"t": "- грузопассажирского и отдельно следующего локомотива, оборудованного воздухораспределителями пассажирского типа – на 0,05 - 0,06 МПа (0,5-0,6 кгс/см2);", "b": false, "n": ""}, {"t": "- пассажирского поезда – на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2);", "b": false, "n": ""}, {"t": "- пассажирского поезда при наличии в составе пассажирского поезда более половины вагонов с воздухораспределителями пассажирского типа со ступенчатым отпуском - на 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "В зимний период проверку действия автоматических тормозов в пути следования выполнять снижением давления в уравнительном резервуаре на:", "b": false, "n": ""}, {"t": "- грузового груженого поезда – 0,08 - 0,10 МПа (0,8 – 1,0 кгс/см2);", "b": false, "n": ""}, {"t": "- грузового порожнего, грузового груженого при преобладании в составе более 50% порожних вагонов – 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2);", "b": false, "n": ""}, {"t": "- пассажирского поезда – 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2),", "b": false, "n": ""}, {"t": "- пассажирского поезда с композиционными тормозными колодками – 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2).", "b": false, "n": ""}, {"t": "10.2.9 Для проверки действия электропневматических тормозов в пути следования выполнить ступень торможения до давления в тормозных цилиндрах локомотива 0,10 - 0,15 МПа (1,0 -1,5 кгс/см2).", "b": false, "n": "10.2.9"}, {"t": "Для проверки действия электропневматических тормозов в пути следования в зимний период выполнить ступень торможения до давления в тормозных цилиндрах локомотива 0,15 - 0,20 МПа (1,5 - 2,0 кгс/см2), при наличии композиционных тормозных колодок – 0,15 - 0,25 МПа (1,5 - 2,5 кгс/см2).", "b": false, "n": ""}, {"t": "10.2.10 При эксплуатации пассажирских поездов постоянного формирования, сформированных из пассажирских вагонов моделей 61-4458, 61-4462, 61-4463 и 61-4464 с тормозным оборудованием «KNORR-BREMSE»:", "b": false, "n": "10.2.10"}, {"t": "- перед проведением проверок работы тормозов в зимний период пассажирских поездов в пути следования выполнять торможения снижением давления в уравнительном резервуаре на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) в один прием, а при управлении электропневматическим тормозом давление в тормозных цилиндрах локомотива должно быть 0,20 - 0,25 МПа (2,0 - 2,5 кгс/см2) в один прием со снижением скорости не менее чем на 5 км/ч. При этом от момента окончания торможения до начала проверки работы тормозов должно пройти не более 5 минут.", "b": false, "n": ""}, {"t": "10.2.11 Отпуск автоматических (электропневматических) тормозов при выполнении проверки действия в пути следования выполнять только после того, как произошло снижение скорости на 10 км/ч в пассажирском, грузовом груженом, грузопассажирском поезде и одиночном локомотиве и на 4 - 6 км/ч в грузовом порожнем, грузовом груженом при преобладании в составе более 50% порожних вагонов поезде на расстоянии, не превышающем установленного в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "10.2.11"}, {"t": "В случае выявления неудовлетворительной работы автотормозов при оценке их действия применить экстренное торможение и принять все меры к остановке поезда.", "b": false, "n": ""}, {"t": "10.2.12 Если после ступени торможения тормозной эффект не будет получен в пассажирском поезде в течении 10 секунд, грузовом порожнем поезде длиной до 400 осей и грузопассажирском в течение 20 секунд, а в остальных грузовых поездах в течение 30 секунд, немедленно выполнить экстренное торможение и принять все меры к остановке поезда. В пассажирском поезде дополнительно доложить начальнику поезда и после потребовать приведения в действия стояночных (ручных) тормозов.", "b": false, "n": "10.2.12"}, {"t": "10.2.13 В зависимости от результата проверки действия тормозов в пути следования машинист при дальнейшем ведении поезда выбирает места начала торможения и величину снижения давления, чтобы не допустить проезда сигнала с запрещающим показанием, а сигнал уменьшения скорости и место начала ограничения скорости следования проследовать с установленной для этого места скоростью.", "b": false, "n": "10.2.13"}, {"t": "10.2.14 При проверке действия автоматических тормозов в порожних грузовых поездах, в составе которых 350 осей и более отпуск необходимо выполнять после ступени торможения с выдержкой ручки крана машиниста в положении «Перекрыша с питанием» в течение 6 - 10 с. При этом снижение скорости за время торможения и отпуска должно быть не менее чем на 10 км/ч.", "b": false, "n": "10.2.14"}, {"t": "10.2.15 Если при следовании с поездом по месту, установленному для проверки действия автотормозов, машинист ведущего локомотива не выполнит проверку, то машинист второго локомотива обязан связаться с машинистом головного локомотива по радиосвязи и одновременно подать сигнал бдительности – требование произвести проверку.", "b": false, "n": "10.2.15"}]}, {"id": "tb10_3_1", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.3.1 Управление автоматическими тормозами грузового поезда при включении воздухораспределителей грузового типа на равнинный режим работы", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 103–106", "paras": [{"t": "а) Первую ступень служебного торможения выполнять снижением давления в уравнительном резервуаре: в порожних и груженом при преобладании в составе более 50% порожних вагонов – на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2), а в груженых поездах – на 0,05 - 0,08 МПа (0,5 - 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "При следовании по спускам до 0,008 на зелёный огонь светофора или по свободному перегону разрешается выполнять первую ступень торможения снижением давления в уравнительном резервуаре на 0,03 - 0,05 МПа (0,3 - 0,5 кгс/см2).", "b":
