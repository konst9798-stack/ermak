ки не более 3 мм.", "b": false, "n": ""}, {"t": "Толщина тормозных колодок (тормозных накладок) для пассажирских поездов должна обеспечивать возможность проследования без замены из пункта формирования до пункта оборота и обратно и устанавливается местными правилами и нормами.", "b": false, "n": ""}, {"t": "6.2.8 Запрещается устанавливать композиционные тормозные колодки на вагоны, рычажная передача которых установлена под чугунные колодки и, наоборот. Допускается на пассажирские вагоны, рычажная передача которых установлена под композиционные колодки и скорость движения не превышает 120 км/ч, на колесных парах пассажирских вагонов с редукторами ставить чугунные тормозные колодки.", "b": false, "n": "6.2.8"}, {"t": "Пассажирские вагоны, эксплуатируемые в поездах со скоростями движения свыше 120 км/ч, должны быть оборудованы композиционными тормозными колодками.", "b": false, "n": ""}, {"t": "6.2.9 Допускается на служебные и дизельные вагоны рефрижераторного подвижного состава, а также грузовые вагоны с дизельным отделением пятивагонных рефрижераторных секций, тормозная рычажная передача которых рассчитана только на чугунные колодки (горизонтальные тормозные рычаги имеют одно отверстие для соединения с затяжкой) ставить композиционные тормозные колодки при обязательном условии, что воздухораспределители этих вагонов должны быть включены на «Порожний» режиме работы.", "b": false, "n": "6.2.9"}, {"t": "6.2.10 Грузовые вагоны с тарой от 27 т и более, в том числе шестиосные и восьмиосные вагоны, разрешается эксплуатировать только с композиционными тормозными колодками.", "b": false, "n": "6.2.10"}, {"t": "6.2.11 При замене тормозных колодок необходимо соблюдать следующие условия:", "b": false, "n": "6.2.11"}, {"t": "- на одном вагоне должны быть установлены колодки одного типа и конструкции;", "b": false, "n": ""}, {"t": "- колодки на одной оси колесной пары грузового вагона не должны различаться по толщине более чем на 10 мм.", "b": false, "n": ""}, {"t": "6.2.12 При правильно отрегулированной тормозной рычажной передаче:", "b": false, "n": "6.2.12"}, {"t": "- выход штока тормозного цилиндра должен находиться в пределах норм, приведенным в таблицах 2 и 3 настоящих Правил. Указатель выхода штока тормозного цилиндра должен находиться в пределах индикатора рабочего хода. Таблица 2 – Выход штока тормозного цилиндра грузовых вагонов Выход штока, мм, при отправлении с максимально пункта технического допустимый обслуживания в эксплуатации Тип вагона и тормозных колодок при при при полном полном первой служебном служебном ступени торможении торможении торможения (без регулятора) 1 2 3 4 Грузовой вагон (в том числе рефрижераторный) с одним тормозным цилиндром с 75–125 40–100 175 чугунными тормозными колодками Грузовой вагон (в том числе рефрижераторный) с одним 50–100 40–80 130 тормозным цилиндром 1 2 3 4 с композиционными тормозными колодками Грузовой вагон с двумя тормозными цилиндрами (с раздельным торможением) с 30–90 – – чугунными тормозными колодками Грузовой вагон с двумя тормозными цилиндрами (с 25–65 раздельным торможением) с – – (75)* композиционными тормозными колодками Грузовой вагон с двумя тормозными цилиндрами (с раздельным торможением) с 50-100 40-80 – ходом штока 240 мм, с композиционными колодками Восьмиосный грузовой вагон с двумя тормозными цилиндрами диаметром 356 мм. (с раздельным 50-100 40-80 130 торможением) и композиционными тормозными колодками Примечание: * - для вагонов с буксовыми узлами, оборудованными адаптерами Таблица 3 - Выход штока тормозных цилиндров пассажирских вагонов, мм При Максимально отправлении с допустимый при полном Тип вагонов пунктов служебном торможении технического в эксплуатации (без обслуживания авторегулятора) 1 2 3 с чугунными и 130-160 композиционными колодками 80-120 габарита РИЦ с воздухораспределителями 105-115 западноевропейского типа и 50-70 чугунными колодками ВЛ-РИЦ на тележках 25-40 ТВЗ-ЦНИИ-М с 75 15-30 композиционными колодками Примечания: 1 В числителе – при полном служебном торможении, в знаменателе – при первой ступени торможения. 2 Выход штока тормозного цилиндра при композиционных колодках на пассажирских вагонах указан с учетом длины хомута (70 мм), установленного на штоке. 3 Выходы штоков тормозных цилиндров у других типов вагонов устанавливаются в соответствии с руководством по их эксплуатации.", "b": false, "n": ""}, {"t": "Нормы выхода штоков тормозных цилиндров у вагонов с тормозной рычажной передачей, не оборудованной регуляторами, перед крутыми затяжными спусками устанавливаются техническо-распорядительным документом владельца инфраструктуры;", "b": false, "n": ""}, {"t": "- расстояние от торца муфты защитной трубы регулятора тормозной рычажной передачи (далее – регулятор) до присоединительной резьбы его винта должно быть:", "b": false, "n": ""}, {"t": "- для грузовых вагонов оборудованных авторегуляторами 574Б, РТРП-675, РТРП-675-М не менее 150 мм, для регуляторов 6581, РТРП-300 – не менее 50 мм;", "b": false, "n": ""}, {"t": "- для пассажирских вагонов оборудованных авторегуляторами 574Б, РТРП-675, РТРП-675-М не менее 250 мм при отправлении из пункта формирования и оборота и не менее 150 мм при проверке на промежуточных пунктах технического осмотра.", "b": false, "n": ""}, {"t": "При применении других типов авторегуляторов минимальная длина регулирующего элемента авторегулятора при отправлении из пункта формирования и оборота и при проверке на промежуточных пунктах технического осмотра должна быть указана в руководстве по эксплуатации конкретной модели вагона, согласованном владельцем инфраструктуры;", "b": false, "n": ""}, {"t": "- упорный рычаг привода (упор) регулятора при отпущенном тормозе вагона не должен касаться корпуса регулятора;", "b": false, "n": ""}, {"t": "- углы наклона горизонтальных, промежуточных и вертикальных рычагов должны обеспечивать работоспособное состояние тормозной рычажной передачи вагона до предельного износа тормозных колодок.", "b": false, "n": ""}, {"t": "При необходимости регулировки тормозная рычажная передача вагонов, оборудованных регулятором, должна быть отрегулирована на поддержание выхода штока тормозного цилиндра на нижнем пределе установленных норм выхода штока.", "b": false, "n": ""}, {"t": "Регулировку тормозной системы с триангелями бесподвесочного типа производить в соответствии с инструкцией по регулировке данной тормозной системы.", "b": false, "n": ""}, {"t": "6.2.13 Проверку противоюзного устройства необходимо проводить на станциях формирования после произведённого полного служебного торможения.", "b": false, "n": "6.2.13"}, {"t": "Для проверки механического противоюзного устройства необходимо через окно в корпусе датчика провернуть инерционный груз. При этом должен произойти выброс воздуха из тормозного цилиндра проверяемой тележки через сбрасывающий клапан. После прекращения воздействия на груз он должен сам возвратиться в исходное положение, а тормозной цилиндр наполниться сжатым воздухом до первоначального давления, что контролируется по манометру на боковой стенке кузова вагона. Проверку необходимо проводить для каждого датчика.", "b": false, "n": ""}, {"t": "Для проверки электронного противоюзного устройства необходимо после произведённого полного служебного торможения произвести проверку функционирования сбрасывающих клапанов путем запуска тестовой программы. При этом должен происходить последовательный сброс воздуха на соответствующей колёсной паре и срабатывание соответствующих сигнализаторов наличия давления сжатого воздуха этой оси на борту вагона;", "b": false, "n": ""}, {"t": "6.2.14 Проверку действия скоростного регулятора необходимо проводить на станциях формирования после проведенного полного служебного торможения нажатием кнопки проверки скоростного регулятора. Давление в тормозных цилиндрах должно повыситься до установленной величины, а после прекращения нажатия на кнопку давление в цилиндрах должно снизиться до первоначального значения.", "b": false, "n": "6.2.14"}, {"t": "6.2.15 Проверку действия магниторельсового тормоза необходимо проводить на станциях формирования после экстренного торможения путем нажатия кнопки проверки магниторельсового тормоза. При этом башмаки магниторельсового тормоза должны опуститься на рельсы. После прекращения нажатия на кнопку все башмаки магниторельсового тормоза должны подняться в верхнее (транспортное) положение.", "b": false, "n": "6.2.15"}]}, {"id": "tb7_1", "cat": "tm_car", "page": 0, "pages": [], "title": "7.1 Общие положения", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 45–47", "paras": [{"t": "7.1.1 Запрещается ставить в поезда вагоны, не прошедшие техническое обслуживание и без наличия записи в журнале о признании вагонов годными к безопасному следованию в поездах.", "b": false, "n": "7.1.1"}, {"t": "7.1.2 Не допускается отправление со станции, где имеется пункт технического обслуживания вагонов или пункт опробования тормозов, а также со станции формирования поездов или пункта массовой погрузки грузов вагонов с выключенным или неправильно действующими тормозами, за исключением случаев, оговоренных настоящими Правилами.", "b": false, "n": "7.1.2"}, {"t": "Автотормоза вагонов моторвагонного подвижного состава, локомотивов, самоходного подвижного состава, специальных путевых машин, следующие в составе поезда, должны быть включены в тормозную магистраль и исправно действовать.", "b": false, "n": ""}, {"t": "7.1.3 Последние два вагона в поезде должны быть с включенными действующими автоматическими тормозами. В грузовых поездах повышенного веса и длины последние пять вагонов должны быть с включенными действующими автоматическими тормозами.", "b": false, "n": "7.1.3"}, {"t": "В случае возникновения неисправностей тормозов в пути следования у хвостовых вагонов необходимо:", "b": false, "n": ""}, {"t": "- при неисправности тормозов предпоследнего вагона, а в поездах повышенного веса и длины хотя бы одного из четырех предпоследних вагонов, поезд выводится с перегона до ближайшей станции со скоростью в соответствии с фактическим тормозным нажатием;", "b": false, "n": ""}, {"t": "- при неисправности тормозов хвостового вагона поезд выводится с перегона до ближайшей станции с постановкой вспомогательного локомотива в хвост поезда до ближайшей станции со скоростью в соответствии с фактическим тормозным нажатием.", "b": false, "n": ""}, {"t": "По прибытии поезда на станцию провести ремонт или перестановку вагонов, чтобы в хвосте поезда находились два вагона, а в поезде повышенного веса и длины пять вагонов с включенными и исправно действующими автотормозами.", "b": false, "n": ""}, {"t": "7.1.4 Допускается в грузовые поезда включать специальный подвижной состав с пролетной магистралью или вагоны с разрядными грузами с выключенными автоматическими тормозами у этих вагонов. Отправлять такие поезда необходимо порядком, установленным владельцем инфраструктуры. При этом в грузовых поездах количество вагонов с выключенными тормозами или пролетной магистралью в одной группе вагонов не должно превышать восьми осей, а в хвосте поезда перед последними двумя тормозными вагонами – не более четырех осей.", "b": false, "n": "7.1.4"}, {"t": "7.1.5 В пассажирских и почтово-багажных поездах в тормозную сеть должны быть включены все воздухораспределители пассажирского типа, а в грузовых поездах - все воздухораспределители грузового типа за исключением случаев, оговорённых настоящими Правилами.", "b": false, "n": "7.1.5"}, {"t": "7.1.6 В составы пассажирских и почтово-багажных поездов не допускается включать грузовые вагоны.", "b": false, "n": "7.1.6"}, {"t": "7.1.7 Включение воздухораспределителей вагонов на соответствующий режим торможения в составе поезда, а также у отдельных вагонов или группы вагонов, прицепляемых к поездам, производят:", "b": false, "n": "7.1.7"}, {"t": "– на станциях с пунктами технического обслуживания – осмотрщики вагонов;", "b": false, "n": ""}, {"t": "– на промежуточных станциях, где нет работников, на которых эта обязанность возложена владельцем инфраструктуры, – осмотрщики, направленные с ближайших пунктов технического обслуживания или специально выделенные работники, обученные выполнению данных операций;", "b": false, "n": ""}, {"t": "– на перегоне, после разгрузки хоппер-дозаторной и думпкарной вертушки – работники, обслуживающие данную вертушку.", "b": false, "n": ""}, {"t": "7.1.8 Загрузку вагонов определять по поездным документам.", "b": false, "n": "7.1.8"}]}, {"id": "tb7_2", "cat": "tm_car", "page": 0, "pages": [], "title": "7.2 В пассажирских поездах", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 47–49", "paras": [{"t": "7.2.1 При вождении пассажирских поездов должны применяться локомотивы, оборудованные электропневматическим тормозом и системой его управления.", "b": false, "n": "7.2.1"}, {"t": "Применение в пассажирских поездах дублированного питания при скоростях движения более 120 км/ч запрещается.", "b": false, "n": ""}, {"t": "7.2.2 Пассажирские и почтово-багажные поезда должны эксплуатироваться с применением электропневматических тормозов, а при наличии в составе пассажирского поезда вагонов с включенными воздухораспределителями пассажирского типа со ступенчатым отпуском (западноевропейского типа) с применением автоматических тормозов.", "b": false, "n": "7.2.2"}, {"t": "Пассажирские поезда постоянного формирования, оборудованные воздухораспределителями пассажирского типа со ступенчатым отпуском и электропневматическим тормозом, должны эксплуатироваться с применением электропневматических тормозов.", "b": false, "n": ""}, {"t": "7.2.3 В пассажирских поездах с составом до 20 вагонов включительно воздухораспределители пассажирского типа с бесступенчатым отпуском включать на короткосоставный режим. При формировании пассажирских поездов с составом более 20 вагонов воздухораспределители пассажирского типа с бесступенчатым отпуском включать на длинносоставный режим. Включение воздухораспределителей пассажирского типа с бесступенчатым отпуском на короткосоставный режим в поездах с составом более 20 до 25 вагонов допускается отдельными распоряжениями владельца инфраструктуры.", "b": false, "n": "7.2.3"}, {"t": "7.2.4 Воздухораспределители пассажирского типа со ступенчатым отпуском пассажирских вагонов включать:", "b": false, "n": "7.2.4"}, {"t": "- на пассажирский режим работы при скорости движения до 120 км/ч;", "b": false, "n": ""}, {"t": "- на скоростной режим работы при скорости движения свыше 120 км/ч.", "b": false, "n": ""}, {"t": "7.2.5 При наличии в составе пассажирского поезда внутреннего сообщения одного вагона с тормозом пассажирского типа со ступенчатым отпуском разрешается тормоз этого вагона выключить, при условии обеспечения необходимым единым наименьшим тормозным нажатием на 100 тс веса без учета выключенного тормоза.", "b": false, "n": "7.2.5"}, {"t": "7.2.6 В случае выявления в пути следования отказа электропневматического тормоза машинист обязан сообщить начальнику поезда о выявленной неисправности и следовать на автоматических тормозах до ближайшего пункта технического обслуживания пассажирских вагонов, где неисправность должна быть устранена.", "b": false, "n": "7.2.6"}, {"t": "При обнаружении в пути следования отказа действия электропневматического тормоза не более чем на двух вагонах, допускается отключить электровоздухораспределители этих вагонов от электрической цепи в клеммных коробках. Эти вагоны должны следовать в составе поезда с управлением на автоматическом тормозе до пункта технического обслуживания пассажирских вагонов, где неисправность должна быть устранена, а электровоздухораспределители подключены к электрической цепи в клеммных коробках, о чем должна быть выполнена отметка в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": ""}, {"t": "7.2.7 Запрещается отправлять из пунктов формирования и оборота на пневматическом управлении пассажирские поезда, оборудованные электропневматическими тормозами, за исключением случаев необходимости отправления в составе пассажирского поезда вагонов, не оборудованных электропневматическими тормозами.", "b": false, "n": "7.2.7"}, {"t": "7.2.8 К пассажирским поездам, следующим с управлением на электропневматических тормозах на промежуточных станциях маршрута следования, в порядке исключения, допускается прицеплять в хвост не более двух пассажирских вагонов, не оборудованных электропневматическими тормозами, но с исправными автоматическими тормозами, о чем должна быть выполнена отметка в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "7.2.8"}, {"t": "7.2.9 Допускается совместная эксплуатация в одном составе пассажирских вагонов с дисковыми и колодочными тормозами при условии оборудования последних композиционными тормозными колодками. Составы таких пассажирских поездов следует формировать по возможности с максимальным количеством вагонов, оборудованных дисковыми тормозами.", "b": false, "n": "7.2.9"}, {"t": "В составах пассажирских поездов, состоящих не менее чем из десяти пассажирских вагонов, следующих на чугунных тормозных колодках, со скоростями движения не более 120 км/ч с исправно действующими электропневматическими тормозами разрешается включение не более двух пассажирских вагонов, оборудованных дисковыми тормозами.", "b": false, "n": ""}, {"t": "В составы пассажирских поездов, следующих на композиционных (чугунных) тормозных колодках, со скоростями движения не более 120 км/ч с исправно действующими электропневматическими тормозами допускается включение, как отдельного вагона, так и групп пассажирских вагонов, оборудованных чугунными (композиционными) тормозными колодками. Составы таких пассажирских поездов следует формировать по возможности с максимальным количеством вагонов, оборудованных одним типом тормозных колодок.", "b": false, "n": ""}, {"t": "7.2.10 Тип тормозных колодок (тормозных накладок), на которых допускается эксплуатация пассажирских вагонов на крутых затяжных спусках круче 0,030 устанавливает владелец инфраструктуры.", "b": false, "n": "7.2.10"}, {"t": "7.2.11 Запрещается эксплуатация:", "b": false, "n": "7.2.11"}, {"t": "- пассажирских вагонов с противоюзным устройством при его неисправности;", "b": false, "n": ""}, {"t": "- пассажирских вагонов, оборудованных скоростным режимом торможения при отсутствии на вагоне или неисправности датчика скоростного регулятора.", "b": false, "n": ""}, {"t": "При обнаружении в пути следования вагонов с неисправным противоюзным устройством допускается довести их до пунктов формирования или оборота, где неисправность необходимо устранить.", "b": false, "n": ""}, {"t": "7.2.12 При вождении пассажирских поездов с составами более 25 вагонов должны применяться локомотивы с устройствами автоматического включения электропневматического тормоза при открытии стоп-крана в составе поезда.", "b": false, "n": "7.2.12"}, {"t": "В случае выхода из строя электропневматического тормоза в таком поезде в пути следования разрешается довести его на автоматических тормозах до первой станции, где необходимо восстановить действие электропневматического тормоза. При невозможности восстановления работы электропневматического тормоза поезд должен быть разъединен на два поезда.", "b": false, "n": ""}]}, {"id": "tb7_3", "cat": "tm_car", "page": 0, "pages": [], "title": "7.3 В грузовых поездах", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 49–52", "paras": [{"t": "7.3.1 В грузовых поездах, у которых зарядное давление установлено в пределах 0,47-0,51 МПа (4,8-5,2 кгс/см2), и грузопассажирских поездах допускается совместное включение в тормозную сеть поезда воздухораспределителей грузового и пассажирского типов.", "b": false, "n": "7.3.1"}, {"t": "Воздухораспределители пассажирского типа с бесступенчатым отпуском следует включить на длинносоставный режим.", "b": false, "n": ""}, {"t": "Если в грузовом поезде не более двух пассажирских вагонов, то их воздухораспределители выключить (кроме двух последних вагонов в хвосте поезда).", "b": false, "n": ""}, {"t": "Передача (пересылка) вагонов с дисковыми тормозами или с тормозами пассажирского типа со ступенчатым отпуском в составах грузовых поездов допускается только в количестве не более 2-х вагонов с выключенными автотормозами. При этом на вагонах со стояночными тормозами и автоматическими приводами должны быть открыты оба разобщительных крана от тормозной магистрали к цилиндрам стояночных тормозов.", "b": false, "n": ""}, {"t": "Пересылку пассажирских вагонов, оборудованных тормозами пассажирского типа со ступенчатым отпуском, в грузовых поездах выполнять с выключенными тормозами, если тормоза состава включаются на равнинный режим, и с включением на грузовой режим, если тормоза состава включаются на горный режим.", "b": false, "n": ""}, {"t": "Режимный переключатель воздухораспределителей грузового типа следует установить в положение равнинного режима, а грузовой переключатель в соответствии с пунктом 7.3.2 настоящих Правил.", "b": false, "n": ""}, {"t": "Переключение режимного переключателя воздухораспределителей грузового типа на горный режим должно производится в соответствии настоящими Правилами.", "b": false, "n": ""}, {"t": "7.3.2 Все грузовые вагоны, в конструкции которых предусмотрена установка авторежима, в том числе сочлененного типа, кроме шестиосных и восьмиосных вагонов, должны быть оборудованы авторежимом. До завершения работ по дооборудованию грузовых вагонов авторежимами на этих вагонах воздухораспределитель включать:", "b": false, "n": "7.3.2"}, {"t": "– с чугунными тормозными колодками на груженый режим при загрузке на ось более 6 тс, средний режим при загрузке на ось от 3 до 6 (включительно) тс, порожний режим при загрузке на ось менее 3 тс;", "b": false, "n": ""}, {"t": "– с композиционными тормозными колодками на средний режим при загрузке на ось более 6 тс, порожний режим при загрузке на ось 6 тс и менее.", "b": false, "n": ""}, {"t": "Допускается в исключительных случаях включать вагоны, оборудованные авторежимом и композиционными тормозными колодками на груженый режим работы воздухораспределителя в соответствии с организационно-распорядительными документами владельца инфраструктуры при соответствующих расчётах и проведении опытных поездок второго рода.", "b": false, "n": ""}, {"t": "Отдельные типы грузовых вагонов, оборудованных композиционными тормозными колодками, с разрешения владельца инфраструктуры допускается эксплуатировать с включением воздухораспределителя на груженый режим.", "b": false, "n": ""}, {"t": "У грузовых вагонов, оборудованных авторежимом или имеющих на кузове трафарет «Однорежимный», воздухораспределитель включать на:", "b": false, "n": ""}, {"t": "– груженый режим с чугунными тормозными колодками,", "b": false, "n": ""}, {"t": "– средний режим с композиционными тормозными колодками,", "b": false, "n": ""}, {"t": "– груженый режим с композиционными тормозными колодками допускается отдельным распоряжением владельца инфраструктуры на участках железной дороги, в зимний период подверженных снежным заносам, при осевой нагрузке не менее 20 тс на рельсы.", "b": false, "n": ""}, {"t": "У воздухораспределителей рефрижераторных вагонов режимы включать в следующем порядке: автотормоза всех вагонов с чугунными тормозными колодками, в том числе грузовых вагонов со служебным отделением в пятивагонной секции, включать в порожнем состоянии на порожний режим, при загрузке до 6 тс на ось (включительно) – на средний и более 6 тс на ось – на груженый режим торможения. Автотормоза служебных, дизельных и машинных вагонов, в том числе грузовых вагонов с дизельным отделением пятивагонной секции, включать на средний режим с закреплением переключателя.", "b": false, "n": ""}, {"t": "На рефрижераторных вагонах с тормозной рычажной передачей, конструкция которых позволяет эксплуатацию тормоза вагона как с чугунными, так и с композиционными тормозными колодками (горизонтальные рычаги имеют два отверстия для установки осей затяжки), при оборудовании их композиционными колодками режимы торможения включать:", "b": false, "n": ""}, {"t": "– на грузовых рефрижераторных вагонах – на порожний режим при загрузке на ось до 6 тс и средний при загрузке на ось 6 тс и более,", "b": false, "n": ""}, {"t": "– на служебных, дизельных и машинных вагонах, в том числе вагонах с дизельным отделением пятивагонной секции – на средний режим торможения с закреплением переключателя.", "b": false, "n": ""}, {"t": "Автотормоза служебных, дизельных и машинных вагонов, в том числе вагонов с дизельным отделением пятивагонной секции с рычажной передачей, предназначенной для эксплуатации только с чугунными тормозными колодками (горизонтальный рычаг имеет одно отверстие для установки оси затяжки), при оборудовании композиционными тормозными колодками включать на режим торможения «Порожний» с закреплением переключателя режимов.", "b": false, "n": ""}, {"t": "Допускается обращение рефрижераторного подвижного состава со скоростью до 120 км/ч в соответствии с отдельными распоряжениями владельца инфраструктуры.", "b": false, "n": ""}, {"t": "7.3.3 Включать воздухораспределители в грузовых поездах на режим «Горный» необходимо перед затяжными спусками крутизной 0,018 и более, а переключать на равнинный режим – после прохода поездом этих спусков в пунктах, установленных организационно распорядительными документами владельца инфраструктуры.", "b": false, "n": "7.3.3"}, {"t": "В поездах при наличии и исправном действии электрического тормоза на локомотиве с учётом местных условий на основании опытных поездок второго рода с разрешения владельца инфраструктуры, допускается использовать равнинный режим воздухораспределителей на затяжных спусках крутизной: с составом из груженых вагонов – до 0,020 включительно; с составом из порожних вагонов – до 0,025 включительно, а на спусках большей крутизны – по распоряжению владельца инфраструктуры.", "b": false, "n": ""}, {"t": "7.3.4 В грузовых поездах из порожних вагонов с числом осей состава от 350 до 400 включительно допускается производить отключение воздухораспределителей не более чем на 1/4 вагонов, а в поездах длиной состава более 400 осей – на 1/3 вагонов.", "b": false, "n": "7.3.4"}, {"t": "Вагоны с отключенными воздухораспределителями должны быть равномерно расположены по длине состава, но не группами, при этом на пяти последних вагонах в хвосте состава автоматические тормоза должны быть включены и исправно действовать, о чем делается отметка в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": ""}, {"t": "Порядок переключения режимов воздухораспределителей устанавливается в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "7.3.5 В поездах повышенного веса и длины для предупреждения разрыва автосцепок после отпуска автотормозов на участках с ломаным профилем пути разрешается включение до 25% воздухораспределителей вагонов на горный режим с головы поезда обычного формирования весом более 6,0 тыс. тс и длиной состава более 350 осей, а также с головной части первого состава соединенного поезда весом от 6,0 до 14,2 тыс. тс.", "b": false, "n": "7.3.5"}, {"t": "7.3.6 Эксплуатация поездов повышенного веса более 8,3 тыс.тс. с управлением тормозами только с головы поезда разрешается только с применением систем управления тормозами поезда по радиоканалу.", "b": false, "n": "7.3.6"}, {"t": "Применение таких систем должно осуществляться в соответствии с организационно-распорядительными документами владельца инфраструктуры с разработкой соответствующей технологии.", "b": false, "n": ""}, {"t": "Допускается вождение поездов весом от 8,3 до 9,0 тыс. т без применения систем управления тормозами поездов если выполнено одно из условий:", "b": false, "n": ""}, {"t": "- на участке следования локомотива с таким поездом отсутствуют спуски (спрямленного профиля), круче 0,0065;", "b": false, "n": ""}, {"t": "- длина такого поезда больше длины расположенных на участке следования локомотива с поездом спусков (спрямленного профиля пути), имеющих крутизну более 0,0065.", "b": false, "n": ""}]}, {"id": "tb7_4", "cat": "tm_car", "page": 0, "pages": [], "title": "7.4 В соединенном поезде с постановкой локомотива в голове и в составе или в хвосте поезда с объединённой тормозной магистралью", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 52–53", "paras": [{"t": "7.4.1 Тормозное нажатие на 100 тонн веса в соединенном поезде принимают по наименьшему значению тормозного нажатия одного из объединённых составов.", "b": false, "n": "7.4.1"}, {"t": "7.4.2 Разность тормозного нажатия на 100 тонн веса поезда в соединяемых поездах не должна превышать величину более 5 тс.", "b": false, "n": "7.4.2"}]}, {"id": "tb7_5", "cat": "tm_car", "page": 0, "pages": [], "title": "7.5 Недействующих локомотивов и вагонов моторвагонного подвижного состава", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 53–55", "paras": [{"t": "7.5.1 Локомотивы могут пересылаться как в одиночном порядке в поездах, так и сплотками. Моторвагонный подвижной состав пересылается составами, секциями и отдельными вагонами (сплотками). При этом рукава тормозной магистрали локомотивов и вагонов моторвагонного подвижного состава соединяют с общей тормозной магистралью поезда; все несоединенные соединительные рукава питательных воздухопроводов должны быть сняты с подвижного состава, а их концевые краны закрыты, кроме локомотивов, пересылаемых в порядке диспетчерской регулировки.", "b": false, "n": "7.5.1"}, {"t": "7.5.2 У пересылаемых в недействующем состоянии локомотивов и вагонов моторвагонного подвижного состава в каждой кабине разобщительные и комбинированные краны перекрыть (на локомотивах, оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом перекрыть разобщительные краны от тормозной и питательной магистралей (при наличии) к исполнительному устройству крана машиниста); краны двойной тяги (при наличии) перекрыть, ручки кранов машиниста установить в положение экстренного торможения; краны к ЭПК автостопа перекрыть; все несоединенные соеденительные рукава питательных воздухопроводов должны быть сняты с подвижного состава, а их концевые краны закрыты.", "b": false, "n": "7.5.2"}, {"t": "Источник питания электропневматического тормоза отключить от цепей управления.", "b": false, "n": ""}, {"t": "На локомотивах, у которых действие автоматического тормоза происходит через кран вспомогательного тормоза, в одной из кабин все разобщительные краны на воздухопроводах, идущих к этому крану, открыть. При наличии блокировочного устройства включить его в этой же кабине, при этом ручку комбинированного крана перевести в положение двойной тяги. Если действие автоматического тормоза локомотива происходит независимо от крана вспомогательного тормоза, то на воздухопроводах от этого крана все разобщительные краны перекрыть, комбинированные краны установить в положение двойной тяги, а блокировочное устройство в кабинах установить в выключенное положение.", "b": false, "n": ""}, {"t": "У недействующего локомотива разобщительный кран на воздухопроводе, соединяющем тормозную магистраль с питательной через обратный клапан, должен быть открыт при включенном одном главном резервуаре или группе резервуаров. Если на локомотиве имеется питательные резервуары тормозной системы, то разобщительные краны к главным резервуарам перекрыть. На моторвагонном подвижном составе, у которого тормозные цилиндры наполняются через реле давления, должно быть включено устройство для пересылки его в холодном состоянии.", "b": false, "n": ""}, {"t": "Все ручки кранов у недействующего локомотива должны быть опломбированы в вышеуказанных положениях.", "b": false, "n": ""}, {"t": "7.5.3 При пересылке одного поезда моторвагонного подвижного состава или сплотки, сформированной из вагонов этих поездов, воздухораспределители пассажирского типа с бесступенчатого отпуска включать на короткосоставный режим, если в сплотке не более 20 вагонов. Если в сплотке более 20 вагонов, а также независимо от числа вагонов при включении сплотки в грузовой поезд воздухораспределители пассажирского типа с бесступенчатым отпуском включать на длинносоставный режим.", "b": false, "n": "7.5.3"}, {"t": "При пересылке одного поезда моторвагонного подвижного состава вагоны которого оборудованы воздухораспределителями пассажирского типа со ступенчатым отпуском режим их включения должен соответствовать требованиям руководства по эксплуатации данной модели, согласованным с владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "7.5.4 Сплотки с выключенными тормозами могут быть отправлены только при невозможности приведения автоматических тормозов в действующее состояние. В этих случаях в хвосте сплотки должны быть прицеплены два порожних четырехосных вагона с включенными и действующими автотормозами или действующий локомотив с локомотивной бригадой.", "b": false, "n": "7.5.4"}, {"t": "При этом количество локомотивов и вагонов моторвагонного подвижного состава в сплотке устанавливают из расчета обеспечения необходимого тормозного нажатия, которое с учетом веса ведущего локомотива и вагонов и их тормозов должно быть на 100 т веса сплотки не менее 6 тс для спусков крутизной до 0,010 включительно, не менее 9 тс для спусков до 0,015 и не менее 12 тс для спусков до 0,020 включительно. Скорость следования сплотки при выключенных автотормозах у локомотивов в недействующем состоянии или МВПС не должна превышать 25 км/ч.", "b": false, "n": ""}, {"t": "Сплотка должна быть обеспечена стояночными (ручными) тормозами в соответствии с нормами, установленными настоящими Правилами.", "b": false, "n": ""}, {"t": "7.5.5 Проводники, сопровождающие сплотку, одиночный локомотив или моторвагонный подвижной состав должны быть проинструктированы не только по общим положениям, касающимся сопровождения сплотки, но и по правилам применения тормозных средств на пересылаемых локомотивах (моторвагонном подвижном составе), порядку опробования автотормозов в сплотке и переключения режимов воздухораспределителей.", "b": false, "n": "7.5.5"}, {"t": "Порядок пересылки одного поезда моторвагонного подвижного состава, оборудованного воздухораспределителями пассажирского типа со ступенчатым отпуском, должен производится в соответствии с техникораспорядительным документом владельца инфраструктуры.", "b": false, "n": ""}]}, {"id": "tb8", "cat": "tm_car", "page": 0, "pages": [], "title": "8 Обеспечение поездов тормозами", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 55", "paras": [{"t": "8.1 Все поезда, отправляемые со станции, должны быть обеспечены тормозами с гарантированным нажатием в соответствии с «Нормами обеспечения поездов тормозами и допускаемых скоростей движения поездов» (далее – Нормы) (Приложение 2).", "b": false, "n": "8.1"}, {"t": "8.2 Каждый владелец инфраструктуры разрабатывает и утверждает приложения к Нормам, в которых должны быть указаны данные эксплуатирующегося на инфраструктуре подвижного состава: расчетные нажатия для вагонов, курсирующих во внутригосударственном сообщении, локомотивов и моторвагонного подвижного состава, а также учетный вес локомотивов и моторвагонного подвижного состава, число его тормозных осей, а для пассажирских вагонов - нагрузку от пассажиров, ручной клади и снаряжения.", "b": false, "n": "8.2"}, {"t": "8.3 Фактический вес грузовых, почтовых и багажных вагонов в составах поездов необходимо определять по поездным документам.", "b": false, "n": "8.3"}, {"t": "8.4 Для удержания на месте после остановки на перегоне в случае неисправности грузовые, грузопассажирские и почтово-багажные поезда должны иметь исправные стояночные (ручные) тормоза и тормозные башмаки в соответствии с нормами, указанными в Приложении 2.", "b": false, "n": "8.4"}, {"t": "8.5 При отказе автотормозов у отдельных вагонов в пути следования поезд может быть отправлен с тормозным нажатием менее установленного нормативами (таблица 2, приложение 2) до первой станции, где имеется пункт технического обслуживания вагонов, с выдачей машинисту предупреждения об ограничении скорости.", "b": false, "n": "8.5"}, {"t": "В исключительном случае при отказе автотормозов в пути следования во всем поезде следовать дальше можно только после восстановления их действия. В противном случае поезд выводится с перегона вспомогательным локомотивом порядком, устанавливаемым владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "Порядок отправления и следования таких поездов устанавливается руководителем подразделения владельца инфраструктуры.", "b": false, "n": ""}]}, {"id": "tb9_1", "cat": "tm_test", "page": 0, "pages": [], "title": "9.1 Виды и общие требования при опробовании тормозов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 56–60", "paras": [{"t": "9.1.1 Устанавливаются следующие виды опробования тормозов:", "b": false, "n": "9.1.1"}, {"t": "- полное опробование тормозов;", "b": false, "n": ""}, {"t": "- сокращённое опробование тормозов;", "b": false, "n": ""}, {"t": "- технологическое опробование тормозов грузового поезда.", "b": false, "n": ""}, {"t": "9.1.2 При полном опробовании тормозов грузового поезда необходимо выполнить замер давления в тормозной магистрали хвостового вагона, проверить целостность тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона, проверить плотность тормозной сети поезда при нахождении ручки крана машиниста в поездном положении и положении «Перекрыша с питанием», действие тормозов у всех вагонов на торможение и отпуск, подсчитать тормозное нажатие в поезде и количество ручных тормозов.", "b": false, "n": "9.1.2"}, {"t": "Кроме этого, дополнительно в грузовых поездах с составом более 100 осей необходимо произвести замер наибольшего времени отпуска двух хвостовых вагонов.", "b": false, "n": ""}, {"t": "При полном опробовании тормозов пассажирских поездов проверяют целостность тормозной и питательной магистралей поезда (в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) и свободности прохождения сжатого воздуха до хвостового вагона по ним, плотность тормозной и питательной (в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) сетей, действие электропневматического тормоза каждого вагона на торможение и отпуск, величину напряжения в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне, действие автоматических тормозов у всех вагонов на торможение и отпуск, а также подсчитывают тормозное нажатие в поезде и количество ручных тормозов.", "b": false, "n": ""}, {"t": "9.1.3 При сокращенном опробовании тормозов проверяют состояние тормозной магистрали по действию тормозов хвостовых вагонов.", "b": false, "n": "9.1.3"}, {"t": "При выполнении сокращенного опробования в пассажирских поездах при смене локомотивных бригад дополнительно необходимо выполнить проверку целостности тормозной и питательной (в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) магистралей поезда, свободности прохождения сжатого воздуха по ним до хвостового вагона.", "b": false, "n": ""}, {"t": "При выполнении сокращенного опробования в грузовых поездах дополнительно необходимо выполнить проверку целостности тормозной магистрали поезда, свободности прохождения сжатого воздуха по ней до хвостового вагона, а также проверку плотности тормозной сети поезда.", "b": false, "n": ""}, {"t": "9.1.4 При проведении сокращенного опробования тормозов после проведения полного опробования тормозов от стационарной установки или другого локомотива грузового поезда необходимо выполнить замер давления в тормозной магистрали хвостового вагона, проверить целостность тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона, проверить плотность тормозной сети поезда при нахождении ручки крана машиниста в поездном положении и положении «Перекрыша с питанием», действие тормозов у хвостовых вагонов на торможение и отпуск, подсчитать тормозное нажатие в поезде и количество ручных тормозов.", "b": false, "n": "9.1.4"}, {"t": "Кроме этого, дополнительно в грузовых поездах с составом более 100 осей необходимо произвести замер наибольшего времени отпуска двух хвостовых вагонов.", "b": false, "n": ""}, {"t": "При проведении сокращенного опробования тормозов после проведения полного опробования тормозов от стационарной установки или другого локомотива пассажирских поездов проверяют целостность тормозной и питательной магистралей поезда (в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) и свободности прохождения сжатого воздуха до хвостового вагона по ним, плотность тормозной и питательной (в случае эксплуатации пассажирских поездов с применением питательной магистрали локомотива) сетей, действие электропневматического тормоза у двух хвостовых вагонов на торможение и отпуск, величину напряжения в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне, действие автоматических тормозов у двух хвостовых вагонов на торможение и отпуск, а также подсчитывают тормозное нажатие в поезде и количество ручных тормозов", "b": false, "n": ""}, {"t": "9.1.5 При технологическом опробовании автоматических тормозов грузового поезда определяется величина изменения плотности тормозной сети и действие автоматических тормозов вагонов головной части поезда. Необходимое количество вагонов указывается в технико-нормативных документах владельца инфраструктуры, но не менее чем 5 вагонов.", "b": false, "n": "9.1.5"}, {"t": "9.1.6 В пассажирских поездах выполняется вначале опробование электропневматических, а затем – автоматических тормозов.", "b": false, "n": "9.1.6"}, {"t": "9.1.7 Опробование тормозов перед отправлением поезда выполнять после зарядки тормозной магистрали зарядным давлением, указанным в таблице 1 настоящих Правил.", "b": false, "n": "9.1.7"}, {"t": "9.1.8 Время от начала отпуска при опробовании тормозов до отправления на затяжной спуск пассажирского поезда должно составлять не менее 120 секунд (2 минут), грузового поезда – не менее 240 секунд (4 минут).", "b": false, "n": "9.1.8"}, {"t": "9.1.9 Плотность тормозной сети поезда при нахождении ручки крана машиниста в поездном положении проверяют машинист и осмотрщик вагонов:", "b": false, "n": "9.1.9"}, {"t": "- при полном опробовании тормозов от локомотива;", "b": false, "n": ""}, {"t": "- при сокращенном опробовании тормозов от локомотива при проведении его после полного опробования тормозов от стационарного устройства (в том числе и с автоматической регистрацией) или другого локомотива;", "b": false, "n": ""}, {"t": "- при сокращенном опробовании тормозов если было изменение состава поезда.", "b": false, "n": ""}, {"t": "Так же плотность тормозной сети грузового поезда необходимо проверить машинисту при нахождении ручки крана машиниста в поездном положении в случаях выполнения сокращенного, в том числе при отсутствии изменении состава поезда, и технологического опробования тормозов.", "b": false, "n": ""}, {"t": "Плотность тормозной сети грузового поезда при нахождении ручки крана машиниста в положении «Перекрыша с питанием» проверяет машинист:", "b": false, "n": ""}, {"t": "- при полном опробовании тормозов от локомотива;", "b": false, "n": ""}, {"t": "- при сокращенном опробовании тормозов от локомотива при проведении его после полного опробования тормозов от стационарного устройства (в том числе и с автоматической регистрацией) или другого локомотива.", "b": false, "n": ""}, {"t": "9.1.10 Полное опробование автоматических тормозов в сплотках из недействующих локомотивов или вагонов моторвагонного подвижного состава выполняют осмотрщик вагонов совместно с проводниками сплоток. При этом проверяются выход штоков всех тормозных цилиндров и соответствие их нормативам, указанным в руководстве по эксплуатации. На станциях, где не предусмотрены осмотрщики вагонов, полное опробование тормозов выполняется локомотивной бригадой головного локомотива совместно с проводником сплотки.", "b": false, "n": "9.1.10"}, {"t": "9.1.11 Полное опробование автоматических тормозов в сплотках из действующих локомотивов выполняется только работниками локомотивных бригад. Ответственность за проверку правильности включения тормозного оборудования на ведомых локомотивах сплотки и опробование автоматических тормозов возлагается на локомотивную бригаду ведущего (головного) локомотива.", "b": false, "n": "9.1.11"}, {"t": "9.1.12 На станциях, где нет пунктов подготовки вагонов к перевозкам или пунктов технического обслуживания при прицепке к одиночно следующему локомотиву не более пяти вагонов полное опробование автоматических тормозов выполняются локомотивной бригадой.", "b": false, "n": "9.1.12"}, {"t": "9.1.13 Полное опробование производится от стационарного устройства (в том числе и с автоматической регистрацией) или локомотива, сокращенное и технологическое - только от локомотива.", "b": false, "n": "9.1.13"}, {"t": "При опробовании тормозов в поезде управление тормозами состава с локомотива выполняет машинист, а от стационарного устройства (в том числе и с автоматической регистрацией) осмотрщик вагонов или оператор. Действие тормозов в составе и правильность их включения проверяют осмотрщики вагонов.", "b": false, "n": ""}, {"t": "9.1.14 Для выполнения полного опробования на промежуточных станциях и разъездах, где нет штатных осмотрщиков вагонов, полное опробование выполняют осмотрщики вагонов, направленные с ближайших пунктов технического обслуживания вагонов, или работники, на которого эта обязанность возложена владельцем инфраструктуры, При выполнении сокращенного опробования тормозов на станциях, где не предусмотрены должности осмотрщиков вагонов, к проверке действия автоматических тормозов хвостовых вагонов пассажирских поездов привлекаются начальник (механик-бригадир) поезда или проводники вагонов, а в грузовых и почтово-багажных поездах работники, на которых эта обязанность возложена владельцем инфраструктуры.", "b": false, "n": "9.1.14"}, {"t": "На перегонах при выполнении сокращенного опробования в пассажирских поездах привлекаются начальник (механик-бригадир) поезда или проводники вагонов, сокращенное в грузовых и почтово-багажных поездах выполняет локомотивная бригада, а технологическое опробование грузового поезда выполняет локомотивная бригада.", "b": false, "n": ""}, {"t": "9.1.15 При обслуживании локомотивов пассажирского поезда машинистом без помощника машиниста к сокращенному опробованию тормозов на станциях, где не предусмотрены осмотрщики вагонов, и на перегонах привлекаются начальник (механик-бригадир) пассажирского поезда или проводники вагонов (головного, хвостового) по требованию машиниста, передаваемому по радиосвязи, или работники, на которых эта обязанность возложена владельцем инфраструктуры.", "b": false, "n": "9.1.15"}, {"t": "9.1.16 В случае выявления во время опробования не сработавших на отпуск воздухораспределителей не разрешается выполнять их отпуск вручную до выяснения причин неотпуска. В этих случаях необходимо проверить наличие перекрытых концевых кранов в тормозной магистрали поезда, особенно в тех местах, где прицеплялись или отцеплялись вагоны. Неисправные воздухораспределители заменить, а на промежуточных станциях выключить, перекрыв кран на воздухопроводе от тормозной магистрали к воздухораспределителю и выпустив воздух из рабочей камеры через выпускной клапан (запасного резервуара через выпускной клапан), убедившись в отходе тормозных колодок (тормозных накладок) от поверхности катания колес (тормозных дисков), сделав об этом отметку в «Справке об обеспечении поезда тормозами и исправном их действии» и следовать до ближайшей станции с пунктом технического обслуживания грузовых вагонов, где неисправность должна быть устранена.", "b": false, "n": "9.1.16"}, {"t": "9.1.17 Ответственность за достоверность данных по опробованию тормозов в поездах несут осмотрщики вагонов, а там, где нет осмотрщиков вагонов – работники, выполнявшие опробование, на которых эта обязанность возложена владельцем инфраструктуры.", "b": false, "n": "9.1.17"}, {"t": "Ответственность за достоверность данных по опробованию тормозов согласно пунктам 9.1.9, 9.1.10 и 9.1.11 настоящих Правил несет локомотивная бригада, выполнявшая опробование автоматических тормозов.", "b": false, "n": ""}, {"t": "9.1.18 Владелец инфраструктуры для стационарной установки с регистрацией параметров может ввести дополнительные проверки с изменением очередности операций при проведении проверки тормозов, если это не угрожает безопасности движения.", "b": false, "n": "9.1.18"}]}, {"id": "tb9_2", "cat": "tm_test", "page": 0, "pages": [], "title": "9.2 Порядок составления и выдачи «Справки об обеспечении поезда тормозами и исправном их действии»", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 60–64", "paras": [{"t": "9.2.1 По результатам полного опробования автоматических тормозов в поезде, а также после сокращенного, если предварительно на станции было выполнено полное опробование состава от стационарного устройства (в том числе и с автоматической регистрацией) или другого локомотива, осмотрщик вагонов (или работник, на которого эта обязанность возложена владельцем инфраструктуры) составляет в двух экземплярах под копирку «Справку об обеспечении поезда тормозами и исправном их действии» и подлинник вручает машинисту ведущего локомотива.", "b": false, "n": "9.2.1"}, {"t": "9.2.2 Машинист, получив «Справку об обеспечении поезда тормозами и исправном их действии» обязан убедиться, что отмеченные в ней данные о тормозах поезда соответствуют нормам и требованиям. При следовании с поездом двойной или многократной тягой машинисты всех локомотивов перед отправлением должны лично ознакомиться с данными, указанными в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.2.2"}, {"t": "9.2.3 При составлении и выдаче машинисту «Справки об обеспечении поезда тормозами и исправном их действии» результат проверки плотности тормозной магистрали поезда от локомотива записывает работник вагонного хозяйства, выполнявший проверку действия при опробовании автоматических тормозов; в остальных случаях, если не было изменения состава поезда, результат проверки плотности тормозной магистрали при опробовании тормозов записывает в «Справку об обеспечении поезда тормозами и исправном их действии» машинист с последующей росписью.", "b": false, "n": "9.2.3"}, {"t": "9.2.4 В «Справке об обеспечении поезда тормозами и исправном их действии» должны быть указаны следующие данные:", "b": false, "n": "9.2.4"}, {"t": "- дата вручения;", "b": false, "n": ""}, {"t": "- время вручения;", "b": false, "n": ""}, {"t": "- серия и номер локомотива;", "b": false, "n": ""}, {"t": "- номер поезда;", "b": false, "n": ""}, {"t": "- вес поезда;", "b": false, "n": ""}, {"t": "- количестве осей в поезде;", "b": false, "n": ""}, {"t": "- требуемое расчетное и фактическое нажатие колодок (накладок);", "b": false, "n": ""}, {"t": "- расчетное количество стояночных (ручных) тормозов в осях для удержания грузовых, грузопассажирских, пассажирских и почтово-багажных (хозяйственных) поездов на месте;", "b": false, "n": ""}, {"t": "- фактическое наличие исправных (ручных) тормозных осей для удержания грузовых, грузопассажирских, пассажирских и почтово-багажных (хозяйственных) поездов на месте;", "b": false, "n": ""}, {"t": "- количество (в процентах) в поезде композиционных колодок;", "b": false, "n": ""}, {"t": "- величина давления в тормозной магистрали хвостового вагона грузового поезда;", "b": false, "n": ""}, {"t": "- время отпуска автоматических тормозов двух хвостовых вагонов (на грузовые поезда длиной более 100 осей);", "b": false, "n": ""}, {"t": "- величина выхода штока тормозного цилиндра на хвостовом вагоне (на вагонах с раздельным потележечным торможением указывается величина выхода штока обоих тормозных цилиндров через дробь);", "b": false, "n": ""}, {"t": "- номер вагона, у которого встречаются осмотрщики при опробовании тормозов (при опробовании тормозов тремя и более осмотрщиками ставится символ «Т» и количество осмотрщиков);", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда в поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда в положении «Перекрыша с питанием»;", "b": false, "n": ""}, {"t": "- плотность питательной сети пассажирского поезда при эксплуатации пассажирских поездов с применением питательной магистрали локомотива;", "b": false, "n": ""}, {"t": "- величина напряжения в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне пассажирского поезда;", "b": false, "n": ""}, {"t": "- номер хвостового вагона.", "b": false, "n": ""}, {"t": "В отдельных случаях в справке проставляются соответствующие отметки:", "b": false, "n": ""}, {"t": "- проведенном опробовании автоматических тормозов с выдержкой в течении 600 секунд (10 минут);", "b": false, "n": ""}, {"t": "- наличии в грузовом поезде вагонов с воздухораспределителями, включенными на груженый режим, пассажирских вагонов или локомотивов с включенными тормозами;", "b": false, "n": ""}, {"t": "- наличии в пассажирском поезде вагонов с включенными дисковыми или магниторельсовыми тормозами и с автотормозами западноевропейского типа со ступенчатым отпуском.", "b": false, "n": ""}, {"t": "9.2.5 Результаты полного опробования тормозов от стационарного устройства с автоматической регистрацией параметров хранятся на электронном носителе и распечатываются в бумажном виде. Распечатка совместно с копией «Справки об обеспечении поезда тормозами и исправном их действии» хранятся не менее семи суток у должностного лица, назначенного руководителем подразделения, работник которого выполнял полное опробование тормозов.", "b": false, "n": "9.2.5"}, {"t": "9.2.6 «Справку об обеспечении поезда тормозами и исправном их действии» машинист должен хранить до конца поездки и по прибытии в основное депо сдать вместе со скоростемерной лентой (электронным носителем системы параметров движения поезда).", "b": false, "n": "9.2.6"}, {"t": "Если производится смена локомотивных бригад без отцепки локомотива, то сменяющийся машинист обязан передать имеющуюся у него «Справку об обеспечении поезда тормозами и исправном их действии» принявшему локомотив машинисту. Сдающий машинист на скоростемерной ленте (сопроводительных документах) делает пометку «Справку об обеспечении поезда тормозами и исправном их действии» (формы ВУ-45) на поезд №… передал машинисту (фамилия, имя, отчество и подпись принявшего машиниста), наименование депо».", "b": false, "n": ""}, {"t": "9.2.7 При каждом сокращенном опробовании автоматических тормозов осмотрщик вагонов, а там, где эта должность не предусмотрена работники, на которых эта обязанность возложена владельцем инфраструктуры, делают отметку о выполнении сокращенного опробования (включая отметку о происшедшем изменении состава с указанием номера хвостового вагона) в имеющейся у машиниста «Справки об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.2.7"}, {"t": "При прицепке (отцепке) вагонов, новые данные о плотности тормозной магистрали в «Справку об обеспечении поезда тормозами и исправном их действии» заносит работник, на которого возложена обязанность выполнять опробование тормозов.", "b": false, "n": ""}, {"t": "Если сокращенное опробование автоматических тормозов пассажирского поезда было выполнено с привлечением начальника (механика-бригадира) поезда или проводников вагонов, то начальник (механик-бригадир) должен сделать отметку о выполнении сокращенного опробования автоматических тормозов в имеющейся у машиниста «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": ""}, {"t": "9.2.8 На станциях, где нет пунктов подготовки вагонов к перевозкам или пунктов технического обслуживания при прицепке к одиночно следующему локомотиву не более пяти вагонов полное опробование автоматических тормозов выполняются локомотивной бригадой без вручения машинисту локомотива «Справки об обеспечении поезда тормозами и исправном их действии», а данные о весе поезда, тормозном нажатии с учетом веса и тормозных средств локомотива, дате, времени полного опробования тормозов, плотности тормозной сети машинист локомотива записывает в журнал технического состояния локомотива, хранящийся на локомотиве, и расписывается вместе с помощником. При этом исправные автотормоза должны быть включены на соответствующий режим торможения, за исключением случаев, предусмотренных для перевозки специальных грузов. Последние два вагона в поезде должны быть с включенными и исправно действующими автотормозами. Максимальная скорость движения поезда определяется по фактическому тормозному нажатию в сравнении с потребным с учетом веса и тормозных средств локомотива. По прибытии в депо машинист должен сделать копию записи из журнала технического состояния локомотива на сопроводительном документе и сдать вместе со скоростемерной лентой (электронным носителем системы параметров движения поезда).", "b": false, "n": "9.2.8"}, {"t": "Поезд следует без «Справки об обеспечении поезда тормозами и исправном их действии» до первой станции с пунктом технического обслуживания грузовых вагонов, где должно быть выполнено полное опробование автотормозов и машинисту выдана «Справка об обеспечении поезда тормозами и исправном их действии». Максимальная скорость движения поезда определяется по фактическому тормозному нажатию в сравнении с потребным с учетом веса и тормозных средств локомотива.", "b": false, "n": ""}, {"t": "9.2.9 При выполнении полного опробования на станциях, где не предусмотрены осмотрщики вагонов автоматических тормозов в сплотках из недействующих локомотивов или вагонов моторвагонного подвижного состава выполняет локомотивная бригада головного локомотива совместно с проводником сплотки без вручения машинисту ведущего локомотива «Справки об обеспечении поезда тормозами и исправном их действии». После проведения полного опробования тормозов данные о количестве, номерах и сериях локомотивов (вагонов моторвагонного подвижного состава), нажатии колодок на ось, с учетом веса и тормозных средств ведущего локомотива, даты и времени проведения полного опробования автоматических тормозов, плотности тормозной сети машинист записывает в журнал технического состояния локомотива и расписывается вместе с проводником сплотки.", "b": false, "n": "9.2.9"}, {"t": "9.2.10 Опробование автоматических тормозов в сплотке из действующих локомотивов выполняется работниками локомотивных бригад без вручения машинисту ведущего локомотива «Справки об обеспечении поезда тормозами и исправном их действии», а данные о количестве, номерах и сериях локомотивов, нажатии колодок на ось с учетом веса и тормозных средств ведущего локомотива, дате и времени проведения полного опробования автотормозов, плотности тормозной сети машинист ведущего локомотива записывает в журнал технического состояния локомотива и расписывается вместе с помощником.", "b": false, "n": "9.2.10"}, {"t": "9.2.11 Ответственность за достоверность данных «Справки об обеспечении поезда тормозами и исправном их действии» несут осмотрщики вагонов, а там, где нет осмотрщиков вагонов – работники, выполнявшие опробование на которых эта обязанность возложена владельцем инфраструктуры. Ответственность за достоверность данных по опробованию автоматических тормозов в журнале технического состояния локомотива несет локомотивная бригада, выполнявшая опробование.", "b": false, "n": "9.2.11"}]}, {"id": "tb9_3", "cat": "tm_test", "page": 0, "pages": [], "title": "9.3 Порядок проведения полного опробования тормозов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 64–71", "paras": [{"t": "9.3.1 Полное опробование автоматических тормозов в поездах выполняется:", "b": false, "n": "9.3.1"}, {"t": "- на станциях формирования и оборота поездов перед их отправлением;", "b": false, "n": ""}, {"t": "- после смены локомотива;", "b": false, "n": ""}, {"t": "- перед отправлением поезда с промежуточной станции после его стоянки без локомотивной бригады;", "b": false, "n": ""}, {"t": "- на станциях, разделяющих смежные гарантийные участки следования грузовых поездов, при техническом обслуживании состава без смены локомотива;", "b": false, "n": ""}, {"t": "- на станциях, предшествующих перегонам с затяжными спусками, где остановка поезда предусмотрена графиком движения. Перед затяжными спусками крутизной 0,018 и более полное опробование производится с 600 секундной (10 минутной) выдержкой в заторможенном состоянии. Перечень таких станций устанавливается владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "9.3.2 Полное опробование электропневматических тормозов производится на железнодорожных станциях формирования и оборота поездов перед их отправлением от стационарного устройства (в том числе и с автоматической регистрацией) или локомотива.", "b": false, "n": "9.3.2"}, {"t": "9.3.3 При выполнении полного опробования автоматических тормозов грузовых и грузопассажирских поездов необходимо произвести:", "b": false, "n": "9.3.3"}, {"t": "- установку измерительного устройства для измерения давления в тормозной магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "- замер зарядного давления в тормозной магистрали хвостового вагона. Замер давления в тормозной магистрали хвостового вагона поезда выполнять после полной зарядки тормозной магистрали всего поезда. Показания давления в тормозной магистрали хвостового вагона при поездном положении ручки крана машиниста не должно отличаться от зарядного давления в голове более чем:", "b": false, "n": ""}, {"t": "а) на 0,03 МПа (0,3 кгс/см2) при длине состава поезда до 300 осей включительно;", "b": false, "n": ""}, {"t": "б) на 0,05 МПа (0,5 кгс/см2) при длине состава поезда более 300 до 400 осей включительно;", "b": false, "n": ""}, {"t": "в) на 0,07 МПа (0,7 кгс/см2) при длине состава поезда более 400 осей;", "b": false, "n": ""}, {"t": "- демонтаж измерительного устройства для измерения давления в тормозной магистрали хвостового вагона;", "b": false, "n": ""}, {"t": "- проверку целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда. Проверку осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана хвостового вагона на 8 - 10 секунд;", "b": false, "n": ""}, {"t": "- замер времени отпуска автоматических тормозов у двух последних вагонов в хвосте поезда (при длине грузового поезда свыше 100 осей). Выполняется после полной зарядки тормозной магистрали, но не менее чем по истечении 120 секунд (2 минут) после срабатывания датчика контроля состояния тормозной магистрали или снижения давления в тормозной магистрали при проверке ее целостности, ступенью торможения со снижением давления по уравнительному резервуару на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) и получения информации о переводе машинистом ручки крана машиниста в положение «Зарядка и отпуск» с повышением давления по уравнительному резервуару на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) выше зарядного давления до момента начала отхода колодок от колес. Временем отпуска автоматических тормозов двух последних вагонов в хвосте поезда принимается наибольшее время отпуска вагонов;", "b": false, "n": ""}, {"t": "- проверку плотности тормозной сети поезда при поездном положении ручки крана машиниста.", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля (измерения) плотности тормозной магистрали поезда, проверку плотности производить по показанию этого устройства.", "b": false, "n": ""}, {"t": "Проверку плотности производят после отключения компрессоров по достижении в главных резервуарах локомотива предельного давления и последующего снижения этого давления на 0,04 - 0,05 МПа (0,4 - 0,5 кгс/см2) с замером времени дальнейшего снижения давления на 0,05 МПа (0,5 кгс/см2).", "b": false, "n": ""}, {"t": "Для поездов с локомотивами в голове наименьшее допустимое время снижения давления при проверке плотности тормозной магистрали в зависимости от длины состава и объема главных резервуаров локомотивов указано в таблице 4 настоящих Правил; Таблица 4 - Время снижения давления на 0,05 МПа (0,5 кгс/см2) в главных резервуарах при проверке плотности тормозной сети грузового поезда Общий объем Время, с, при длине состава в осях главных 101-150 151-200 201-250 251-300 301-350 351-400 401-450 451-480 481-530 до 100 резервуаров локомотива, л 1000 58 40 29 25 23 20 17 15 13 11 1200 69 46 34 29 25 22 20 18 15 13 1500 80 58 46 34 31 26 23 21 17 15 1800 98 69 52 46 38 33 29 26 22 20 2000 104 75 58 52 40 36 32 29 24 22 2500 129 93 71 64 51 45 40 36 30 28 3000 207 138 102 87 75 66 60 51 45 33 Примечания:", "b": false, "n": ""}, {"t": "1. При проверке плотности тормозной сети грузового поезда при зарядном давлении 0,52 - 0,55 МПа (5,3 - 5,6 кгс/см2) норму времени, указанную в таблице 4 уменьшить на 10%.", "b": false, "n": ""}, {"t": "2. При работе по системе многих единиц, когда главные резервуары локомотивов соединены в общий объем, указанное время увеличивать пропорционально изменению объемов главных резервуаров.", "b": false, "n": ""}, {"t": "3. На каждом локомотиве на видном месте должна быть выписка с указанием общего объёма главных резервуаров.", "b": false, "n": ""}, {"t": "4. При общем объеме главных резервуаров локомотива, отличном от представленного в таблице, объем принимать по ближайшему наименьшему объему, приведенному в таблице", "b": false, "n": ""}, {"t": "- проверку действия автоматических тормозов вагонов поезда на торможение. Для этого необходимо произвести снижение давления по уравнительному резервуару на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) с зарядного давления с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием», по истечении 120 секунд (2 минут) для грузовых поездов, у которых все воздухораспределители включены на равнинный режим, и 600 секунд (10 минут) – при воздухораспределителях, включенных на горный режим осмотрщики вагонов обязаны проверить состояние и действие автоматических тормозов по всему поезду у каждого вагона и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию колодок к поверхности катания колес.", "b": false, "n": ""}, {"t": "- проверку плотности тормозной сети поезда в положении ручки крана машиниста «Перекрыша с питанием», выполняют по истечении 120 секунд (2 минут) для грузовых поездов, у которых все воздухораспределители включены на равнинный режим, и 600 секунд (10 минут) – при воздухораспределителях, включенных на горный режим. Измеренная плотность тормозной сети поезда в положении ручки крана машиниста «Перекрыша с питанием» не должна отличаться от плотности при поездном положении ручки крана машиниста более чем на 10 % в сторону уменьшения.", "b": false, "n": ""}, {"t": "Для грузовых поездов с составом до 100 осей включительно проверка плотности тормозной сети поезда в положении ручки крана машиниста «Перекрыша с питанием» не производится.", "b": false, "n": ""}, {"t": "На грузовых локомотивах, оборудованных устройством контроля (измерения) плотности тормозной магистрали, проверку плотности производить по показанию этого устройства;", "b": false, "n": ""}, {"t": "- проверку действия автоматических тормозов вагонов поезда на отпуск.", "b": false, "n": ""}, {"t": "После окончания проверки действия автоматических тормозов на торможение произвести отпуск путем постановки ручки крана машиниста в поездное положение, а в грузовых поездах повышенной длины (длиной состава 350 осей и более) в положение «зарядка и отпуск» до получения давления в уравнительном резервуаре на 0,05 - 0,07 МПа (0,5 - 0,7 кгс/см2) выше зарядного давления с последующим переводом ручки крана машиниста в поездное положение. При этом осмотрщики вагонов обязаны проверить отпуск автоматических тормозов по всему поезду у каждого вагона и убедиться в их нормальной работе на отпуск по уходу штока тормозных цилиндров и отходу колодок от поверхности катания колес.", "b": false, "n": ""}, {"t": "При выявлении, не сработавших на отпуск, воздухораспределителей не разрешается выполнять их отпуск вручную до выяснения причин неотпуска. Все выявленные неисправности тормозного оборудования на вагонах должны быть устранены и действие тормозов у этих вагонов вновь проверено.", "b": false, "n": ""}, {"t": "9.3.4 По окончании проведения полного опробования автоматических тормозов выдается «Справка об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.3.4"}, {"t": "9.3.5 При выполнении полного опробования тормозов пассажирских поездов необходимо произвести:", "b": false, "n": "9.3.5"}, {"t": "- отключение источника питания электропневматического тормоза на локомотиве;", "b": false, "n": ""}, {"t": "- проверку целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда.", "b": false, "n": ""}, {"t": "Проверку осуществляют после полной зарядки тормозной сети поезда путем открытия последнего концевого крана тормозной магистрали хвостового вагона. При проверке целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда необходимо убедиться в свободности прохождения сжатого воздуха по ней и срабатывании не менее двух ускорителей экстренного торможения воздухораспределителей на вагонах в голове и хвосте поезда.", "b": false, "n": ""}, {"t": "При наличии в поезде более трети вагонов с включенными пассажирскими автоматическими тормозами со ступенчатым отпуском перед проверкой целостности тормозной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда машинист должен перевести ручку крана машиниста в положение «Перекрыша без питания», а после срабатывания автоматических тормозов локомотива, снижения давления в тормозной магистрали и уравнительном резервуаре ручку крана машиниста перевести в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Отпуск автоматических тормозов поезда до зарядного давления производить установкой ручки крана машиниста в положение «Зарядка и отпуск» до зарядного давления с последующим переводом в поездное положение;", "b": false, "n": ""}, {"t": "- проверку целостности питательной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда при эксплуатации пассажирских поездов с применением питательной магистрали локомотива.", "b": false, "n": ""}, {"t": "Проверку целостности питательной магистрали поезда и свободности прохождения сжатого воздуха по ней до хвостового вагона поезда проводят при давлении в питательной магистрали не менее 0,80 МПа (8,0 кгс/см2) путем открытия последнего концевого крана питательной магистрали хвостового вагона. Положительной считается проверка, при которой машинист локомотива фиксирует снижение давления в питательной магистрали;", "b": false, "n": ""}, {"t": "- проверку плотности тормозной сети поезда при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления от органа управления к исполнительным устройствам производится электрическим или иным способом разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста установить в закрытое положение). По истечении 20 секунд после отключения питания тормозной магистрали замеряют снижение давления в тормозной магистрали: снижение давления допускается на величину не более чем на 0,02 МПа (0,2 кгс/см2) в течение 60 секунд (1 минуты);", "b": false, "n": ""}, {"t": "- проверку плотности питательной сети поезда при эксплуатации пассажирских поездов с применением питательной магистрали локомотива проводят при отключенном питании тормозной магистрали поезда (комбинированным краном или краном двойной тяги), а на локомотивах, оборудованных краном машиниста, у которого передача команды управления к исполнительным устройствам производится электрическим или иным способом, разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста нужно установить в закрытое положение. После отключения питания замеряют снижение давления в питательной магистрали с 0,84 МПа (8,4 кгс/см2): снижение давления допускается на величину не более чем на 0,05 МПа (0,5 кгс/см2) в течение 60 секунд (1 минута);", "b": false, "n": ""}, {"t": "- проверку действия электропневматических тормозов на торможение и отпуск проводят при включенном источнике электрического питания электропневматического тормоза и выключенном переключателе дублированного питания проводов на локомотиве.", "b": false, "n": ""}, {"t": "Проверку производят при нахождении ручки вспомогательного тормоза в первом тормозном положении путем служебного торможения электропневматического тормоза до получения давления в тормозных цилиндрах локомотива 0,10 - 0,20 МПа (1,0 - 2,0 кгс/см2). Во время торможения напряжение источника питания должно быть не ниже 45 В.", "b": false, "n": ""}, {"t": "При положении служебного торможения электропневматическим тормозом крана машиниста на световом сигнализаторе пульта машиниста должна загореться лампа «Т», а при переводе ручки крана в положение «Перекрыша с питанием» лампа «Т» должна погаснуть и загореться лампа «П».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов обязаны проверить действие на торможение электропневматических тормозов во всем поезде и убедиться в их нормальной работе на торможение по выходу штока тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку действия на торможение электропневматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенках вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "Напряжение в цепях электропневматического тормоза в режиме торможения на хвостовом вагоне должно быть более 30 В.", "b": false, "n": ""}, {"t": "После проверки действия на торможение электропневматических тормозов необходимо отключить питание электропневматического тормоза на локомотиве и оставить ручку крана машиниста в положении «Перекрыша с питанием». Не менее чем через 15 секунд, когда произойдет отпуск электропневматических тормозов в поезде, включить питание электропневматического тормоза на локомотиве.", "b": false, "n": ""}, {"t": "Осмотрщики вагонов должны проверить отпуск тормозов у всех вагонов по уходу штока тормозных цилиндров и отходу тормозных колодок (тормозных накладок) от поверхности катания колес (тормозного диска). На вагонах с дисковыми тормозами проверку отпуска электропневматических тормозов допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "После этого машинист должен перевести ручку крана машиниста в поездное положение и отключить электропневматический тормоз.", "b": false, "n": ""}, {"t": "В случае выявления осмотрщиками неотпустившего тормоза у одного из вагонов неисправный электровоздухораспределитель должен быть заменен, а полное опробование электропневматических тормозов выполнено повторно с проверкой действия у отремонтированного вагона;", "b": false, "n": ""}, {"t": "- проверку действия автоматических тормозов поезда на торможение и отпуск после полной зарядки тормозной магистрали.", "b": false, "n": ""}, {"t": "Для проверки автоматических тормозов на торможение необходимо снизить давление в уравнительном резервуаре за один прием на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2) от зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "Осмотрщики вагонов не ранее чем через 120 секунд (2 минуты), а перед затяжными спусками крутизной 0,018 и более через 600 секунд (10 минут) после выполненного торможения обязаны проверить состояние и действие автоматических тормозов по всему поезду у каждого вагона, убедиться в их нормальной работе на торможение по выходу штоков тормозных цилиндров и прижатию тормозных колодок (тормозных накладок) к поверхности катания колес (тормозного диска).", "b": false, "n": ""}, {"t": "По окончании проверки действия автоматических тормозов на торможение с последующим отпуском тормозов поездным положением ручки крана машиниста осмотрщики вагонов должны проверить отпуск тормозов у каждого вагона по уходу штока тормозного цилиндра и отходу тормозных колодок (тормозных накладок) от колес (тормозных дисков).", "b": false, "n": ""}, {"t": "На вагонах с дисковыми тормозами проверку действия автоматических тормозов и их отпуска допускается проводить по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "В случае выявления при выполнении полного опробования автоматических тормозов в поезде с вагонами, оборудованными дисковыми тормозами, продолжительного времени выхода воздуха через кран машиниста после ступени торможения и нахождении ручки крана машиниста в положение «Перекрыша с питанием», опробование прекратить до устранения неисправности обратного клапана одного из вагонов.", "b": false, "n": ""}, {"t": "Все выявленные неисправности тормозного оборудования на вагонах должны быть устранены и действие автоматических тормозов у этих вагонов вновь проверено.", "b": false, "n": ""}, {"t": "9.3.6 По окончании проведения полного опробования тормозов выдается «Справка об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.3.6"}]}, {"id": "tb9_4", "cat": "tm_test", "page": 0, "pages": [], "title": "9.4 Порядок проведения полного опробования тормозов в поездах с составом из недействующих локомотивов или вагонов моторвагонного подвижного состава", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 71", "paras": [{"t": "9.4.1 Полное опробование автоматических тормозов необходимо выполнять, соблюдая требования так же, как при опробовании автоматических тормозов поезда соответствующего вида движения. После полного опробования машинисту ведущего локомотива осмотрщиком вагонов или работником, на которого эта обязанность возложена владельцем инфраструктуры, выдается «Справка об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": "9.4.1"}]}, {"id": "tb9_5", "cat": "tm_test", "page": 0, "pages": [], "title": "9.5 Порядок проведения сокращенного опробования тормозов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 71–85", "paras": [{"t": "9.5.1 Сокращенное опробование автоматических тормозов выполняется:", "b": false, "n": "9.5.1"}, {"t": "- после прицепки поездного локомотива к составу, если предварительно на станции было выполнено полное опробование автоматических тормозов от стационарного устройства (в том числе и с автоматической регистрацией) или локомотива;", "b": false, "n": ""}, {"t": "- при смене направления движения поезда с головы на хвост, если не меняется локомотив;", "b": false, "n": ""}, {"t": "- после смены локомотивных бригад, когда локомотив от поезда не отцепляется;", "b": false, "n": ""}, {"t": "- после стоянки поезда более 1800 секунд (30 минут);", "b": false, "n": ""}, {"t": "- после всякого разъединения рукавов в составе поезда или состава и локомотивом (кроме отцепки подталкивающего локомотива, включенного в тормозную магистраль), перекрытия концевого крана в поезде, после соединения рукавов вследствие прицепки подвижного состава (в последнем случае – с проверкой действия тормоза у каждого прицепленного вагона).", "b": false, "n": ""}, {"t": "9.5.2 В пассажирских поездах сокращенное опробование автоматических тормозов дополнительно выполняется:", "b": false, "n": "9.5.2"}, {"t": "- при снижении давления в главных резервуарах локомотива ниже 0,55 МПа (5,5 кгс/см2);", "b": false, "n": ""}, {"t": "- после снижения
