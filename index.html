 секции соединить правые нижние и средние контакты SA1 отвёрткой — питание будет от секции №2.", "Нет питания от ШП секции №2 и бустерной: секцию №2 перевести в А.Р. (SA1 вниз), на бустерной секции и секции №1 соединить правые нижние и средние контакты SA1 отвёрткой — питание будет от секции №1.", "Нет питания от ШП секций №1 и №2: перевести их в А.Р. (SA1 вниз) — питание будет от бустерной секции."], "notes": ["Секция №1 питается от бустерной; бустерная — от секции №2; секция №2 — от бустерной.", "Неисправна АКБ на всех секциях. А) При давлении воздуха 3,5–4 атм ГВ включить вручную. Б) На блоке 8 всех секций заклинить КМ5. В) На блоке 7 всех секций заклинить KV44. Г) На всех секциях вентиль защиты Y1 включить вручную. Д) На пульте включить кн. «Токоприёмник 1», нажать на грибок клапана ТКП Y10. Е) После подъёма ТКП в работу вступит зарядный агрегат; запустить и откачать электровоз, затем отпустить грибок Y10. Ж) САУТ не включать, открутить фишку КОН. При проезде нейтральной вставки кратковременно отключить ЭПК и нажать на клапан Y10. Если не работают КЛУБ и радиосвязь — см. «К.З. в цепи АКБ», пункты В и Г. З) Перейти на кран резервного управления (кран усл. №130)."], "kind": "fault", "id": "f7"}, {"cat": "tyaga", "page": 20, "pages": [20], "title": "«П» КМЭ: не гаснет лампа «ВИП» на всех секциях — что проверить", "steps": ["Включение автомата SF23 «Тяга».", "ЭПК заряжено и включено; вентиляторы и маслонасос запущены.", "Тормозная магистраль заряжена: на пневмоблоке головной секции проверить включение ПВУ SP4. Если ПВУ не включилось, а ТМ заряжена — блок-контакты обвести перемычкой.", "Включение МСУД и КЛУБ: при включении КЛУБ на блоке 9 головной секции проверить включение реле KV84.", "На блоке 7 головной секции проверить отключённое положение реле KV12, KV18 и включение KV13, KV21, KV22. На всех секциях — отключённое положение реле КТ2.", "На блоке 3 проверить включение реле КТ7 (на бустерной секции КТ7 на блоке 9)."], "notes": [], "kind": "fault", "id": "f8"}, {"cat": "tyaga", "page": 21, "pages": [21], "title": "«П» КМЭ: не гаснет «ВИП» на всех секциях — действия 1", "steps": ["ТМ заряжена: на пневмоблоке головной секции проверить включение ПВУ SP4. Если ПВУ не включилось, а ТМ заряжена — блок-контакты обвести перемычкой.", "Не включились реле KV21, KV22 на блоке 7 всех (или одной) секций — заклинить во включённом положении.", "Включено реле КТ2 — на всех секциях проверить положение тормозных переключателей QT. Если всё нормально — КТ2 расклинить в отключённом положении, рекуперацию не применять.", "На блоке 7 головной секции включено реле KV12 — расклинить в отключённом положении.", "На блоке 7 головной секции не включилось KV13 — заклинить во включённом положении и поставить перемычку с Н410 (реле КТ4) на Н77 (реле KV64), включить тумблер «Сигнализация» для работы клапана Y3 (отпуск тормозов).", "На головной секции включено реле KV18 — расклинить в отключённом положении."], "notes": [], "kind": "fault", "id": "f9"}, {"cat": "tyaga", "page": 22, "pages": [22], "title": "«П» КМЭ: не гаснет «ВИП» на всех секциях — действия 2", "steps": ["Не включилось КТ7 на всех секциях: на SA5 головной секции на стоянке перемычка с Э80 на Э2. Запустить электровоз, КМЭ в «П», включить «Сигнализация». Если «ВИП» погасла — 70 секунд, чтобы развить 2 км/ч, иначе свисток ЭПК. На стоянке «Сигнализация» выключить. Если подать питание на провод Э3 — электровоз поедет назад.", "Всё включается, а «ВИП» не гаснет на всех секциях: проверить положение реверсоров QP и тормозных переключателей QT. На блоке 7 головной секции перемычка с Н410 (КТ4) на Э6 (КТ2), включить «Сигнализация»."], "notes": [], "kind": "fault", "id": "f10"}, {"cat": "tyaga", "page": 23, "pages": [23, 24], "title": "Положение реверсоров QP и переключателей QT по секциям", "steps": [], "notes": ["Схема положения QP и QT в зависимости от расположения секций. Красные стрелки показывают направление взгляда."], "kind": "info", "id": "f11"}, {"cat": "tyaga", "page": 25, "pages": [25], "title": "Не переводятся тормозные переключатели из рекуперации в тягу", "steps": ["Проверить положение контактора К1: если включён — зайти в ВВК, отключить вручную, перекрыть кран КН67.", "На блоке 8 проверить контактор КМ13: если включён — отключить вручную.", "На блоке 7 проверить отключённое положение КТ2: если включено — расклинить в отключённом положении.", "Если всё нормально — на блоке 7 перемычка с Н410 (КТ4) на Н36 (КТ2), включить «Сигнализация». После переключения тормозных переключателей перемычку убрать."], "notes": [], "kind": "fault", "id": "f12"}, {"cat": "tyaga", "page": 26, "pages": [26], "title": "«П» КМЭ: не гаснет «ВИП» на одной секции, в зоне регулирования отключаются все БВ секции", "steps": ["На блоке 7 неисправной секции проверить включение KV21, KV22, KV15 и отключение КТ2. На блоке 8 — включение КМ41, КМ42.", "Не включились KV21, KV22 — на блоке 7 неисправной секции заклинить во включённом положении.", "На блоке 7 неисправной секции включено КТ2: проверить положение QT, КТ2 расклинить в отключённом положении.", "Не включилось KV15: проверить положение QP и QT, KV15 заклинить во включённом положении. На головной секции — заклинивать перед отправлением (за 70 с развить 2 км/ч), на стоянке расклинить.", "KV15 включено: на блоке 8 проверить КМ41 и КМ42. Если не включились — на блоке 7 перемычка с Н410 (КТ4) на Н157 и Н158 (KV15), включить «Сигнализация». Не помогло — на блоке 8 заклинить КМ41, КМ42 во включённом положении."], "notes": [], "kind": "fault", "id": "f13"}, {"cat": "tyaga", "page": 27, "pages": [27], "title": "«П» КМЭ: не гаснет «ВИП» на одной секции, отключаются все БВ одной группы ТЭД (лампы «ТД1-2» или «ТД3-4»)", "steps": ["На неисправной секции проверить положение реверсоров QP и тормозных переключателей QT.", "На блоке 8 неисправной секции: горят «ТД1-2» — заклинить КМ41; горят «ТД3-4» — заклинить КМ42."], "notes": [], "kind": "fault", "id": "f14"}, {"cat": "tyaga", "page": 28, "pages": [28], "title": "«П» КМЭ: «ВИП» гаснет, в зоне регулирования нет нагрузки на одной группе ТЭД", "steps": ["На блоке 8 неисправной секции проверить тягу (коромысло) контактора КМ41 или КМ42 — возможно, слетела или сломалась.", "Если всё нормально — на блоке А71 или А72 проверить свечение светодиодов."], "notes": [], "kind": "fault", "id": "f15"}, {"cat": "tyaga", "page": 29, "pages": [29], "title": "При постановке КМЭ в «П» отключаются все БВ секции (ТД1-4), БВ не восстанавливаются — сгорел F37", "steps": ["Проверить положение тормозных переключателей QT и реверсоров QP.", "На блоке 8 неисправной секции восстановить предохранитель F37.", "На блоке 7 неисправной секции расклинить KV15 в отключённом положении (клин между якорем и сердечником).", "На блоке 8 неисправной секции заклинить КМ41 и КМ42 во включённом положении.", "БВ включать и тягу собирать обычным порядком."], "notes": [], "kind": "fault", "id": "f16"}, {"cat": "tyaga", "page": 30, "pages": [30], "title": "В любом положении КМЭ срабатывает автомат SF23 «Тяга» (начало)", "steps": ["Автомат SF23 не восстанавливать, К.З. не искать.", "На всех секциях проверить положение QT и QP.", "На головной секции заклинить SA3 во включённом положении.", "На блоке 7 всех секций заклинить KV21, KV22, KV15. На головной секции KV15 клинить только перед отправлением, на стоянке расклинить (иначе срыв ЭПК)."], "notes": ["На электровозах примерно с №700 на всех секциях дополнительно заклинить во включённом положении SA5."], "kind": "fault", "id": "f17", "rel": ["p2"]}, {"cat": "tyaga", "page": 31, "pages": [31], "title": "В любом положении КМЭ срабатывает автомат SF23 «Тяга» (конец)", "steps": ["На головной секции с обратной стороны блока 9 на реле KV23 перемычка с Л7 на Л8, если эти провода есть. Если Л7 и Л8 нет — перемычку можно не ставить.", "В КМЭ головной секции отсоединить и заизолировать провод Э19 или положить изоляцию в провода Н023–Э19 (11-12) и Э19–Э2 (1-2). В скобках — монтажный номер.", "На блоке 7 головной секции перемычка с Н410 (КТ4) на Э19 (КТ4), включить «Сигнализация». Если при этом сработает SF29 «Сигнализация» — заказать вспомогательный локомотив."], "notes": ["Нумерация в оригинале продолжает предыдущую страницу (пункты 5–7)."], "kind": "fault", "id": "f18", "rel": ["p2"]}, {"id": "p2", "cat": "tyaga", "page": 0, "pages": [], "kind": "fault", "photo": true, "title": "Тяга без автомата SF23 — фото с локомотива 2ЭС5К", "steps": ["Включить SA3: перемычка с Н230 на «+» вентиля SA3.", "Под пультом машиниста (в КМЭ) изолировать контакты 1 и 11.", "На SA5 перемычка с Н410 на «+» вентиля.", "Заклинить KV21 и KV22.", "На КТ4 перемычка с Н410 на Э19, заклинить KV15."], "sp": {"0": ["b1_0", "b1_1", "b1_2"], "1": ["b2_1", "b2_0"], "2": ["b2_2", "b2_3"], "3": ["b3_0", "b3_1"], "4": ["b3_2", "b3_3"]}, "notes": ["Фотографии сделаны на обычном «Ермаке» (2ЭС5К).", "На головной секции KV15 клинить только перед отправлением, на стоянке расклинить, иначе сорвёт ЭПК."], "rel": ["f18"]}, {"cat": "bv", "page": 32, "pages": [32], "title": "Не включаются БВ — что проверить", "steps": ["Напряжение АКБ на шкафе питания — не менее 35 В.", "На блоке 8 целостность предохранителя F37 (15 А).", "Разъединители QS3 и QS4 на тяговом трансформаторе — включены.", "На блоке 7 включение реле KV21 и KV22.", "В силовых блоках А11 и А12 включение разъединителей QS11 и QS12.", "Давление воздуха в цепях управления — не менее 5 атм."], "notes": [], "kind": "fault", "id": "f19"}, {"cat": "bv", "page": 33, "pages": [33], "title": "Не включаются БВ на всех секциях, в А11/А12 слышен шум магнитной системы, МСУД не перезапускается", "steps": ["На блоке 7 всех секций проверить KV21 и KV22; если не включились — заклинить."], "notes": [], "kind": "fault", "id": "f20"}, {"cat": "bv", "page": 34, "pages": [34], "title": "Не включаются БВ на одной секции — проверка F37", "steps": ["Запустить электровоз (мотор-вентиляторы), КМЭ в «П». Если «ВИП» не погасла — сгорел F37.", "Если сгорел F37 — на блоке 7 неисправной секции перемычка с Н410 (КТ4) на Н017 (KV43), включить «Сигнализация».", "Если при перемычке Н410–Н017 срабатывает SF29 «Сигнализация» — К.З. в цепи БВ (см. «К.З. в цепи БВ»).", "На блоке 8 F37 можно заменить, взяв с F23 или F24."], "notes": [], "kind": "fault", "id": "f21"}, {"cat": "bv", "page": 35, "pages": [35], "title": "Не включаются БВ на одной секции, в А11/А12 не слышно работы магнитной системы", "steps": ["На блоке 7 нажать на якорь KV43. Если работы магнитной системы не слышно, а F37 цел — нет питания на включающие катушки БВ.", "На блоке 7 неисправной секции перемычка с Н410 (КТ4) на Н150 (KV43), включить «Сигнализация». После включения БВ перемычку убрать.", "Если БВ не включились — включить принудительно под воздухом."], "notes": [], "kind": "fault", "id": "f22"}, {"cat": "bv", "page": 36, "pages": [36], "title": "Включение БВ принудительно под воздухом", "steps": ["Опустить токоприёмник и с соблюдением ТБ зайти в ВВК.", "В силовых блоках А11 и А12 на разъединителе QS5 обвести перемычкой нормально разомкнутый контакт в проводах Э26–Н155 (А11) и Э26–Н156 (А12).", "На пульте машиниста при опущенных токоприёмниках включить кнопку «Главный выключатель».", "В силовых блоках А11 и А12 нажать на клапан включающей катушки БВ."], "notes": [], "kind": "fault", "id": "f23"}, {"cat": "bv", "page": 37, "pages": [37], "title": "БВ включаются и отключаются на одной секции", "steps": ["F37 цел, при нажатии на якорь KV43 в А11/А12 слышна работа магнитной системы — нет питания на удерживающие катушки БВ.", "На блоке 7 неисправной секции проверить KV21 и KV22; если выключены — заклинить.", "Если KV21 и KV22 включены — в А11 и А12 на QS5 обвести перемычкой нормально разомкнутый контакт в проводах Э26–Н155 (А11) и Э26–Н156 (А12).", "Можно в А11 и А12 на всех БВ поставить перемычки с Н410 на «+» удерживающей катушки БВ, включить «Сигнализация»."], "notes": [], "kind": "fault", "id": "f24"}, {"cat": "bv", "page": 38, "pages": [38], "title": "БВ включаются и отключаются на одной группе ТЭД", "steps": ["В А11 или А12 на QS5 обвести перемычкой нормально разомкнутый контакт в проводах Э26–Н155 (1-я группа ТЭД) или Э26–Н156 (2-я группа).", "Можно в А11 или А12 на всех БВ поставить перемычки с Н410 на «+» удерживающей катушки БВ, включить «Сигнализация»."], "notes": [], "kind": "fault", "id": "f25"}, {"cat": "bv", "page": 39, "pages": [39], "title": "К.З. в цепи БВ, постоянно перегорает F37", "steps": ["К.З. не искать, F37 не восстанавливать. На блоке 8 неисправной секции заклинить КМ41 и КМ42 во включённом положении.", "В А11 и А12 на разъединителях QS11 и QS12 поставить изоляцию под два блокировочных контакта (чтобы не искать провода).", "В А11 и А12 на всех БВ поставить перемычки с Н410 на «+» удерживающей катушки БВ, включить «Сигнализация» (поочерёдно).", "Если при перемычке с Н410 срабатывает SF29 «Сигнализация» — К.З. в удерживающей катушке данного БВ; этот БВ отключить разъединителем ТЭД QS11 или QS12.", "С соблюдением ТБ войти в силовые блоки А11 и А12 и нажать на клапан включающей катушки БВ."], "notes": [], "kind": "fault", "id": "f26"}, {"cat": "gv", "page": 40, "pages": [40], "title": "ГВ не включается — что проверить", "steps": ["Включение автоматов SF22 «Главный выключатель» и SF23 «Тяга».", "Напряжение АКБ на шкафе питания — не менее 35 В.", "Включение блокировки тормозов 367 (SQ1), включение SA3 и SA5 (если SA5 включён — флажок смотрит влево).", "Давление в цепях управления по манометру МН6 и в цепи ГВ по МН4.", "КМЭ в положении «0», включение KV21 и KV22 на блоке 7.", "Включение реле KV2 и давление в пневмоприводе токоприёмника."], "notes": ["Все проверки — при включённой блокировке 367, включённых кнопках «Токоприёмник передний и задний», «Цепи управления», «Главный выключатель», «МСУД» и тумблере «Сигнализация»."], "kind": "fault", "id": "f27"}, {"cat": "gv", "page": 41, "pages": [41], "title": "ГВ не включается на всех секциях, не горят лампы, не включился SA3", "steps": ["Если не включился SA3 — на блоке 7 проверить KV21 и KV22. Если они включены — неисправен сам SA3: включить вручную, нажав на грибок вентиля (или повернуть указатель в сторону вентиля), и заклинить шестерни отвёрткой.", "Если KV21 и KV22 не включились — нет питания в проводе Н18. На SA3 головной секции перемычка с Н230 (блок-контакт SA3) на Н18 («+» катушки SA3), включить «Сигнализация».", "Если SA3 включён, но нет питания на KV21 и KV22 — на блоке 7 всех секций заклинить их во включённом положении."], "notes": [], "kind": "fault", "id": "f28"}, {"cat": "gv", "page": 42, "pages": [42], "title": "ГВ не включается на всех секциях, МСУД и сигнализация работают", "steps": ["Определить, где нет питания — в Э26 или Э27: при включённой кнопке «ГВ» на блоке 7 головной секции нажать на якорь KV43. ГВ включилось — нет питания в Э27; не включилось — нет питания в Э26.", "Нет питания в Э27: на блоке 7 головной секции перемычка с Н77 (KV64) на Э27 (KV21), ГВ включать кнопкой «Отпуск тормозов».", "Нет питания в Э26: на SA5 головной секции перемычка с Э80 на Э26, включить «Сигнализация». ГВ отключать тумблером «Сигнализация»."], "notes": [], "kind": "fault", "id": "f29"}, {"cat": "gv", "page": 43, "pages": [43], "title": "ГВ не включается на одной секции", "steps": ["На блоке 7 неисправной секции проверить KV21 и KV22 (не включились — заклинить) и отключение KV41.", "На блоке 7 неисправной секции перемычка с Н410 (КТ4) на Н210 (KV41), включить «Сигнализация». После включения ГВ перемычку убрать.", "Не включилось — включить принудительно под воздухом: на блоке 7 перемычка с Н410 (КТ4) на Н204 (KV43), включить «Сигнализация». С соблюдением ТБ зайти в ВВК и нажать на шток включающего электромагнита ГВ (у вакуумного ГВ — электромагнита вакуумной камеры). Закрыть шторы ВВК, поднять ТКП, включить ГВ на остальных секциях. Перемычку убрать."], "notes": [], "kind": "fault", "id": "f30"}, {"cat": "gv", "page": 44, "pages": [44], "title": "Включение ГВ принудительно под воздухом", "steps": ["На блоке 7 неисправной секции перемычка с Н410 (КТ4) на Н204 (KV43), включить «Сигнализация».", "С соблюдением ТБ зайти в ВВК. Воздушный ГВ — нажать на шток включающего электромагнита. Вакуумный ГВ — нажать на шток включающей катушки привода вакуумной камеры.", "Закрыть шторы ВВК, поднять ТКП и включить ГВ на остальных секциях."], "notes": [], "kind": "fault", "id": "f31"}, {"cat": "gv", "page": 45, "pages": [45], "title": "ГВ включается и отключается на одной из секций", "steps": ["Повторное включение ГВ запрещено. Пом. машиниста осматривает неисправную секцию и докладывает состояние блинкерной защиты: KV1 – РЗ, KV3 – РЗ, КА1–6, КА8, КА9 (на схеме выделены красным).", "Проверить РМТ: на БИ МСУД высветится «сработало РМТ».", "Если РМТ и блинкерная защита не сработали — в трансформаторном отсеке перемычка с Н410 (блок-контакт QS4) на Н208 (реле перегрузки КА9), включить «Сигнализация». ГВ на этой секции отключать тумблером «Сигнализация»."], "notes": ["С этой перемычкой рекуперацией пользоваться запрещено (сработает КА8). Следить за расшифровочным табло: при загорании РЗ немедленно отключить ГВ тумблером «Сигнализация». Пом. машиниста чаще осматривает машинное отделение и блинкеры.", "Проверка РМТ: опустить ТКП, на блоке 7 перемычка с Н410 (КТ4) на Н204 (KV43), включить «Сигнализация», нажать на якорь KV43. ГВ включилось — сработало РМТ. Включилось и отключилось — обрыв в цепи удерживающей катушки ГВ."], "kind": "fault", "id": "f32"}, {"cat": "gv", "page": 46, "pages": [46], "title": "Логическая схема отыскания К.З. («земли») в силовой схеме", "steps": [], "notes": ["Начало: в блоках А11 и А12 отключить QS11 и QS12, восстановить ГВ. ГВ не бьёт — «земля» в ТЭД. ГВ бьёт через РЗ — «земля» в ВИП или сглаживающих реакторах: отключить ВИП 1 и 2 разъединителями. Не бьёт — «земля» в ВИП; бьёт — выше ВИП. Дальше — по схеме на рисунке.", "Проверить напряжение в цепях управления. При завышенном напряжении шкаф питания А25 поставить в аварийное положение (SA1 — «Аварийно»).", "Для быстрого вывода поезда с перегона на блоках А11 и А12 можно отключить разъединители QS7. Выводить по возможности на малых токах, после разгона отключить секцию тумблером S61–S64 на пульте пом. машиниста.", "«Неявная земля» — ГВ через РЗ срабатывает в определённой зоне ВИП или при определённой скорости. Поиск аналогичен логической схеме."], "kind": "info", "id": "f33"}, {"cat": "gv", "page": 47, "pages": [47], "title": "Автомат SF22 «ГВ» срабатывает при включении кнопки «Главный выключатель» или «Возврат защиты»", "steps": ["Определить неисправную секцию отключением SA5: на пульте пом. машиниста отключить все тумблеры S61–S64, восстановить SF22, включить кнопку «ГВ». Затем поочерёдно включать S61–S64 и смотреть, на какой секции срабатывает SF22."], "notes": ["Секция отключением SA5 НЕ определяется. А) SF22 и кн. «ГВ» не включать. Б) На SA5 всех секций изоляция в проводах Э26–Н202. В) На SA5 всех секций перемычка с Э80 на Н202, включить «Сигнализация». Г) ГВ включать посекционно на блоке 7, кратковременно нажимая на якорь KV43.", "Секция отключением SA5 определяется. А) На SA5 «больной» секции изоляция в Э26–Н202. Б) На блоке 7 «больной» секции изоляция в Н204 (Н205)–Н209 на KV43. В) В трансформаторном отсеке изоляция в Н207–Н208 на КА9 или отсоединить Н208. Г) Перемычка с Н410 (QS4) на Н208 (КА9), включить «Сигнализация». Д) Для включения ГВ и БВ — перемычка на блоке 7 с Э128 (+KV78) на Н209 и Н150 (KV43), кратковременно включить кн. «Освещение тележек». Е) Если срабатывает SF29 — ГВ включить вручную или «больную» секцию не использовать.", "SF22 срабатывает при включении кн. «Возврат защиты». А) К.З. не искать. Б) На всех секциях на блоке 7 на KV41 изоляция в проводах Н209–Н210. В) ГВ включить принудительно под воздухом."], "kind": "fault", "id": "f34"}, {"cat": "tkp", "page": 48, "pages": [48], "title": "Токоприёмники не поднимаются — что проверить", "steps": ["Включение автомата SF21 «Токоприёмники».", "Напряжение АКБ на шкафе питания — не менее 35 В.", "Давление в цепях управления по МН6 — не ниже 5 атм.", "Давление в пневмоприводе ТКП по МН8 (2,2–2,4 атм) и открытие крана КН41.", "В А11 и А12 разъединители QS5 — должны быть отключены.", "Выход блокировок штор ВВК."], "notes": [], "kind": "fault", "id": "f35"}, {"cat": "tkp", "page": 49, "pages": [49], "title": "Токоприёмники не поднимаются, штоки ПБ не вышли на всех секциях", "steps": ["На блоке 7 головной секции перемычка с Н202 (KV44) на Э29 (KV44), ТКП поднимать кнопкой «Главный выключатель». Или перемычка с Н410 (КТ4) на Э29 (KV44), ТКП поднимать тумблером «Сигнализация»."], "notes": [], "kind": "fault", "id": "f36"}, {"cat": "tkp", "page": 50, "pages": [50], "title": "Токоприёмники не поднимаются, штоки ПБ не вышли на одной секции", "steps": ["На неисправной секции осмотреть вентиль защиты Y1 и включить вручную. Не удалось — на всех секциях заклинить KV44 и поднять ТКП на той секции, где вышли шторы ВВК."], "notes": ["Вентиль защиты включают вручную: оттянуть на себя грибок клапана и закрутить по часовой стрелке до упора или поставить клин. Затем визуально убедиться, что штоки ВВК вышли."], "kind": "fault", "id": "f37"}, {"cat": "tkp", "page": 51, "pages": [51], "title": "Токоприёмники не поднимаются, штоки ПБ вышли", "steps": ["На всех секциях на блоке 8 проверить переключатель Q6 (должен быть включён), на блоке 9 — разъединители QS28 (на бустерной ещё QS27), должны быть выключены.", "На блоке 7 всех секций проверить включение KV44. Не включилось — заклинить на всех секциях, или перемычка на блоке 7 головной секции с Э29 (KV44) на Э36 («+» катушки KV44), ТКП поднимать кнопкой «Токоприёмник передний»."], "notes": [], "kind": "fault", "id": "f38"}, {"cat": "tkp", "page": 52, "pages": [52], "title": "При включении кнопки «Токоприёмник» срабатывает автомат SF21", "steps": ["Кнопки «Токоприёмник передний и задний» не включать.", "На всех секциях заклинить во включённом положении реле KV2 (на бустерной секции KV2 на блоке 7).", "На головной секции включить вручную вентиль защиты Y1.", "На блоке 7 всех секций заклинить KV44.", "На головной секции на KV44 изоляция в проводах Э29–Н236 (две штуки).", "На головной секции на KV44 перемычка с Н202 на Н236, ТКП поднимать кнопкой «Главный выключатель», давление в цепи ТКП контролировать по МН8."], "notes": [], "kind": "fault", "id": "f39", "rel": ["p1"]}, {"id": "p1", "cat": "tkp", "page": 0, "pages": [], "kind": "fault", "photo": true, "title": "Подъём токоприёмника без автомата SF21 — фото с локомотива 2ЭС5К", "steps": ["Закрутить или заклинить вентиль защиты Y1 — блокировки должны выйти.", "Поставить изоляцию на розетку под Y10 (в районе ноги), чтобы перемычка не касалась корпуса. Затем перемычка с левого ввода на «+» Y10.", "Перемычка с KV43 (провод Н204) на KV18 (провод Э80)."], "sp": {"0": ["a1_0"], "1": ["a1_1", "a1_2"], "2": ["a2_0", "a2_1"]}, "notes": ["Фотографии сделаны на обычном «Ермаке» (2ЭС5К)."], "rel": ["f39"]}, {"cat": "pd", "page": 53, "pages": [53], "title": "Нет запуска ПД на всех секциях", "steps": ["На всех секциях проверить автомат SF25 «Вспом. машины».", "На блоке 7 всех секций проверить KV19, KV45; на блоке 8 — КМ1, КМ2, КМ3.", "Не включилось KV19 — на блоке 7 головной секции перемычка с Н410 (КТ4) на Э40 («+» катушки KV19), ПД запускать тумблером «Сигнализация». Не включилось KV45 — заклинить.", "Можно на блоке 7 всех секций заклинить KV19; при проследовании нейтральных вставок отключать ГВ."], "notes": [], "kind": "fault", "id": "f40"}, {"cat": "pd", "page": 54, "pages": [54], "title": "3ЭС5К с №683: при запуске МВ1, МВ2 или МК нет запуска ПД", "steps": ["На всех секциях проверить SF25 «Вспом. машины».", "На блоке 7 всех секций проверить KV19; на блоке 8 — КМ2 и КМ3.", "Не включилось KV19 — на блоке 7 головной секции перемычка с Н410 (КТ4) на Э40 («+» катушки KV19), ПД запускать тумблером «Сигнализация».", "Либо KV19 заклинить на всех секциях; при проследовании нейтральных вставок отключать ГВ.", "При включении МВ1, МВ2 или МК с обратной стороны блока 9 проверить KV25; не включилось — заклинить."], "notes": [], "kind": "fault", "id": "f41"}, {"cat": "pd", "page": 55, "pages": [55], "title": "Нет запуска ПД на одной секции", "steps": ["На неисправной секции проверить SF25 «Вспом. машины» (на бустерной — на ЩПР).", "На блоке 7 проверить KV19, KV45. Не включилось KV19 — заклинить, при проезде нейтральных вставок отключать ГВ. Не включилось KV45 — заклинить.", "На блоке 8 не включились КМ2 и КМ3 — заклинить.", "На блоке 8 не включился КМ1: на ЩПР отключить S13 «Пусковой двигатель», запустить сначала один из вентиляторов, затем компрессор (один вентилятор работает постоянно). Не включается KV45 — заклинить на блоке 7."], "notes": [], "kind": "fault", "id": "f42"}, {"cat": "pd", "page": 56, "pages": [56], "title": "3ЭС5К с №683: при запуске МВ1, МВ2 или МК нет запуска ПД на одной секции", "steps": ["На неисправной секции проверить SF25 «Вспом. машины» (на бустерной — на ЩПР).", "На блоке 7 проверить KV19. Не включилось — заклинить, при проезде нейтральных вставок отключать ГВ. Не включилось KV45 при запуске МВ или МК — заклинить.", "На блоке 8 не включились КМ2 и КМ3 — заклинить.", "На блоке 8 не включился КМ1: на ЩПР отключить S13 «Пусковой двигатель», запустить сначала вентилятор, затем компрессор. Не включается KV45 — заклинить на блоке 7.", "При включении МВ1, МВ2 или МК с обратной стороны блока 9 проверить KV25; не включилось — заклинить."], "notes": [], "kind": "fault", "id": "f43"}, {"cat": "pd", "page": 57, "pages": [57], "title": "3ЭС5К с №683: при запуске МВ1/МВ2/МК одновременно запускается другой МВ или МК", "steps": ["Причина — пробой блока диодов U101, U102 или U103.", "Пробит U101 — запустится МВ1; U102 — МВ2; U103 — МК.", "Если одновременно запускаются вентиляторы — следовать до основного или оборотного депо. Если одновременно запускается компрессор — на ЩПР неисправной секции отключить S14 «Компрессор» и на блоке 7 на KV45 поставить изоляцию в проводах Н254–Н256."], "notes": [], "kind": "fault", "id": "f44"}, {"cat": "pd", "page": 58, "pages": [58], "title": "При включении «Вспом. машины» срабатывает SF25 «ВМ» на головной секции — где К.З.", "steps": ["Определить, где К.З.: в проводе Э40 или в цепи КМ1–3 головной секции.", "На блоке 7 головной секции расклинить KV19 (клин между якорем и сердечником).", "Восстановить SF25 «ВМ» и включить кнопку «Вспом. машины».", "SF25 сработал — К.З. в проводе Э40. Не сработал — К.З. в цепи КМ1–3 головной секции."], "notes": [], "kind": "fault", "id": "f45"}, {"cat": "pd", "page": 59, "pages": [59], "title": "SF25 «ВМ» на головной секции, К.З. в проводе Э40", "steps": ["SF25 «ВМ» восстановить. Кнопку «Вспом. машины» на пульте НЕ ВКЛЮЧАТЬ.", "На блоке 7 всех секций заклинить KV19.", "При проезде нейтральных вставок отключать ГВ."], "notes": [], "kind": "fault", "id": "f46"}, {"cat": "pd", "page": 60, "pages": [60], "title": "SF25 «ВМ» на головной секции, К.З. в цепи КМ1–3 головной секции", "steps": ["На блоке 7 головной секции на KV19 изоляция в проводах Н025–Н239 (две штуки), KV45 заклинить.", "На блоке 8 головной секции заклинить КМ2 и КМ3.", "Для работы маслонасоса на блоке 8 головной секции отсоединить провод Н281 от «+» катушки КМ15 и поставить перемычку с Н296 («+» катушки КМ11).", "На пульте включить «Вспом. машины», затем запустить вентилятор 2 (работает постоянно), затем компрессор. МН запускается вместе с В1.", "На электровозах с №269 (2ЭС5К с №165) проверить давление в маслонасосе и на блоке 7 заклинить KV46."], "notes": [], "kind": "fault", "id": "f47"}, {"cat": "pd", "page": 61, "pages": [61], "title": "SF25 «ВМ» срабатывает на задних секциях, К.З. в цепи КМ1–3 задней секции", "steps": ["На блоке 7 неисправной секции на KV19 изоляция в Н025–Н239 (две штуки), KV45 заклинить.", "На блоке 8 неисправной секции заклинить КМ2 и КМ3.", "Для работы маслонасоса на блоке 8 неисправной секции отсоединить Н281 от «+» катушки КМ15 и поставить перемычку с Н296 («+» катушки КМ11).", "На пульте включить «Вспом. машины», затем вентилятор 2 (работает постоянно), затем компрессор. МН запускается вместе с В1.", "На электровозах с №269 (2ЭС5К с №165) проверить давление в маслонасосе и на блоке 7 заклинить KV46."], "notes": [], "kind": "fault", "id": "f48"}, {"cat": "pd", "page": 87, "pages": [87, 88], "title": "3ЭС5К с №680: изменённая схема вспомогательных машин", "steps": [], "notes": ["В схему введено реле KV25 в цепи пускового двигателя. Оно на 9-м блоке, имеет блок-контакт в проводах Н241–Н242 в цепи КМ1 (М10, пусковой двигатель).", "При запуске МВ или МК сначала получает питание KV25 по проводам Н271, Н272 или Н254 (через диоды U101, U102, U103) и замыкает блок-контакт в цепи КМ1, запуская ПД М10.", "Когда напряжение генераторной обмотки достигнет 300±50 В, переключаются контакты РКН KV01 панели А1: размыкается блок-контакт в цепи КМ2 и КМ3 (отключаются пусковые конденсаторы С107–С109), замыкается питание катушки KV45. KV45 разрешает запуск всех вспомогательных машин."], "kind": "info", "id": "f49"}, {"cat": "vent", "page": 62, "pages": [62], "title": "Нет запуска вентиляторов 1 и 2 на всех секциях", "steps": ["Проверить автомат SF26 «Вентилятор 1,2».", "На блоке 7 всех секций проверить KV45; не включилось — заклинить на всех секциях.", "На SA3 головной секции проверить контакты в проводах Н228–Э41 и Н229–Э42."], "notes": [], "kind": "fault", "id": "f50"}, {"cat": "vent", "page": 63, "pages": [63], "title": "Нет запуска вентилятора 1 на всех секциях", "steps": ["Если вентилятор 2 запускается — восстановить ТРТ кнопкой «Возврат реле».", "На SA5 головной секции перемычка с Э45 на Э41, вентилятор 1 запускать кнопкой «Возврат реле» (кнопку заклинить во включённом положении)."], "notes": ["Можно на SA5 головной секции поставить перемычку с Э41 на Э42 — тогда вентилятор 1 запускается вместе с вентилятором 2."], "kind": "fault", "id": "f51"}, {"cat": "vent", "page": 64, "pages": [64], "title": "Нет запуска вентилятора 1 на одной секции", "steps": ["На ЩПР неисправной секции проверить тумблер S11 «В1», восстановить ТРТ кнопкой «Возврат реле».", "На блоке 7 неисправной секции на KV19 перемычка с Н294 на Н298 — В1  SF26, включить «Вентилятор 2». Сработал — К.З. до ЩПР; не сработал — после ЩПР.", "К.З. до ЩПР: кнопку и тумблер S12 не включать. На блоке 7 всех секций на KV19 перемычка с Н298 на Н294 — В2 запускается вместе с В1.", "К.З. после ЩПР: посекционно включая S12 найти неисправную секцию. На ней S12 отключить, вентилятор и группу ТЭД не использовать.", "Если вентилятор и группа ТЭД нужны — на неисправной секции заклинить КМ12."], "notes": [], "kind": "fault", "id": "f56"}, {"cat": "vent", "page": 67, "pages": [67], "title": "Нет запуска маслонасоса на одной секции", "steps": ["На ЩПР неисправной секции проверить S17 «МН», восстановить ТРТ кнопкой «Возврат реле».", "На блоке 7 проверить отключение KV47; если включено — расклинить (клин между якорем и сердечником).", "Нет результата — на блоке 8 перемычка с Н250 («+» катушки КМ12) на Н281 («+» катушки КМ15), МН запускается вместе с МВ2."], "notes": ["На 3ЭС5К с №269 (2ЭС5К с №156) проверить давление масла и на блоке 7 неисправной секции заклинить KV46."], "kind": "fault", "id": "f57"}, {"cat": "vent", "page": 70, "pages": [70], "title": "При включении «Вентилятор 1 или 2» срабатывает SF25 «ВМ» на одной секции — К.З. в цепи маслонасоса", "steps": ["На ЩПР неисправной секции отключить тумблер S17 «МН».", "На блоке 8 неисправной секции заклинить КМ15.", "После включения ГВ сразу запустить ДП и МВ. Один из вентиляторов работает постоянно."], "notes": ["На 3ЭС5К с №269 (2ЭС5К с №156) проверить давление масла и на блоке 7 неисправной секции заклинить KV46."], "kind": "fault", "id": "f58"}, {"cat": "mk", "page": 71, "pages": [71], "title": "Нет запуска компрессоров на всех секциях", "steps": ["Проверить автомат SF27 «Компрессор».", "Запустить вентиляторы. Если не запускаются — на блоке 7 всех секций проверить KV45, не включилось — заклинить.", "На блоке 7 головной секции проверить KV48. Не включилось — нажать на якорь; компрессоры заработали — заклинить KV48 (контроль давления по манометру ГР).", "При нажатии на якорь KV48 компрессоры не заработали — на SA5 головной секции перемычка с Э45 на Э46, компрессорами управлять кнопкой «Возврат реле» (контроль по манометру ГР).", "Можно перейти на работу от регулятора давления SP6 задней секции."], "notes": [], "kind": "fault", "id": "f59"}, {"cat": "mk", "page": 72, "pages": [72], "title": "Нет запуска компрессоров на всех секциях — переход на SP6 задней секции", "steps": ["На пульте кнопку «Компрессор» выключить, на пневмоблоке головной секции перекрыть кран КН48.", "Для автоматической работы на блоке 7 задней секции перемычка с Н410 (КТ4) на Н251 (KV48), на пульте головной секции включить «Сигнализация»."], "notes": [], "kind": "fault", "id": "f60"}, {"cat": "mk", "page": 73, "pages": [73], "title": "Нет запуска компрессора на одной секции", "steps": ["На ЩПР неисправной секции проверить тумблер S14 «Компрессор».", "Восстановить ТРТ кнопкой «Возврат реле».", "Если неисправный компрессор не нужен — S14 отключить.", "Если нужен — на блоке 8 перемычка с Н293 («+» катушки блока ТРТ А34) на Н262 («+» катушки КМ14), компрессором управлять кнопкой «Возврат реле» (контроль по манометру ГР)."], "notes": [], "kind": "fault", "id": "f61"}, {"cat": "mk", "page": 74, "pages": [74], "title": "При включении «Компрессор» срабатывает SF27 — где К.З.", "steps": ["Определить, где К.З.: до или после ЩПР.", "На ЩПР всех секций отключить S14, восстановить SF27 и включить кнопку «Компрессор».", "SF27 сработал — К.З. до ЩПР; не сработал — после ЩПР."], "notes": [], "kind": "fault", "id": "f62"}, {"cat": "mk", "page": 75, "pages": [75], "title": "SF27 «Компрессор»: К.З. до ЩПР", "steps": ["SF27, кнопку «Компрессор» и тумблер S14 не включать.", "На блоке 7 всех секций перемычка с Э128 («+» катушки KV78) на Н256 (KV45), компрессорами управлять тумблером «Освещение тележек» (контроль по манометру ГР)."], "notes": ["Или на блоке 7 всех секций перемычка с Н410 (КТ4) на Н256 (KV45), компрессорами управлять тумблером «Сигнализация» (контроль по манометру ГР)."], "kind": "fault", "id": "f63"}, {"cat": "mk", "page": 76, "pages": [76], "title": "SF27 «Компрессор»: К.З. после ЩПР", "steps": ["Поочерёдно включая S14 на ЩПР, найти секцию, где срабатывает SF27.", "На неисправной секции S14 не включать, следовать до основного или оборотного депо без одного компрессора."], "notes": [], "kind": "fault", "id": "f64"}, {"cat": "msud", "page": 77, "pages": [77], "title": "Нет запуска МСУД — что проверить", "steps": ["На ЩПР всех секций автоматы SF45, SF46 «МСУД», SF86 «Цепи диагностики», SF87 «Цепи индикации», SF89 «Датчики скорости», SF91 «МПК1», SF92 «МПК2», SF93 «ЦМК».", "На пульте пом. машиниста — тумблеры «Блоки управления».", "На блоке 7 — включение KV21 и KV22.", "На блоке 8 — включение контактора КМ43.", "Если КМ43 включён — светодиоды на шкафу МСУД (горят два зелёных: «ЦМК» и «МПК1» или «МПК2»)."], "notes": [], "kind": "fault", "id": "f65"}, {"cat": "msud", "page": 78, "pages": [78, 79], "title": "Автоматы МСУД при приёмке; «замёрз» блок индикации", "steps": [], "notes": ["Все автоматы питания МСУД — в коридоре. Отмеченные на схеме красным должны быть обязательно включены.", "Зимой при низкой температуре в кабине блок индикации может не запуститься, мигает жёлтый светодиод напротив датчика температуры. Блок «замёрз», на работу локомотива это не влияет (работает и ручное, и авторегулирование). После прогрева блок запустится сам."], "kind": "info", "id": "f66"}, {"cat": "msud", "page": 80, "pages": [80], "title": "Нет запуска МСУД — действия", "steps": ["Не включились KV21 и KV22 на блоке 7 — заклинить.", "Не включился КМ43 на блоке 8 — на блоке 7 перемычка с Н410 (КТ4) на Н111 (KV22), включить «Сигнализация». Не включился — заклинить КМ43 на блоке 8."], "notes": [], "kind": "fault", "id": "f67"}, {"cat": "msud", "page": 81, "pages": [81], "title": "Нет запуска МСУД, KV22 и КМ43 включились", "steps": ["На шкафу МСУД проверить свечение светодиодов.", "Не горят — проверить блок питания (стабилизатор) МСУД А64: сверху горят два зелёных светодиода; проверить разъёмы. Если выпал разъём — на БИ в основном кадре «СМЕ МСУД».", "На бустерной секции блок питания МСУД А64 находится под SA6."], "notes": [], "kind": "fault", "id": "f68"}, {"cat": "msud", "page": 82, "pages": [82], "title": "Срабатывают автоматы SF86, SF93, SF89, SF91, SF92, SF45/SF46", "steps": [], "notes": ["SF86 «Цепи диагностики». Нагрузка будет. На мониторе «Сработали реле-автоматы» или мигает «К.З.». Нажать любую клавишу МСУД и следовать до пункта смены бригад.", "SF93 «ЦМК» на одной секции. В основном кадре мигает «МСУД». Нагрузка будет, контроля оборудования нет. Кнопками 6 и 2 найти секцию без контроля, восстановить автомат. Не восстанавливается — следовать до основного или оборотного депо.", "SF89 «Датчики скорости». Нагрузка будет, нет показаний скорости вращения ТЭД. Следовать до пункта смены бригад.", "SF91 «МПК1» на одной секции. На головной: «СМЕ, ТД, МСУД», «Нет связи в системе МСУД» — включить на пульте секции №1 МПК2. На ведомых: мигает «СМЕ МСУД» — переключиться на МПК2 на неисправной секции. После снятия «СИ» работать без ограничений до депо.", "SF92 «МПК2» на одной секции — то же, с переходом на МПК1.", "SF45 или SF46. Отключён SF45 (SF46 включён) на задних секциях — всё работает. Отключён SF46 (SF45 включён) на задних или головной — всё работает. Отключён SF45 (SF46 включён) на головной — не работает дисплей, не собирается тяга, в зонах регулирования отпадают все БВ."], "kind": "info", "id": "f69"}, {"cat": "msud", "page": 83, "pages": [83], "title": "SF87, обогрев МСУД, SF45 и «езда без МСУД»", "steps": [], "notes": ["SF87 «Цепи индикации» питает только блок индикации (монитор). Если монитор «завис» — не перезагружайте МСУД, а переключите SF87 на ЩПР (можно даже в тяге или рекуперации). Если SF87 срабатывает или монитор вышел из строя — следовать до депо, контролируя ток якоря ТЭД по амперметру. С №180 можно в задней кабине вывести БИ из фонового режима: убедиться, что мигает зелёный светодиод, нажать одновременно клавиши 1 и 5.", "SF90 «Обогрев МСУД» включают при температуре ниже нуля. Термостат включает подогрев ниже −35 °C. Если МСУД включить на сильно расхоложенном локомотиве (в шкафу ниже −35…−40 °C), он не запустится, пока не включён обогрев. Бывает, что с включённым подогревом МСУД работает нестабильно (сбои, ложные срабатывания, потери связи) — отключить подогрев и перезапустить МСУД. Электроника рассчитана до −55 °C.", "SF45 срабатывает на головной секции при включении кн. «МСУД». А) На пульте пом. машиниста отключить все тумблеры «Блоки управления». Б) Тумблер МПК всех секций — в «МПК1». В) Восстановить SF45 и на блоке 8 головной секции принудительно включить КМ43. Дальше по ситуации — см. схему на странице.", "SF45 срабатывает при включении КМ43: на КМ43 головной секции изоляция в Н652–А7 (Н045–Н088 на бустерной), КМ43 заклинить; SF93 и SF92 головной секции отключить; на блоке 3 перемычка с Н33 (KV17) на А1 или А2 (KV63).", "«Езда без МСУД» (SF45 или неисправен стабилизатор А64). А) На ЩПР выключить SF45, SF46, SF86, SF87, SF89, SF91, SF92, SF93. Б) В БСА1 на блоке 3 перемычка с Н230 (SA3) на А1 (если был МПК2) или А2 (если был МПК1) реле KV63; на бустерной — на блоке 7 с Н410 (КТ4). В) Перейти на ручное регулирование, включить «Сигнализация». Г) Вести поезд по току якоря ТЭД. Лучше проконсультироваться со специалистом."], "kind": "info", "id": "f70"}, {"cat": "msud", "page": 84, "pages": [84], "title": "МСУД работает, на БИ горит «СИ» на одной секции, нет нагрузки на ТЭД", "steps": ["КМЭ поставить в «0» и снова собрать тягу. В задней кабине КМЭ — в «0», кнопки «МСУД» и «Цепи управления» — выключены.", "При индикации «СИ-САУТ» или «СИ-КЛУБ» — перезапустить САУТ и КЛУБ.", "Перейти на другой МПК, проверить автоматы на ЩПР.", "На блоке 8 проверить целостность предохранителя F17.", "Не помогло — выключить ГВ, опустить ТКП и выключить АКБ на 1 минуту. Затем снова собрать тягу."], "notes": [], "kind": "fault", "id": "f71"}, {"cat": "msud", "page": 85, "pages": [85], "title": "При постановке КМЭ в «П» перегорает F17 на блоке 8", "steps": ["Определить, в каком блоке управления ВИП К.З.: А73 или А74.", "На блоке 8 восстановить F17.", "Запустить вентилятор 2 (вентилятор 1 не запускать), КМЭ в «П».", "F17 не перегорает — К.З. в А73. На ЩПР неисправной секции выключить S11 «Вентилятор 1», следовать на оставшихся ТЭД.", "F17 перегорает — К.З. в А74. Выключить S12 «Вентилятор 2», восстановить F17, следовать на оставшихся ТЭД."], "notes": [], "kind": "fault", "id": "f72"}, {"cat": "msud", "page": 86, "pages": [86], "title": "В авторегулировании при задании 100–150 А рывок (бросок тока), нет тока якоря одной группы ТЭД на БИ", "steps": ["На блоках питания датчиков тока LEM А71 и А72 проверить свечение светодиодов (на бустерной секции один блок — А72).", "Не горит один светодиод — сгорел предохранитель, заменить."], "notes": ["Можно перевести тумблер S3 в «Ручное регулирование» и следовать дальше; на БИ не будет тока якоря одной группы ТЭД."], "kind": "fault", "id": "f73"}, {"cat": "pnevm", "page": 16, "pages": [16], "title": "Подъём ТКП и включение ГВ от вспомогательного компрессора", "steps": ["На пневмоблоке перекрыть краны КН23 и КН25. В коридоре перекрыть КН44.", "На блоке 7 всех секций заклинить KV44.", "Включить тумблер S25 «Компрессор токоприёмника» или кнопку S10 на пневмоблоке.", "Когда давление в резервуаре ГВ дойдёт до 5,6–5,8 атм (воздушный ГВ) или 4,5–4,8 атм (вакуумный), замкнётся контакт АМД — с пульта поднять ТКП и включить ГВ.", "Запустить компрессоры; при давлении в ГР 6–7 атм открыть КН23. После откачки перемычку убрать."], "notes": ["Пом. машиниста стоит у пневмоблока и следит за давлением по МН6; при падении нажимает S10 и подкачивает до 5 атм.", "Если в запасном резервуаре РС4 больше 5 атм: перекрыть КН23, на блоке 7 всех секций заклинить KV44, в компрессорном отсеке открыть КН25, поднять ТКП, включить ГВ, запустить компрессоры; при 6–7 атм в ГР открыть КН23."], "kind": "fault", "id": "f74"}, {"cat": "pnevm", "page": 16, "pages": [16], "title": "Расхолаживание электровоза", "steps": [], "notes": ["Вариант 1 (заводской). А) Отключить все кнопки и тумблеры, заблокировать пульты, отключить приборы безопасности и радиостанцию, отключить SA3 на А25 всех секций. В обеих кабинах перекрыть краны ЭПК КН5 и КН49. Б) Отключить блокировку усл. №367, ключ вынуть. Перекрыть КН41 к клапану ТКП на всех секциях. В) На пневмоблоке открыть КН55 и перекрыть КН23 на всех секциях; перекрыть КН1 на ГР. Г) Открыть кран «холодного резерва» КН24 на всех секциях.", "Вариант 2 (неправильный, но работает). А) То же, что в варианте 1, пункт А. Б) В кабине с включённой блокировкой 367: КК1 — в «двойную тягу», кран 395 — в 5-е положение, 215 — в поездное. Перекрыть КН41 на всех секциях. В) Перекрыть КН1 на секциях, где блокировка 367 отключена. Г) Открыть КН24 и перекрыть КН23 на всех секциях. Д) Нет отпуска тормозов — открыть КН55.", "Следование в холодном состоянии с краном усл. №130: перекрыть кран двойной тяги справа под кузовом. Во всех секциях перекрыть КН5 (от ТМ) и КН49 (от ПМ) к ЭПК, КН23, КРрШ3 к клапану замещения, КН1 к ГР. На панели А16 в конце секции открыть КРрШ4 (холодный резерв). Перекрыть КН41 на всех секциях."], "kind": "info", "id": "f75"}, {"cat": "pnevm", "page": 17, "pages": [17], "title": "Кран 130: следование двойной тягой", "steps": ["Под исполнительным блоком крана машиниста перекрыть кран КН7."], "notes": ["КН6 — кран питательной магистрали, КН7 — кран тормозной магистрали.", "Бывает, что при смене кабины дует воздух по исполнительной части в нерабочей кабине. Чтобы этого избежать, в нерабочей кабине под исполнительным блоком перекрыть КН6 и КН7."], "kind": "fault", "id": "f76"}, {"cat": "pnevm", "page": 18, "pages": [18], "title": "Кран 130: переход на кран резервного управления", "steps": ["Ручку крана машиниста усл. №130 перевести в 6-е положение или нажать клапан экстренной остановки, разрядить ТМ, затем перевести в 4-е положение.", "Выключить автомат SF47 «Кран машиниста» на блоке автоматов у пом. машиниста и два тумблера на ИП-ЛЭ-50 на обеих секциях.", "На исполнительном блоке крана №130 перевести рукоятку переключателя режимов на работу через кран резервного управления.", "Рукоятку крана резервного управления перевести в положение отпуска (поездное), зарядить тормозную магистраль."], "notes": [], "kind": "fault", "id": "f77"}, {"cat": "pnevm", "page": 11, "pages": [11, 12, 13], "title": "Краны и датчики пневмоблока", "steps": [], "notes": ["КН16 — общий кран ЦУ, разобщает БСА1 и БСА2 от магистрали ЦУ. КН54 — сообщает магистраль ЦУ с атмосферой (обдув).", "SP2 — при снижении давления в ТМ до 0,27–0,29 МПа размыкает цепь клапана Y3 (срабатывает автотормоз). SP4 — разбирает тягу при 0,27–0,29 МПа в ТМ (отключает KV15); вкл. 0,45–0,48 МПа.", "SP7 — отключает компрессор ТКП при 0,76 МПа. МН6 — манометр цепей управления. SP3 — при 0,13–0,15 МПа в ТЦ разбирает рекуперацию (отключает К1). SP8 — при служебном торможении, ТЦ 0,28–0,32 МПа и скорости более 10 км/ч включает песочницы Y11–Y14.", "КР6 — при срыве рекуперации наполняет ТЦ до 0,18–0,2 МПа. КР5 — при экстренном торможении или разрыве межсекционного соединения наполняет ТЦ до 0,2–0,25 МПа. КР4 — редуктор ЦУ (0,5 МПа).", "Y3 — клапан отпуска тормозов локомотива. Y4 — наполняет ТЦ при срыве рекуперации. МН7 — манометр резервуаров РС5, РС6. МН8 (бустерная) — манометр ТЦ1.", "КН23 — разобщает ПМ от магистрали ЦУ (используется с компрессором ТКП). КН35 — исключает наполнение ТЦ при срыве рекуперации. КН42 — при экстренном торможении или разрыве. КН7/КН8 — разобщают ПМ от РД1/РД2. КН33/КН34 — РД1/РД2 от магистрали вспомогательного тормоза.", "КН60/КН61 — отключают ТЦ1/ТЦ2. КН48 — отключает SP6. КН24 — кран «холодного» резерва. КН55 — продувка магистрали вспомогательного тормоза. SP6 — регулятор давления компрессора. РД1, РД2 — реле давления ТЦ1, ТЦ2. Y26 — принудительная остановка по команде ДНЦ через ЭПК.", "С моторно-осевыми подшипниками качения: Y31 повышает давление в ТЦ через КР7 до 0,5–0,55 МПа при экст <script>
(function(){
const cats = DATA.cats, items = DATA.items;
const catName = Object.fromEntries(cats);
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs = new Set(LS.get('ermak.favs',[]));
let done = LS.get('ermak.done',{});
let cat = 'all';

// Latin lookalikes -> Cyrillic so "kv44" finds "KV44", "km13" finds "КМ13"
const LAT = {a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[abcehkmoptxy]/g,c=>LAT[c]).replace(/[«»"“”]/g,'').replace(/\s+/g,' ');
items.forEach(it=>{it._hay = norm([it.title, ...it.steps, ...it.notes, catName[it.cat]].join(' '))});

const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CODE = /(?<![\p{L}\d])((?:KV|КV|KT|КТ|KM|КМ|KA|КА|KK|КК|КН|KH|КР|SF|SA|SQ|SP|QS|QF|QT|QP|РД|РС|PC|МН|MH|МВ|ТД|U|Y|F|Н|H|Э|Л|S|А|A|Т)\s?\d{1,3}(?:[–-]\d)?)(?![\p{L}\d])/gu;
function fmt(s, terms){
  let h = esc(s).replace(CODE,'<span class="code">$1</span>');
  return terms && terms.length ? mark(h, terms) : h;
}
function mark(html, terms){
  // highlight only outside tags
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(m,a,txt)=>{
    let out = txt, nt = norm(txt);
    const ranges=[];
    terms.forEach(t=>{let i=0;while(t&&(i=nt.indexOf(t,i))>-1){ranges.push([i,i+t.length]);i+=t.length}});
    if(!ranges.length) return m;
    ranges.sort((x,y)=>x[0]-y[0]);
    let res='',p=0;
    for(const [s,e] of ranges){ if(s<p) continue; res+=out.slice(p,s)+'<mark class="hit">'+out.slice(s,e)+'</mark>'; p=e; }
    return a+res+out.slice(p);
  });
}

// chips
const chipsEl = document.getElementById('chips');
function renderChips(){
  const counts = {}; items.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  const list = [['all','Все',items.length],['fav','★ Избранное',favs.size], ...cats.map(([k,n])=>[k,n.replace(/ \(.+\)/,''),counts[k]||0])];
  chipsEl.innerHTML = list.map(([k,n,c])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${esc(n)}<span class="n">${c}</span></button>`).join('');
}
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; cat=b.dataset.c; renderChips(); renderList(); window.scrollTo({top:0})});

// list
const mainEl = document.getElementById('main'), qEl = document.getElementById('q'), clr = document.getElementById('clr');
function renderList(){
  const q = norm(qEl.value.trim());
  clr.hidden = !q;
  const terms = q ? q.split(' ').filter(Boolean) : [];
  let res = items.filter(it=>(cat==='all'||(cat==='fav'?favs.has(it.id):it.cat===cat)) && terms.every(t=>it._hay.includes(t)));
  if(!res.length){
    mainEl.innerHTML = `<p class="empty">${cat==='fav'&&!q?'Здесь будут неисправности, отмеченные звёздочкой. Откройте любую и нажмите ☆.':'Ничего не найдено. Попробуйте короче: номер аппарата (KV44, SF27) или одно слово из симптома.'}</p>`+footer();
    return;
  }
  const byCat = {}; res.forEach(it=>(byCat[it.cat]=byCat[it.cat]||[]).push(it));
  let html='';
  cats.forEach(([k,n])=>{ if(!byCat[k]) return;
    html += `<section class="group"><h2>${esc(n)}</h2><div class="list">`+byCat[k].map(it=>{
      const n = it.steps.length;
      return `<button class="item" data-id="${it.id}"><span class="t">${mark(esc(it.title),terms)}</span>${favs.has(it.id)?'<span class="star" aria-label="В избранном">★</span>':'<span></span>'}<span class="meta">${it.kind==='info'?'<span class="tag info">Справка</span>':`<span class="tag">${n} ${plural(n,'шаг','шага','шагов')}</span>`}${it.photo?'<span class="tag photo">Фото</span>':''}${it.pages.length?`<span>стр. ${it.pages.join(', ')}</span>`:''}</span></button>`;
    }).join('')+`</div></section>`;
  });
  mainEl.innerHTML = html + footer();
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function footer(){return `<footer class="src"><span>По материалам сборника С.А. Гужвы (ТЧЭ-11, 2019).</span><span>Это памятка для самоподготовки. В пути действуйте по действующим инструкциям и указаниям ДНЦ.</span></footer>`}
qEl.addEventListener('input',renderList);
clr.addEventListener('click',()=>{qEl.value='';renderList();qEl.focus()});
let pushed=false;
mainEl.addEventListener('click',e=>{const b=e.target.closest('.item'); if(b){pushed=true; location.hash=b.dataset.id}});

// detail
const det = document.getElementById('detail');
let cur = null;
function openDetail(id){
  const it = items.find(x=>x.id===id); if(!it){closeDetail();return}
  cur = it;
  const terms = norm(qEl.value.trim()).split(' ').filter(Boolean);
  const d = done[id]||[];
  const sib = items.filter(x=>x.cat===it.cat), k = sib.indexOf(it), prev=sib[k-1], next=sib[k+1];
  det.innerHTML = `
  <div class="dbar"><div class="wrap">
    <button class="iconbtn" id="back" aria-label="Назад к списку">← <span>Список</span></button>
    <span class="where">${esc(catName[it.cat])}</span>
    <button class="iconbtn" id="fav" aria-pressed="${favs.has(id)}" aria-label="Избранное"><span class="${favs.has(id)?'star-on':''}">${favs.has(id)?'★':'☆'}</span></button>
  </div></div>
  <div class="wrap dbody">
    <div style="display:grid;gap:8px">
      <h2 id="dtitle">${mark(esc(it.title),terms)}</h2>
      <div class="dmeta">${it.kind==='info'?'<span class="tag info">Справка</span>':''}${it.photo?'<span class="tag photo">Фото с локомотива</span>':''}${it.pages.length?`<span>Страница сборника: ${it.pages.join(', ')}</span>`:''}</div>${it.rel?it.rel.map(r=>{const x=items.find(y=>y.id===r);return x?`<button class="rel" data-rel="${r}">${x.photo?'Фото-инструкция: ':'См. также: '}${esc(x.title)} →</button>`:''}).join(''):''}
    </div>
    ${it.steps.length?`<div style="display:grid;gap:10px"><h3 class="sec-h">Порядок действий</h3><p class="hint">Нажмите на шаг, чтобы отметить выполненным.</p><ol class="steps">${it.steps.map((s,i)=>`<li class="step${d.includes(i)?' done':''}" data-i="${i}" tabindex="0" role="checkbox" aria-checked="${d.includes(i)}"><span class="num" aria-hidden="true"></span><span class="txt">${fmt(s,terms)}${it.sp&&it.sp[i]?`<span class="sph">${it.sp[i].map(k=>`<img class="zoomable" data-k="${k}" src="${IMG[k]}" alt="Фото к шагу ${i+1}" loading="lazy">`).join('')}</span>`:''}</span></li>`).join('')}</ol>${d.length?'<button class="iconbtn" id="reset" style="color:var(--ink-2);justify-self:start">Сбросить отметки</button>':''}</div>`:''}
    ${it.notes.length?`<div class="notes"><h3 class="sec-h">${it.steps.length?'Дополнительно':'Описание'}</h3>${it.notes.map(n=>`<div class="note">${fmt(n,terms).replace(/([.;:])\s+([А-ЖЗ]\))/g,'$1<br>$2')}</div>`).join('')}</div>`:''}
    ${it.pages.length?`<div class="figs"><h3 class="sec-h">Схема</h3>`:''}${it.pages.map(p=>IMG[p]?`<figure class="fig" data-p="${p}"><img alt="Схема, страница ${p}" src="${IMG[p]}" loading="lazy" decoding="async"><figcaption><span>Стр. ${p}</span><span>Нажмите, чтобы увеличить</span></figcaption></figure>`:'').join('')}${it.pages.length?'</div>':''}
    <div class="nav2">
      <button id="prev" ${prev?'':'disabled'}><small>← Предыдущая</small><span>${prev?esc(prev.title):''}</span></button>
      <button id="next" class="nx" ${next?'':'disabled'}><small>Следующая →</small><span>${next?esc(next.title):''}</span></button>
    </div>
  </div>`;
  det.hidden = false; det.scrollTop = 0; document.body.style.overflow='hidden';
  det.querySelector('#back').onclick = ()=>{ if(pushed){pushed=false;history.back()} else location.hash=''; };
  det.querySelector('#fav').onclick = ()=>{favs.has(id)?favs.delete(id):favs.add(id); LS.set('ermak.favs',[...favs]); openDetail(id); renderChips(); renderList()};
  if(prev) det.querySelector('#prev').onclick=()=>location.replace('#'+prev.id);
  if(next) det.querySelector('#next').onclick=()=>location.replace('#'+next.id);
  const r = det.querySelector('#reset'); if(r) r.onclick=()=>{delete done[id]; LS.set('ermak.done',done); openDetail(id)};
  det.querySelectorAll('.step').forEach(el=>{
    const tog=()=>{ if(getSelection().toString()) return; const i=+el.dataset.i; let a=done[id]||[]; a=a.includes(i)?a.filter(x=>x!==i):[...a,i]; done[id]=a; LS.set('ermak.done',done);
      el.classList.toggle('done'); el.setAttribute('aria-checked', a.includes(i)); if(!det.querySelector('#reset')&&a.length) openDetail(id) };
    el.addEventListener('click',tog); el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}});
  });
  det.querySelectorAll('.fig').forEach(f=>f.onclick=()=>openViewer(f.dataset.p));
  det.querySelectorAll('.zoomable').forEach(f=>f.onclick=e=>{e.stopPropagation();openViewer(f.dataset.k)});
  det.querySelectorAll('.rel').forEach(b=>b.onclick=()=>location.replace('#'+b.dataset.rel));
}
function closeDetail(){det.hidden=true;det.innerHTML='';cur=null;document.body.style.overflow=''}

// viewer
const vw = document.getElementById('viewer');
let zoom=1, vimg=null, pan=null;
function openViewer(p){
  vw.innerHTML = `<div class="vbar"><button class="iconbtn" id="vclose" aria-label="Закрыть">✕</button><span class="sp"></span><button class="iconbtn" id="zout" aria-label="Уменьшить">−</button><span class="z" id="zl"></span><button class="iconbtn" id="zin" aria-label="Увеличить">+</button><button class="iconbtn" id="zfit">Вписать</button></div><div class="pan" id="pan"><img src="${IMG[p]}" alt="Увеличенное изображение"></div>`;
  vw.hidden=false; pan=vw.querySelector('#pan'); vimg=pan.querySelector('img');
  const fit=()=>{zoom=1;apply()};
  vimg.onload=()=>{ zoom = innerWidth<700 ? 2 : 1; apply(); pan.scrollLeft=0 };
  if(vimg.complete) vimg.onload();
  vw.querySelector('#vclose').onclick=closeViewer;
  vw.querySelector('#zin').onclick=()=>setZoom(zoom*1.5);
  vw.querySelector('#zout').onclick=()=>setZoom(zoom/1.5);
  vw.querySelector('#zfit').onclick=fit;
  // drag to pan with mouse
  let drag=null;
  pan.onpointerdown=e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,y:e.clientY,l:pan.scrollLeft,t:pan.scrollTop};pan.style.cursor='grabbing'};
  window.onpointermove=e=>{if(!drag)return;pan.scrollLeft=drag.l-(e.clientX-drag.x);pan.scrollTop=drag.t-(e.clientY-drag.y)};
  window.onpointerup=()=>{drag=null;if(pan)pan.style.cursor=''};
  pan.ondblclick=()=>setZoom(zoom>=2?1:2.5);
}
function setZoom(z){
  const cx=(pan.scrollLeft+pan.clientWidth/2)/vimg.width, cy=(pan.scrollTop+pan.clientHeight/2)/vimg.height;
  zoom=Math.min(5,Math.max(1,z)); apply();
  pan.scrollLeft=cx*vimg.width-pan.clientWidth/2; pan.scrollTop=cy*vimg.height-pan.clientHeight/2;
}
function apply(){ vimg.style.width=(pan.clientWidth*zoom)+'px'; vw.querySelector('#zl').textContent=Math.round(zoom*100)+'%' }
function closeViewer(){vw.hidden=true;vw.innerHTML='';window.onpointermove=window.onpointerup=null}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!vw.hidden) closeViewer(); else if(!det.hidden) location.hash=''; } });
function route(){ const h=location.hash.slice(1); if(!vw.hidden) closeViewer(); if(h&&/^f\d+$/.test(h)) openDetail(h); else closeDetail(); }
addEventListener('hashchange',route);

renderChips(); renderList(); route();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(function(){
  const btn=document.getElementById('install'); let ev=null;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(!standalone)btn.hidden=false});
  btn.onclick=async()=>{ if(ev){ev.prompt();await ev.userChoice;ev=null;btn.hidden=true} else { tip() } };
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone){btn.hidden=false}
  function tip(){ if(document.querySelector('.ios-tip'))return; const m=document.getElementById('main'); const t=document.createElement('div'); t.className='ios-tip';
    t.innerHTML='<b>Как установить на iPhone:</b> откройте эту страницу в Safari, нажмите «Поделиться» (квадрат со стрелкой) и выберите «На экран Домой». Иконка появится на рабочем столе, приложение будет работать без интернета.'; m.prepend(t) }
})();
</script></body></html>
