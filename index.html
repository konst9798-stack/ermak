ин прием темпом служебного торможения для получения полного давления в тормозных цилиндрах (тормозных блоках) вагонов поезда с целью значительного снижения скорости поезда или его остановки на более коротком расстоянии.", "b": false, "n": "2.62"}, {"t": "2.63 торможение экстренное: Торможение, применяемое в случаях, требующих немедленной остановки поезда, путем применения максимальной тормозной силы.", "b": false, "n": "2.63"}, {"t": "2.64 торможение ступенчатое вспомогательным тормозом локомотива и электропневматическим тормозом поезда: Торможение, достигаемое повышением давления в тормозных цилиндрах локомотива и поезда или вагона моторвагонного поезда (МВПС) через определённые интервалы времени независимо от давления в тормозной магистрали.", "b": false, "n": "2.64"}, {"t": "2.65 торможение электрическое: Процесс торможения, в котором сила торможения создается при преобразовании кинетической энергии поезда в электрическую энергию.", "b": false, "n": "2.65"}, {"t": "2.66 цилиндр тормозной: Техническое устройство, преобразующее давление сжатого воздуха (пневматика) или жидкости (гидравлика) в силу.", "b": false, "n": "2.66"}, {"t": "2.67 устройство резервного пневматического управления изменением давления в тормозной магистрали (кран резервного управления): Техническое устройство, позволяющее непосредственно управлять изменением давления в тормозной магистрали независимо от передачи команд управления от ручки крана машиниста к исполнительным устройствам.", "b": false, "n": "2.67"}]}, {"id": "tb3_1", "cat": "tm_loc", "page": 0, "pages": [], "title": "3.1 Перечень работ, выполняемых при приемке, сдаче и обслуживании локомотива при выдаче из депо и в пути следования", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 12–18", "paras": [{"t": "3.1.1 Техническое состояние тормозного оборудования локомотивов проверяется после технического обслуживания и плановых видах ремонта, перед выдачей из цеха ремонтной организации, после отстоя локомотива без бригады, при смене локомотивных бригад, а также в пути следования.", "b": false, "n": "3.1.1"}, {"t": "Работы по проверке и регулировке тормозного оборудования локомотива при техническом обслуживании (кроме ТО-1) и плановых видах ремонта выполняет ответственный работник, назначенный приказом руководителя предприятия, имеющего право на осуществление данного вида деятельности. Результаты проверки отражаются в соответствующих учетных формах технической документации для каждого вида работ с подписью ответственного работника.", "b": false, "n": ""}, {"t": "При оборудовании локомотива системой диагностики тормозного оборудования с функцией сохранения измеренных параметров приемка локомотива после плановых видов ремонта или технического обслуживания (кроме ТО-1) должна осуществляться с применением данной системы.", "b": false, "n": ""}, {"t": "3.1.2 Проверка технического состояния тормозного оборудования локомотива после плановых видов ремонта или технического обслуживания (кроме ТО-1) проводится специалистами, указанными в техникораспорядительных документах владельца железнодорожного подвижного состава.", "b": false, "n": "3.1.2"}, {"t": "Результаты проверки отражаются в соответствующих учетных формах технической документации для каждого вида работ с подписью ответственного работника и регистрацией на носителе информации.", "b": false, "n": ""}, {"t": "В специально отведенном для этой цели месте необходимо удалить конденсат из компрессорной установки, масловлагоотделителей, главных и вспомогательных резервуаров, питательной и тормозной магистралей и выполнить следующие проверки:", "b": false, "n": ""}, {"t": "- уровня масла компрессорной установки, который не должен выходить за пределы контрольных рисок;", "b": false, "n": ""}, {"t": "- правильности положений ручек разобщительных кранов воздухопроводах пневматической системы и на модулях тормозного оборудования;", "b": false, "n": ""}, {"t": "- наличие пломб;", "b": false, "n": ""}, {"t": "- производительность компрессорной установки;", "b": false, "n": ""}, {"t": "- состояния тормозной рычажной передачи, ее предохранительных устройств,", "b": false, "n": ""}, {"t": "- выходов штоков тормозных цилиндров,", "b": false, "n": ""}, {"t": "- толщины тормозных колодок (тормозных накладок) и их расположение на поверхности катания колес (тормозных дисков),", "b": false, "n": ""}, {"t": "- отсутствия недопустимого снижения давления в тормозных цилиндрах;", "b": false, "n": ""}, {"t": "- плотность тормозной и питательной сетей.", "b": false, "n": ""}, {"t": "Из обеих кабин управления для каждого типа подвижного состава необходимо проверить:", "b": false, "n": ""}, {"t": "- работу стояночного (ручного) тормоза;", "b": false, "n": ""}, {"t": "- пределы давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении;", "b": false, "n": ""}, {"t": "- темпа ликвидации сверхзарядного давления краном машиниста;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара крана машиниста;", "b": false, "n": ""}, {"t": "- работу крана машиниста в положении «Перекрыша с питанием»;", "b": false, "n": ""}, {"t": "- работу крана машиниста в положении «Перекрыша без питания»;", "b": false, "n": ""}, {"t": "- работу вспомогательного тормоза на максимальное давление в тормозных цилиндрах (тормозных блоках) при нахождении его ручки в крайнем тормозном положении;", "b": false, "n": ""}, {"t": "- темп экстренной разрядки через кран машиниста;", "b": false, "n": ""}, {"t": "- проходимость воздуха через блокировочное устройство;", "b": false, "n": ""}, {"t": "- проходимость воздуха через кран машиниста;", "b": false, "n": ""}, {"t": "- действие ЭПК на срабатывание с разрядкой тормозной магистрали;", "b": false, "n": ""}, {"t": "- работу системы скоростного регулирования (при наличии);", "b": false, "n": ""}, {"t": "- работу противоюзного устройства (при наличии).", "b": false, "n": ""}, {"t": "Дополнительно должны быть проверены при искусственно созданной утечке из тормозной магистрали локомотива через отверстие диаметром 5 мм:", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара;", "b": false, "n": ""}, {"t": "- время ликвидации сверхзарядного давления;", "b": false, "n": ""}, {"t": "- работа крана машиниста в положении «Перекрыша без питания»;", "b": false, "n": ""}, {"t": "- работа крана машиниста при положении «Поездное»;", "b": false, "n": ""}, {"t": "На локомотивах грузового типа дополнительно проверить:", "b": false, "n": ""}, {"t": "- работу воздухораспределителей при ступени торможения;", "b": false, "n": ""}, {"t": "- работу датчика контроля состояния тормозной магистрали.", "b": false, "n": ""}, {"t": "На локомотивах пассажирского типа дополнительно проверить:", "b": false, "n": ""}, {"t": "- работу воздухораспределителей при ступени торможения;", "b": false, "n": ""}, {"t": "- напряжение источника питания электропневматического тормоза при питании от аккумуляторных батарей (опущенном токоприемнике электровоза или заглушенном дизеле тепловоза);", "b": false, "n": ""}, {"t": "- действие электропневматического тормоза на возможность ступенчатого торможения до полного наполнения тормозных цилиндров (тормозных блоков) и последующего ступенчатого отпуска до полного выпуска воздуха из тормозных цилиндров (тормозных блоков);", "b": false, "n": ""}, {"t": "- работу световой индикации работы электропневматического тормоза;", "b": false, "n": ""}, {"t": "- возможность дублированного питания.", "b": false, "n": ""}, {"t": "На локомотивах при наличии устройства резервного пневматического управления в каждой кабине дополнительно необходимо проверить:", "b": false, "n": ""}, {"t": "- регулировку поддержания установленной величины зарядного давления в уравнительном резервуаре и тормозной магистрали в отпускном (поездном) положении рукоятки устройства резервного пневматического управления;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара после перевода рукоятки устройства резервного пневматического управления из отпускного положения в положение, обеспечивающем поддержание заданного давления в тормозной магистрали после торможения;", "b": false, "n": ""}, {"t": "- работу воздухораспределителей на торможение и отпуск устройством резервного пневматического управления;", "b": false, "n": ""}, {"t": "- работу клапанов аварийно-экстренного торможения.", "b": false, "n": ""}, {"t": "3.1.3 Проверка технического состояния тормозного оборудования локомотива после отстоя локомотива без бригады производит локомотивная бригада.", "b": false, "n": "3.1.3"}, {"t": "Приемка локомотивной бригадой локомотива, оборудованного системой диагностики тормозного оборудования с функцией сохранения измеренных параметров, после плановых видов ремонта или технического обслуживания (кроме ТО-1) должна производиться с использованием результатов проверки данной системы.", "b": false, "n": ""}, {"t": "При приемке локомотива после отстоя локомотива без бригады принимающая локомотивная бригада в определенном месте должна удалить конденсат из компрессорной установки, масловлагоотделителей, главных и вспомогательных резервуаров, питательной и тормозной магистралей и выполнить следующие проверки:", "b": false, "n": ""}, {"t": "- правильности положений ручек разобщительных кранов воздухопроводах пневматической системы и на модулях тормозного оборудования;", "b": false, "n": ""}, {"t": "- наличие пломб;", "b": false, "n": ""}, {"t": "- уровня масла компрессорной установки, который не должен выходить за пределы контрольных рисок (при наличии технической возможности);", "b": false, "n": ""}, {"t": "- состояния тормозной рычажной передачи, ее предохранительных устройств;", "b": false, "n": ""}, {"t": "- выхода штоков тормозных цилиндров;", "b": false, "n": ""}, {"t": "- толщины тормозных колодок (тормозных накладок) и их расположение на поверхности катания колес (тормозных дисков).", "b": false, "n": ""}, {"t": "- плотности тормозной и питательной сети;", "b": false, "n": ""}, {"t": "- отсутствия недопустимого снижения давления в тормозных цилиндрах;", "b": false, "n": ""}, {"t": "Из обеих кабин управления для каждого типа подвижного состава необходимо проверить:", "b": false, "n": ""}, {"t": "- пределы давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении;", "b": false, "n": ""}, {"t": "- работу стояночного (ручного) тормоза;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара крана машиниста;", "b": false, "n": ""}, {"t": "- темп ликвидации сверхзарядного давления краном машиниста;", "b": false, "n": ""}, {"t": "- работу крана машиниста в положении «Перекрыша с питанием»;", "b": false, "n": ""}, {"t": "- работу крана машиниста в положении «Перекрыша без питания»;", "b": false, "n": ""}, {"t": "- работу вспомогательного тормоза на максимальное давление в тормозных цилиндрах (тормозных блоках) при нахождении ручки в крайнем тормозном положении;", "b": false, "n": ""}, {"t": "- темп экстренной разрядки через кран машиниста;", "b": false, "n": ""}, {"t": "- проходимость воздуха через блокировочное устройство;", "b": false, "n": ""}, {"t": "- проходимость воздуха через кран машиниста;", "b": false, "n": ""}, {"t": "- работу клапанов аварийно-экстренного торможения.", "b": false, "n": ""}, {"t": "На локомотивах грузового типа дополнительно из обеих кабин управления проверить:", "b": false, "n": ""}, {"t": "- работу воздухораспределителей при ступени торможения (без пяти минутной выдержки);", "b": false, "n": ""}, {"t": "- работу датчика контроля состояния тормозной магистрали.", "b": false, "n": ""}, {"t": "На локомотивах пассажирского типа дополнительно проверить:", "b": false, "n": ""}, {"t": "- работу воздухораспределителей при ступени торможения (без пятиминутной выдержки);", "b": false, "n": ""}, {"t": "- напряжение источника питания электропневматического тормоза;", "b": false, "n": ""}, {"t": "- действие электропневматического тормоза на возможность ступенчатого торможения до полного наполнения тормозных цилиндров (тормозных блоков) и последующего ступенчатого отпуска до полного выпуска воздуха из тормозных цилиндров (тормозных блоков);", "b": false, "n": ""}, {"t": "- работу световой индикации работы электропневматического тормоза.", "b": false, "n": ""}, {"t": "На локомотивах при наличии устройства резервного пневматического управления в каждой кабине дополнительно необходимо проверить:", "b": false, "n": ""}, {"t": "- регулировку поддержания установленной величины зарядного давления в уравнительном резервуаре и тормозной магистрали в отпускном (поездном) положении ручки устройства резервного пневматического управления (при наличии);", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара после перевода рукоятки устройства резервного пневматического управления (при наличии) из отпускного положения в положение, обеспечивающем поддержание заданного давления в тормозной магистрали после торможения;", "b": false, "n": ""}, {"t": "- работу воздухораспределителей на торможение и отпуск устройством резервного пневматического управления.", "b": false, "n": ""}, {"t": "Конкретный порядок проведения проверки технического состояния тормозного оборудования локомотива после отстоя локомотива без бригады должен быть указан в технико-распорядительном документе владельца подвижного состава.", "b": false, "n": ""}, {"t": "3.1.4 При смене локомотивных бригад принимающая бригада обязана выполнить проверки:", "b": false, "n": "3.1.4"}, {"t": "- пределов давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении;", "b": false, "n": ""}, {"t": "- состояния тормозной рычажной передачи, ее предохранительных устройств;", "b": false, "n": ""}, {"t": "- положение режимных переключателей воздухораспределителей;", "b": false, "n": ""}, {"t": "- выхода штоков тормозных цилиндров;", "b": false, "n": ""}, {"t": "- толщину тормозных колодок (тормозных накладок);", "b": false, "n": ""}, {"t": "- правильность регулирования крана машиниста на поддержание зарядного давления в тормозной магистрали при положение «Поездное»;", "b": false, "n": ""}, {"t": "- правильность регулирования крана вспомогательного тормоза локомотива на максимальное давление в тормозных цилиндрах (тормозных блоках) при нахождении его ручки в крайнем тормозном положении;", "b": false, "n": ""}, {"t": "- положения ручек кранов тормозного оборудования;", "b": false, "n": ""}, {"t": "- правильность соединения рукавов тормозной и питательной магистралей и открытия концевых кранов между локомотивом (локомотивами) и первым вагоном и правильность подвешивания нерабочих рукавов;", "b": false, "n": ""}, {"t": "- работы датчика контроля состояния тормозной магистрали по подаче визуального светового сигнала;", "b": false, "n": ""}, {"t": "- при двойной тяге и при системе многих единиц проверить правильность включения тормозного оборудования на ведомых локомотивах;", "b": false, "n": ""}, {"t": "- напряжение источника питания электропневматического тормоза.", "b": false, "n": ""}, {"t": "Дополнительно при смене локомотивной бригады на одиночном локомотиве в отведенном месте удалить конденсат из компрессорной установки, масловлагоотделителей, главных и вспомогательных резервуаров, питательной и тормозной магистралей.", "b": false, "n": ""}, {"t": "Конкретный порядок проведения проверки технического состояния тормозного оборудования локомотива при смене локомотивных бригад должен быть указан в технико-распорядительном документе владельца подвижного состава.", "b": false, "n": ""}, {"t": "3.1.5 При смене локомотивных бригад сдающая локомотивная бригада обязана предоставить достоверную информацию принимающей локомотивной бригаде о техническом состоянии тормозного оборудования локомотива с записью в журнале технического состояния локомотива установленной формы о всех нарушениях работы тормозного оборудования, выявленных за время работы.", "b": false, "n": "3.1.5"}, {"t": "3.1.6 При сдаче локомотива в депо (цех ремонтной организации) или пунктах оборота необходимо:", "b": false, "n": "3.1.6"}, {"t": "- в отведенном месте удалить конденсат из компрессорной установки, масловлагоотделителей, главных и вспомогательных резервуаров, питательной и тормозной магистралей;", "b": false, "n": ""}, {"t": "- проверить состояние тормозной рычажной передачи и ее предохранительных устройств, выходы штоков тормозных цилиндров, состояние и толщину тормозных колодок (тормозных накладок).", "b": false, "n": ""}, {"t": "Сделать запись в журнале технического состояния локомотива установленной формы о всех нарушениях работы тормозного оборудования, выявленных за время работы.", "b": false, "n": ""}, {"t": "3.1.7 При обслуживании локомотива в пути следования локомотивная бригада обязана:", "b": false, "n": "3.1.7"}, {"t": "- при стоянках (где это возможно) поезда (локомотива) удалять конденсат из масловлагоотделителей и главных резервуаров;", "b": false, "n": ""}, {"t": "- в зимних условиях на стоянке своевременно удалять лед с деталей тормозной рычажной передачи.", "b": false, "n": ""}, {"t": "3.1.8 При предстоящем планируемом длительном отстое локомотива в недействующем состоянии дополнительно открыть выпускные краны главных резервуаров и масловлагоотделителей, отключить компрессорные установки.", "b": false, "n": "3.1.8"}]}, {"id": "tb3_2", "cat": "tm_loc", "page": 0, "pages": [], "title": "3.2 Правила проверки и регулировки тормозного оборудования", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 18–25", "paras": [{"t": "3.2.1 Проверку наличия пломб необходимо проводить на следующем оборудовании: на разъемах блоков систем безопасности, на предохранительных клапанах, на фиксаторах открытого положения разобщительных кранов тормозной магистрали к электропневматическим клапанам автостопа (далее-ЭПК), на разобщительных кранах на питательном воздухопроводе и на воздухопроводе от воздухораспределителя к крану вспомогательного тормоза, на разобщительных кранах питательного воздухопровода к реле давления тормозных цилиндров (тормозных блоков), на разобщительном кране на воздухопроводе от тормозной магистрали к скоростемеру, к датчикам давления (при наличии), на манометрах, визуальный осмотр которых возможен без дополнительной работы.", "b": false, "n": "3.2.1"}, {"t": "3.2.2 При проверке производительности компрессорной установки необходимо замерить время наполнения главных резервуаров, которое должно быть не более, указанного в руководстве эксплуатации конкретной серии локомотива.", "b": false, "n": "3.2.2"}, {"t": "3.2.3 Пределы давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении регулятором в соответствии с руководством по эксплуатации на тяговый подвижной состав. Отклонение от нормативного значения пределов давлений допускается ±0,02 МПа (±0,2 кгс/см2). Разница пределов давлений между включением и выключением компрессорных установок на тепловозах с механическим приводом компрессоров должна быть не менее 0,10 МПа (1,0 кгс/см2).", "b": false, "n": "3.2.3"}, {"t": "3.2.4 Выхода штоков тормозных цилиндров при нахождении ручки вспомогательным тормозом в крайнем тормозном положении должны находиться в пределах допускаемой нормы выхода штока, установленной руководством по эксплуатации завода-изготовителя и согласованной с владельцем инфраструктуры.", "b": false, "n": "3.2.4"}, {"t": "3.2.5 Толщина гребневых и секционных чугунных тормозных колодок на локомотивах после плановых видов ремонта и технического обслуживания допускается не менее 20 мм (на маневровых и вывозных локомотивах – не менее 15 мм).", "b": false, "n": "3.2.5"}, {"t": "Толщина гребневых и секционных чугунных тормозных колодок на локомотивах в эксплуатации допускается не менее 15 мм (на маневровых и вывозных локомотивах – не менее 10 мм) Для других типов тормозных колодок их минимальная толщина определяются исходя из норм, установленных руководствами по эксплуатации, согласованных с владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "Выход тормозных колодок за наружную грань поверхности катания бандажа (обода колеса) в эксплуатации допускается не более 10 мм. Выход тормозных колодок за наружную грань поверхности катания бандажа (обода колеса) после плановых видов ремонта и технического обслуживания не допускается.", "b": false, "n": ""}, {"t": "Тормозные колодки необходимо заменять при достижении предельной толщины, наличии по всей ширине тормозной колодки трещин, распространяющихся до стального каркаса, при клиновидном износе, если наименьшая допускаемая толщина находится от тонкого торца тормозной колодки на расстоянии 50 мм и более.", "b": false, "n": ""}, {"t": "Для тормозных накладок дискового тормоза их минимальные толщины определяются исходя из норм, установленных руководствами по эксплуатации, согласованных с владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "3.2.6 Проверку проходимости воздуха через концевые краны тормозной и питательной магистралей проводят путем не менее трехкратного продолжительного их открытия при нахождении ручки крана машиниста в положении «Поездное».", "b": false, "n": "3.2.6"}, {"t": "3.2.7 Плотность тормозной и питательной сетей проверяют при поездном положении ручек крана машиниста и крана вспомогательного тормоза, перекрытом комбинированном кране или кране двойной тяги, а на локомотивах оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом (кроме механического) необходимо перекрыть разобщительный кран на тормозной или питательной магистрали (при наличии) к исполнительному устройству крана машиниста и неработающих компрессорных установок. Снижение давления, наблюдаемое по манометрам, должно быть: в тормозной сети с нормального зарядного давления на величину не более чем на 0,02 МПа (0,2 кгс/см2) в течение 60 секунд (1 минуты), в питательной сети с 0,80 МПа (8,0 кгс/см2) на величину не более чем на 0,02 МПа (0,2 кгс/см2) в течение 150 секунд (2,5 минуты).", "b": false, "n": "3.2.7"}, {"t": "Перед проверкой плотности тормозной и питательной сетей локомотив должен быть закреплен от ухода и несанкционированного движения.", "b": false, "n": ""}, {"t": "3.2.8 Проверку темпа ликвидации сверхзарядного давления краном машиниста проводят после завышения давления до 0,64 МПа (6,4 кгс/см2) в уравнительном резервуаре крана машиниста путем постановки ручки крана машиниста в положение «Зарядка и отпуск» и последующего ее перевода в положение «Поездное». Снижение давления в уравнительном резервуаре с 0,58 до 0,56 МПа (с 5,8 до 5,6 кгс/см2) должно происходить за 80 - 120 секунд. В поездах повышенной длины время снижения давления в уравнительном резервуаре с 0,58 до 0,56 МПа (с 5,8 до 5,6 кгс/см2) должно быть 100 - 120 секунд.", "b": false, "n": "3.2.8"}, {"t": "При проверке темпа ликвидации краном машиниста сверхзарядного давления и снижении давления в уравнительном резервуаре не допускается подача визуального светового сигнала о срабатывании датчика контроля состояния тормозной магистрали.", "b": false, "n": ""}, {"t": "3.2.9 Плотность уравнительного резервуара крана машиниста проверяют при нахождении ручки крана машиниста в положении «Перекрыша с питанием» при зарядном давлении в тормозной магистрали. При этом понижение давление по манометру уравнительного резервуара должно быть не более 0,01 МПа (0,1 кгс/см2) в течение 180 секунд (3 минут). Завышение давления в уравнительном резервуаре не допускается.", "b": false, "n": "3.2.9"}, {"t": "3.2.10 Проверку работы крана машиниста в положении «Перекрыша с питанием» производят аналогично пункту 3.2.9 настоящих Правил при этом дополнительно необходимо произвести открытие концевого крана тормозной магистрали (срабатывание ЭПК). При этом давление в уравнительном резервуаре не должно снижаться более чем на 0,02 МПа (0,20 кгс/см2) в течение 40 секунд. Завышение давления в уравнительном резервуаре не допускается. При снижении давления в уравнительном резервуаре более чем на 0,02 МПа (0,20 кгс/см2) в течение 40 секунд проверить плотность уравнительного резервуара крана машиниста.", "b": false, "n": "3.2.10"}, {"t": "3.2.11 Работу крана машиниста в положении «Перекрыша без питания» производят путем постановки ручки крана машиниста в положение «Перекрыша без питания» и открытом концевом кране тормозной магистрали (сработавшем ЭПК). При этом давление в уравнительном резервуаре должно непрерывно снижаться. Завышение давления в уравнительном резервуаре не допускается.", "b": false, "n": "3.2.11"}, {"t": "3.2.12 При проверке работы крана машиниста при поездном положении допускается снижение давления, контролируемого по манометру тормозной магистрали, в сторону уменьшения не более чем на 0,015 МПа (0,15 кгс/см2) от первоначального значения.", "b": false, "n": "3.2.12"}, {"t": "3.2.13 Темп экстренной разрядки через кран машиниста проверяют путем перевода ручки крана машиниста в положение «Экстренное торможение». Время снижения давления в тормозной магистрали с 0,5 до 0,25 МПа (с 5,0 до 2,5 кгс/см2) должно быть не более 3 секунд.", "b": false, "n": "3.2.13"}, {"t": "3.2.14 Проходимость воздуха через кран машиниста при нахождении ручки крана машиниста в поездном положении и открытом концевом кране тормозной магистрали со стороны проверяемой кабины. Проверка должна осуществляться при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2), выключенных компрессорных установках. Время снижения давления в главных резервуарах объемом 1000 л с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см2) должно быть 16 – 20 секунд. При большем объеме главных резервуаров локомотива время должно быть пропорционально увеличено.", "b": false, "n": "3.2.14"}, {"t": "3.2.15 Проходимость воздуха через блокировочное устройство проверяют при нахождении ручки крана машиниста в положении «Зарядка и отпуск и открытом концевом кране тормозной магистрали со стороны проверяемой кабины. Проверку следует производить при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2) и выключенных компрессорных установках по времени снижения давления в главных резервуарах объемом 1000 л с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см 2), которое должно быть в пределах от 9 до 12 секунд. При большем объеме главных резервуаров локомотива время должно быть пропорционально увеличено.", "b": false, "n": "3.2.15"}, {"t": "3.2.16 Давление в тормозных цилиндрах (тормозных блоках) при нахождении ручки крана вспомогательным тормозом в крайнем тормозном положении должно быть не менее указанного в руководстве по эксплуатации конкретной серии локомотива, согласованное с владельцем инфраструктуры.", "b": false, "n": "3.2.16"}, {"t": "3.2.17 Отсутствие недопустимого снижения давления в тормозных цилиндрах (тормозных блоках) производят после наполнения их до максимального давления и последующего перекрытия подачи сжатого воздуха к ним. Снижение давления в тормозных цилиндрах (тормозных блоках) должно быть не более 0,02 МПа (0,2 кгс/см2) в течение 60 секунд (1 минуты).", "b": false, "n": "3.2.17"}, {"t": "3.2.18 Для проверки работы системы скоростного регулирования необходимо выполнить экстренное торможение. После достижения в тормозных цилиндрах (тормозных блоках) локомотива максимального давления необходимо запустить программу проверки в каждой секции, при работе которой давление в тормозных цилиндрах (тормозных блоках) должно измениться до величины, указанной в руководстве по эксплуатации конкретного локомотива, согласованного владельцем инфраструктуры.", "b": false, "n": "3.2.18"}, {"t": "3.2.19 Для проверки работы противоюзного устройства необходимо выполнить полное служебное торможение. После достижения в тормозных цилиндрах (тормозных блоках) максимального давления необходимо запустить программу проверки, которая не должна по своему окончанию выдать ошибку работы данной системы.", "b": false, "n": "3.2.19"}, {"t": "3.2.20 Работу воздухораспределителей при ступени торможения:", "b": false, "n": "3.2.20"}, {"t": "- для грузового подвижного состава проверка выполняется на груженом и равнинном режиме работы воздухораспределителя, а на локомотивах, у которых отпуск автоматического тормоза обеспечивается выпуском сжатого воздуха из рабочей камеры воздухораспределителей, – на груженом и горном режиме. Проверку необходимо выполнять снижением давления в уравнительном резервуаре с зарядного давления на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2), а при воздухораспределителе, действующем через кран вспомогательного тормоза – на 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2). При этом воздухораспределители должны сработать и не давать самопроизвольного отпуска в течение 300 секунд (5 минут). После торможения убедиться в том, что давление в тормозных цилиндрах (тормозных блоках) локомотива не менее 0,1 МПа (1,0 кгс/см2) и штоки поршней вышли из тормозных цилиндров, а тормозные колодки (тормозные накладки) прижаты к колесам (тормозным дискам). После окончания проверки необходимо установить ручку крана машиниста в поездное положение, при котором тормоз должен отпустить, а тормозные колодки (тормозные накладки) должны отойти от колес (тормозных дисков).", "b": false, "n": ""}, {"t": "На локомотивах, оборудованных тормозными блоками проверку действие на торможение и отпуск тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах локомотивов в видимой зоне;", "b": false, "n": ""}, {"t": "- для пассажирского подвижного состава проверку необходимо выполнять снижением давления в уравнительном резервуаре с зарядного давления на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2). При этом воздухораспределители должны сработать и не давать самопроизвольного отпуска в течение 300 секунд (5 минут). После торможения убедиться в том, что давление в тормозных цилиндрах локомотива составляет не менее 0,1 МПа (1,0 кгс/см2) и штоки поршней вышли из тормозных цилиндров, а тормозные колодки (тормозные накладки) прижаты к колесам (тормозным дискам). После окончания проверки необходимо установить ручку крана машиниста в поездное положение, при котором тормоз должен отпустить, а тормозные колодки (тормозные накладки) должны отойти от колес (тормозных дисков).", "b": false, "n": ""}, {"t": "На локомотивах, оборудованных тормозными блоками, проверку действие на торможение и отпуск тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах локомотивов в видимой зоне.", "b": false, "n": ""}, {"t": "3.2.21 При проверке работы датчика контроля состояния тормозной магистрали при ступени торможения 0,02 - 0,03 МПа (0,2 - 0,3 кгс/см2) во время срабатывания воздухораспределителя на торможение должен подаваться визуальный световой сигнал о срабатывании датчика контроля состояния тормозной магистрали. После последующего снижения давления в уравнительном резервуаре не менее 0,04 МПа (0,4 кгс/см2) сигнал датчика контроля состояния тормозной магистрали должен погаснуть.", "b": false, "n": "3.2.21"}, {"t": "3.2.22 Напряжение источника питания электропневматического тормоза при питании от аккумуляторных батарей (опущенном токоприемнике электровоза или заглушенном дизеле тепловоза), должно быть:", "b": false, "n": "3.2.22"}, {"t": "- не ниже 48 В при поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "- не ниже 45 В при нахождении ручки крана машиниста в положение «Торможение»;", "b": false, "n": ""}, {"t": "- не ниже 45 В при искусственно созданной нагрузке током 4 А (в режиме «Перекрыша») и 8 А (в режиме «Торможение»).", "b": false, "n": ""}, {"t": "3.2.23 Действие электропневматического тормоза на возможность ступенчатого торможения до полного наполнения тормозных цилиндров (тормозных блоков) и последующего ступенчатого отпуска до полного выпуска воздуха из них. Должно быть выполнено не менее 3 ступеней торможения и 3 ступеней отпуска.", "b": false, "n": "3.2.23"}, {"t": "На локомотивах, оборудованных отдельным устройством управления электропневматическим тормозом, его действие проверять при поездном положении ручки крана машиниста", "b": false, "n": ""}, {"t": "3.2.24 При проверке работы световой индикации работы электропневматического тормоза:", "b": false, "n": "3.2.24"}, {"t": "- при нахождении ручки крана машиниста в положении «Зарядка и отпуск» и в поездном положении должна гореть лампа с буквенным обозначением «О»;", "b": false, "n": ""}, {"t": "- при нахождении ручки крана машиниста в положениях «Перекрыша без питания» и «Перекрыша с питанием» – лампы «П» и «О»;", "b": false, "n": ""}, {"t": "- при нахождении ручки крана машиниста в положениях «Замедленное торможение», «Служебное торможение» и «Экстренное торможение» – лампы «Т» и «О».", "b": false, "n": ""}, {"t": "На локомотивах, оборудованных отдельным устройством управления электропневматическим тормозом, его действие проверять при поездном положении ручки крана машиниста.", "b": false, "n": ""}, {"t": "3.2.25 При наличии выключателя «Дублированное питание ЭПТ» необходимо проверить работу дублированного питания. Для чего необходимо подвесить соединительные концевые рукава тормозной магистрали на изолированные подвески со стороны обеих кабин управления и включить тумблер дублированного питания. При поездном положении ручки крана машиниста должна гореть лампа с буквенным обозначением «О», а при выключении тумблера лампа должна погаснуть.", "b": false, "n": "3.2.25"}, {"t": "3.2.26 Работу воздухораспределителей при торможении от устройства резервного пневматического управления проверяется снижением давления в уравнительном резервуаре на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2) с последующим переводом в положение «Перекрыша». При этом воздухораспределитель должен сработать на торможение и не отпускать в течение не менее 120 секунд (2 минут). Отпуск воздухораспределителя осуществляется путем перевода ручки крана резервного управления из положения «Перекрыша» в отпускное положение с контролем отпуска по манометру тормозных цилиндров (тормозных блоков).", "b": false, "n": "3.2.26"}, {"t": "3.2.27 Работа клапанов аварийно-экстренного торможения проверяется путем нажатия на кнопку клапана аварийно-экстренного торможения. При этом время снижение давления в тормозной магистрали с 0,50 до 0,25 МПа (5,0 до 2,5 кгс/см2) должно быть не более 3 секунд.", "b": false, "n": "3.2.27"}, {"t": "3.2.28 Проверку работы стояночного (ручного) тормоза проводят при отпущенном состоянии тормоза локомотива порядком, указанным в руководстве по эксплуатации конкретной модели локомотива, приводят в действие стояночный (ручной) тормоз. После приведения в действие стояночного (ручного) тормоза тормозные колодки (тормозные накладки) должны плотно прилегать к поверхности катания колеса (тормозного диска).", "b": false, "n": "3.2.28"}, {"t": "Приведение в действие стояночного тормоза на локомотивах, оборудованных тормозными блоками, допускается проводить по показаниям сигнализаторов, расположенных на боковых стенах локомотивов в видимой зоне.", "b": false, "n": ""}, {"t": "3.2.29 Величина зарядного давления и правильность регулирования крана машиниста на поддержание зарядного давления в тормозной магистрали при поездном положении должна соответствовать таблице 1 Правил, а режим включения воздухораспределителей - главе 4 настоящих Правил. Таблица 1 - Зарядное давление в тормозной магистрали Характеристика поезда Зарядное давление в тормозной магистрали ведущего локомотива, МПа (кгс/см2) 1 2 Пассажирский; грузопассажирский; маневровый состав; 0,50-0,52 (5,0-5,2) грузовой, в составе которого имеются груженые вагоны, включенные на средний режим, сплотка локомотивов, одиночные локомотивы; грузовой, в составе которого имеются локомотивы и вагоны с включенными воздухораспределителями пассажирского типа Грузовой, в составе которого имеются груженые 0,53-0,55 (5,3-5,5) вагоны, на затяжных спусках крутизной 0,018 и более;", "b": false, "n": "3.2.29"}, {"t": "грузовой, в составе которого имеются груженые вагоны, включенные на груженый режим Пассажирский, в составе которого имеются вагоны с 0,48-0,50 (4,8-5,0) включенными автотормозами пассажирского типа со ступенчатым отпуском (западноевропейского типа);", "b": false, "n": ""}, {"t": "грузовой с составом из порожних вагонов Поезд с составом из недействующих вагонов 0,45-0,48 (4,5–4,8) электропоездов или метрополитена Грузовой, в составе которого имеются вагоны 0,48 (4,8) моторвагонного подвижного состава (кроме вагонов дизель-поездов ДР1А, ДР1П, ДРБ, ЭС1, ЭС2Г, ЭС1П, ЭГ2Тв, ЭГЭ2Тв, ЭС104, РА-3) Примечания: 1. На участках железных дорог с затяжными спусками крутизной менее 0,018 на основании местных правил и норм исходя из опытных поездок, может устанавливаться зарядное давление 0,53 - 0,55 МПа (5,3 - 5,5 кгс/см2) в грузовых груженых поездах с вагонами, воздухораспределители которых включены на груженый режим. 2. Зарядное давление устанавливается по манометру, установленному в тормозной магистрали локомотива.", "b": false, "n": ""}]}, {"id": "tb4", "cat": "tm_loc", "page": 0, "pages": [], "title": "4 Порядок смены кабин управления на локомотивах и режимы включения воздухораспределителей на локомотивах", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 25–29", "paras": [{"t": "4.1 В оставляемой кабине управления машинист должен:", "b": false, "n": "4.1"}, {"t": "а) на локомотивах, оборудованных блокировочным устройством:", "b": false, "n": ""}, {"t": "- при наличии электропневматического тормоза отключить на пульте управления выключатель управления питания этого тормоза;", "b": false, "n": ""}, {"t": "- ручку крана вспомогательного тормоза перевести в последнее тормозное положение. На локомотивах, оборудованных краном машиниста и краном вспомогательного тормоза, у которых передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом (кроме механического), ручку крана вспомогательного тормоза в нерабочей кабине должна остаться в последнем тормозном положении, если иное не указано в руководстве по эксплуатации локомотива;", "b": false, "n": ""}, {"t": "- осуществить разрядку тормозной магистрали краном машиниста до нуля;", "b": false, "n": ""}, {"t": "- привести в действие автоматический стояночный тормоз (при наличии);", "b": false, "n": ""}, {"t": "- после установления максимального давления в тормозных цилиндрах повернуть ключ блокировочного устройства и вынуть его.", "b": false, "n": ""}, {"t": "б) на локомотивах, не оборудованных блокировочным устройством или при наличии устройства блокировки тормоза № 267:", "b": false, "n": ""}, {"t": "- при наличии электропневматического тормоза отключить на пульте управления выключатель управления питания этого тормоза;", "b": false, "n": ""}, {"t": "- ручку крана вспомогательного тормоза перевести в последнее тормозное положение;", "b": false, "n": ""}, {"t": "- осуществить разрядку тормозной магистрали краном машиниста до нуля;", "b": false, "n": ""}, {"t": "- перевести ручку комбинированного крана (при наличии) в положение двойной тяги. При наличии в блокировке функции автоматического разобщения крана машиниста с тормозной магистралью при повороте ключа блокировочного устройства данную операцию не производить;", "b": false, "n": ""}, {"t": "- после установления максимального давления в тормозных цилиндрах повернуть ключ устройства блокировки тормоза № 267 и вынуть его;", "b": false, "n": ""}, {"t": "- перекрыть разобщительный кран от крана вспомогательного тормоза к тормозным цилиндрам.", "b": false, "n": ""}, {"t": "На электровозах серии ЧС разобщительный кран на воздухопроводе от крана вспомогательного тормоза к тормозным цилиндрам должен быть открыт.", "b": false, "n": ""}, {"t": "Убедиться в наполнении тормозных цилиндров (тормозных блоков) до полного давления и отсутствии недопустимого снижения давления в них. Допускается снижение давления в тормозных цилиндрах не более 0,02 МПа (0,2кгс/см2) в течении 1 мин.", "b": false, "n": ""}, {"t": "В вводимой в работу кабине машинист должен:", "b": false, "n": ""}, {"t": "а) на локомотивах, оборудованных блокировочным устройством:", "b": false, "n": ""}, {"t": "- вставить ключ в блокировочное устройство и повернуть его, выключив блокировку и активировав органы управления;", "b": false, "n": ""}, {"t": "- перевести ручку крана машиниста в поездное положение и наполнить уравнительный резервуар и тормозную магистраль до зарядного давления;", "b": false, "n": ""}, {"t": "- отменить действие автоматического стояночного тормоза (при наличии).", "b": false, "n": ""}, {"t": "б) на локомотивах, не оборудованных блокировочным устройством или при наличии устройства блокировки тормоза № 267:", "b": false, "n": ""}, {"t": "- открыть разобщительный кран на воздухопроводе к тормозным цилиндрам от крана вспомогательного тормоза. На локомотиве серии ЧС ручку крана вспомогательного тормоза перевести в последнее тормозное положение;", "b": false, "n": ""}, {"t": "- перевести ручку крана машиниста в поездное положение, а при наличии блокировки тормоза № 267 вставить съемный ключ блокировки в гнездо и повернуть его, зарядить уравнительный резервуар до зарядного давления;", "b": false, "n": ""}, {"t": "- открыть комбинированный кран, зарядить тормозную магистраль до зарядного давления.", "b": false, "n": ""}, {"t": "На локомотивах серии ЧС при уходе из нерабочей кабины помощника машиниста или при обслуживании одним машинистом ручку крана вспомогательного тормоза отпустить.", "b": false, "n": ""}, {"t": "4.2 Помощник машиниста в процессе перехода должен находиться в оставляемой кабине и по манометрам тормозной магистрали и тормозных цилиндров (тормозных блоков) контролировать заторможенное состояние локомотива до зарядки тормозной магистрали из рабочей кабины. В случае выявления самопроизвольного отпуска тормоза локомотива помощник машиниста обязан привести в действие стояночный (ручной) тормоз.", "b": false, "n": "4.2"}, {"t": "На локомотивах, оборудованных приводом стояночного (ручного) тормоза только в одной кабине, помощник машиниста в процессе перехода должен находиться в кабине, оборудованной приводом стояночного (ручного) тормоза.", "b": false, "n": ""}, {"t": "При оборудовании локомотива приводом стояночного (ручного) тормоза и манометрами тормозных цилиндров в кузове, позволяющими контролировать заторможенное состояние локомотива в процессе перехода в другую кабину управления, нахождение помощника машиниста необходимо в кузове.", "b": false, "n": ""}, {"t": "На локомотивах, оборудованных автоматическим стояночным тормозом или стояночным тормозом с дистанционным приводом, нахождение помощника машиниста в кабине, оборудованной приводом стояночного (ручного) тормоза, не требуется.", "b": false, "n": ""}, {"t": "После прицепки локомотива к составу нахождение помощника машиниста в оставляемой кабине не требуется.", "b": false, "n": ""}, {"t": "Порядок смены кабины управления на локомотивах, обслуживаемых машинистом без помощника машиниста, устанавливается владельцем железнодорожного подвижного состава и согласовывается с владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "4.3 Окончив все операции по переходу в рабочую кабину, машинист обязан (за исключением смены кабины управления после прицепки к составу и дальнейшего следования с ним):", "b": false, "n": "4.3"}, {"t": "- до приведения локомотива в движение проверить, контролируя по манометру тормозных цилиндров (тормозных блоков), работу вспомогательного и автоматического тормозов.", "b": false, "n": ""}, {"t": "С целью исключения самопроизвольного движения локомотива в зависимости от конструкции подвижного состава и профиля пути допускается выполнять проверку работы вспомогательного и автоматического тормоза при наличии давления в тормозных цилиндрах (блоках) 0,06 - 0,10 МПа (0,6 - 1,0 кгс/см2).", "b": false, "n": ""}, {"t": "- после приведения локомотива в движение маневровым порядком выполнить проверку действия вспомогательного тормоза при достижении скорости 3 - 7 км/ч до остановки локомотива.", "b": false, "n": ""}, {"t": "4.4 Режимы включения воздухораспределителей на локомотивах", "b": false, "n": "4.4"}, {"t": "4.4.1 Включение режимов воздухораспределителей грузового типа на локомотивах производить:", "b": false, "n": "4.4.1"}, {"t": "а) Режим «Порожний»:", "b": false, "n": ""}, {"t": "- при ведении грузового поезда со скоростью не более 90 км/ч (в голове состава, в составе соединенного поезда, второй при двойной тяге);", "b": false, "n": ""}, {"t": "- на втором и последующих локомотивах при работе по системе многих единиц в случае если действие крана вспомогательного тормоза первого локомотива распространяется на последующие локомотивы;", "b": false, "n": ""}, {"t": "- на подталкивающем локомотиве при следовании с объединённой тормозной магистралью.", "b": false, "n": ""}, {"t": "б) Режим «Средний»:", "b": false, "n": ""}, {"t": "- в сплотке на втором и последующих локомотивах;", "b": false, "n": ""}, {"t": "- при пересылке недействующего локомотива в составе грузового поезда;", "b": false, "n": ""}, {"t": "- на втором и последующих локомотивах при работе по системе многих единиц в случае если действие крана вспомогательного тормоза первого локомотива не распространяется на последующие локомотивы.", "b": false, "n": ""}, {"t": "в) Режим «Груженый»:", "b": false, "n": ""}, {"t": "- в сплотке на головном локомотиве;", "b": false, "n": ""}, {"t": "- при ведении грузового поезда со скоростью более 90 км/ч;", "b": false, "n": ""}, {"t": "- при одиночном следовании локомотива;", "b": false, "n": ""}, {"t": "- при ведении пассажирского или грузопассажирского поезда;", "b": false, "n": ""}, {"t": "- на всех маневровых локомотивах при выполнении маневровых работ и передвижений;", "b": false, "n": ""}, {"t": "- на поездных локомотивах при обслуживании одним машинистом при выполнении маневровых работ и передвижений;", "b": false, "n": ""}, {"t": "- при прицепке к одиночно следующему локомотиву не более пяти грузовых вагонов.", "b": false, "n": ""}, {"t": "г) Режим «Равнинный»:", "b": false, "n": ""}, {"t": "- с пассажирскими и грузопассажирскими поездами;", "b": false, "n": ""}, {"t": "- при следовании по спускам крутизной до 0,018.", "b": false, "n": ""}, {"t": "д) Режим «Горный»:", "b": false, "n": ""}, {"t": "- при следовании по спускам крутизной 0,018 и более;", "b": false, "n": ""}, {"t": "- на локомотивах, у которых отпуск автоматического тормоза производится выпуском воздуха из рабочей камеры воздухораспределителя.", "b": false, "n": ""}, {"t": "4.4.2 Включение режимов воздухораспределителей пассажирского типа без ступенчатого отпуска производить:", "b": false, "n": "4.4.2"}, {"t": "а) Режим работы «Короткосоставный»:", "b": false, "n": ""}, {"t": "- при следовании с пассажирским поездом до 20-ти вагонов включительно;", "b": false, "n": ""}, {"t": "- при одиночном следовании локомотива;", "b": false, "n": ""}, {"t": "- в сплотке из пассажирских локомотивов.", "b": false, "n": ""}, {"t": "б) Режим работы «Длинносоставный»:", "b": false, "n": ""}, {"t": "- при следовании с пассажирским поездом более 20-ти вагонов;", "b": false, "n": ""}, {"t": "- на локомотивах в сплотке с грузовыми локомотивами;", "b": false, "n": ""}, {"t": "- при пересылке пассажирских локомотивов в составе грузового поезда.", "b": false, "n": ""}, {"t": "в) Режим работы «Ускоритель выключен»: при самопроизвольном срабатывании воздухораспределителя на экстренное торможение.", "b": false, "n": ""}, {"t": "4.4.3 Включение воздухораспределителей пассажирского типа без ступенчатого отпуска на режим работы «Короткосоставный» в пассажирских поездах с составами более 20 до 25 вагонов разрешается специальным указанием владельца инфраструктуры.", "b": false, "n": "4.4.3"}]}, {"id": "tb5_1", "cat": "tm_loc", "page": 0, "pages": [], "title": "5.1 Прицепка к составу", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 29–32", "paras": [{"t": "5.1.1 Подъезжая к составу, машинист обязан вспомогательным тормозом остановить локомотив на расстоянии 10 - 15 м от первого вагона.", "b": false, "n": "5.1.1"}, {"t": "Осмотрщик вагонов или работник, на которого эта обязанность возложена владельцем инфраструктуры, обязан убедиться в исправной работе автосцепки и нормальном положении рычага расцепного механизма автосцепки первого вагона.", "b": false, "n": ""}, {"t": "По команде осмотрщика вагонов или работника, на которого эта обязанность возложена владельцем инфраструктуры, машинист должен привести в движение локомотив и подъезжать к составу со скоростью не более 3 км/ч, обеспечив плавность сцепления автосцепок.", "b": false, "n": ""}, {"t": "После сцепления локомотива с грузовым составом машинист кратковременным движением от состава должен проверить надежность сцепления.", "b": false, "n": ""}, {"t": "После сцепления локомотива с грузовым составом, закрепленным специальными механическими упорами, осмотрщик вагонов или работник, на которого эта обязанность возложена владельцем инфраструктуры, проверяют надежность сцепления по сигнальным отросткам замков автосцепок.", "b": false, "n": ""}, {"t": "После сцепления локомотива с пассажирским, почтово-багажным, грузопассажирским составами осмотрщик вагонов или работник, на которого эта обязанность возложена владельцем инфраструктуры, проверяют надежность сцепления по сигнальным отросткам замков автосцепок.", "b": false, "n": ""}, {"t": "Во всех случаях необходимо проверить положение расцепных рычагов автосцепок локомотива и первого вагона.", "b": false, "n": ""}, {"t": "5.1.2 До соединения концевых рукавов магистралей между локомотивом и первым вагоном состава осмотрщик вагонов или работник, на которого эта обязанность возложена владельцем инфраструктуры, обязан сообщить машинисту о состоянии тормозной магистрали состава поезда (заряжена или не заряжена), наличии в составе грузового поезда пассажирских вагонов, локомотивов и вагонов моторвагонного подвижного состава, о количестве груженых и порожних вагонов и их загрузке, вагонов с выключенными тормозами, количестве вагонов в пассажирском поезде, наличии в нем вагонов с выключенными электропневматическими тормозами или включенных вагонов с отличающимися по принципу действия воздухораспределителями пассажирского типа. Получив требуемую информацию, машинист обязан отрегулировать кран машиниста на величину зарядного давления, указанную в таблице 1, и включить воздухораспределители локомотива на соответствующий режим работы, указанные в главе 4 настоящих Правил.", "b": false, "n": "5.1.2"}, {"t": "5.1.3 Помощник машиниста после прицепки локомотива к составу и перехода машиниста в рабочую кабину при выключенном источнике питания электропневматического тормоза (при наличии), по команде машиниста обязан трехкратным открытием концевого крана продуть тормозную магистраль локомотива со стороны состава, соединить рукава тормозной, а при эксплуатации пассажирских поездов с применением питательной магистрали локомотива продуть питательную магистраль локомотива со стороны состава. После соединения рукавов открыть концевой кран сначала у локомотива, а затем у вагона.", "b": false, "n": "5.1.3"}, {"t": "Машинист совместно с осмотрщиком вагонов или работником, на которого эта обязанность возложена владельцем инфраструктуры, должны убедиться в надежности сцепления по сигнальным отросткам замков автосцепок, исправности и правильности соединения рукавов и открытия концевых кранов между локомотивом и первым вагоном.", "b": false, "n": ""}, {"t": "При обслуживании локомотива машинистом без помощника машиниста до включения источника питания электропневматического тормоза (при наличии) осмотрщик вагонов или работник, на которого эта обязанность возложена владельцем инфраструктуры, после прицепки локомотива к составу и перехода машиниста в рабочую кабину обязан по команде машиниста трехкратным открытием крана через концевой рукав продуть тормозную магистраль локомотива со стороны состава, соединить рукава тормозной, а при необходимости и питательной магистралей между локомотивом и первым вагоном, открыть концевой кран сначала у локомотива, а затем у вагона.", "b": false, "n": ""}, {"t": "Допускается проводить продувку тормозной, а при необходимости и питательной магистралей локомотива до его прицепки к составу пассажирского поезда при условии остановки локомотива на расстоянии не менее 10 м от первого вагона и продувки с обоих сторон локомотива.", "b": false, "n": ""}, {"t": "При многократной тяге соединение рукавов и открытие концевых кранов между локомотивами и первым вагоном выполняет помощник машиниста первого локомотива, а исполнение этой работы проверяет машинист первого локомотива совместно с машинистами других локомотивов. Ответственность за правильность исполнения несет машинист первого локомотива. Кроме того, при многократной тяге машинист первого локомотива совместно с машинистами других локомотивов проверяет правильность включения тормозного оборудования в рабочих кабинах других локомотивов и установку ручек комбинированных кранов (или кранов двойной тяги) в положение двойной тяги, а на локомотивах, оборудованных краном машиниста, у которого передача команды управления от органа управления к исполнительным устройствам производится электрическим или иным способом перекрытое положение разобщительного крана от тормозной магистрали (при наличии) к исполнительному устройству крана машиниста.", "b": false, "n": ""}, {"t": "При многократной тяге с локомотивами в голове поезда и обслуживании каждого локомотива одним машинистом соединение рукавов и открытие концевых кранов между локомотивами и первым вагоном поезда выполняет машинист последнего локомотива.", "b": false, "n": ""}, {"t": "5.1.4 После прицепки локомотива к пассажирскому составу, смены кабины управления, соединения рукавов тормозной, а при необходимости и питательной магистрали, и открытия концевых кранов машинист обязан осуществлять зарядку тормозной магистрали при поездном положении ручки крана машиниста.", "b": false, "n": "5.1.4"}, {"t": "5.1.5 После прицепки локомотива к грузовому составу, смены кабины управления необходимо до соединения рукавов тормозной магистрали и открытия концевых кранов выполнить торможение краном машиниста снижением давления в уравнительном резервуаре на величину не менее 0,15 МПа (1,5 кгс/см2).", "b": false, "n": "5.1.5"}, {"t": "После соединения рукавов тормозной магистрали и открытия концевых кранов между локомотивом и первым вагоном ручку крана машиниста перевести в положение «Зарядка и отпуск» и повысить давление в уравнительном резервуаре в поезде с составом до 100 осей включительно до зарядного давления, а в поезде свыше 100 осей - на 0,10 - 0,12 МПа (1,0 - 1,2 кгс/см2) выше отрегулированного зарядного давления. После чего ручку крана машиниста перевести в поездное положение.", "b": false, "n": ""}, {"t": "Если в грузовом составе имеются вагоны с включенными воздухораспределителями пассажирского типа, то зарядку тормозной сети поезда производить положением «Зарядка и отпуск» до зарядного давления с последующим переводом ручки крана машиниста в поездное положение.", "b": false, "n": ""}]}, {"id": "tb5_2", "cat": "tm_loc", "page": 0, "pages": [], "title": "5.2 Отцепка от состава", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 32–33", "paras": [{"t": "5.2.1 После прибытия поезда на железнодорожную станцию машинист перед отцепкой локомотива от состава поезда должен выключить источник питания электропневматического тормоза (при наличии), привести в действие автоматические тормоза снижением давления в уравнительном резервуаре на величину не менее 0,15 МПа (1,5 кгс/см2).", "b": false, "n": "5.2.1"}, {"t": "После этого помощник машиниста или работник, на которого эта обязанность возложена владельцем инфраструктуры перекрывает концевые краны сначала у локомотива, а затем у первого вагона, разъединяет между локомотивом и первым вагоном рукава тормозной и питательной (при наличии) магистралей, подвешивает их на подвески локомотива и пассажирского вагона (при наличии подвесок).", "b": false, "n": ""}, {"t": "5.2.2 При обслуживании локомотива одним машинистом выполнение операций по отцепке поездного локомотива от состава поезда возлагается на осмотрщика вагонов или работника, на которого эта обязанность возложена владельцем инфраструктуры.", "b": false, "n": "5.2.2"}, {"t": "5.2.3 Отцепка поездного локомотива от пассажирского поезда с электрическим отоплением выполняется только после разъединения поездным электромехаником высоковольтных междувагонных электрических соединений между локомотивом и первым вагоном.", "b": false, "n": "5.2.3"}, {"t": "Перед отцепкой поездного локомотива, обслуживаемого одним машинистом, от состава грузового поезда машинист должен переключить воздухораспределители грузового типа локомотива на груженый режим.", "b": false, "n": ""}, {"t": "5.2.4 Локомотивной бригаде во время отцепки локомотива от состава запрещается перекрывать концевые краны в составе поезда между вагонами.", "b": false, "n": "5.2.4"}, {"t": "5.2.5 В случае неисправности концевого крана головного вагона до разъединения рукавов помощник машиниста должен выждать время полного выхода сжатого воздуха, а машинист обязан сообщить об этом дежурному по станции.", "b": false, "n": "5.2.5"}, {"t": "5.2.6 После отцепки от состава необходимо выполнить проверку действия вспомогательного тормоза при достижении скорости 3 - 7 км/ч до остановки локомотива.", "b": false, "n": "5.2.6"}]}, {"id": "tb5_3", "cat": "tm_loc", "page": 0, "pages": [], "title": "5.3 Действия локомотивной бригады при формировании соединенных грузовых поездов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 33–34", "paras": [{"t": "5.3.1 После сцепления машинист локомотива, находящегося в середине состава, обязан проверить правильность сцепления автосцепок, соединения рукавов тормозной магистрали и открытия концевых кранов локомотива и хвостового вагона впереди стоящего поезда, сообщить машинисту головного локомотива номер своего поезда, его вес, количество осей, потребное и фактическое тормозное нажатие в соответствии со «Справкой об обеспечении поезда тормозами и исправном их действии» формы ВУ-45 (Приложение 1).", "b": false, "n": "5.3.1"}, {"t": "5.3.2 Во время разъединения поездов после остановки машинисту головного локомотива запрещается выполнять отпуск автотормозов до разъединения рукавов и расцепления автосцепок между локомотивом второго поезда и хвостовым вагоном впереди стоящего поезда.", "b": false, "n": "5.3.2"}, {"t": "Отпуск автотормозов хвостовой части первого поезда должен проверить помощник машиниста второго локомотива по двум последним вагонам первого поезда.", "b": false, "n": ""}, {"t": "Машинист первого поезда может начать движение только после уведомления машинистом второго поезда о выполненном разъединении и об отпуске тормозов двух хвостовых вагонов первого поезда.", "b": false, "n": ""}, {"t": "5.4 Машинист подталкивающего локомотива после прицепки в хвост поезда с включением его автотормозов в общую тормозную сеть должен перевести ручку комбинированного крана в положение двойной тяги (на локомотивах, оборудованных краном машиниста, у которого передача команды управления от органа управления к исполнительным устройствам производится электрическим или иным способом перекрыть разобщительный кран от тормозной магистрали к исполнительному устройству крана машиниста), а ручку крана машиниста в положение экстренного торможения. На локомотивах, обеспечивающих разбор тяги и подачи песка при нахождении ручки крана машиниста в положении экстренного торможения, ручка крана машиниста должна быть установлена в положение служебного торможения.", "b": false, "n": "5.4"}, {"t": "О подготовке тормозного оборудования, включении в тормозную магистраль поезда и готовности следования машинист подталкивающего локомотива обязан доложить машинисту ведущего локомотива.", "b": false, "n": ""}, {"t": "После прицепки подталкивающего локомотива в хвост поезда помощник машиниста обязан соединить рукава тормозной магистрали хвостового вагона и локомотива и открыть концевой кран сначала у вагона, а затем, убедившись в проходе воздуха через контрольное отверстие, открыть концевой кран у локомотива. После этого машинист ведущего локомотива обязан зарядить тормозную сеть всего поезда.", "b": false, "n": ""}, {"t": "Если автотормоза подталкивающего локомотива, обслуживаемого одним машинистом, должны быть включены в общую тормозную сеть, то выполнение операций по прицепке подталкивающего локомотива к составу и отцепке его от состава поезда возлагается на осмотрщиков вагонов. На станциях, где не предусмотрены должности осмотрщиков вагонов, прицепка и отцепка подталкивающих локомотивов выполняется порядком, указанным в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "5.5 Допускается применение подталкивающих локомотивов, оборудованных системой управления автоматическими тормозами и тягой по радиоканалу с головного локомотива.", "b": false, "n": "5.5"}, {"t": "Применение таких систем должно осуществляться в соответствии с организационно-распорядительными документами владельца инфраструктуры с разработкой соответствующей технологии.", "b": false, "n": ""}]}, {"id": "tb6", "cat": "tm_car", "page": 0, "pages": [], "title": "6 Техническое обслуживание тормозного оборудования вагонов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 34–45", "paras": [{"t": "6.1 Общие положения", "b": false, "n": "6.1"}, {"t": "6.1.1 Техническое состояние тормозного оборудования вагонов должно проверяться при их техническом обслуживании работниками пунктов технического обслуживания и контрольных пунктов технического обслуживания.", "b": false, "n": "6.1.1"}, {"t": "Выполнение работ контролирует ответственный работник (старший по смене, старший осмотрщик вагонов, руководитель смены), который должен обеспечить:", "b": false, "n": ""}, {"t": "- соединение рукавов;", "b": false, "n": ""}, {"t": "- открытие концевых и разобщительных кранов;", "b": false, "n": ""}, {"t": "- исправную работу тормозного оборудования;", "b": false, "n": ""}, {"t": "- включение всех тормозов в составе поезда (за исключением случаев, предусмотренных настоящими Правилами);", "b": false, "n": ""}, {"t": "- переключение режимов торможения;", "b": false, "n": ""}, {"t": "- установленную норму тормозного нажатия в поезде;", "b": false, "n": ""}, {"t": "- надежную работу тормозов при опробовании их на станции и в пути следования.", "b": false, "n": ""}, {"t": "6.1.2 Запрещается подавать под погрузку, посадку пассажиров и ставить в поезд вагоны с неисправным тормозным оборудованием, а также без предъявления их к техническому обслуживанию и записи в журнале о признании вагонов годными к безопасному следованию в поездах.", "b": false, "n": "6.1.2"}, {"t": "На станциях, где нет пунктов технического обслуживания вагонов, порядок проверки технического состояния и ремонта тормозного оборудования вагонов при их постановке в поезда и подаче под погрузку устанавливается организационно распорядительными документами подразделений владельца инфраструктуры.", "b": false, "n": ""}, {"t": "6.1.3 Запрещается в пассажирских поездах приступать к техническому обслуживанию и ремонту тормозного оборудования вагонов, опробованию тормозов пассажирских поездов, оборудованных электроотоплением, до выключения источника питания высоковольтной цепи отопления.", "b": false, "n": "6.1.3"}, {"t": "6.1.4 Не допускается постановка в поезда, а также отправление со станций формирования и оборота вагонов, у которых тормозное оборудование имеет хотя бы одну из следующих неисправностей:", "b": false, "n": "6.1.4"}, {"t": "- неисправное тормозное оборудование: воздухораспределитель, электровоздухораспределитель, электрическая цепь электропневматического тормоза, авторежим, концевой или разобщительный кран, выпускной клапан, обратный клапан между тормозной магистралью и дополнительным питательным резервуаром на вагонах с дисковыми тормозами, тормозной цилиндр, резервуары, рабочая камера, тормозной блок, реле давления;", "b": false, "n": ""}, {"t": "- повреждение воздухопроводов: трещины, прорывы, протертости и расслоение соединительных рукавов; трещины, надломы и вмятины на воздухопроводах, неплотность их соединений, ослабление трубопровода в местах крепления;", "b": false, "n": ""}, {"t": "- неисправность механической части: триангелей, тяг, подвесок, авторегулятора рычажной передачи, башмаков, клещевых механизмов; трещины или изломы в деталях, откол проушин колодки, неправильное крепление тормозной колодки в башмаке (тормозной накладки);", "b": false, "n": ""}, {"t": "- неисправные или отсутствующие предохранительные устройства и балки авторежимов; - нетиповое крепление механических частей, нетиповые детали и шплинты в узлах;", "b": false, "n": ""}, {"t": "- неисправный стояночный (ручной) тормоз;", "b": false, "n": ""}, {"t": "- ослабление крепления деталей;", "b": false, "n": ""}, {"t": "- неотрегулированная рычажная передача;", "b": false, "n": ""}, {"t": "- толщина тормозных колодок (тормозных накладок) менее минимально-допустимой в эксплуатации.", "b": false, "n": ""}, {"t": "6.1.5 В пунктах формирования грузовых поездов и в пунктах формирования и оборота пассажирских поездов, а также пунктах технического обслуживания грузовых поездов на станциях, предшествующих крутым затяжным спускам, осмотрщики вагонов обязаны проверить исправность и действие стояночных (ручных) тормозов, обращая внимание на легкость приведения в действие и прижатие тормозных колодок к колесам (тормозных накладок к тормозным дискам).", "b": false, "n": "6.1.5"}, {"t": "6.1.6 Оборотный запас воздухораспределителей, предназначенный для замены неисправных на вагонах, хранить на закрытых стеллажах при температуре наружного воздуха.", "b": false, "n": "6.1.6"}, {"t": "6.1.7 Перед соединением рукавов тормозной магистрали работник, производящий соединение рукавов должен очистить головки соединительных рукавов от грязи, льда и снега, проверить состояние уплотнительных колец, при необходимости зачистить поверхности электрических контактов головок рукавов наждачным полотном, продуть ее сжатым воздухом. Негодные уплотнительные кольца заменить. Запрещается наносить смазку на кольца.", "b": false, "n": "6.1.7"}, {"t": "6.1.8 При продувке тормозной магистрали перед соединением рукавов работнику, производящему соединение рукавов необходимо убедиться в свободном проходе воздуха.", "b": false, "n": "6.1.8"}, {"t": "6.1.9 При опробовании автотормозов и обнаружении воздухораспределителей, нечувствительных к торможению и/или отпуску, а также с наличием замедленного отпуска произвести его замену, а пылеулавливающую сетку и фильтр осмотреть и при необходимости заменить. После чего выполнить проверку тормоза данного вагона.", "b": false, "n": "6.1.9"}, {"t": "6.1.10 При плохой подвижности деталей рычажной передачи вагона произвести отцепку вагона и произвести ремонт рычажной передачи. Допускается ремонт рычажной передачи пассажирских вагонов осуществлять без отцепки вагона.", "b": false, "n": "6.1.10"}, {"t": "6.1.11 При наличии снега и льда на рычажной передаче вагона его удалить. При наличии на тележках грузовых вагонов тормозной системы с триангелями бесподвесочного типа необходимо дополнительно очистить направляющие системы от снега и льда.", "b": false, "n": "6.1.11"}, {"t": "6.1.12 Не допускается отправлять в поезде вагоны с тормозными колодками, которые не отходят от колес вследствие замораживания рычажной передачи.", "b": false, "n": "6.1.12"}, {"t": "6.1.13 Все неисправности, выявленные при техническом обслуживании вагонов необходимо устранить.", "b": false, "n": "6.1.13"}, {"t": "6.1.14 При выявлении неисправностей у вагона, которые невозможно устранить на станции, не имеющей пункта технического обслуживания, допускается следование вагона в составе поезда с выключенным тормозом до ближайшего пункта технического обслуживания при условии, что это не угрожает безопасности движения.", "b": false, "n": "6.1.14"}, {"t": "6.1.15 Техническое обслуживание тормозного оборудования вагонов поездов повышенного веса и длины (грузовых поездов обычного или специального формирования) и соединенных поездов разрешается выполнять в составах на разных путях с обязательным полным опробованием автотормозов в каждом составе, подлежащем последующему сцеплению при формировании поезда.", "b": false, "n": "6.1.15"}, {"t": "6.1.16 На станциях, где нет пунктов подготовки вагонов к перевозкам или пунктов технического обслуживания, каждый вагон перед постановкой в поезд должен быть осмотрен и подготовлен для следования до ближайшей станции, имеющей пункт технического обслуживания.", "b": false, "n": "6.1.16"}, {"t": "Порядок предъявления составов поездов к техническому обслуживанию и оформления их готовности, а также порядок осмотра и ремонта вагонов перед постановкой в состав поезда на станциях, где нет пунктов подготовки вагонов к перевозкам или пунктов технического обслуживания, устанавливает руководитель подразделения владельца инфраструктуры.", "b": false, "n": ""}, {"t": "6.2 Технические требования на выполнение технического обслуживания тормозного оборудования вагонов", "b": false, "n": "6.2"}, {"t": "6.2.1 При техническом обслуживании у каждого вагона необходимо:", "b": false, "n": "6.2.1"}, {"t": "- проверить исправность тормозного оборудования;", "b": false, "n": ""}, {"t": "- проверить наличие и исправность крепежных деталей и предохранительных (поддерживающих) устройств тормозного оборудования;", "b": false, "n": ""}, {"t": "- в тормозной рычажной передаче проверить наличие осей, шайб, шплинтов, соответствие и правильность их постановки;", "b": false, "n": ""}, {"t": "- на вагонах, оборудованных авторежимом, проверить исправность опорной балки, контактной планки, крепление опорной балки и контактной планки, положение упора авторежима относительно контактной планки;", "b": false, "n": ""}, {"t": "- проверить состояние, толщину тормозных колодок (тормозных накладок) и их расположение относительно поверхности катания колес (тормозных дисков);", "b": false, "n": ""}, {"t": "- проверить регулировку выходов штоков тормозных цилиндров и тормозной рычажной передачи. При наличии на тележках грузовых вагонов тормозной системы с триангелями бесподвесочного типа проверить положение указателя выхода штока;", "b": false, "n": ""}, {"t": "- проконтролировать правильность включения режимов воздухораспределителей на каждом вагоне с учетом наличия авторежима, в том числе в соответствие с загрузкой и типом тормозных колодок (тормозных накладок).", "b": false, "n": ""}, {"t": "На пассажирских вагонах с дисковыми тормозами дополнительно проверить:", "b": false, "n": ""}, {"t": "- суммарный зазор между обеими тормозными накладками и тормозным диском на каждом диске. Зазор между обеими тормозными накладками и тормозным диском должен быть не более 6 мм. На вагонах, оборудованных стояночными тормозами, зазоры проверять при отпуске после экстренного торможения;", "b": false, "n": ""}, {"t": "- отсутствие пропуска воздуха обратным клапаном на трубопроводе между тормозной магистралью и дополнительным питательным резервуаром;", "b": false, "n": ""}, {"t": "- на станции формирования состояние поверхностей трения дисков (визуально с протяжкой вагонов);", "b": false, "n": ""}, {"t": "- исправность сигнализаторов наличия давления сжатого воздуха, расположенных на борту вагона.", "b": false, "n": ""}, {"t": "На грузовых вагонах проконтролировать в зависимости от наличия или отсутствия на вагоне авторежима, типа колодок (композиционных или чугунных), загрузки вагона, типа и модели вагона правильность включения воздухораспределителя на режим торможения «Порожний», «Средний» или «Груженый». Дополнительно проконтролировать включение на режим «Равнинный» или «Горный» в зависимости от профиля пути.", "b": false, "n": ""}, {"t": "На пассажирских вагонах локомотивной тяги необходимо проконтролировать режим включения воздухораспределителя в зависимости от количества вагонов в составе. Дополнительно проконтролировать правильность включения ускорителя экстренного торможения.", "b": false, "n": ""}, {"t": "6.2.2 При техническом обслуживании состава вагонов или поезда необходимо:", "b": false, "n": "6.2.2"}, {"t": "- проконтролировать соединение рукавов тормозной и питательной магистралей между вагонами, составом вагонов и локомотивом – убедиться в том, что соединительные рукава соединены, концевые краны между вагонами, составом вагонов и локомотивом открыты, хвостовой концевой кран последнего вагона закрыт. На пассажирском подвижном составе дополнительно необходимо проверить правильность и надежность подвешивания рукава;", "b": false, "n": ""}, {"t": "- проконтролировать включение тормозов у вагонов: убедиться в том, что разобщительные краны на подводящих трубах к воздухораспределителям открыты, трехходовые перед тормозными цилиндрами (тормозными блоками) открыты;", "b": false, "n": ""}, {"t": "- проконтролировать плотность тормозной сети состава, которая должна соответствовать установленным нормативам;", "b": false, "n": ""}, {"t": "- проконтролировать плотность питательной сети состава, которая должна соответствовать установленным нормативам;", "b": false, "n": ""}, {"t": "- проконтролировать действие тормоза каждого вагона при торможении и отпуске;", "b": false, "n": ""}, {"t": "- проконтролировать действие электропневматического тормоза с проверкой целостности электрической цепи состава, отсутствие замыкания проводов электропневматического тормоза между собой и на корпус вагона, напряжение в цепи хвостового вагона в режиме торможения. Проверку действия электропневматического тормоза производить от источника питания со стабилизированным выходным напряжением 40-50 В, при этом падение напряжения в электрической цепи проводов электропневматического тормоза в режиме торможения в пересчете на один вагон проверяемого состава должно составлять не более 0,5 В для составов до 20 вагонов включительно и не более 0,3 В для составов большей длины. Воздухораспределители и электровоздухораспределители, работающие неудовлетворительно, заменить исправными;", "b": false, "n": ""}, {"t": "- проконтролировать правильность регулирования тормозной рычажной передачи, действие автоматических регуляторов, которая должна соответствовать установленным нормативам;", "b": false, "n": ""}, {"t": "- проконтролировать выход штока тормозных цилиндров на каждом включенном вагоне, который должен соответствовать установленным нормативам.", "b": false, "n": ""}, {"t": "При наличии на тележках грузовых вагонов тормозной системы с триангелями бесподвесочного типа указатель выхода штока тормозного цилиндра должен находиться в пределах индикатора рабочего хода;", "b": false, "n": ""}, {"t": "- состояние противоюзного устройства (при наличии). Запрещается эксплуатация вагонов с дисковыми тормозами при неисправности противоюзного устройства. При обнаружении в пути следования вагонов с неисправным противоюзным устройством допускается довести их до пунктов формирования или оборота, где неисправность необходимо устранить. При этом до устранения неисправности противоюзное устройство должно быть выключено;", "b": false, "n": ""}, {"t": "- действие скоростного регулятора (при наличии);", "b": false, "n": ""}, {"t": "- действие магниторельсового тормоза (при наличии).", "b": false, "n": ""}, {"t": "6.2.3 Все тормозное оборудование должно быть надежно закреплено, ослабленные детали крепления необходимо затянуть, взамен неисправных и недостающих деталей крепления и предохранительных (поддерживающих) устройств должны быть установлены исправные детали крепления и предохранительные (поддерживающие) устройства.", "b": false, "n": "6.2.3"}, {"t": "6.2.4 У резинотекстильных трубок соединительных рукавов не допускается наличие расслоений, надрывов и глубоких трещин, доходящих до текстильного слоя, отслоений внешнего или внутреннего слоя. У резинотекстильных трубок соединительных рукавов с металлической оплеткой также не допускается более пяти участков разрушений металлической оплетки размером 20х20 мм на всей длине рукава.", "b": false, "n": "6.2.4"}, {"t": "6.2.5 Вертикальные оси в тормозной рычажной передаче, должны быть установлены головками вверх. Оси, установленные горизонтально, должны быть обращены шайбами наружу от продольной оси вагона. Горизонтальные оси, расположенные на продольной оси вагона, должны быть обращены головками в одну сторону.", "b": false, "n": "6.2.5"}, {"t": "На оси тормозной рычажной передачи должны быть установлены стандартные шайбы и шплинты. Обе ветви шплинта должны быть разведены на угол между ними не менее 90º. При необходимости замены шплинты следует устанавливать новые, повторное использование шплинтов запрещается.", "b": false, "n": ""}, {"t": "Расстояние между шайбой и шплинтом в шарнирных соединениях тормозной рычажной передачи при замене не должно превышать 3 мм. Допускается регулировать этот размер постановкой не более одной дополнительной шайбы необходимой толщины, но не более 6 мм, с таким же диаметром отверстия, как и у основной шайбы.", "b": false, "n": ""}, {"t": "6.2.6 Опорная балка для авторежима не должна иметь трещин и деформации.", "b": false, "n": "6.2.6"}, {"t": "Опорная балка для авторежима должна крепиться на специальных полках боковых рам тележки вагона через резинометаллические элементы и иметь возможность свободно перемещаться в пазах боковых рам.", "b": false, "n": ""}, {"t": "Контактная планка должна быть надежно закреплена на опорной балке с помощью крепежных деталей.", "b": false, "n": ""}, {"t": "Под контактной планкой могут устанавливаться регулировочные планки, закрепленные на опорной балке заодно с контактной планкой. Приварка регулировочных планок поверх контактной планки запрещена.", "b": false, "n": ""}, {"t": "Упор авторежима должен находиться над средней зоной контактной планки – расстояние от упора авторежима до края контактной планки не должно быть менее 50 мм.", "b": false, "n": ""}, {"t": "6.2.7 Тормозные колодки не должны иметь изломов и трещин.", "b": false, "n": "6.2.7"}, {"t": "Тормозные колодки могут выступать за кромку наружной грани обода колеса на грузовых вагонах не более чем на 10 мм. На пассажирских вагонах локомотивной тяги и грузовых вагонах с тележками пассажирского типа выход колодок за кромку наружной грани обода колеса не допускается.", "b": false, "n": ""}, {"t": "Минимальная толщина тормозных колодок, при которой они подлежат замене (толщина предельно изношенных тормозных колодок) устанавливается в зависимости от длины гарантийного участка, но не менее:", "b": false, "n": ""}, {"t": "- чугунных - 12 мм;", "b": false, "n": ""}, {"t": "- композиционных с металлическим штампованным каркасом - 14 мм;", "b": false, "n": ""}, {"t": "- композиционных с сетчато-проволочным каркасом - 10 мм.", "b": false, "n": ""}, {"t": "Композиционные тормозные колодки с сетчато-проволочным каркасом можно отличить от композиционных тормозных колодок с металлическим штампованным каркасом по ушку, заполненному фрикционной композиционной массой.", "b": false, "n": ""}, {"t": "Толщину тормозной колодки проверять с наружной стороны, а при клиновидном износе – на расстоянии 50 мм от тонкого торца.", "b": false, "n": ""}, {"t": "При износе боковой поверхности тормозных колодок со стороны гребня колеса необходимо проверить состояние триангелей, траверс (у грузовых вагонов с тележками пассажирского типа), тормозных башмаков и их подвесок, тормозные колодки заменить.", "b": false, "n": ""}, {"t": "Минимальная толщина вновь устанавливаемой тормозной колодки должна быть не менее 25 мм, при этом клиновидный износ не допускается.", "b": false, "n": ""}, {"t": "Металлокерамические тормозные накладки, эксплуатируемые с не вентилируемыми тормозными дисками, толщиной 13 мм и менее, металлокерамические тормозные накладки, эксплуатируемые с вентилируемыми тормозными дисками, толщиной 16 мм и менее и композиционные тормозные накладки толщиной 5 мм и менее по наружному радиусу накладок подлежат замене. Толщину тормозной накладки следует проверять в верхней и нижней части тормозной накладки. Допускается разница толщин между верхней и нижней частью тормозной накладки в держателе наклад
