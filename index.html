false, "n": ""}, {"t": "б) Вторую и последующие ступени торможения, при необходимости, или отпуск автоматических тормозов выполнять после использования положения «Перекрыша с питанием» для грузовых поездов с составом до 350 осей включительно по истечении не менее 6 секунд, а для грузовых поездов с составом более 350 осей по истечении не менее 8 секунд. Ступени торможения выполнять снижением давления в уравнительном резервуаре в пределах от 0,03 до 0,08 МПа (от 0,3 до 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "Если кран машиниста имеет положение «Замедленное торможение», то после получения необходимой разрядки уравнительного резервуара разрешается задерживать ручку крана машиниста в этом положении в течение 5-8 секунд перед перемещением в положение «Перекрыша с питанием» с целью стабилизации давления в уравнительном резервуаре.", "b": false, "n": ""}, {"t": "в) Повторные торможения выполнять в виде цикла, состоящего из торможения и отпуска, для достижения требуемой скорости движения.", "b": false, "n": ""}, {"t": "г) С целью предупреждения истощения автоматических тормозов в поезде при следовании по спуску, на котором выполняются повторные торможения, необходимо выдерживать между торможениями время не менее 60 секунд (1 минуты) для обеспечения подзарядки тормозной магистрали поезда. Для выполнения этого требования не делать частых торможений и не отпускать автотормоза при большой скорости.", "b": false, "n": ""}, {"t": "Если при отпуске автоматических тормозов положением ручки крана машиниста «Зарядка и отпуск» время для подзарядки рабочих камер воздухораспределителей на равнинном режиме работы было менее 60 секунд (1 минуты), очередную ступень торможения разрешается выполнять снижением давления в уравнительном резервуаре не менее чем на 0,03 МПа (0,3 кгс/см2) больше первоначальной ступени торможения Если после отпуска автоматических тормозов возникает необходимость повторного торможения, то этот отпуск выполнять заблаговременно и при такой скорости движения, чтобы обеспечить необходимую зарядку автоматических тормозов к повторному торможению.", "b": false, "n": ""}, {"t": "д) Время непрерывного следования поезда с постоянной ступенью торможения не должно превышать 150 секунд (2,5 минуты). При необходимости более длительного торможения необходимо увеличить разрядку тормозной магистрали и после достаточного снижения скорости отпустить тормоза. Исходя из местных условий, по результатам поездок второго рода, указанное время может быть увеличено до 300 секунд (5 минут) и должно быть указано в технико-распорядительных документах владельца инфраструктуры и технико-распорядительных документов владельца подвижного состава.", "b": false, "n": ""}, {"t": "е) Все служебные торможения проводить с применением положения ручки крана машиниста «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "ж) При выполнении полного служебного торможения в один прием снижать давление в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2).", "b": false, "n": ""}, {"t": "з) Если по какой-либо причине при следовании по спуску давление в тормозной магистрали будет ниже 0,34 МПа (3,4 кгс/см2), остановить поезд, привести в действие вспомогательный тормоз локомотива установкой ручки крана в крайнее тормозное положение, после чего отпустить автоматические тормоза и заряжать тормозную магистраль на стоянке до начала движения поезда (либо в течение не менее 300 секунд (5 минут), если поезд удерживается вспомогательным тормозом локомотива).", "b": false, "n": ""}, {"t": "Если при следовании поезда выполнено последнее торможение, при котором давление в магистрали ниже 0,34 МПа (3,4 кгс/см2) и далее по условиям профиля пути скорость поезда будет постоянной или снижаться настолько, что потребуется произвести отпуск автоматических тормозов, а за время до следующего торможения представляется возможность осуществить подзарядку тормозной сети поезда до установленного давления, останавливать поезд для подзарядки не требуется.", "b": false, "n": ""}, {"t": "и) Перед торможением снижением давления в уравнительном резервуаре более чем на 0,10 МПа (1,0 кгс/см2) предварительно привести в действие приборы пескоподачи.", "b": false, "n": ""}, {"t": "к) Включать тягу на локомотивах в грузовых (грузопассажирских) поездах после ступени торможения в движущемся поезде не ранее 1 минуты (60 секунд), но не ранее времени отпуска хвостовых вагонов, указанного в «Справке об обеспеченности поезда тормозами и исправном их действии», после перевода ручки крана машиниста в положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "л) При следовании со скоростью более 80 км/ч и появлении на локомотивном светофоре желтого огня приводить автоматические тормоза в действие снижением давления в уравнительном резервуаре в груженом поезде на 0,08 - 0,10 МПа (0,8 - 1,0 кгс/см2), в порожнем и груженом при преобладании в составе более 50% порожних вагонов – на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2).", "b": false, "n": ""}, {"t": "При меньшей скорости движения или большей длине блок участков торможение начинать с учетом скорости, профиля пути и эффективности тормозных средств на соответствующем расстоянии от светофора.", "b": false, "n": ""}, {"t": "м) Полный отпуск автоматических тормозов после служебного торможения производить путём повышения давления в уравнительном резервуаре положением «Зарядка и отпуск» до зарядного давления при длине поезда до 100 осей (включительно) и на 0,02 - 0,06 МПа (0,2 - 0,6 кгс/см2) выше зарядного в поездах длиной выше 100 осей в зависимости от условий ведения поезда с последующим переводом его в поездное положение. После снижения давления до нормального зарядного при необходимости повторить указанное завышение давления.", "b": false, "n": ""}, {"t": "На незатяжных спусках, где применяются повторные торможения отпуск автоматических тормозов между повторными торможениями разрешается выполнять повышением давления в уравнительном резервуаре до зарядного давления. Если в процессе повторных торможений возникает необходимость тормозить с повышенного зарядного давления, отпуск при последнем из частых повторных торможений выполнять давлением на 0,02 - 0,06 МПа (0,2 - 0,6 кгс/см2) выше давления уравнительного резервуара, с которого выполнялось торможение.", "b": false, "n": ""}, {"t": "н) После экстренного торможения полный отпуск автоматических тормозов выполнять положением «Зарядка и отпуск» повышением давления в уравнительном резервуаре выше зарядного давления на 0,10 - 0,12 МПа (1,0 - 1,2 кгс/см2), а в поездах длиной до 100 осей (включительно) до зарядного давления с последующим переводом в поездное положение.", "b": false, "n": ""}, {"t": "о) При длине состава груженого поезда более 100 до 350 осей перед началом отпуска автоматических тормозов затормаживать локомотив краном вспомогательного тормоза с давлением в тормозных цилиндрах 0,10 - 0,22 МПа (1,0 - 2,2 кгс/см2) и выдерживать в заторможенном состоянии в течение 30 - 40 секунд, после чего плавно отпустить его после отпуска автоматических тормозов состава поезда.", "b": false, "n": ""}, {"t": "п) В поездах с составом длиной более 300 осей не отпускать автоматические тормоза при скорости менее 20 км/ч до полной остановки поезда.", "b": false, "n": ""}, {"t": "р) После остановки грузового (грузопассажирского) поезда с применением автоматических тормозов необходимо выждать время с момента перевода ручки крана машиниста в положение «Зарядка и отпуск» до включения тяги не менее:", "b": false, "n": ""}, {"t": "- после ступени торможения – не менее 90 секунд (1,5 минуты);", "b": false, "n": ""}, {"t": "- после полного служебного торможения – не менее 120 секунд (2 минуты);", "b": false, "n": ""}, {"t": "- после экстренного торможения в поездах длиной до 100 осей – не менее 240 секунд (4 минут), более 100 осей – не менее 360 секунд (6 минут).", "b": false, "n": ""}, {"t": "При отрицательных температурах окружающего атмосферного воздуха время с момента перевода ручки крана машиниста в отпускное положение до приведения локомотива в движение увеличивается в полтора раза.", "b": false, "n": ""}]}, {"id": "tb10_3_2", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.3.2 Управление автоматическими тормозами грузового поезда на затяжных спусках при включении воздухораспределителей грузового типа на равнинный режим работы", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 106–109", "paras": [{"t": "а) Первую ступень служебного торможения выполнять снижением давления в уравнительном резервуаре на 0,04 - 0,08 МПа (0,4 - 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "б) Вторую и последующие ступени торможения, при необходимости, или отпуск автоматических тормозов выполнять после использования положения «Перекрыша с питанием» для грузовых поездов с составом до 350 осей включительно по истечении не менее 6 секунд, а для грузовых поездов с составом более 350 осей по истечении не менее 8 секунд. Ступени торможения выполнять снижением давления в уравнительном резервуаре в пределах от 0,03 до 0,08 МПа (от 0,3 до 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "Если кран машиниста имеет положение «Замедленное торможение», то после получения необходимой разрядки уравнительного резервуара разрешается задерживать ручку крана машиниста в этом положении в течение 5-8 секунд перед перемещением в положение «Перекрыша с питанием», с целью стабилизации давления в уравнительном резервуаре.", "b": false, "n": ""}, {"t": "в) Повторные торможения выполнять в виде цикла, состоящего из торможения и отпуска, для достижения требуемой скорости движения.", "b": false, "n": ""}, {"t": "г) С целью предупреждения истощения автоматических тормозов в поезде при следовании по спуску, на котором выполняются повторные торможения, необходимо выдерживать между торможениями время не менее 60 секунд (1 минуты) для обеспечения подзарядки тормозной магистрали поезда. Для выполнения этого требования не делать частых торможений и не отпускать автотормоза при большой скорости.", "b": false, "n": ""}, {"t": "Если при отпуске автоматических тормозов положением ручки крана машиниста «Зарядка и отпуск» время для подзарядки рабочих камер воздухораспределителей было менее 60 секунд (1 минуты), очередную ступень торможения разрешается выполнять снижением давления в уравнительном резервуаре не менее чем на 0,03 МПа (0,3 кгс/см2) больше первоначальной ступени торможения.", "b": false, "n": ""}, {"t": "Если после отпуска автоматических тормозов возникает необходимость повторного торможения, то этот отпуск выполнять заблаговременно и при такой скорости движения, чтобы обеспечить необходимую зарядку автоматических тормозов к повторному торможению.", "b": false, "n": ""}, {"t": "д) Время непрерывного следования поезда с постоянной ступенью торможения на спуске не должно превышать 180 секунд (2,5 минут). При необходимости более длительного торможения необходимо увеличить разрядку тормозной магистрали и после достаточного снижения скорости отпустить тормоза.", "b": false, "n": ""}, {"t": "Исходя из местных условий, по результатам поездок второго рода, указанное время может быть увеличено до 300 секунд (5 минут) и должно быть указано в технико-распорядительных документах владельца инфраструктуры и технико-распорядительных документов владельца подвижного состава.", "b": false, "n": ""}, {"t": "е) Все служебные торможения проводить с применением положения ручки крана машиниста «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "ж) При выполнении полного служебного торможения в один прием снижать давление в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2).", "b": false, "n": ""}, {"t": "з) При необходимости применения полного служебного торможения, а также в процессе регулировочных торможений дополнительными ступенями при следовании по спуску не разряжать тормозную магистраль до давления ниже 0,34 МПа (3,4 кгс/см2). Если по какой-либо причине при следовании по спуску давление в тормозной магистрали будет ниже 0,34 МПа (3,4 кгс/см2), остановить поезд, привести в действие вспомогательный тормоз локомотива установкой ручки крана в крайнее тормозное положение, после чего отпустить автоматические тормоза и заряжать тормозную магистраль на стоянке в течение не менее 300 секунд (5 минут), если поезд удерживается вспомогательным тормозом локомотива.", "b": false, "n": ""}, {"t": "Если при следовании поезда выполнено последнее торможение, при котором давление в магистрали ниже 0,34 МПа (3,4 кгс/см2) и далее по условиям профиля пути скорость поезда будет постоянной или снижаться настолько, что потребуется произвести отпуск автоматических тормозов, а за время до следующего торможения представляется возможность осуществить подзарядку тормозной сети поезда до установленного давления, останавливать поезд для подзарядки не требуется.", "b": false, "n": ""}, {"t": "и) Перед торможением снижением давления в уравнительном резервуаре более чем на 0,10 МПа (1,0 кгс/см2) предварительно привести в действие приборы пескоподачи.", "b": false, "n": ""}, {"t": "к) Включать тягу на локомотивах в грузовых (грузопассажирских) поездах после ступени торможения в движущемся поезде не ранее 1 минуты (60 секунд), но не ранее времени отпуска хвостовых вагонов, указанного в «Справке об обеспеченности поезда тормозами и исправно их действии», после перевода ручки крана машиниста в положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "л) Полный отпуск автоматических тормозов после служебного торможения производить путём повышения давления в уравнительном резервуаре положением «Зарядка и отпуск» до зарядного давления при длине поезда до 100 осей (включительно) и на 0,03 - 0,07 МПа (0,3 - 0,7 кгс/см2) выше зарядного в поездах длиной выше 100 осей в зависимости от условий ведения поезда с последующим переводом его в поездное положение.", "b": false, "n": ""}, {"t": "Разрешается после повышения давления в уравнительном резервуаре на указанную величину выдержать ручку крана машиниста в положении «Перекрыша с питанием» не более 30 секунд с последующим переводом ручки крана машиниста в положение, «Поездное» через положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "м) Если в процессе повторных торможений возникает необходимость тормозить с повышенного зарядного давления, отпуск выполнять давлением на 0,02 - 0,06 МПа (0,2 - 0,6 кгс/см2) выше давления, уравнительного резервуара, с которого выполнялось последнее торможение.", "b": false, "n": ""}, {"t": "н) После экстренного торможения полный отпуск автоматических тормозов выполнять положением «Зарядка и отпуск» повышением давления в уравнительном резервуаре выше зарядного давления на 0,10 - 0,12 МПа (1,0 - 1,2 кгс/см2), а в поездах длиной до 100 осей (включительно) до зарядного давления с последующим переводом в поездное положение.", "b": false, "n": ""}, {"t": "о) В случаях невозможности удержания поезда вспомогательным тормозом локомотива для обеспечения необходимого минимального времени на зарядку и отпуск автоматических тормозов, в случаях применения экстренного торможения или разрядки тормозной магистрали давлением ниже 0,34 МПа (3,4 кгс/см2) локомотивная бригада должна произвести переключение 1/3 воздухораспределителей на горный режим в голове состава. Далее производит отпуск тормозов постановкой ручки крана машиниста в «Поездное положение» до повышения давления в уравнительном резервуаре на величину 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2) меньше зарядного давления с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием». После выдержки времени на зарядку и отпуск автоматических тормозов, произвести полный отпуск положением, «Зарядка и отпуск» до завышения давления в уравнительном резервуаре на 0,05 - 0,07 МПа (0,5 - 0,7 кгс/см2) выше зарядного. При начале движения головной части поезда не снижать давление в тормозных цилиндрах локомотива менее 0,15 МПа (1,5 кгс/см2) с последующим плавным отпуском после начала движения всего поезда.", "b": false, "n": ""}, {"t": "п) При длине состава груженого поезда более 100 до 350 осей перед началом отпуска автоматических тормозов затормаживать локомотив краном вспомогательного тормоза с давлением в тормозных цилиндрах 0,10 - 0,22 МПа (1,0 - 2,2 кгс/см2) и выдерживать в заторможенном состоянии в течение 30 - 40 секунд, после чего плавно отпустить его.", "b": false, "n": ""}, {"t": "р) В поездах с составом длиной более 300 осей не отпускать автоматические тормоза при скорости менее 20 км/ч до полной остановки поезда.", "b": false, "n": ""}, {"t": "с) После остановки грузового (грузопассажирского) поезда с применением автоматических тормозов необходимо выждать время с момента перевода ручки крана машиниста в положение «Зарядка и отпуск» до включения тяги не менее:", "b": false, "n": ""}, {"t": "- после ступени торможения – не менее 90 секунд (1,5 минуты);", "b": false, "n": ""}, {"t": "- после полного служебного торможения – не менее 120 секунд (2 минуты);", "b": false, "n": ""}, {"t": "- после экстренного торможения в поездах длиной до 100 осей – не менее 240 секунд (4 минут), более 100 осей – не менее 360 секунд (6 минут).", "b": false, "n": ""}, {"t": "При отрицательных температурах окружающего атмосферного воздуха время с момента перевода ручки крана машиниста в отпускное положение до приведения локомотива в движение увеличивается в полтора раза.", "b": false, "n": ""}]}, {"id": "tb10_3_3", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.3.3 Управление автоматическими тормозами грузового поезда при включении воздухораспределителей грузового типа на горный режим работы", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 109–112", "paras": [{"t": "а) Первую ступень служебного торможения выполнять снижением давления в уравнительном резервуаре 0,06 - 0,10 МПа (0,6 - 0,10 кгс/см2).", "b": false, "n": ""}, {"t": "Далее силу торможения регулировать в зависимости от скорости движения поезда и профиля пути. При этом не выполнять полный отпуск автоматических тормозов, если до окончания подзарядки тормозной магистрали и выполнения повторного торможения скорость поезда превысит установленную.", "b": false, "n": ""}, {"t": "б) Вторую и последующие ступени торможения, при необходимости, или отпуск автоматических тормозов выполнять после использования положения «Перекрыша с питанием» для грузовых поездов с составом до 350 осей включительно по истечении не менее 6 секунд, а для грузовых поездов с составом более 350 осей по истечении не менее 8 секунд. Ступени торможения выполнять снижением давления в уравнительном резервуаре в пределах от 0,03 до 0,8 МПа (от 0,3 до 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "Если кран машиниста имеет положение «Замедленное торможение», то после получения необходимой разрядки уравнительного резервуара разрешается задерживать ручку крана машиниста в этом положении в течение 5-8 секунд перед перемещением в положение «Перекрыша с питанием», с целью стабилизации давления в уравнительном резервуаре.", "b": false, "n": ""}, {"t": "в) Повторные торможения выполнять в виде цикла, состоящего из торможения и отпуска, для достижения требуемой скорости движения.", "b": false, "n": ""}, {"t": "Если после отпуска автоматических тормозов возникает необходимость повторного торможения, то этот отпуск выполнять заблаговременно и при такой скорости движения, чтобы обеспечить необходимую зарядку автоматических тормозов к повторному торможению.", "b": false, "n": ""}, {"t": "г) Все служебные торможения проводить с применением положения ручки крана машиниста «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "д) При выполнении полного служебного торможения в один прием снижать давление в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2).", "b": false, "n": ""}, {"t": "е) При необходимости применения полного служебного торможения, а также в процессе регулировочных торможений дополнительными ступенями при следовании по спуску не разряжать тормозную магистраль до давления ниже 0,34 МПа (3,4 кгс/см2). Если по какой-либо причине при следовании по спуску давление в тормозной магистрали будет ниже 0,34 МПа (3,4 кгс/см2), остановить поезд, привести в действие вспомогательный тормоз локомотива установкой ручки крана в крайнее тормозное положение, после чего отпустить автоматические тормоза и заряжать тормозную магистраль на стоянке в течение не менее 300 секунд (5 минут), если поезд удерживается вспомогательным тормозом локомотива.", "b": false, "n": ""}, {"t": "Если при следовании поезда выполнено последнее торможение, при котором давление в магистрали ниже 0,34 МПа (3,4 кгс/см2) и далее по условиям профиля пути скорость поезда будет постоянной или снижаться настолько, что потребуется произвести отпуск автоматических тормозов, а за время до следующего торможения представляется возможность осуществить подзарядку тормозной сети поезда до установленного давления, останавливать поезд для подзарядки не требуется.", "b": false, "n": ""}, {"t": "ж) После остановки поезда, при невозможности удержания поезда вспомогательным тормозом локомотива, в процессе отпуска и зарядки тормозов, произвести отпуск тормозов постановкой ручки крана машиниста в «Поездное положение» до повышения давления в уравнительном резервуаре на величину 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2) меньше зарядного давления с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием». После выдержки времени на зарядку и отпуск автоматических тормозов, произвести полный отпуск положением «Зарядка и отпуск» до завышения давления в уравнительном резервуаре на 0,05 - 0,07 МПа (0,5 - 0,7 кгс/см2) выше зарядного. При начале движения головной части поезда не снижать давление в тормозных цилиндрах локомотива менее 0,15 МПа (1,5 кгс/см2) с последующим плавным отпуском после начала движения всего поезда.", "b": false, "n": ""}, {"t": "з) Перед торможением снижением давления в уравнительном резервуаре более чем на 0,10 МПа (1,0 кгс/см2) предварительно привести в действие приборы пескоподачи.", "b": false, "n": ""}, {"t": "и) Включать тягу на локомотивах после ступени торможения в движущемся поезде не ранее 1 минуты (60 секунд) после перевода ручки крана машиниста в положение «Зарядка и отпуск», но не ранее времени отпуска хвостовых вагонов, указанного в «Справке об обеспеченности поезда тормозами и исправно их действии».", "b": false, "n": ""}, {"t": "к) Если полного отпуска не требуется, то производить ступенчатый отпуск переводом ручки крана в поездное положение до повышения давления в уравнительном резервуаре при каждой ступени отпуска не менее чем на 0,02 МПа (0,2 кгс/см2). При давлении в тормозной магистрали ниже зарядного на 0,04 МПа (0,4 кгс/см2) производить только полный отпуск.", "b": false, "n": ""}, {"t": "л) Полный отпуск автоматических тормозов после служебного торможения производить путём повышения давления в уравнительном резервуаре положением, «Зарядка и отпуск» на 0,05 - 0,10 МПа (0,5 - 1,0 кгс/см2) в зависимости от условий ведения поезда с последующим переводом его в поездное положение.", "b": false, "n": ""}, {"t": "Разрешается после повышения давления в уравнительном резервуаре на указанную величину выдержать ручку крана машиниста в положении «Перекрыша с питанием» не более 30 секунд с последующим переводом ручки крана машиниста в положение, «Поездное» через положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "м) Если в процессе повторных торможений возникла необходимость произвести торможение с повышенного зарядного давления, отпуск при последнем из торможений выполнить давлением на 0,05 - 0,08 МПа (0,5 - 0,8 кгс/см2) выше давления уравнительного резервуара, с которого выполнялось торможение.", "b": false, "n": ""}, {"t": "н) После экстренного торможения полный отпуск автоматических тормозов выполнять положением «Зарядка и отпуск» повышением давления в уравнительном резервуаре выше зарядного давления на 0,10 - 0,12 МПа (1,0 - 1,2 кгс/см2), а в поездах длиной до 100 осей (включительно) до зарядного давления с последующим переводом в поездное положение.", "b": false, "n": ""}, {"t": "о) При длине состава груженого поезда более 100 до 350 осей перед началом полного отпуска автоматических тормозов затормаживать локомотив краном вспомогательного тормоза с давлением в тормозных цилиндрах 0,15 - 0,22 МПа (1,5 - 2,2 кгс/см2) и выдерживать в заторможенном состоянии 50 - 60 секунд, но не менее времени указанного в «Справке об обеспеченности поезда тормозами и исправно их действии», после чего плавно отпустить вспомогательный тормоз.", "b": false, "n": ""}, {"t": "п) После остановки грузового (грузопассажирского) поезда с применением автоматических тормозов необходимо выждать время с момента перевода ручки крана машиниста в положение «Зарядка и отпуск» до включения тяги не менее:", "b": false, "n": ""}, {"t": "- после ступени торможения – не менее 120 секунд (2 минуты);", "b": false, "n": ""}, {"t": "- после полного служебного торможения – не менее 210 секунд (3,5 минуты);", "b": false, "n": ""}, {"t": "- после экстренного торможения в поездах длиной до 100 осей – не менее 240 секунд (4 минут), более 100 осей – не менее 360 секунд (6 минут).", "b": false, "n": ""}, {"t": "При отрицательных температурах окружающего атмосферного воздуха время с момента перевода ручки крана машиниста в отпускное положение до приведения локомотива в движение увеличивается в полтора раза.", "b": false, "n": ""}]}, {"id": "tb10_3_4", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.3.4 Управление тормозами при ведении грузового поезда по ломаному профилю пути", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 112–113", "paras": [{"t": "а) Спуск с переходом на подъем При ведении поезда по спуску не допускать превышения установленной для данного участка скорости.", "b": false, "n": ""}, {"t": "Если скорость может увеличиваться более установленной, применить тормоза и после снижения скорости отпустить их с таким расчетом, чтобы въезжать на подъем с отпущенными тормозами и максимально допускаемой скоростью.", "b": false, "n": ""}, {"t": "Включать тягу разрешается только после полного отпуска автоматических тормозов.", "b": false, "n": ""}, {"t": "б) Спуск различной крутизны При ведении грузового поезда с выключенной тягой тяги по спуску различной крутизны необходимо применять ступенчатое торможение вспомогательным тормозом локомотива при переходе со спуска меньшей крутизны на спуск большей крутизны. При этом следовании с применением вспомогательного тормоза на одной ступени разрешается не более 120 секунд (2 минут).", "b": false, "n": ""}, {"t": "в) Спуск с переходом на площадку и снова на спуск В процессе ведения грузового поезда по спуску с переходом на короткую площадку (менее длины поезда) и далее снова на спуск при выходе локомотива на спуск после площадки рекомендуется плавно привести в действие вспомогательный тормоз локомотива. При выходе на спуск всего поезда в зависимости от скорости движения отпустить ступенями вспомогательный тормоз.", "b": false, "n": ""}, {"t": "Если площадка после спуска длинная (более длины поезда), то на спуске рекомендуется полностью отпустить автоматические тормоза (если они приводились в действие для снижения скорости) и следовать по площадке с отпущенными автоматическими тормозами, при необходимости, с включенной тягой.", "b": false, "n": ""}, {"t": "При выходе локомотива на следующий спуск рекомендуется привести в действие вспомогательный тормоз и отпустить его ступенями при выходе всего поезда на спуск, если по условиям профиля не требуется применение автотормозов.", "b": false, "n": ""}, {"t": "г) Спуск с переходом на площадку и далее на подъем Если в процессе ведения грузового поезда по спуску с переходом на площадку и далее на подъем по условиям ведения поезда потребуется применение автоматических тормозов при следовании поезда по площадке, то при отпуске тормозов, если головная часть поезда следует в подъем затормаживать локомотив краном вспомогательного тормоза не требуется, если он не был заторможен автоматическим тормозом локомотива. При этом включать тягу на локомотивах после ступени торможения в движущемся поезде следует не ранее чем через 1 минуту (60 секунд), но не ранее времени отпуска хвостовых вагонов, указанного в «Справке об обеспеченности поезда тормозами и исправном их действии» или после перевода ручки крана машиниста в отпускное положение.", "b": false, "n": ""}]}, {"id": "tb10_4", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.4 Управления автоматическими тормозами грузовых поездов повышенной длины, повышенного веса и длины", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 113–115", "paras": [{"t": "10.4.1 Максимальная допускаемая скорость движения поездов по условиям обеспеченности тормозами устанавливается в соответствии с нормами обеспечения поездов тормозами, утвержденными владельцем инфраструктуры.", "b": false, "n": "10.4.1"}, {"t": "10.4.2 Зарядное давление в тормозной магистрали на поездном локомотиве в составе поезда устанавливать:", "b": false, "n": "10.4.2"}, {"t": "- порожнего поезда 0,48 - 0,50 МПа (4,8 - 5,0 кгс/см2);", "b": false, "n": ""}, {"t": "- груженого поезда 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2).", "b": false, "n": ""}, {"t": "При этом давление в тормозной магистрали хвостового вагона не должно отличаться более чем на 0,07 МПа (0,7 кгс/см2) от зарядного давления.", "b": false, "n": ""}, {"t": "10.4.3 Служебные торможения при снижении давления в уравнительном резервуаре более 0,06 МПа (0,6 кгс/см2) вплоть до полного служебного торможения в один прием с головного локомотива выполнять постановкой ручки крана машиниста в положение служебного торможения с выдержкой в этом положении до снижения давления в уравнительном резервуаре на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2) и последующим переводом в положение «Замедленное торможение». После получения необходимой разрядки ручку крана машиниста перевести в положение «Перекрыша с питанием».", "b": false, "n": "10.4.3"}, {"t": "10.4.4 Вторую ступень торможения, при необходимости, или отпуск автоматических тормозов выполнять по истечении не менее 10 секунд после использования положения «Перекрыша с питанием».", "b": false, "n": "10.4.4"}, {"t": "10.4.5 Служебные торможения груженых поездов вплоть до полного служебного выполнять в два приема: с первоначальным снижением давления в уравнительном резервуаре на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2) с последующей выдержкой ручки крана машиниста в течение не менее 10 секунд в положении «Перекрыша с питанием» и последующим снижением давления в уравнительном резервуаре на необходимую величину, но не менее, чем на 0,03 МПа (0,3 кгс/см2) в положение служебного торможения и по достижении необходимого давления перевести ручку крана машиниста в положение «Перекрыша с питанием». Допускается вместо положения служебного торможения использовать положение «Замедленное торможение» без 10 секундной выдержки.", "b": false, "n": "10.4.5"}, {"t": "10.4.6 Запрещается производить отпуск автоматических тормозов:", "b": false, "n": "10.4.6"}, {"t": "- в поездах повышенного веса и длины при скорости менее 30 км/ч;", "b": false, "n": ""}, {"t": "- в поездах повышенной длины при скорости менее 20 км/ч.", "b": false, "n": ""}, {"t": "10.4.7 Полное служебное торможение выполнять снижением давления в уравнительном резервуаре на 0,18 - 0,20 МПа (1,8 – 2,0 кгс/см2).", "b": false, "n": "10.4.7"}, {"t": "10.4.8 Отпуск автоматических тормозов в пути следования выполнять положением ручки крана машиниста «Зарядка и отпуск» в зависимости от длины состава и плотности тормозной сети поезда на 0,05 - 0,10 МПа (0,5 - 1,0 кгс/см2) выше зарядного.", "b": false, "n": "10.4.8"}, {"t": "Разрешается после повышения давления в уравнительном резервуаре на указанную величину выдержать ручку крана машиниста в положении «Перекрыша с питанием» в течение 30 - 40 секунд с последующим переводом ручки крана машиниста в положение «Поездное» через положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "10.4.9 Если в процессе отпуска автоматических тормозов с завышением давления в тормозной магистрали выше зарядного время для подзарядки рабочих камер воздухораспределителей было менее 120 секунд (2 минут), разрешается очередную ступень торможения выполнять снижением давления в уравнительном резервуаре на 0,02 - 0,03 МПа (0,2 - 0,3 кгс/см2) больше начальной ступени.", "b": false, "n": "10.4.9"}, {"t": "10.4.10 В момент начала отпуска автоматических тормозов груженого поезда затормозить локомотив краном вспомогательного тормоза с давлением в тормозных цилиндрах 0,10 - 0,22 МПа (1,0 - 2,2 кгс/см2), выдержать локомотив в заторможенном состоянии 40-60 секунд, после чего плавно отпустить тормоз локомотива.", "b": false, "n": "10.4.10"}, {"t": "10.4.11 При трогании с места после остановки время с момента перевода ручки крана машиниста в положение «Зарядка и отпуск» до включения тяги должно быть не менее:", "b": false, "n": "10.4.11"}, {"t": "- после служебного торможения 180 секунд (3 минуты),", "b": false, "n": ""}, {"t": "- после полного служебного торможения 240 секунд (4 минуты),", "b": false, "n": ""}, {"t": "- после экстренного – 480 секунд (8 минут).", "b": false, "n": ""}, {"t": "При отрицательных температурах окружающего атмосферного воздуха время с момента перевода ручки крана машиниста в отпускное положение до приведения локомотива в движение увеличивается в полтора раза.", "b": false, "n": ""}, {"t": "10.4.12 При наличии автоматических систем, позволяющих контролировать на локомотиве величину давления тормозной магистрали в хвосте поезда, включение тяги в движении выполнять не ранее:", "b": false, "n": "10.4.12"}, {"t": "- после служебного торможения - повышения давления на половину величины снижения давления, предшествовавшей разрядки тормозной магистрали;", "b": false, "n": ""}, {"t": "- после полного служебного торможения - повышения давления на 0,10 МПа (1,0 кгс/см2).", "b": false, "n": ""}]}, {"id": "tb10_5", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.5 Управление автоматическими тормозами соединенного поезда с автономными тормозными магистралями", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 115–116", "paras": [{"t": "10.5.1 Пропускать соединенные грузовые поезда с сохранением автономности тормозных магистралей каждого поезда разрешается только при ликвидации последствий крушений, аварий и стихийных бедствий. Их пропуск на двухпутных участках должен осуществляться по временно однопутному перегону и одному или двум впереди лежащим перегонам без скрещения с пассажирскими поездами.", "b": false, "n": "10.5.1"}, {"t": "На однопутных линиях движение соединенных грузовых поездов с автономными тормозными магистралями может осуществляться в пределах всего участка, включающего перегон (перегоны) на котором ведутся восстановительные работы.", "b": false, "n": ""}, {"t": "10.5.2 Машинист локомотива второго поезда управляет автоматическими тормозами по команде машиниста головного локомотива.", "b": false, "n": "10.5.2"}, {"t": "Команды о торможении, величине ступени торможения и завышения давления в тормозной магистрали отпуске машинист головного локомотива передает по радиосвязи.", "b": false, "n": ""}, {"t": "10.5.3 К исполнению команд машинисты приступают после подтверждения воспринятой команды машинистом второго поезда. При этом выполнение команд при управлении автоматическими тормозами в составах, входящих в соединенный поезд, должно выполняться машинистами по возможности одновременно. Запрещаются несогласованные действия машинистов при управлении автоматическими тормозами.", "b": false, "n": "10.5.3"}, {"t": "10.5.4 При ведении соединенного поезда с автономными тормозными магистралями при проверке действия автоматических тормозов в пути следования машинист головного локомотива передает по радиосвязи команду машинисту второго поезда о начале проверки, выслушивает подтверждение восприятия и выполняет ступень торможения снижением давления в уравнительном резервуаре на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2). Машинист второго поезда, подтвердив получение команды, выполняет торможение такой же ступенью.", "b": false, "n": "10.5.4"}, {"t": "Снижение скорости на 10 км/ч должно происходить на расстоянии, не превышающем установленное местными технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "10.5.5 Отпуск автоматических тормозов при проверке их действия выполнять только после того, как машинисты убедятся в нормальной работе автотормозов, и машинист второго поезда подтвердит получение команды на отпуск от машиниста головного поезда.", "b": false, "n": "10.5.5"}, {"t": "10.5.6 Запрещается производить отпуск автоматических тормозов поезда до его полной остановки при скорости менее 30 км/ч, независимо от температуры окружающей среды.", "b": false, "n": "10.5.6"}, {"t": "10.5.7 Применение экстренного торможения допускается в крайних случаях, когда требуется немедленная остановка поезда, по команде машиниста локомотива, первым заметившего опасность. В этом случае после краткого повторения одним из машинистов, воспринимающим команду, машинисты одновременно приступают к выполнению экстренного торможения.", "b": false, "n": "10.5.7"}, {"t": "10.5.8 В случае выхода из строя радиосвязи машинист головного поезда определяет ближайшее место удобное для остановки и расцепления составов и выполняет ступень торможения для остановки.", "b": false, "n": "10.5.8"}]}, {"id": "tb10_6", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.6 Управление автоматическими тормозами соединенного поезда с объединенной тормозной магистралью с постановкой локомотива в голове и в составе или в хвосте поезда", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 116–121", "paras": [{"t": "10.6.1 Автоматические тормоза локомотивов должны быть включены в тормозную магистраль, а комбинированные краны открыты и блокировка выключена.", "b": false, "n": "10.6.1"}, {"t": "10.6.2 Зарядное давление в тормозной магистрали, на которое регулируют краны машиниста должно быть:", "b": false, "n": "10.6.2"}, {"t": "- головного локомотива 0,51 - 0,52 МПа (5,1 - 5,2 кгс/см2);", "b": false, "n": ""}, {"t": "- локомотива в составе или хвосте поезда 0,50 - 0,51 МПа (5,0 - 5,1 кгс/см2).", "b": false, "n": ""}, {"t": "10.6.3 При постановке локомотива в хвост поезда или перед объединением поездов помощник машиниста локомотива в составе или хвосте поезда обязан осмотреть автосцепку хвостового вагона впереди стоящего поезда, убедиться в ее исправности, очистить головки рукавов и продуть через концевой кран тормозную магистраль. Сцепление локомотива в составе или хвосте поезда с хвостовым вагоном впереди стоящего поезда осуществлять при скорости не более 3 км/ч.", "b": false, "n": "10.6.3"}, {"t": "Осаживание впереди стоящего поезда запрещается.", "b": false, "n": ""}, {"t": "После сцепления машинист, находящийся в составе или хвосте поезда, обязан лично проверить правильность соединения автосцепок, рукавов и открытие концевых кранов тормозных магистралей локомотива и хвостового вагона впереди стоящего поезда.", "b": false, "n": ""}, {"t": "После объединения двух поездов производят сокращенное опробование автоматических тормозов. Помощник машиниста головного локомотива проверяет срабатывание тормозов у первых 5 вагонов первого поезда. Помощник машиниста локомотива в составе поезда проверяет срабатывание тормозов по 2 последним вагонам первого поезда и первым 5 вагонам второго поезда.", "b": false, "n": ""}, {"t": "10.6.4 Все виды торможений необходимо выполнять синхронно на головном локомотиве и на локомотиве в составе или хвосте поезда по командам машиниста головного локомотива.", "b": false, "n": "10.6.4"}, {"t": "Приступать к исполнению торможений необходимо сразу после краткого подтверждения восприятия команды машинистом в составе (или в хвосте) поезда.", "b": false, "n": ""}, {"t": "Допускается выполнять торможения на локомотиве в составе или хвосте поезда по срабатыванию датчика контроля состояния тормозной магистрали.", "b": false, "n": ""}, {"t": "При неисправности радиосвязи между машинистами следование поезда с локомотивами в голове и в составе или хвосте поезда запрещается.", "b": false, "n": ""}, {"t": "При выявлении неисправности радиосвязи в пути следования машинист головного локомотива останавливает поезд служебным торможением, по возможности на площадке и прямом участке пути. Машинист локомотива в составе или хвосте поезда при срабатывании датчика контроля состояния тормозной магистрали руководствуется пунктом 10.6.14 настоящих Правил.", "b": false, "n": ""}, {"t": "Если после остановки поезда машинистам не удается установить между собой радиосвязь, поезд должен быть разъединен.", "b": false, "n": ""}, {"t": "10.6.5 Вождение соединенных грузовых поездов с объединенной тормозной магистралью и локомотивами в голове и составе поезда в общем случае должно производится только с использованием автоматизированных систем распределенной тяги и торможения, управляемых по радиоканалу.", "b": false, "n": "10.6.5"}, {"t": "Допускается вождение соединенных грузовых поездов с объединенной тормозной магистралью и локомотивами в голове и составе поезда без использования автоматизированных систем распределенной тяги и торможения, управляемых по радиоканалу при технологических окнах более 12 часов, ликвидации последствий крушений, аварий и стихийных бедствий.", "b": false, "n": ""}, {"t": "10.6.6 В процессе движения соединенного порожнего поезда тяга только головным локомотивом не допускается.", "b": false, "n": "10.6.6"}, {"t": "10.6.7 При ведении соединенного поезда с объединенными тормозными магистралями для проведения проверки тормозов в пути следования машинист головного локомотива передает по радиосвязи команду машинисту второго поезда о начале проверки, выслушивает подтверждение восприятия и выполняет ступень торможения:", "b": false, "n": "10.6.7"}, {"t": "- для порожнего грузового поезда - снижением давления в уравнительном резервуаре на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2)", "b": false, "n": ""}, {"t": "- для груженого грузового поезда - снижением давления в уравнительном резервуаре на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2).", "b": false, "n": ""}, {"t": "Снижение скорости на 10 км/ч должно происходить на расстоянии, не превышающем установленное местными технико-распорядительными документами владельца инфраструктуры.", "b": false, "n": ""}, {"t": "10.6.8 Отпуск автоматических тормозов при проверке их действия выполнять только после того, как машинисты убедятся в нормальной работе автотормозов, и машинист второго поезда подтвердит получение команды на отпуск от машиниста головного поезда.", "b": false, "n": "10.6.8"}, {"t": "10.6.9 Служебные и полные служебные торможения выполнять следующим порядком:", "b": false, "n": "10.6.9"}, {"t": "а) служебные торможения:", "b": false, "n": ""}, {"t": "- в одну ступень снижением давления в уравнительном резервуаре на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2) с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием»;", "b": false, "n": ""}, {"t": "- в две ступени снижением давления в уравнительном резервуаре на 0,04 - 0,06 МПа (0,4 - 0,6 кгс/см2) и, после выдержки 4-5 секунды в положении «Перекрыша с питанием» на величину не менее 0,03 МПа (0,3 кгс/см2) с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "б) полные служебные до полной остановки поезда:", "b": false, "n": ""}, {"t": "- на головном локомотиве: снижением давления в уравнительном резервуаре на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2) и последующим переводом ручки крана машиниста в положение «Замедленное торможение» с замедленной разрядкой уравнительного резервуара до снижения давления на 0,18 - 0,20 МПа (1,8 - 2,0 кгс/см2);", "b": false, "n": ""}, {"t": "- на локомотиве в составе или хвосте поезда переводом ручки крана машиниста в положение служебное торможение до снижения давления в уравнительном резервуаре на 0,18 - 0,20 МПа (1,8 - 2,0 кгс/см2).", "b": false, "n": ""}, {"t": "После снижения давления в уравнительном резервуаре на необходимую величину ручки крана машиниста на обоих локомотивах следует перевести в положение «Перекрыша с питанием».", "b": false, "n": ""}, {"t": "В целях минимизации продольно-динамических реакций в головной части состава при выполнении остановочных служебных торможений рекомендуется отпускать вспомогательный тормоз головного локомотива и приводить его в действие после остановки поезда.", "b": false, "n": ""}, {"t": "10.6.10 Запрещается производить отпуск автоматических тормозов поезда до его полной остановки при скорости менее 30 км/ч, независимо от температуры окружающей среды.", "b": false, "n": "10.6.10"}, {"t": "10.6.11 Отпуск автоматических тормозов выполнять одновременно на обоих локомотивах либо с опережением начала отпуска на локомотиве, находящемся в составе или хвосте поезда (до 6 секунд).", "b": false, "n": "10.6.11"}, {"t": "Отпуск автоматических тормозов необходимо производить путем постановки ручки крана машиниста в положение «Зарядка и отпуск» до повышения давления в уравнительном резервуаре на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2) выше зарядного с последующим переводом ее в поездное положение. После полного отпуска автоматических тормозов, в случае, если торможение выполнялось не до полной остановки, с целью предупреждения реакций включать тягу на локомотиве в составе поезда по команде машиниста головного локомотива с опережением.", "b": false, "n": ""}, {"t": "10.6.12 При расположении состава соединенного порожнего поезда длиной от 570 до 800 осей на спуске необходимо сжимать состав путем применения вспомогательного или электрического тормоза локомотива в голове состава.", "b": false, "n": "10.6.12"}, {"t": "10.6.13 Режимы трогания соединенных поездов или поездов с локомотивами в составе или хвосте поезда устанавливают в соответствии с местными условиями на основании технико-распорядительных документов владельца инфраструктуры.", "b": false, "n": "10.6.13"}, {"t": "10.6.14 Если в процессе ведения поезда на локомотивах происходит срабатывание датчика контроля состояния тормозной магистрали или наблюдается понижение давления в тормозной магистрали без срабатывания датчика контроля состояния тормозной магистрали:", "b": false, "n": "10.6.14"}, {"t": "- машинист головного локомотива обязан выполнить ступень торможения со снижением давления в уравнительном резервуаре 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2) с последующим переводом ручки крана машиниста в положение «Перекрыша без питания» до полной остановки поезда, и передает команду машинисту локомотива в составе или хвосте поезда о выполнении идентичной ступени торможения;", "b": false, "n": ""}, {"t": "- машинист локомотива в составе или хвосте поезда обязан выполнить ступень торможения со снижением давления в уравнительном резервуаре 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2) с последующим переводом ручки крана машиниста в положение «Перекрыша без питания» до полной остановки поезда, и передает сообщение машинисту головного локомотива о выполненной ступени торможения;", "b": false, "n": ""}, {"t": "- при ведении поезда с помощью автоматизированных систем, управляемых по радиоканалу, машинист головного локомотива или машинист локомотива в составе или хвосте поезда должен произвести полное служебное торможение с помощью органов управления данных систем.", "b": false, "n": ""}, {"t": "После остановки поезда установленным порядком следует произвести осмотр вагонов и выяснить причину снижения давления. После чего необходимо выполнить сокращенное опробование тормозов.", "b": false, "n": ""}, {"t": "В случае невыяснения причины понижения давления в тормозной магистрали поезда дальнейшее следование осуществлять только после разъединения. При этом машинисты поездов должны заявить контрольную проверку тормозов в случае повторного срабатывания тормозов при следовании после разъединения в соответствии с главой 17 настоящих Правил.", "b": false, "n": ""}, {"t": "10.6.15 В случаях внезапной подачи сигнала остановки, внезапном возникновении препятствия или иной необходимости немедленной остановки поезда:", "b": false, "n": "10.6.15"}, {"t": "а) при ведении поезда без помощи автоматизированных систем машинист головного локомотива должен перевести ручку крана машиниста в положение экстренного торможения, после чего немедленно по радиосвязи сообщить машинисту локомотива в составе или хвосте поезда команду о выполнении экстренного торможения.", "b": false, "n": ""}, {"t": "Если машинист локомотива в составе или хвосте поезда выявляет необходимость немедленной остановки поезда, он обязан передать данную информацию машинисту головного локомотива.", "b": false, "n": ""}, {"t": "Машинист локомотива в составе или хвосте поезда выполняет экстренное торможение только по команде машиниста головного локомотива.", "b": false, "n": ""}, {"t": "б) при ведении поезда с помощью автоматизированных систем, управляемых по радиоканалу, машинист головного локомотива или локомотива в составе (хвосте) поезда должен произвести полное служебное торможение от кнопочного контроллера с последующим переводом ручки крана машиниста в положение экстренного торможения, после чего по радиосвязи сообщить другому машинисту о необходимости выполнения экстренного торможения.", "b": false, "n": ""}, {"t": "Отпуск автоматических тормозов производить только после полной остановки поезда. При этом отправление поезда возможно только после его осмотра.", "b": false, "n": ""}, {"t": "10.6.16 При стоянках поезда более 1800 секунд (30 минут), снижении давления в главных резервуарах ниже 0,55 МПа (5,5 кгс/см2) выполнить опробование автоматических тормозов следующим порядком:", "b": false, "n": "10.6.16"}, {"t": "- проверить плотность тормозной сети поезда при поездном положении ручки крана машиниста, которая не должна отличаться от значения, указанного в «Справке об обеспечении поезда тормозами и исправном их действии» более чем на 20% в сторону уменьшения или увеличения;", "b": false, "n": ""}, {"t": "- машинист головного локомотива выполняет ступень торможения снижением давления в уравнительном резервуаре на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2). После срабатывания датчика контроля состояния тормозной магистрали на пульте локомотива в составе поезда, машинист этого локомотива производит аналогичную ступень торможения; убедившись в срабатывании автотормозов, машинист локомотива в составе поезда извещает об этом по радиосвязи машиниста головного локомотива, после чего они отпускают тормоза.", "b": false, "n": ""}, {"t": "Помощник машиниста второго поезда проверяет действие автоматических тормозов на торможение и отпуск на вагонах, количество которых устанавливается организационно распорядительными документами соответствующих подразделений владельца инфраструктуры.", "b": false, "n": ""}, {"t": "В случае, если при проверке плотности объединенного поезда установлено изменение плотности свыше 20 %, необходимо проверить состояние тормозной магистрали обоих составов и провести сокращенное опробование тормозов.", "b": false, "n": ""}]}, {"id": "tb10_7", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.7 Управление автоматическими тормозами грузовых поездов в зимних условиях", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 121–122", "paras": [{"t": "10.7.1 Время с момента перевода ручки крана машиниста в положение отпуска до приведения грузового поезда в движение после его остановки должно быть увеличено в полтора раза от значений, указанных в подпункте р) пункта 10.3.1, подпункте с) пункта 10.3.2, подпункте р) пункта 10.3.3 и пункте 10.4.11 настоящих Правил.", "b": false, "n": "10.7.1"}, {"t": "10.7.2 При температуре воздуха ниже минус 40°С, а также в условиях снегопадов, снежных заносов первую ступень торможения выполнять снижением давления в уравнительном резервуаре порожних поездах и груженых поездах при преобладании в составе более 50% порожних вагонов на 0,06 - 0,08 МПа (0,6 - 0,8 кгс/см2), а в остальных груженых – 0,08 - 0,10 МПа (0,8 - 1,0 кгс/см2).", "b": false, "n": "10.7.2"}, {"t": "Вторую и последующие ступени торможения выполнять ступенью снижением давления в уравнительном резервуаре на 0,05 - 0,10 МПа (0,5 - 1,0 кгс/см2).", "b": false, "n": ""}, {"t": "10.7.3 На затяжных и крутых затяжных спусках при наличии снежного покрова на рельсах первую ступень торможения в начале спуска выполнять снижением давления в тормозной магистрали на 0,08 - 0,12 МПа (0,8 - 1,2 кгс/см2), а в случае необходимости дополнительной ступенью увеличивать разрядку тормозной магистрали до полного служебного торможения.", "b": false, "n": "10.7.3"}, {"t": "10.7.4 Чаще проверять работу автоматических тормозов в пути следования, выполняя ступень торможения.", "b": false, "n": "10.7.4"}, {"t": "Интервал времени и/или места, где должна выполняться проверка тормозов, указываются технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "10.7.5 При снегопаде, свежевыпавшем снеге, уровень которого превышает уровень головок рельсов, пурге, снежных заносах до торможения грузового поезда перед входом на станцию, имеющей сигнал уменьшения скорости или остановки; имеющей остановку, предусмотренную графиком движения или перед следованием по затяжному спуску, выполнять торможение для проверки и подготовки работы автоматических тормозов, если время следования поезда без торможения до этого превышает 1200 секунд (20 минут).", "b": false, "n": "10.7.5"}, {"t": "10.7.6 При ступени торможения со снижением давления в уравнительном резервуаре более 0,10 МПа (1,0 кгс/см2) при инее, гололеде необходимо предварительно за 50-100 м до начала торможения приводить в действие приборы пескоподачи и подавать на рельсы песок до остановки поезда или окончания торможения после отпуска автоматических тормозов.", "b": false, "n": "10.7.6"}, {"t": "10.7.7 При подходе к станциям и запрещающим сигналам, если после первой ступени торможения не получен достаточный тормозной эффект в поезде, выполнить экстренное торможение.", "b": false, "n": "10.7.7"}]}, {"id": "tb10_8", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.8 Управление автоматическими тормозами пассажирского поезда .. 122 10.9 Управление автоматическими тормозами пассажирского поезда при наличии вагонов с включенными воздухораспределителями пассажирского типа со ступенчатым отпуском", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 122–127", "paras": [{"t": "состава.", "b": false, "n": ""}, {"t": "Вторую и последующую ступени торможения, а также отпуск автоматических тормозов необходимо производить по истечении не менее 5 секунд после использования положения «Перекрыша с питанием» или после того, как закончится выпуск воздуха из тормозной магистрали через кран машиниста.", "b": false, "n": ""}, {"t": "10.8.2 При подходе к запрещающим сигналам и остановкам на станциях (остановочных пунктах) после выполнении служебного торможения перевести ручку крана машиниста в положение «Перекрыша без питания» с предварительной постановкой ручки крана машиниста в положение «Перекрыша с питанием» (кроме поездов, в составе которых имеются вагоны с включенными пассажирскими тормозами со ступенчатым отпуском западноевропейского типа).", "b": false, "n": "10.8.2"}, {"t": "10.8.3 Если пассажирский поезд заторможен ступенью 0,03 МПа (0,3 кгс/см2), то перед отпуском тормозов увеличить разрядку тормозной магистрали не менее, чем до 0,05 МПа (0,5 кгс/см2).", "b": false, "n": "10.8.3"}, {"t": "10.8.4 Перед торможением снижением давления в уравнительном резервуаре более чем на 0,10 МПа (1,0 кгс/см2) при автоматических тормозах предварительно привести в действие приборы пескоподачи.", "b": false, "n": "10.8.4"}, {"t": "10.8.5 При подходе к сигналам с разрешающим показанием при нерасчетливом торможении, когда поезд может остановиться ранее установленного или требуемого места, отпуск автоматических тормозов после каждого торможения выполнять переводом ручки крана машиниста в положение «Зарядка и отпуск» до давления в уравнительном резервуаре 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2); а перед последующим торможением - в положение «Перекрыша без питания».", "b": false, "n": "10.8.5"}, {"t": "10.8.6 Если за время отпуска автоматических тормозов пассажирского поезда запасные резервуары не успевают подзарядиться до установленного давления, для повторного торможения необходимо снизить давление в тормозной магистрали ступенью с разрядкой не менее чем на 0,03 МПа (0,3 кгс/см2) больше предыдущей ступени торможения.", "b": false, "n": "10.8.6"}, {"t": "10.8.7 Разрешается в необходимых случаях при нерасчетливом торможении для остановки в определенном месте выполнить отпуск автоматических тормозов переводом ручки крана машиниста в поездное положение и после достижения требуемого увеличения или стабилизации скорости поезда ручку крана машиниста перевести в положение «Перекрыша без питания» с готовностью выполнить повторное торможение с разрядкой тормозной магистрали и величиной ступени от фактического давления в момент торможения для остановки поезда в требуемом месте.", "b": false, "n": "10.8.7"}, {"t": "10.8.8 В случае снижения давления в тормозной магистрали ниже 0,35 МПа (3,5 кгс/см2) во время торможения на спуске остановить пассажирский поезд, привести в действие вспомогательный тормоз локомотива постановкой ручки в крайнее тормозное положение, после чего отпустить автоматические тормоза и зарядить тормозную магистраль до установленного давления.", "b": false, "n": "10.8.8"}, {"t": "Если при следовании поезда в конце спуска выполнено последнее торможение, при котором давление в магистрали ниже 0,35 МПа (3,5 кгс/см2) и далее по условиям профиля пути скорость поезда будет постоянной или снижаться настолько, что потребуется произвести отпуск автоматических тормозов, а за время до следующего торможения представляется возможность осуществить подзарядку тормозной сети поезда до установленного давления, останавливать поезд для подзарядки не требуется.", "b": false, "n": ""}, {"t": "10.8.9 Избегать частых торможений при отсутствии достаточного времени для подзарядки тормозной сети поезда, так как неполная зарядка влечет за собой истощение автоматических тормозов с последующим снижением тормозного эффекта. Перед повторным торможением не отпускать тормоза на высокой скорости, если до торможения скорость поезда может увеличиться сверх установленной, а тормозная сеть к этому моменту не успеет зарядиться.", "b": false, "n": "10.8.9"}, {"t": "10.8.10 При выполнении полного служебного торможения в один прием снижать давление в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2).", "b": false, "n": "10.8.10"}, {"t": "10.8.11 В случае торможения пассажирского поезда при несанкционированном снижении давления в тормозной магистрали (срыв стоп-крана, вследствие разъединения тормозной магистрали и др.) выполнить экстренное торможение.", "b": false, "n": "10.8.11"}, {"t": "10.8.12 При отпуске автоматических тормозов после служебных торможений ручку крана машиниста выдерживать в положении «Зарядка и отпуск» до получения давления в уравнительном резервуаре 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2).", "b": false, "n": "10.8.12"}, {"t": "В поездах, состоящих из семи вагонов и менее, отпуск автоматических тормозов после служебного торможения выполнять постановкой ручки крана машиниста в положение «Зарядка и отпуск» на 1-2 секунды, с последующим перемещением ее в поездное положение.", "b": false, "n": ""}, {"t": "Отпуск автоматических тормозов в поезде после служебного торможения выполнять перед остановкой при скорости 4 - 6 км/ч, а при преобладании в поезде композиционных колодок и дисковых тормозов отпускать автоматические тормоза после остановки поезда.", "b": false, "n": ""}, {"t": "10.8.13 При отпуске автоматических тормозов после экстренных торможений ручку крана машиниста выдерживать в поездном положении до полной зарядки тормозной сети поезда.", "b": false, "n": "10.8.13"}, {"t": "В поездах, состоящих из семи вагонов и менее, после экстренного торможения временно установить комбинированный кран в положение двойной тяги (на локомотивах, оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом), разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста установить в закрытое положение, ручку крана машиниста перевести в поездное положение и после зарядки уравнительного резервуара до давления 0,50 МПа (5,0 кгс/см2) установить комбинированный кран в поездное положение (на локомотивах, оборудованных краном машиниста, у которого передача команды управления от ручки к исполнительным устройствам производится электрическим или иным способом), разобщительный кран на тормозной магистрали (при наличии) к исполнительному устройству крана машиниста установить в открытое положение и зарядить тормозную сеть поезда.", "b": false, "n": ""}, {"t": "Перед отправлением поезда выполнить ступень торможения 0,05 - 0,06 МПа (0,5-0,6 кгс/см2) с последующим отпуском положением «Зарядка и отпуск» до зарядного давления.", "b": false, "n": ""}, {"t": "10.8.14 Время с момента перевода ручки крана машиниста в положение отпуска до приведения поезда в движение должно быть:", "b": false, "n": "10.8.14"}, {"t": "- при длине до 20 вагонов включительно после ступени торможения – не менее 15 секунд, после полного служебного торможения – не менее 30 секунд, после экстренного – не менее 90 секунд (1,5 минуты);", "b": false, "n": ""}, {"t": "- при длине поезда более 20 вагонов после ступени торможения – не менее 40 секунд, после полного служебного торможения – не менее 60 секунд (1 минуты), после экстренного – не менее 180 секунд (3 минуты).", "b": false, "n": ""}, {"t": "Если все вагоны поезда оборудованы сигнализаторами отпуска, то приводить поезд в движение после остановки разрешается только после их срабатывания, сигнализирующем о полном отпуске автоматических тормозов.", "b": false, "n": ""}, {"t": "10.8.15 Проводники пассажирских вагонов перед отправлением поезда с промежуточной станции или после вынужденных остановок должны проверить отпуск автоматического тормоза вагона по манометру, расположенному в тамбуре или служебном отделении вагона, а если позволяют условия – и по отходу тормозных колодок от поверхностей катания колес. На вагонах с дисковыми тормозами (при отсутствии манометров, расположенных в тамбуре или в служебном отделении вагона), отпуск тормозов проверяется по показаниям манометров и сигнализаторам торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": "10.8.15"}, {"t": "10.8.16 Если на станции должна выполняться смена локомотивных бригад без отцепки локомотива от состава пассажирского поезда, то сменяющийся машинист обязан остановить поезд на станции. После остановки поезда на станции выполнить полное служебное торможение с общим снижением давления в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2) от установленного зарядного давления с последующей установкой ручки крана машиниста в положение «Перекрыша с питанием». Привести в действие вспомогательный тормоз локомотива постановкой ручки в крайнее тормозное положение.", "b": false, "n": "10.8.16"}, {"t": "10.9 Управление автоматическими тормозами пассажирского поезда при наличии вагонов с включенными воздухораспределителями пассажирского типа со ступенчатым отпуском", "b": false, "n": "10.9"}, {"t": "10.9.1 При наличии в составе пассажирского поезда вагонов с включенными воздухораспределителями пассажирского типа со ступенчатым отпуском поезд должен следовать на автоматических тормозах.", "b": false, "n": "10.9.1"}, {"t": "10.9.2 В пути следования необходимо следить за поддержанием установленного зарядного давления, обращая особое внимание на восстановление зарядного давления после отпуска автотормозов.", "b": false, "n": "10.9.2"}, {"t": "10.9.3 С целью сохранности колесных пар вагонов и обеспечения достаточной плавности торможения первую ступень торможения выполнять снижением давления в уравнительном резервуаре на 0,03 - 0,05 МПа (0,3 - 0,5 кгс/см2) с последующим, при необходимости, усилением торможения дополнительным снижением давления в тормозной магистрали на необходимую величину, но не менее чем на 0,03 МПа (0,3 кгс/см2).", "b": false, "n": "10.9.3"}, {"t": "10.9.4 Отпуск автоматических тормозов после служебного торможения выполняется переводом ручки крана машиниста в положение «Зарядка и отпуск» до получения давления в уравнительном резервуаре 0,53 МПа (5,3 кгс/см2) и последующим переводом ее в поездное положение.", "b": false, "n": "10.9.4"}, {"t": "Для ускорения отпуска и восстановления предтормозного давления, когда еще не произошла полная зарядка тормозной магистрали, в зависимости от длины поезда дать дополнительно 2-3 кратковременных перемещений ручки крана машиниста на 1-2 секунды из поездного положения в положение «Зарядка и отпуск».", "b": false, "n": ""}, {"t": "10.9.5 При отпуске автоматических тормозов после экстренных торможений ручку крана машиниста выдерживать в поездном положении до полной зарядки тормозной сети поезда.", "b": false, "n": "10.9.5"}, {"t": "В поездах, состоящих из семи вагонов и менее после экстренного торможения временно установить комбинированный кран в положение двойной тяги, ручку крана машиниста поставить в поездное положение и после зарядки уравнительного резервуара до давления 0,50 МПа (5,0 кгс/см2) установить комбинированный кран в поездное положение и зарядить тормозную сеть поезда.", "b": false, "n": ""}, {"t": "10.9.6 Перед отправлением поезда выполнить постановку ручки крана машиниста в положение «Зарядка и отпуск» на 1-2 секунды и последующим перемещением ее в поездное положение.", "b": false, "n": "10.9.6"}, {"t": "10.9.7 При выполнении служебных торможений использовать положение «Перекрыша с питанием».", "b": false, "n": "10.9.7"}, {"t": "10.9.8 Если в процессе повторных торможений возникает необходимость тормозить с повышенного зарядного давления, отпуск автоматических тормозов при последнем из частых повторных торможений выполнять давлением 0,03 - 0,05 МПа (0,3 - 0,5 кгс/см2) выше давления, уравнительного резервуара с которого выполнялось торможение. При служебных торможениях с повышенного зарядного давления не допускать снижения давления в тормозной магистрали более чем на 0,13 МПа (1,3 кгс/см2).", "b": false, "n": "10.9.8"}, {"t": "10.9.9 После остановки поезда с применением автоматических тормозов необходимо выдержать время от момента перевода ручки крана машиниста в отпускное положение до приведения локомотива в движение в поездах:", "b": false, "n": "10.9.9"}, {"t": "- длиной до 20 вагонов включительно после ступенчатого и полного служебного торможения - не менее 60 секунд (1 минуты), после экстренного – не менее 240 секунд (4 минут);", "b": false, "n": ""}, {"t": "- длиной более 20 вагонов после ступенчатого и полного служебного торможения – не менее 120 секунд (2 минут), после экстренного – не менее 360 секунд (6 минут).", "b": false, "n": ""}, {"t": "Если вагоны поезда оборудованы сигнализаторами отпуска, то приводить поезд в движение после остановки разрешается только после их срабатывания, сигнализирующем о полном отпуске автоматических тормозов.", "b": false, "n": ""}]}, {"id": "tb10_10", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.10 Управление электропневматическими тормозами пассажирских поездов", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 127–130", "paras": [{"t": "10.10.1 При нахождении ручки крана машиниста в поездном положении должна гореть сигнальная лампа контроля состояния цепи электропневматического тормоза, а источник питания должен обеспечивать напряжение не менее 48 В.", "b": false, "n": "10.10.1"}, {"t": "10.10.2 При выполнении проверки действия электропневматических тормозов в пути следования необходимо использовать положение ручки крана машиниста «Перекрыша с питанием».", "b": false, "n": "10.10.2"}, {"t": "10.10.3 Для регулирования скорости движения поезда, на локомотивах, оборудованных тормозом пассажирского типа с бесступенчатым отпуском, и системой управления электропневматическим тормозом, при следовании по перегону и при остановках в пути следования выполнять ступенчатое торможение постановкой ручки крана машиниста в положение служебного торможения с применением электропневматического тормоза (положение «Замедленное торможение») с последующим переводом в положение «Перекрыша без питания». При этом после снижения давления в тормозной магистрали до 0,44 - 0,46 МПа (4,4 - 4,6 кгс/см2) использовать положение крана машиниста «Перекрыша с питанием».", "b": false, "n": "10.10.3"}, {"t": "10.10.4 Первую ступень служебного торможения с применением электропневматического тормоза необходимо выполнять до давления в тормозных цилиндрах локомотива 0,15 МПа (1,5 кгс/см2) в зависимости от скорости движения поезда и крутизны спуска.", "b": false, "n": "10.10.4"}, {"t": "Последующие ступени выполнять по необходимости, вплоть до полного служебного торможения с давлением в тормозных цилиндрах локомотива 0,38 - 0,40 МПа (3,8-4,0 кгс/см2).", "b": false, "n": ""}, {"t": "10.10.5 Перед электропневматическим торможением с давлением в тормозных цилиндрах локомотива более 0,25 МПа (2,5 кгс/см2) необходимо предварительно привести в действие приборы пескоподачи.", "b": false, "n": "10.10.5"}, {"t": "10.10.6 В пути следования машинист должен контролировать нормальное действие электропневматического тормоза по сигнальным лампам и по показаниям амперметра в положении «Перекрыша с питанием» которое не должно изменяться в процессе ведения поезда в сторону уменьшения более чем на 20% от первоначального значения. При большем отклонении показаний, падении напряжения на источнике питания в положении торможения ниже 45 В, при недостаточной эффективности действия электропневматического тормоза или неудовлетворительной плавности торможения, самопроизвольном отпуске при следовании в режиме торможения, а также при погасании сигнальных ламп необходимо перейти на управление автоматическими тормозами.", "b": false, "n": "10.10.6"}, {"t": "10.10.7 Если в поезде имеется не более двух вагонов без электропневматического тормоза или с выключенным электропневматическим тормозом, то при выполнение ступени торможения необходимо осуществлять постановкой ручки крана машиниста в положение Служебное торможение». После достижения необходимого давления в тормозных цилиндрах ручку крана машиниста необходимо перевести в положение «Перекрыша без питания».", "b": false, "n": "10.10.7"}, {"t": "При большем количестве вагонов без электропневматического тормоза, а также при наличии в составе поезда вагонов с включенными воздухораспределителями пассажирского типа со ступенчатым отпуском (западноевропейского типа) поезд должен следовать на автоматических тормозах, о чем должна быть на станции отправления сделана отметка осмотрщиком вагонов в «Справке об обеспечении поезда тормозами и исправном их действии».", "b": false, "n": ""}, {"t": "10.10.8 При обнаружении признаков неисправности электропневматического тормоза в условиях ведения поезда машинист должен выключить источник питания и выполнить проверку действия автоматических тормозов.", "b": false, "n": "10.10.8"}, {"t": "О причинах выключения электропневматического тормоза сообщить по радиосвязи начальнику поезда и сделать отметку в «Справке об обеспечении поезда тормозами и исправном их действии», а также затребовать проверку цепей электропневматического тормоза на ближайшем пункте технического обслуживания пассажирских поездов.", "b": false, "n": ""}, {"t": "10.10.9 При остановочных торможениях электропневматическим тормозом перед запрещающими сигналами, торможение следует выполнять постановкой ручки крана машиниста в положение «Служебное торможение». По достижении необходимого давления в тормозных цилиндрах ручку крана машиниста следует переводить в положение «Перекрыша без питания».", "b": false, "n": "10.10.9"}, {"t": "Если сигнальная лампа гаснет при остановочном торможении перед запрещающем сигналом или предельным столбиком в режиме электропневматического торможения, необходимо применить экстренное торможение и после остановки выключить источник питания электропневматических тормозов.", "b": false, "n": ""}, {"t": "10.10.10 По условиям ведения поезда машинист выполняет полный или ступенчатый отпуск электропневматических тормозов.", "b": false, "n": "10.10.10"}, {"t": "10.10.11 В процессе остановки поезда для обеспечения плавности производить ступенчатый отпуск, а после остановки выполнить полный отпуск тормозов.", "b": false, "n": "10.10.11"}, {"t": "При стоянке до 5 минут разрешается не производить полный отпуск тормозов. Перед отправление поезда необходимо произвести полный отпуск тормозов.", "b": false, "n": ""}, {"t": "10.10.12 Ступенчатый отпуск электропневматических тормозов выполнять путем кратковременного перемещения ручки крана машиниста из положения «Перекрыша с питанием» в поездное положение и обратно в положение «Перекрыша с питанием». При этом каждая ступень отпуска тормозов, контролируемая по манометру давления в тормозных цилиндрах локомотива, должна быть не менее 0,02 - 0,03 МПа (0,2 - 0,3 кгс/см2), при этом последнюю ступень отпуска выполнять с завышением давления в уравнительном резервуаре на 0,02 МПа (0,2 кгс/см2) выше зарядного.", "b": false, "n": "10.10.12"}, {"t": "10.10.13 На спусках, где применяются повторные торможения, отпуск электропневматических тормозов между повторными торможениями выполнять путем перемещения ручки крана машиниста из положения «Перекрыша с питанием» в поездное положение. Причем при выполнении последнего торможения в конце спуска отпуск выполнять с выдержкой ручки крана машиниста в положении «Зарядка и отпуск» до повышения давления в уравнительном резервуаре на 0,02 МПа (0,2 кгс/см2) выше зарядного.", "b": false, "n": "10.10.13"}, {"t": "10.10.14 Полный отпуск электропневматических тормозов в один прием выполнять перемещением ручки крана машиниста в положение «Зарядка и отпуск» до повышения давления в уравнительном резервуаре на 0,02 МПа (0,2 кгс/см2) выше зарядного, а в поездах, состоящих из семи вагонов и менее, отпуск тормозов после служебного торможения выполнять постановкой ручки крана машиниста в положение «Зарядка и отпуск» на 1-2 секунды, с последующим перемещением ее в поездное положение.", "b": false, "n": "10.10.14"}, {"t": "10.10.15 Если на станции должна выполняться смена локомотивных бригад без отцепки локомотива от состава пассажирского поезда, то сменяющийся машинист обязан остановить поезд на станции. После остановки выключить электропневматический тормоз и выполнить полное служебное торможение снижением давления в уравнительном резервуаре на 0,15 - 0,17 МПа (1,5 - 1,7 кгс/см2) от установленного зарядного давления с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием». Привести в действие вспомогательный тормоз локомотива постановкой ручки крана вспомогательного тормоза в крайнее тормозное положение.", "b": false, "n": "10.10.15"}]}, {"id": "tb10_11", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.11 Управления тормозами пассажирских поездов в зимних условиях", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 130–131", "paras": [{"t": "10.11.1 При эксплуатации пассажирских поездов постоянного формирования, сформированных из пассажирских вагонов моделей 61-4458, 61-4462, 61-4463 и 61-4464 с тормозным оборудованием «KNORR-BREMSE» необходимо соблюдать следующие требования:", "b": false, "n": "10.11.1"}, {"t": "- зарядное давление в тормозной магистрали ведущего локомотива должно быть 0,53 - 0,55 МПа (5,3 - 5,5 кгс/см2);", "b": false, "n": ""}, {"t": "- для служебного торможения автоматическим тормозом в пути следования необходимо снижать давление в уравнительном резервуаре от установленного зарядного, первой ступенью на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2) в один прием, независимо от длины состава. Вторая и последующая ступени торможения могут быть выполнены не ранее, чем через 6 секунд после постановки ручки крана машиниста в положение «Перекрыша с питанием» или после того, как закончится выпуск воздуха из тормозной магистрали через кран машиниста;", "b": false, "n": ""}, {"t": "- первую ступень служебного торможения с применением электропневматического тормоза необходимо выполнять до давления в тормозных цилиндрах локомотива 0,15 - 0,25 МПа (1,5 - 2,5 кгс/см2) в один прием в зависимости от скорости движения поезда и крутизны спуска. Последующие ступени выполнять по необходимости, вплоть до полного служебного торможения с давлением в тормозных цилиндрах локомотива 0,38 - 0,40 МПа (3,8 - 4,0 кгс/см2);", "b": false, "n": ""}, {"t": "- прицепка пассажирских вагонов необорудованных противоюзным устройством запрещена.", "b": false, "n": ""}, {"t": "10.11.2 Чаще проверять работу тормозов в пути следования и на станциях, выполняя ступень торможения. Интервал времени и/или места, где должна выполняться проверка тормозов, указываются техникораспорядительных документах владельца инфраструктуры.", "b": false, "n": "10.11.2"}, {"t": "10.11.3 При снегопаде, свежевыпавшем снеге, уровень которого превышает уровень головок рельсов, пурге, снежных заносах до торможения пассажирского поезда перед входом на станцию, имеющей сигнал уменьшения скорости или остановки; имеющий остановку, предусмотренную графиком движения или перед следованием по затяжному спуску, выполнять торможение для проверки и подготовки работы автоматических и электропневматических тормозов в пути следования, если время следования поезда без торможения до этого превышает 1200 секунд (20 минут).", "b": false, "n": "10.11.3"}, {"t": "10.11.4 При ступени торможения более 0,10 МПа (1,0 кгс/см2) при инее, гололеде, когда сила сцепления колес с рельсами снижается, необходимо предварительно за 50 - 100 м до начала торможения приводить в действие приборы пескоподачи и подавать на рельсы песок. Прекратить подачу песка при снижении скорости менее 10 км/ч (до остановки поезда или окончания торможения).", "b": false, "n": "10.11.4"}, {"t": "10.11.5 При подходе к станциям и запрещающим сигналам, если после первой ступени торможения не получен достаточный тормозной эффект в поезде, выполнить экстренное торможение.", "b": false, "n": "10.11.5"}]}, {"id": "tb10_12", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.12 Управление электрическим тормозом на локомотиве при ведении поезда", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 131–135", "paras": [{"t": "10.12.1 Режимы торможения и места применения электрического тормоза устанавливаются в технико-распорядительных документах владельца инфраструктуры, которые разрабатываются на основании расчетов, результатов опытных поездок и с учетом требований руководства по эксплуатации конкретной серии локомотива.", "b": false, "n": "10.12.1"}, {"t": "10.12.2 Тормозная сила электрического тормоза не должна превышать максимально допустимое значение по условиям устойчивости подвижного состава в колее, по его прочности и воздействию на путь.", "b": false, "n": "10.12.2"}, {"t": "10.12.3 На участках, где применяется электрическое торможение на локомотивах, машинист обязан:", "b": false, "n": "10.12.3"}, {"t": "- заблаговременно проверить на локомотиве работу схемы электрического торможения перед перегоном, где будет осуществляться применение этого вида торможения;", "b": false, "n": ""}, {"t": "- переходить на электрическое торможение после того как локомотив с головной частью поезда (не менее 25 %) начнет движение по спуску;", "b": false, "n": ""}, {"t": "- включать на электровозе электрическое торможение или переключаться с одного вида соединения тяговых двигателей на другой вид только при скорости движения поезда меньшей, чем скорость, которая должна автоматически устанавливаться после включения рекуперации на данном соединении тяговых двигателей. Если скорость следования превышает скорость, предусмотренную автоматической характеристикой торможения на установленном для данного участка соединения тяговых двигателей, уменьшить ее до необходимого значения с помощью автоматических тормозов поезда и только после этого включить э
