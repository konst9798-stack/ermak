кончания торможения.", "b": false, "n": "15.3.5"}, {"t": "При подходе к остановочным пунктам на станциях и перегонах и запрещающим сигналам, если после первой ступени торможения не получен достаточный тормозной эффект в поезде, произвести экстренное торможение.", "b": false, "n": ""}, {"t": "15.3.6 В зимний период времени для МВПС, оборудованным композиционными тормозными колодками или дисковыми тормозами, проверку действия автоматических тормозов необходимо осуществлять не реже одного раза в час в течение всего времени следования поезда. Места и скорости движения, а также расстояния, на которых должно происходить снижение скорости при проверке действия тормозов в пути следования, указываются в организационно-распорядительных документах, утвержденных владельцем инфраструктуры.", "b": false, "n": "15.3.6"}, {"t": "15.4 Особенности технического обслуживания и управления тормозами моторвагоного подвижного состав в зимнее время МВПС оборудованного воздухораспределителями пассажирского типа со ступенчатым отпуском должны быть указаны в документе владельца подвижного состава, согласованном владельцем инфраструктуры.", "b": false, "n": "15.4"}]}, {"id": "tb16_1", "cat": "tm_emerg", "page": 0, "pages": [], "title": "16.1 Остановка поезда на спуске", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 163–164", "paras": [{"t": "16.1.1 Для остановки поезда на спуске выключить тягу и привести в действие автоматические тормоза.", "b": false, "n": "16.1.1"}, {"t": "За 30-50 м до остановки привести в действие приборы пескоподачи для улучшения сцепления колес локомотива с рельсами при последующем приведении поезда в движение. После остановки поезда осуществить полное торможение вспомогательным тормозом локомотива (при необходимости и стояночным (ручным) тормозом локомотива) и отпустить автоматические тормоза. Если поезд придет в движение, выполнить ступень торможения снижением давления на 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2), после чего разрешается переключить не менее 1/3 воздухораспределителей в головной части состава грузового поезда на горный режим и удерживать поезд в заторможенном состоянии в процессе стоянки. В случае движения после первой ступени торможения необходимо выполнить вторую ступень торможения дополнительной разрядкой давления на 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2) и остановить поезд. После остановки поезда привести в действие вспомогательный тормоз локомотива и стояночные (ручные) тормоза в составе, подав об этом сигнал проводникам пассажирских вагонов, главному кондуктору, руководителю работ. В поездах, где таких работников нет, помощник машиниста должен подложить под колеса вагонов, имеющиеся на локомотиве, тормозные башмаки, а при недостатке их дополнительно привести в действие стояночные (ручные) тормоза вагонов в количестве и в соответствии с порядком, установленным технико-распорядительным документом владельца инфраструктуры.", "b": false, "n": ""}, {"t": "В пассажирском поезде, кроме того, сообщить об остановке начальнику (механику-бригадиру) поезда по радиосвязи.", "b": false, "n": ""}, {"t": "16.1.2 При снижении давления в главных резервуарах ниже 0,60 МПа (6,0 кгс/см2) для грузовых локомотивов и 0,55 МПа (5,5 кгс/см2) для пассажирских локомотивов вследствие отключения компрессорных установок при снятии напряжения в контактной сети, неисправности дизелей на тепловозе и по другим причинам необходимо остановить поезд при помощи автотормозов. После остановки произвести разрядку тормозной магистрали до полного служебного торможения и установить ручку крана машиниста в положение «Перекрыша без питания», привести в действие вспомогательный тормоз локомотива с максимальным давлением в тормозных цилиндрах.", "b": false, "n": "16.1.2"}, {"t": "Подать сигнал о применении стояночных (ручных) тормозов проводникам вагонов, главному кондуктору, руководителю работ, которые должны привести в действие стояночные (ручные) тормоза вагонов. В поездах, где таких работников нет, помощник машиниста должен установить под колеса вагонов, имеющиеся на локомотиве тормозные башмаки, а при недостатке их дополнительно привести в действие стояночные (ручные) тормоза вагонов в количестве и в соответствии с порядком, установленным организационно-распорядительными документами владельца инфраструктуры. Кроме того необходимо привести в действие стояночный (ручной) тормоз локомотива.", "b": false, "n": ""}, {"t": "После восстановления нормальной работы компрессорных установок перед приведением поезда в движение зарядить тормозную магистраль установленным давлением и отпустить автоматические тормоза.", "b": false, "n": ""}, {"t": "16.1.3 Перед приведением поезда в движение выполнить зарядку поезда сжатым воздухом, проверить плотность тормозной сети и целостность тормозной магистрали, а затем провести сокращенное опробование тормозов по двум хвостовым вагонам, извлечь все тормозные башмаки из-под колес, отпустить стояночные (ручные) тормоза в поезде, ступенями отпустить вспомогательный тормоз локомотива.", "b": false, "n": "16.1.3"}]}, {"id": "tb16_2", "cat": "tm_emerg", "page": 0, "pages": [], "title": "16.2 Остановка поезда на подъеме", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 164–165", "paras": [{"t": "16.2.1 Для остановки поезда на подъеме плавно снизить тягу и после снижения скорости выключить тягу, привести в действие автоматические тормоза поезда, а после остановки и вспомогательный тормоз локомотива. Перед остановкой привести в действие приборы пескоподачи.", "b": false, "n": "16.2.1"}, {"t": "Далее действовать, как указано в п.п. 16.1.1 настоящих Правил.", "b": false, "n": ""}, {"t": "16.2.2 При приведении поезда в движение необходимо руководствоваться указаниями п. 16.1.3 настоящих Правил. Если после включения тяги привести поезд в движение не удается, выполнить первую ступень торможения и затем отпустить тормоза поездным положением ручки крана машиниста. После сжатия поезда скатыванием локомотива назад на 5-10 м с учетом местных условий и длины поезда выполнить ступень торможения. После отпуска тормозов поездным положением ручки крана машиниста, выждать две третьих времени, указанного в «Справке об обеспечении поезда тормозами и исправном их действии» на отпуск хвостовых вагонов, включить тягу и привести поезд в движение.", "b": false, "n": "16.2.2"}, {"t": "16.2.3 При осаживании остановившегося на подъеме поезда на более легкий профиль руководствоваться порядком действия работников при вынужденной остановке поезда на перегоне согласно Правил технической эксплуатации. Отпустить вспомогательный тормоз и, после того как поезд придет в движение, удерживать его в растянутом состоянии применяя, при необходимости, вспомогательный тормоз локомотива. Для остановки поезда привести в действие автоматические тормоза поезда первой ступенью торможения.", "b": false, "n": "16.2.3"}, {"t": "После остановки отпустить тормоза поезда, выждать необходимое время для их полного отпуска и привести поезд в движение.", "b": false, "n": ""}]}, {"id": "tb16_3", "cat": "tm_emerg", "page": 0, "pages": [], "title": "16.3 При остановках поезда на крутых затяжных спусках, подъемах после применения экстренного торможения", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 165", "paras": [{"t": "16.3.1 В случае применения экстренного торможения с составом грузового поезда, в котором все воздухораспределители включены на горный режим, после остановки поезда машинист производит отпуск тормозов постановкой ручки крана машиниста в поездное положение до повышения давления в уравнительном резервуаре на величину 0,07 - 0,08 МПа (0,7 - 0,8 кгс/см2) меньше зарядного давления с последующим переводом ручки крана машиниста в положение «Перекрыша с питанием». После выдержки времени произвести полный отпуск тормозов положением «Зарядка и отпуск» повышением давления в уравнительном резервуаре на 0,05-0,07 МПа (0,5-0,7 кгс/см2) выше зарядного. При начале движения головной части поезда не снижать давление в тормозных цилиндрах локомотива менее 0,15 МПа (1,5 кгс/см2) с последующим плавным отпуском после начала движения всего поезда. При приведении поезда в движение на подъеме руководствоваться п. 16.2.2 настоящих Правил.", "b": false, "n": "16.3.1"}]}, {"id": "tb16_4", "cat": "tm_emerg", "page": 0, "pages": [], "title": "16.4 При доставке поезда на станцию после разрыва", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 165–166", "paras": [{"t": "16.4.1 При разрыве грузового поезда на перегоне и доставке его на станцию руководствоваться порядком действий работников при вынужденной остановке поезда на перегоне согласно Правил технической эксплуатации и Правилами по движению поездов и маневровой работе или иных нормативных документов, действующих на территории стран-участников Содружества, Грузии, Латвийской республики, Литовской республики и Эстонской республики.", "b": false, "n": "16.4.1"}, {"t": "При доставке разорвавшегося поезда с перегона поврежденные соединительные тормозные рукава заменить запасными или снятыми с хвостового вагона и локомотива.", "b": false, "n": ""}, {"t": "16.4.2 В процессе вывода разорвавшегося поезда отсутствие сжатого воздуха в тормозной сети последних вагонов может быть допущено только в случае невозможности восстановления целостности тормозной магистрали и необходимости перекрытия по этой причине концевых кранов. При этом в поезде, находящемся на подъеме, машинист должен заявить о необходимости постановки вспомогательного локомотива в хвост поезда для следования до ближайшей станции, где неисправность должна быть устранена или неисправный вагон отцеплен. Порядок вывода таких поездов с перегона, скорость их следования с учетом обеспеченности тормозным нажатием устанавливаются руководителем подразделения владельца инфраструктуры, а при отсутствии в составе железной дороги отделений железной дороги – заместителем руководителя подразделения владельца инфраструктуры и указываются в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "16.4.2"}, {"t": "16.4.3 Перед отправлением поезда с перегона выполнить сокращенное опробование автотормозов.", "b": false, "n": "16.4.3"}]}, {"id": "tb17_1", "cat": "tm_emerg", "page": 0, "pages": [], "title": "17.1 Общие положения", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 166–167", "paras": [{"t": "17.1.1 Контрольную проверку тормозов в поезде по заявлению машиниста, работников подразделения инфраструктуры или владельца подвижного состава выполняют на станциях с пунктами технического обслуживания или на промежуточной станции в случаях неудовлетворительного действия тормозов в пути следования, если не выявлена причина без такой проверки. Очередность и объем контрольной проверки тормозов определяют проводящие ее работники исходя из причин, вызвавших необходимость проверки.", "b": false, "n": "17.1.1"}, {"t": "17.1.2 Контрольную проверку тормозов заявляют поездному диспетчеру:", "b": false, "n": "17.1.2"}, {"t": "- машинист непосредственно или через дежурного по станции;", "b": false, "n": ""}, {"t": "-работники подразделения инфраструктуры через дежурного по станции;", "b": false, "n": ""}, {"t": "- работники поездной бригады пассажирского поезда через машиниста или через дежурного по станции.", "b": false, "n": ""}, {"t": "17.1.3 На основании регистрируемого приказа, передаваемого машинисту по поездной радиосвязи, с учетом профиля пути и обеспечения безопасности движения машинист и поездной диспетчер совместно определяют станцию, на которой будет проводиться контрольная проверка, порядок следования поезда до этой станции.", "b": false, "n": "17.1.3"}, {"t": "Если до пункта проведения контрольной проверки тормозов поезду необходимо проследовать более одного перегона, то поездной диспетчер обязан передать всем попутным дежурным по станции регистрируемый приказ об особом режиме следования этого поезда.", "b": false, "n": ""}, {"t": "Для организации проведения контрольной проверки тормозов поездной диспетчер вызывает лиц, перечень которых устанавливается в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "17.1.4 При контрольной проверке тормозов на станции проверяется техническое состояние тормозного оборудования поезда, а в пути следования - действие автотормозов, обеспеченность поезда тормозным нажатием и правильность управления тормозами машинистом.", "b": false, "n": "17.1.4"}, {"t": "17.1.5 По результатам контрольной проверки составляют акт в соответствии с Приложением 3.", "b": false, "n": "17.1.5"}]}, {"id": "tb17_2", "cat": "tm_emerg", "page": 0, "pages": [], "title": "17.2 Порядок проведения контрольной проверки тормозов на станции. 166 17.3 Порядок проведения контрольной проверки тормозов в пути следования", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 167–171", "paras": [{"t": "- плотность питательной сети пассажирского поезда (при наличии);", "b": false, "n": ""}, {"t": "– давление воздуха в тормозной магистрали последнего вагона, которое должно быть не менее установленного;", "b": false, "n": ""}, {"t": "– правильность включения на грузовых вагонах режимов торможения в соответствии с загрузкой вагона, горного или равнинного режима – в соответствии с условиями профиля пути. В пассажирском поезде проверить правильность включения режимов воздухораспределителей в соответствии с количеством вагонов в составе, а также при пересылке пассажирских вагонов в грузовом поезде;", "b": false, "n": ""}, {"t": "– исправность автоматических регуляторов грузовых режимов (авторежимов) и авторегуляторов рычажных передач, правильность установки композиционных и чугунных тормозных колодок в соответствии с положением осей в отверстиях затяжек горизонтальных рычагов, величины выхода штоков тормозных цилиндров при полном служебном торможении, правильность регулировки рычажной передачи и состояние стояночных (ручных) тормозов, соответствие плеч горизонтальных рычагов таре пассажирского вагона при заклинивании колесных пар;", "b": false, "n": ""}, {"t": "– работу тормозного оборудования локомотива.", "b": false, "n": ""}, {"t": "17.2.2 Выполнить полное опробование тормозов поезда, при котором торможение производить понижением давления в уравнительном резервуаре на величину, при которой выявлена неудовлетворительная работа тормозов, фиксируя при этом число тормозов, не пришедших в действие или самопроизвольно отпустивших, и время, по истечении которого произошел самопроизвольный отпуск. Воздухораспределители пассажирских и грузовых типов на равнинном режиме не должны самопроизвольно отпускать в течение не менее 300 секунд (5 минут), а грузовых на горном режиме – не менее 600 секунд (10 минут). В случаях выявления самопроизвольного отпуска тормозов в течение 300 сек (5 мин), а в грузовых на горном режиме в течение 600 секунд (10 минут) зафиксировать номера подвижных единиц с самопроизвольным отпуском и, по истечению указанного времени, выполнять повторное торможение с обязательной протяжкой скоростемерной лепты (при наличии).", "b": false, "n": "17.2.2"}, {"t": "17.2.3 В грузовых поездах выполнить первую ступень торможения и выдержав ее в течение 120 секунд (2 минут), произвести дополнительную ступень торможения снижением давления в магистрали на 0,03 МПа (0,3 кгс/см2). Через 120 секунд (2 минуты) проверить, нет ли отпуска тормозов в составе вследствие дутья отдельных воздухораспределителей.", "b": false, "n": "17.2.3"}, {"t": "17.2.4 На тормозной цилиндр вагона, в котором произошло заклинивание колесных пар, установить манометр и зарядить тормозную сеть поезда до максимального давления, зафиксированного на носителе информации параметров движения перед торможением, плюс 0,03 МПа (0,3 кгс/см2). Затем выполнить полное служебное торможение снижением давления в магистрали до 0,35 МПа (3,5 кгс/см2) и проверить у этого вагона давление в тормозных цилиндрах по манометру, выход штока и прилегание колодок к колесам.", "b": false, "n": "17.2.4"}, {"t": "При зарядном давлении 0,50 - 0,52 МПа (5,0 - 5,2 кгс/см2) давление в тормозных цилиндрах пассажирских вагонов должно быть 0,39 - 0,42 МПа (3,9 - 4,2 кгс/см2), а при большем зарядном давлении – 0,39 - 0,43 МПа (3,9 - 4,3 кгс/см2) если иное не оговорено в технической документации на конкретную модель вагона.", "b": false, "n": ""}, {"t": "Давление в тормозных цилиндрах грузовых вагонов без авторежимов должно быть: на груженом режиме торможения не более 0,45 МПа (4,5 кгс/см2), на среднем – не более 0,34 МПа (3,4 кгс/см2), на порожнем – не более 0,18 МПа (1,8 кгс/см2);", "b": false, "n": ""}, {"t": "На грузовых вагонах, оборудованных авторежимом, давление в тормозных цилиндрах должно быть пропорционально загрузке вагона, которая определяется по положению его вилки относительно корпуса авторежима или по фактической загрузке вагона.", "b": false, "n": ""}, {"t": "Давление в тормозных цилиндрах грузовых вагонов также следует проверять в случае подозрения о неисправности авторежима на вагоне (пониженная эффективность автоматических тормозов поезда при отсутствии явных причин снижения тормозной эффективности, таких как установка чугунных колодок вместо композиционных или несоответствие установки затяжки типу колодок).", "b": false, "n": ""}, {"t": "17.2.5 Соответствие режимов включения воздухораспределителя на вагонах его загрузке, а на вагонах, оборудованных авторежимом - наличие опорной балки и контактной планки.", "b": false, "n": "17.2.5"}, {"t": "17.2.6 Грузовые вагоны с тормозными цилиндрами:", "b": false, "n": "17.2.6"}, {"t": "а) считаются с выключенным тормозом:", "b": false, "n": ""}, {"t": "- с выходом штока более 230 мм для тормозного цилиндра диаметром 356 мм;", "b": false, "n": ""}, {"t": "- с выходом штока более 230 мм для тормозного цилиндра диаметром 254 мм и максимальным выходом штока 240 мм;", "b": false, "n": ""}, {"t": "- с выходом штока более 120 мм для тормозного цилиндра диаметром 254 мм и максимальным выходом штока 125 мм;", "b": false, "n": ""}, {"t": "б) имеющие эффективность 2/3 от номинальной:", "b": false, "n": ""}, {"t": "- с выходом штока более 180 мм до 230 мм для тормозного цилиндра диаметром 356 мм;", "b": false, "n": ""}, {"t": "- с выходом штока более 180 мм до 230 мм для тормозного цилиндра диаметром 254 мм и максимальным выходом штока 240 мм;", "b": false, "n": ""}, {"t": "- с выходом штока более 100 мм до 120 мм для тормозного цилиндра диаметром 254 мм и максимальным выходом штока 125 мм.", "b": false, "n": ""}, {"t": "Грузовые вагоны с чугунными тормозными колодками, установленными вместо композиционных, принимаются с включенным тормозом и имеющими эффективность 2/3 от номинальной для данного типа колодок.", "b": false, "n": ""}, {"t": "17.2.7 Проверить плотность питательной и тормозной сетей локомотива, действие крана машиниста, темп перехода с повышенного на нормальное зарядное давление, стабильность поддержания давления в тормозной магистрали при поездном положении ручки крана машиниста и после ступени торможения и перевода его в положение «Перекрыша с питанием», пределы давления в главных резервуарах, действие автоматического тормоза локомотива. После установки ручки крана машиниста из поездного положения в положение «Перекрыша с питанием» завышение давления в ней не допускается. После снижения давления в уравнительном резервуаре на 0,15 МПа (1,5 кгс/см2) положением служебного торможения ручки крана машиниста и перевода его в положение «Перекрыша с питанием» допускается завышение давления в тормозной магистрали не более чем на 0,03 МПа (0,3 кгс/см2) в течение 40 секунд (тормоза в поезде при этом не должны отпускать).", "b": false, "n": "17.2.7"}, {"t": "17.2.8 Проверить проходимость воздуха через блокировочное устройство. Проходимость считается нормальной, если при нахождении ручки крана машиниста в положении «Зарядка и отпуск» и открытии концевого крана тормозной магистрали со стороны проверяемого блокировочного устройства при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2) снижении давления с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см) в главных резервуарах объемом 1000 л происходит в течение 9 - 12 секунд. При большем объеме главных резервуаров это время должно быть пропорционально увеличено.", "b": false, "n": "17.2.8"}, {"t": "17.2.9 Проверить проходимость воздуха через кран машиниста. Проходимость считается нормальной, если при нахождении ручки крана машиниста в поездном положении и открытом концевом кране тормозной магистрали со стороны рабочей кабины при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2) снижении давления с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см2) в главных резервуарах объемом 1000 л происходит в течение 16 - 20 секунд. При большем объеме главных резервуаров время это должно быть пропорционально увеличено.", "b": false, "n": "17.2.9"}, {"t": "17.2.10 Выполнить торможение и отпуск в соответствии с данными, зафиксированными на перегоне, где выявлена ненормальная работа тормозов. После такой проверки выполнить первую ступень торможения с разрядкой уравнительного резервуара на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2), а затем отпуск автотормозов переводом ручки крана машиниста в положение «Зарядка и отпуск», в пассажирском поезде – до зарядки уравнительного резервуара установленным давлением, в грузовом поезде – до момента завышения давления на 0,03 - 0,05 МПа (0,3 - 0,5 кгс/см2) выше предтормозного зарядного с последующим переводом ручки крана машиниста в поездное положение. При этом время отпуска тормозов у контролируемых вагонов с заклиниванием колесных пар на равнинном режиме должно быть не более: 50 секунд – в грузовом поезде с числом осей состава до 300; 60 секунд - с числом осей состава более 300 до 400 (включительно); 80 секунд – с числом осей состава более 400; 25 секунд – в пассажирском поезде с числом осей состава до 80 (включительно); 40 секунд – с числом осей состава более 80.", "b": false, "n": "17.2.10"}, {"t": "У вагонов с воздухораспределителями грузового типа, включенными на горный режим, указанное время увеличивать в 1,5 раза.", "b": false, "n": ""}, {"t": "Увеличенное время отпуска тормоза принимается во внимание как возможная причина заклинивания колесных пар, если приведение вагона в движение могло происходить до окончания отпуска тормоза.", "b": false, "n": ""}, {"t": "Если после проверки воздухораспределителя на вагоне в поезде не выявлена неисправность, воздухораспределитель снять и определить неисправность на стенде в контрольном пункте автотормозов. При снятии проверить чистоту сетки воздухораспределителя и фильтра на магистральном отводе воздухопровода.", "b": false, "n": ""}, {"t": "17.2.11 В пассажирском поезде с электропневматическими тормозами проверить его действие по прижатию тормозных колодок (тормозных накладок) к колесам (тормозным дискам) при первой ступени торможения, исправность междувагонных электрических соединений и напряжение переменного и постоянного тока на локомотиве и в электрической цепи хвостового вагона при нахождении ручки крана машиниста в поездном, тормозном положениях и в положении перекрыши. Проверить работу автоматического и электропневматического тормозов в соответствии с требованиями главы 9 настоящих Правил.", "b": false, "n": "17.2.11"}, {"t": "17.2.12 В пассажирском поезде с вагонами, оборудованными воздухораспределителями пассажирского типа со ступенчатым отпуском или дисковыми тормозами, дополнительно проверить исправность и действие противоюзных устройств и скоростных регуляторов.", "b": false, "n": "17.2.12"}, {"t": "17.2.13 В пассажирском поезде с дисковыми тормозами проверить положение разобщительных кранов, плотность тормозной сети, исправную работу обратных клапанов, исправное состояние манометров, контролирующих давление в тормозных цилиндрах тележек и исправность индикаторов контроля работы тормозов вагонов.", "b": false, "n": "17.2.13"}, {"t": "17.3 Порядок проведения контрольной проверки тормозов в пути следования.", "b": false, "n": "17.3"}, {"t": "17.3.1 При контрольной проверке автотормозов и электропневматических тормозов поезда в пути следования проверить действие тормозов при установленной ступени торможения с замером расстояния, проходимого поездом в тормозном режиме со снижением скорости с 60 до 50 км/ч на площадке или на спуске небольшой крутизны (до 0,004). При невозможности выполнения требований по скорости начала торможения, исходя из местных условий, скорость определяется в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "17.3.1"}, {"t": "17.3.2 Для проверки фактического обеспечения поезда тормозным нажатием после повышения скорости до 60-80 км/ч выполнить экстренное торможение и по значению пройденного пути от момента перемещения ручки крана машиниста до полной остановки поезда определить по таблицам Приложения 4 настоящих Правил достаточность тормозного нажатия.", "b": false, "n": "17.3.2"}, {"t": "Для поездов, обращающихся со скоростями движения свыше 160 км/ч, скорость начала торможения, определяется в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": ""}, {"t": "17.3.3 Проверить плавность торможения пассажирских поездов при скорости и режимах торможения, при которых происходили большие реакции в поезде при наличии технических средств.", "b": false, "n": "17.3.3"}, {"t": "17.3.4 При оборудовании локомотива локомотивным устройством безопасности с регистрацией параметров правильность управления тормозами рассматривается комиссионно, после расшифровки файла поездки.", "b": false, "n": "17.3.4"}]}, {"id": "tb18", "cat": "tm_emerg", "page": 0, "pages": [], "title": "18 Поездные испытания тормозов и контроль за управлением тормозами в поездах", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 171–173", "paras": [{"t": "18.1 Опытные поездки назначаются в соответствии с организационно распорядительными документами владельца инфраструктуры в рамках национального законодательства и подразделяются на опытные поездки трех родов.", "b": false, "n": "18.1"}, {"t": "18.2 Опытные поездки первого рода предназначены для испытаний новой и (или) модернизированной тормозной техники, разработки, уточнения и проверки нормативов и правил эксплуатации тормозов.", "b": false, "n": "18.2"}, {"t": "18.3 Опытные поездки второго рода предназначены для разработки технико-распорядительных документов владельца инфраструктуры и (или) технико-распорядительных документов владельца подвижного состава с учетом местных условий по управлению тормозами, проверке их действия и правилам эксплуатации.", "b": false, "n": "18.3"}, {"t": "18.4 Опытные поездки третьего рода осуществляются для контроля за соблюдением правил управления тормозами, состоянием тормозного оборудования на подвижном составе, обобщения и распространения передового опыта. Опытные поездки третьего рода проводят систематически не реже одного раза в три месяца по всем основным линиям по утвержденному графику с использованием тормозоиспытательного вагона или автономных устройств регистрации параметров работы тормозной системы поезда.", "b": false, "n": "18.4"}, {"t": "18.5 При выполнении опытных поездок первого и второго рода подвижной состав и его тормозное оборудование должны быть приведены в полное соответствие с требованиями Правил технической эксплуатации железных дорог и других нормативных документов владельца инфраструктуры. При необходимости выполняют повагонное взвешивание. Допускается проведение опытных поездок с эксплуатационными поездами без специальной подготовки их тормозного оборудования для выявления влияния отклонений в его состоянии на действие тормозов. В зависимости от от целей и задач опытных поездок должны привлекаться научные организации.", "b": false, "n": "18.5"}, {"t": "При опытных поездках третьего рода специальная подготовка тормозного оборудования не производится.", "b": false, "n": ""}, {"t": "18.6 При всех видах поездок повагонно фиксируют характеристику тормозного оборудования поезда (типы воздухораспределителей, режимы торможения, наличие авторежимов, типы тормозных колодок (тормозных накладок), их соответствие передаточному числу рычажной передачи, типы авторегуляторов рычажной передачи, выход штоков тормозных цилиндров, наличие сползших за наружную грань поверхности катания колеса тормозных колодок (тормозных накладок), состояние колодок и поверхности катания колес, увеличенный наклон рычагов тормозной передачи в заторможенном положении, плотность тормозной сети, состояние крепления тормозного оборудования, а в поездках первого рода – дополнительно плотность тормозных цилиндров, предельное давление в тормозных цилиндрах при экстренном торможении и время их наполнения), проверяют производительность (подачу воздуха) компрессоров локомотива, плотность уравнительного резервуара крана машиниста, питательной сети, тормозной магистрали и тормозных цилиндров локомотива, проверяют отсутствие недопустимого завышения давления в тормозной магистрали после перевода ручки крана машиниста из поездного положения в положение «Перекрыша с питанием», темп перехода с повышенного давления на нормальное зарядное после завышения давления в тормозной магистрали не менее чем на 0,1 МПа (1,0 кгс/см2) по сравнению с нормальным зарядным, проходимость сжатого воздуха через блокировочное устройство локомотива.", "b": false, "n": "18.6"}, {"t": "По результатам опытных поездок составляют акт.", "b": false, "n": ""}]}, {"id": "ta1", "cat": "tm_app", "page": 0, "pages": [], "title": "Приложение 1. Справка об обеспечении поезда тормозами и исправном их действии", "steps": [], "notes": ["Таблицы показаны страницами документа — нажмите, чтобы увеличить."], "kind": "info", "imgs": [{"k": "b174", "c": "Стр. 174"}, {"k": "b175", "c": "Стр. 175"}, {"k": "b176", "c": "Стр. 176"}], "src": "Правила по тормозам, 2025, стр. 174–176", "ft": "Наименование железнодорожной администрации Штемпель станции Приложение 1 форма ВУ-45 Время выдачи ________ ч ________ м СПРАВКА об обеспечении поезда тормозами и исправном их действии Локомотив серия__________  п.п. 15.3-15.6 таблицы, для которых в знаменателе – круче 0,010 до 0,012 включительно. 2 В скобках приведены значения максимальной скорости и соответствующие расстояния ограждения мест внезапно возникших препятствий на линиях, оборудованных автоблокировкой с трехзначной сигнализацией при зеленом огне локомотивного светофора АЛСН, разрешающем следование поездов с указанной максимальной скоростью 3 Расстояния ограждения мест внезапно возникших препятствий для поездов по п.п. 11, 13, 14.1, 15.2, 15.4-15.7 таблицы выбирают исходя из максимальной скорости движения, определенной п. 3.1. 4 Тормозная система рефрижераторных вагонов для обращения рефрижераторных поездов со скоростями свыше 90 до 120 км/ч включительно должна отвечать специальным техническим условиям. 5 Для скоростного пассажирского поезда по п. 7 и 8 в графе 6 таблицы указаны расстояния ограждения в числителе до 0,006 включительно, в знаменателе круче 0,006, но не более 0,010. 6. Длина одиночных поездов в составе соединённого поезда массой до 14,2 тыс. т должна быть не более 76, а во втором - не более 71, а вес каждого поезда не более 7,1 тыс. т. 2. Скорости движения пассажирских поездов 2.1. Если в составе пассажирского поезда имеются вагоны габарита РИЦ и вагоны других стран с включенными автоматическими тормозами, но не оборудованные электропневматическими тормозами, то разрешается отправлять такой поезд с применением автоматических тормозов и эксплуатировать со скоростями, указанными в п.п. 5 и 6 таблицы 1 настоящих Норм, при условии обеспечения необходимым тормозным нажатием. 180 2.2. Пассажирским поездам по п. 1 таблицы 1 настоящих Норм при отказе электропневматического тормоза в пути следования и переходе на автоматические тормоза, а также в исключительных случаях при ведении их грузовыми локомотивами, не оборудованными электропневматическими тормозами, разрешается следовать без уменьшения максимально допустимой скорости, а пассажирским поездам по п.п. 2, 3, 4 таблицы 1 настоящих Норм в случае отказа электропневматического тормоза в пути следования разрешается следовать с уменьшением максимально допустимой скорости на 10 км/ч, а со скоростями движения свыше 160 км/ч (п. 7, 8 таблицы 1 настоящего Приложения) уменьшением максимально допустимой скорости на 20 км/ч, если тормозное нажатие отвечает требованиям соответствующих пунктов настоящих Норм. 2.3. Пассажирские поезда при наличии в составе одного вагона габарита РИЦ с выключенным тормозом, оборудованного пролетной магистралью электропневматического тормоза, разрешается эксплуатировать со скоростями, указанными в п.п. 1, 2 таблицы 1 настоящих Норм при условии обеспечения необходимым тормозным нажатием. 3. Скорости движения грузовых поездов 3.1 На участках, оборудованных автоблокировкой с трехзначной сигнализацией, при зеленом огне локомотивного светофора автоматической локомотивной сигнализации непрерывного типа (АЛСН) при обеспечении тормозного нажатия не менее, указанного в таблице 1 разрешается движение с максимальной скоростью: - грузовых груженых поездов - 90 км/ч; - грузовых порожних длиной от 400 до 520 осей - 90 км/ч; - грузовых поездов, обращающихся со скоростями свыше 100 до 120 км/ч включительно - 120 км/ч. - грузовых поездов, обращающихся со скоростями свыше 120 до 140 км/ч включительно при пневматическом управлении тормозами – 140 км/ч. На линиях, оборудованных автоблокировкой с четырехзначной сигнализацией максимальная скорость движения не должна превышать: - грузовых груженых поездов - 80 км/ч; - грузовых порожних длиной от 400 до 520 осей - 80 км/ч; - грузовых поездов, обращающихся со скоростями свыше 100 до 120 км/ч включительно - 100 км/ч; - грузовых поездов, обращающихся со скоростями свыше 120 до 140 км/ч включительно при пневматическом управлении тормозами – 120 км/ч. 181 На участках с полуавтоматической блокировкой максимальная скорость грузовых поездов устанавливается владельцем инфраструктуры при условии соблюдения расстояний ограждения мест внезапно возникших препятствий, указанных в таблице 1 настоящих Норм. 3.2 Грузовым поездам по п.14.1 таблицы 1 настоящих Норм в случае отказа электропневматического тормоза в пути следования разрешается следовать с уменьшением максимально допустимой скорости на 10 км/ч. 3.3 При соблюдении условий, перечисленных в п. 3.1 настоящих Норм для максимальной скорости 90 км/ч грузовых груженых поездов, скорости движения грузовых поездов повышенного веса и соединенных, приведенные в п.п. 15.3, 15.5-15.7 таблицы 1 настоящих Норм увеличиваются на 10 км/ч, если крутизна руководящего спуска, по которому следует поезд, не превышает 0,010, а расстояния ограждения мест внезапно возникших препятствий соответствуют значениям, приведенным в скобках указанных пунктов таблицы 1 настоящих Норм. 3.4 Грузовые груженые поезда, в составе которых имеются вагоны с нагрузкой от колесной пары на рельсы более 21 тс и автотормоза все включены, могут следовать со скоростью до 80 км/ч включительно, в том числе при наличии вагонов с несимметричной тормозной рычажной передачей (например, вагоны думпкары, хоппер-дозаторы): - с тормозным нажатием менее 33 тс, но не менее 32 тс на 100 тс веса состава - при наличии в составе не менее 50 % вагонов, оборудованных композиционными тормозными колодками, с воздухораспределителями, включенными на средний режим; - с тормозным нажатием менее 32 тс, но не менее 31 тс на 100 тс веса состава - при наличии в составе не менее 75 % вагонов, оборудованных композиционными тормозными колодками, с воздухораспределителями, включенными на средний режим; - с тормозным нажатием менее 31 тс, но не менее 30 тс на 100 тс веса состава - при наличии в составе не менее 100 % вагонов, оборудованных композиционными тормозными колодками, с воздухораспределителями, включенными на средний режим. Допускается грузовым груженым поездам следовать со скоростью до 85 км/ч включительно в составе которых имеются вагоны с нагрузкой от колесной пары на рельсы более 21 тс и автотормоза все включены с тормозным нажатием менее 33 тс, но не менее 30 тс на 100 тс веса состава при наличии в составе не менее 100 % вагонов, оборудованных композиционными тормозными колодками, с воздухораспределителями, включенными на средний режим и при отсутствии в составе поезда вагонов с несимметричной 182 тормозной рычажной передачей (например, вагоны думпкары, хоппердозаторы). Процент вагонов, оборудованных композиционными колодками, указывать в «Справке об обеспечении поезда тормозами и исправном их действии» по образцу: К - 50%, К - 75 %, К-100 %. 4. Порядок пропуска и отправления поездов при невозможности обеспечения единого наименьшего тормозного нажатия 4.1 При невозможности обеспечения единого наименьшего тормозного нажатия в соответствии с данными таблицы 1 настоящих Норм разрешается пропускать или отправлять поезда в случаях, указанных в п. 4.2 и 4.3 настоящих Норм, при тормозном нажатии не менее приведенного в таблице 2 настоящих Норм. 3 4 круче 0,010 до 0,015 (0,012) включительно 2 2 Пассажирские поезда, обращающиеся со скоростями до 120 км/ч включительно Пассажирские поезда, обращающиеся со скоростями более 120 до 130 км/ч включительно Пассажирские поезда, обращающиеся со скоростями более 130 до 140 км/ч включительно Пассажирские поезда, обращающиеся со скоростями более 140 до 160 км/ч включительно круче 0,006 до 0,010 (включительно) 1 1 Категория поезда Допускаемое Максимальная скорость при минимальное допускаемом минимальном тормозное тормозном нажатии, км/ч, нажатие на при руководящем спуске 100 тс веса поезда (состава), тс 3 45 4 105 5 90 6 80 60 120 110 - 68 130 120 - 70 150 140 - до 0,006 (включительно) № п/п Таблица 2 - Нормы допускаемого минимального тормозного нажатия на 100 тс веса поезда (состава) и максимальные скорости движения поездов при этом тормозном нажатии на участках с руководящими спусками до 0,015 включительно 183 2 Скоростной пассажирский поезд Рефрижераторные поезда, обращающиеся со скоростями до 100 км/ч включительно Рефрижераторные поезда, обращающиеся со скоростями более 100 до 120 км/ч в lass=\"lbl\">ПЕРВЫЙ стоит</text><text x=\"840\" y=\"146\" class=\"sub\">← хвостовой вагон</text>\n<g class=\"tr2\"><rect x=\"380\" y=\"154\" width=\"96\" height=\"40\" rx=\"6\" class=\"loco2\"/><rect x=\"320\" y=\"160\" width=\"56\" height=\"34\" rx=\"3\"/><rect x=\"260\" y=\"160\" width=\"56\" height=\"34\" rx=\"3\"/></g>\n<path d=\"M478 177 h 46\" class=\"arrow\"/><path d=\"M512 166 l 16 11 l -16 11\" class=\"arrowh\"/>\n<text x=\"400\" y=\"118\" class=\"lbl\">ВТОРОЙ едет →</text>\n<line x1=\"90\" y1=\"198\" x2=\"90\" y2=\"122\" class=\"sig\"/><circle cx=\"90\" cy=\"110\" r=\"14\" class=\"red\"/>\n<text x=\"90\" y=\"72\" class=\"sub\">красный</text>\n<path d=\"M90 245 H 500\" class=\"dim\"/><path d=\"M500 236 V 254 M640 236 V 254 M700 236 V 254\" class=\"tick\"/>\n<text x=\"295\" y=\"282\" class=\"v\">≤ 20 км/ч</text><text x=\"295\" y=\"310\" class=\"sub\">по приказу ДНЦ</text>\n<path d=\"M500 245 H 640\" class=\"dim\"/><text x=\"570\" y=\"282\" class=\"v\">5 км/ч</text><text x=\"555\" y=\"310\" class=\"sub\">150–200 м</text>\n<path d=\"M640 245 H 700\" class=\"dim stop\"/><text x=\"670\" y=\"282\" class=\"v\">стоп</text><text x=\"690\" y=\"310\" class=\"sub\">10–15 м</text>\n<text x=\"850\" y=\"282\" class=\"v\">сцепка ≤ 3 км/ч</text><text x=\"850\" y=\"310\" class=\"sub\">помощник в кабине</text>\n</svg>"}, {"id": "av2", "cat": "av_step", "page": 0, "pages": [], "title": "Шаг 1. Оба машиниста: договориться по радио", "steps": ["Получив приказ ДНЦ на соединение — связаться по поездной радиосвязи.", "Сообщить друг другу: номера локомотивов и поездов, вес, длину в осях, тормозное нажатие (по справке об обеспечении поезда тормозами), свою фамилию.", "Сверить по натурным листам, что оба поезда подходят под требования инструкции.", "Первый поезд: отсоединить разъём КОН, САУТ-ЦМ перевести в режим АЛС, КЛУБ-У работает штатно, запись в ТУ-152.", "Второй поезд: отсоединить КОН, САУТ-ЦМ в режим АЛС, проверить сбор тяги, КЛУБ-У перевести в «Двойная тяга», запись в ТУ-152."], "notes": ["Перевод КЛУБ-У в «Двойная тяга»: ввести команду К-799 → ввести скорость на 10 км/ч выше установленной → машинист и помощник одновременно нажимают РБ и РБП и держат 1,5–2 с → в течение 30 с кнопкой РМП выбрать мигающий режим «П» → ввести команду К-262."], "kind": "fault", "src": "Местная инструкция 2017, п. 6.5, 6.11, 6.12"}, {"id": "av3", "cat": "av_step", "page": 0, "pages": [], "title": "Шаг 2. Машинист ПЕРВОГО поезда: остановиться и сообщить", "steps": ["Доехать до места, указанного в приказе ДНЦ, и остановиться.", "Сообщить по радио по форме (см. ниже) и вызывать, пока второй машинист не подтвердит.", "Стоять, поезд не трогать. Осаживать первый поезд запрещено.", "Когда помощник второго поезда продувает ТМ и сработает датчик обрыва ТМ №418 — выполнить ступень торможения 0,5–0,6 кгс/см²."], "notes": ["Форма: «Внимание, внимание, внимание! Машинисту поезда №__, фамилия__, локомотив №__. Я машинист поезда №__, фамилия__, локомотив №__, остановился на __ км __ пк для формирования соединённого поезда. Условная длина поезда __»."], "kind": "fault", "src": "Местная инструкция 2017, п. 6.7, 6.10"}, {"id": "av4", "cat": "av_step", "page": 0, "pages": [], "title": "Шаг 3. Машинист ВТОРОГО поезда: подъехать и сцепиться", "steps": ["Запрещающий светофор, за которым стоит первый поезд, проезжать по регистрируемому приказу не быстрее 20 км/ч, с особой бдительностью.", "За 150–200 м до хвостового вагона снизить скорость до 5 км/ч.", "Остановиться за 10–15 м до хвостового вагона первого поезда.", "Дождаться, пока помощник осмотрит автосцепки и продует рукава. При срабатывании датчика №418 у себя краном ничего не делать.", "Предупредить машиниста первого поезда, что начинаете сцепление.", "Тронуться только когда помощник в кабине. Сцепляться со скоростью не более 3 км/ч.", "После сцепления затормозить локомотив вспомогательным тормозом на максимальное давление в ТЦ.", "Дать команду помощнику соединить рукава ТМ и открыть концевые краны.", "Доложить машинисту головного: «…Соединение с хвостовой частью поезда №__ выполнил, отпускаем тормоза».", "Отпустить тормоза с завышением давления в ТМ на 0,3–0,5 кгс/см² выше зарядного.", "После полной зарядки ТМ, отключив компрессоры обоих локомотивов, замерить плотность и доложить машинисту головного."], "notes": ["За правильность сцепления на перегоне, соединение рукавов и открытие концевых кранов отвечает машинист второго поезда (на станции — работник вагонного хозяйства)."], "kind": "fault", "src": "Местная инструкция 2017, п. 6.8–6.10"}, {"id": "av5", "cat": "av_step", "page": 0, "pages": [], "title": "Шаг 4. Помощник машиниста ВТОРОГО поезда", "steps": ["Осмотреть автосцепку хвостового вагона и локомотива, убедиться, что они готовы к сцеплению.", "Снять с подвесок концевые рукава ТМ локомотива и хвостового вагона, очистить головки от грязи.", "Однократно на 8–10 секунд продуть через концевой кран ТМ локомотива и хвостового вагона.", "Вернуться в кабину: без помощника в кабине трогаться запрещено.", "После сцепления по команде машиниста соединить рукава ТМ и открыть концевые краны.", "При опробовании тормозов проверить срабатывание и отпуск по 2 последним вагонам первого поезда и 5 вагонам второго, доложить машинисту."], "notes": [], "kind": "fault", "src": "Местная инструкция 2017, п. 6.10, 6.13"}, {"id": "av6", "cat": "av_step", "page": 0, "pages": [], "title": "Шаг 5. Опробование тормозов соединённого поезда", "steps": ["Машинист головного делает ступень торможения: разрядка УР на 0,6–0,7 кгс/см².", "Когда на пульте второго локомотива загорится лампа «ТМ» — машинист второго делает такую же ступень.", "Помощник второго проверяет тормоза у 2 последних вагонов первого поезда и 5 вагонов второго.", "Машинист второго докладывает: «Тормоза сработали, готов к отпуску тормозов».", "По команде головного оба отпускают тормоза с завышением давления в УР на 0,3–0,5 кгс/см².", "Помощник второго проверяет отпуск по тем же вагонам. Доклад: «Тормоза отпустили, готов к отправлению».", "Машинист головного докладывает ДНЦ (ДСП): «…опробование тормозов произведено, готов к отправлению»."], "notes": ["С ИСАВП-РТ-М: машинист второго включает «Автоведение», машинист головного через кнопочный контроллер (С7 → А) выбирает ступень разрядки УР клавишами 1–9, отпуск — клавиша 0 и величина завышения (0,5–0,7 атм по правилам)."], "kind": "fault", "imgs": [{"k": "a012", "c": "Слайд 12"}], "src": "Местная инструкция 2017, п. 6.13; Презентация ИСАВП-РТ-М, слайд 12"}, {"id": "av7", "cat": "av_step", "page": 0, "pages": [], "title": "Зарядное давление и плотность ТМ", "steps": [], "notes": ["Груженый поезд (инструкция 2017): головной 5,2–5,3 кгс/см², второй 5,0–5,2 кгс/см².", "Порожний поезд (инструкция 2017): головной 5,0 кгс/см², второй 4,8 кгс/см².", "По презентации ИСАВП-РТ-М (правила №151): головной 5,1–5,2 атм, в составе 5,0–5,1 атм. Зарядное давление второго локомотива меньше на 0,1–0,2 атм (по инструкции — на 0,15–0,2).", "Плотность: допустимое минимальное время снижения давления в ГР на 0,5 кгс/см² на каждые 1000 л объёма ГР — 351–400 осей: 15 с; 401–500: 13 с; 501–600: 10 с; 601–700: 9 с; 701–780: 8 с. Время = сумма времени по всем локомотивам ÷ их суммарный объём в тысячах литров.", "При плотности ниже нормы отправлять соединённый поезд запрещено."], "kind": "info", "imgs": [{"k": "a009", "c": "Слайд 9"}], "src": "Местная инструкция 2017, п. 6.10, 6.11; Презентация ИСАВП-РТ-М, слайд 9"}, {"id": "av8", "cat": "av_step", "page": 0, "pages": [], "title": "Где и когда можно соединять", "steps": [], "notes": ["Профиль: спуски до 0,004 и подъёмы до 0,006 включительно; кривая в месте остановки — не менее R=500 м. На стрелочных переводах станций объединять запрещено.", "Ночью место соединения должно быть освещено. Не соединять при видимости 100 м и менее (снег, метель) и в зонах неустойчивой радиосвязи.", "Температура не ниже −25 °С. Не допускается при гололёде на контактной сети более 3 мм.", "Нельзя соединять гружёный поезд с порожним. Меньший по массе и длине состав ставят вторым.", "Не соединяют поезда с людьми, пассажирскими вагонами, МВПС, негабаритными и опасными грузами, транспортёрами, хоппер-дозаторами и т.п. (полный перечень — п. 5.10).", "Перечень мест для соединения и разъединения — в приказе ЗАБ-165 от 24.06.2022 (по презентации) и в п. 5.4 инструкции."], "kind": "info", "imgs": [{"k": "a002", "c": "Слайд 2"}], "src": "Местная инструкция 2017, п. 5.4–5.12; Презентация ИСАВП-РТ-М, слайд 2"}, {"id": "ai1", "cat": "av_isavp", "page": 0, "pages": [], "title": "Режим ведущий / ведомый и маршрут", "steps": ["После объединения оба машиниста: Настройки → сменить режим РТ.", "Головной локомотив выбирает режим «Ведущий», локомотив в составе — «Ведомый».", "Оба выбирают маршрут.", "Затем выйти из режима «Маневровый» в меню Настройки."], "notes": [], "kind": "fault", "imgs": [{"k": "a003", "c": "Слайд 3"}, {"k": "a004", "c": "Слайд 4"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai2", "cat": "av_isavp", "page": 0, "pages": [], "title": "Связь между локомотивами: сетевой адрес и доп. канал", "steps": ["Оба машиниста: Настройки → САВПРТ.", "Установить сетевой адрес и включить доп. канал.", "Проверить по значку антенны устойчивость связи (основной / резервный канал)."], "notes": [], "kind": "fault", "imgs": [{"k": "a005", "c": "Слайд 5"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai3", "cat": "av_isavp", "page": 0, "pages": [], "title": "Нет связи между локомотивами (модем М-ЛИНК)", "steps": ["Перезапустить радиомодем М-ЛИНК: выключить тумблер, через 30 секунд включить.", "Убедиться, что горят светодиоды «ВКЛ», «ПРД», «ПРМ»."], "notes": ["Где модем: на 3(2,4)ЭС5К с системой «Ковчег» с завода — в проходе над дверью в кабину; на машинах с ИСАВП-РТ-М, установленной в депо, — на задней стенке в БСА-1."], "kind": "fault", "imgs": [{"k": "a006", "c": "Слайд 6"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai4", "cat": "av_isavp", "page": 0, "pages": [], "title": "Краны КН58, КН59 клапана Y43", "steps": ["После установки связи оба машиниста проверяют на пневмоблоке открытие кранов КН58, КН59 к клапану Y43 (в нижней части пневмоблока)."], "notes": ["Клапан Y43 даёт дополнительную отпускную волну. На машинах с ИСАВП-РТ-М, установленной в депо, — один кран КН59."], "kind": "fault", "imgs": [{"k": "a007", "c": "Слайд 7"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai5", "cat": "av_isavp", "page": 0, "pages": [], "title": "Ввод параметров соединённого поезда", "steps": ["Машинист ведущего: Настройки → Параметры → Состав РТ → Основные параметры.", "Уточнить по радио у второго машиниста вес, оси, вагоны и условную длину.", "Ввести суммарно по обоим поездам: вагоны, длину, массу, оси, вагоны без тормозов."], "notes": [], "kind": "fault", "imgs": [{"k": "a008", "c": "Слайд 8"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai6", "cat": "av_isavp", "page": 0, "pages": [], "title": "Параметры торможения и токи уставки", "steps": ["Перед настройкой пневматики установить зарядное давление: головной 5,1–5,2 атм, в составе 5,0–5,1 атм.", "Параметры → Торможение → (Параметры): первая и следующая ступени, завышение, минимальное время в перекрыше и т.д. по правилам №151, приложение 3, гл. I.2.4.", "Токи уставки: Параметры → Тяга, отдельно для ведущего и ведомого."], "notes": ["Зарядное давление второго поезда должно быть меньше на 0,1–0,2 атм."], "kind": "fault", "imgs": [{"k": "a009", "c": "Слайд 9"}, {"k": "a010", "c": "Слайд 10"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai7", "cat": "av_isavp", "page": 0, "pages": [], "title": "Проверка настройки после соединения", "steps": ["Машинист в составе поезда включает режим «Автоведение».", "Машинист головного собирает тягу кнопочным контроллером и убеждается, что ток якоря ТЭД задаётся на обоих локомотивах.", "Машинист головного нажимает «Торможение СПДО» — ТМ и УР разряжаются на 0,6–0,8 атм.", "Кнопочным контроллером произвести отпуск."], "notes": [], "kind": "fault", "imgs": [{"k": "a011", "c": "Слайд 11"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai8", "cat": "av_isavp", "page": 0, "pages": [], "title": "Отправление и режимы работы", "steps": ["Соединённым поездом управляют в режиме «Автоведение» или машинист ведущего — в режиме «Кнопочный контроллер».", "Ведомый локомотив управляется автоведением и выполняет команды ведущего.", "На стоянке: на ведущем — режим «Советчик», на ведомом — «Автоведение».", "По окончании работы (или на долгих стоянках) «Автоведение» на ведомом отключают по команде машиниста ведущего."], "notes": [], "kind": "fault", "imgs": [{"k": "a013", "c": "Слайд 13"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai9", "cat": "av_isavp", "page": 0, "pages": [], "title": "Кнопочный контроллер: тяга", "steps": ["Войти: клавиша С7.", "Клавиши 1 и 2 — уменьшить / увеличить ток якоря ведущего на 50 А.", "Клавиши 3 и 4 — уменьшить / увеличить ток якоря ведущего на 100 А.", "Клавиши 7 и 8 — уменьшить / увеличить ток якоря ведомого на 100 А.", "Клавиша 0 — сброс."], "notes": ["На экране: ток якоря и сила тяги ведущего и ведомого, давление в ТМ и УР обоих локомотивов."], "kind": "fault", "imgs": [{"k": "a014", "c": "Слайд 14"}, {"k": "a015", "c": "Слайд 15"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai10", "cat": "av_isavp", "page": 0, "pages": [], "title": "Кнопочный контроллер: торможение", "steps": ["Войти в кнопочный контроллер: С7.", "Сменить «Тяга» на «Торможение»: клавиша А.", "Выбрать ступень разрядки УР клавишами 1–9 на БИ МСУД.", "Увеличить разрядку вплоть до полного служебного: дополнительно клавиша Е."], "notes": [], "kind": "fault", "imgs": [{"k": "a016", "c": "Слайд 16"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ai11", "cat": "av_isavp", "page": 0, "pages": [], "title": "Кнопочный контроллер: отпуск", "steps": ["Войти в меню «Отпуск»: клавиша 0.", "Выбрать величину завышения давления в УР клавишами 1–9.", "Увеличить давление отпуска вплоть до 6,5 атм: клавиша Е."], "notes": [], "kind": "fault", "imgs": [{"k": "a017", "c": "Слайд 17"}], "src": "Презентация ИСАВП-РТ-М"}, {"id": "ar1", "cat": "av_razed", "page": 0, "pages": [], "title": "Признаки разрыва ТМ / срабатывание автотормозов", "steps": ["Признаки: сработал датчик контроля состояния ТМ, часто включаются компрессоры и т.п.", "Машинист, заметивший признаки, нажимает «Торможение поезда до остановки» и сообщает по радио второму машинисту.", "После остановки перевести РКМ в III положение.", "Бригады осматривают поезд, выясняют причину снижения давления и докладывают ДНЦ.", "Если причину не нашли — дальше только после разъединения, по приказу ДНЦ."], "notes": ["Категорически запрещается: отключать тумблер «Выходные цепи УСАВП» во время торможения; отпускать автотормоза до остановки поезда; отпускать автотормоза краном машиниста."], "kind": "fault", "imgs": [{"k": "a018", "c": "Слайд 18"}], "src": "Презентация ИСАВП-РТ-М, слайд 18"}, {"id": "ar2", "cat": "av_razed", "page": 0, "pages": [], "title": "Зависание системы и потеря связи", "steps": ["Система зависла (не меняются координата и скорость, плохо реагирует на кнопки): нажать одновременно «TAB» и «S» на БИ МСУД. Перезагрузка 5–10 с с уходом в «Советчик».", "После перезагрузки проверить координату, при необходимости скорректировать и нажать «St».", "Потеряна связь между локомотивами в пути: перейти в «Советчик», сообщить ДНЦ.", "Довести поезд до ближайшей станции или до километра, указанного ДНЦ, где поезд разъединяют."], "notes": [], "kind": "fault", "imgs": [{"k": "a019", "c": "Слайд 19"}], "src": "Презентация ИСАВП-РТ-М, слайд 19"}, {"id": "ar3", "cat": "av_razed", "page": 0, "pages": [], "title": "Разъединение поездов: по шагам", "steps": ["Остановиться в месте из приказа ДНЦ (не на нейтральной вставке, не в местах секционирования, не у ДИСК, ПОНАБ, КТСМ).", "Кран вспомогательного тормоза — в крайнее тормозное положение, максимум в ТЦ локомотива.", "Помощник второго до отпуска тормозов перекрывает концевые краны (первым — на хвостовом вагоне первого поезда), разъединяет рукава, расцепляет автосцепки, закрепляет краны от самооткрытия, подвешивает рукава, докладывает.", "Машинист второго докладывает первому: «…Концевые краны перекрыты, закреплены, рукава подвешены, можно отпустить тормоза».", "Оба отпускают тормоза первым положением с завышением в УР на 0,3–0,7 кгс/см².", "Машинист первого отъезжает не менее чем на 10–15 м со скоростью не более 3 км/ч.", "Помощник второго проверяет отпуск у 2 хвостовых вагонов первого поезда и вагонов своего поезда. Доклад: «…Тормоза двух хвостовых вагонов отпустили, можете отправляться».", "Если не отпустили — первый поезд делает сокращённое опробование.", "После: первый переводит САУТ-ЦМ в режим САУТ и подключает КОН; второй после ухода первого включает АЛСН, ЭПК, САУТ, КОН, переводит КЛУБ-У в поездной режим."], "notes": [], "kind": "fault", "src": "Местная инструкция 2017, п. 9.1–9.10"}, {"id": "ar4", "cat": "av_razed", "page": 0, "pages": [], "title": "Окончание работы с ИСАВП-РТ-М", "steps": ["Разъединить поезда по нормативным документам.", "Включить маневровый режим или сменить режим на «Одиночный»: Главное меню → Настройка → Сменить режим РТ.", "На обоих локомотивах ввести номера одиночных поездов.", "На ведомом отключить «Двойная тяга» на КЛУБ-У.", "Отключить «Автоведение» на ведущем и ведомом."], "notes": [], "kind": "fault", "imgs": [{"k": "a020", "c": "Слайд 20"}], "src": "Презентация ИСАВП-РТ-М, слайд 20"}, {"id": "ar5", "cat": "av_razed", "page": 0, "pages": [], "title": "Когда соединённый поезд нужно разъединить", "steps": [], "notes": ["Большие продольно-динамические реакции при проверке тормозов в пути.", "Повторное самопроизвольное срабатывание автотормозов (причина не найдена или из-за неправильного режима тяги).", "Непредвиденное ограничение скорости 25 км/ч и менее для гружёного поезда, а перед и на руководящих подъёмах — менее 60 км/ч; предупреждение менее 40 км/ч.", "Сбой АЛСН; срабатывание КТСМ, КГН, УКСПС и т.п.", "Нестабильное напряжение в контактной сети (по согласованию с энергодиспетчером).", "Похолодание ниже −25 °С (информацию даёт ДНЦ); мероприятие «Красная точка».", "О причинах доложить ДНЦ. Разъединяют по приказу ДНЦ в месте с благоприятным профилем."], "kind": "info", "src": "Местная инструкция 2017, п. 11"}, {"id": "ad1", "cat": "av_doc", "page": 0, "pages": [], "title": "1. Общие положения", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "1.1. Область применения", "b": false, "n": "1.1."}, {"t": "1.1.1 Настоящая инструкция по организации вождения соединенных грузовых поездов электровозами серий ВЛ80С, 2(3)ЭС5К в голове и середине состава поезда, с объединенными тормозными магистралями поездов на участках Забайкальской железной дороги устанавливает порядок подготовки, формирования, вождения, пропуска, обеспечения безопасности движения соединенных поездов, регламент переговоров, порядок действий локомотивных бригад, обслуживающих эти поезда.", "b": false, "n": "1.1.1"}, {"t": "1.1.2 Настоящая инструкция разработана на основании и в соответствии с требованиями «Инструкции по организации обращения грузовых поездов повышенной массы и длинны на железнодорожных путях общего пользования ОАО «РЖД», утвержденной распоряжением ОАО «РЖД» от 01 сентября 2016г. №1799р; «Правил технической эксплуатации железных дорог Российской Федерации», утвержденных приказом Минтранса РФ от 21.12.2010 № 286; «Инструкции по движению поездов и маневровой работе на железнодорожном транспорте Российской Федерации», утвержденной приказом Минтранса России от 04.06.2012 №162 в виде приложения №8 к Правилам технической эксплуатации железных дорог Российской Федерации; «Инструкции по сигнализации на железнодорожном транспорте Российской Федерации», утвержденной приказом Минтранса России от 04.06.2012 №162 в виде приложения №7 к Правилам технической эксплуатации железных дорог Российской Федерации; Правила технического обслуживания тормозного оборудования и управления тормозами железнодорожного подвижного состава, утвержденные Советом по железнодорожному транспорту государствучастников Содружества (протокол от 6-7 мая 2014 года №60), утвержденные приказом Минтранса России №151 от 03.06.2014г; Технические требования утвержденные распоряжением ОАО «РЖД» от 25.11.2010г № 2412р, «Инструкции по размещению, установке и эксплуатации средств автоматического контроля технического состояния подвижного состава на ходу поезда», утвержденной МПС Российской Федерации 30 декабря 1996 года № ЦВ-ЦШ-453, «Инструкции по монтажу, вводу в эксплуатацию, техническому обслуживанию и ремонту устройств контроля схода подвижного состава», утвержденной МПС России 31.12.2002 г. № ЦВ-ЦШ-929, «Инструкции по техническому обслуживанию вагонов в эксплуатации», введенной 01.09.2009 г. № 1794р, Инструкции по организации обращения соединенных поездов с распределенной тягой и объединенной тормозной магистралью по Забайкальской железной дороге, утвержденной приказом №Заб-122 от", "b": false, "n": "1.1.2"}, {"t": "19.04.2017 Н Заб.ж.д. А.А. Скачков; Инструкции по организации обращения соединенных грузовых поездов в границах Дальневосточной железной дороги, утвержденной приказом ДВОСТ - 98р от 05.06.2015.Н Дав.ж.д. М.М.Заиченко; Распоряжение ОАО «РЖД» от 30 июня 2015 года № 1601р «Об организации обращения грузовых поездов повышенной массы и длины на железнодорожных путях общего пользования Забайкальской и Дальневосточной железных дорог».Приказ от 08 ноября 2016 года № ЦТ-227 «Об установлении норм масс и длин пассажирских и грузовых поездов на участках, обслуживаемых Забайкальской дирекцией тяги».", "b": false, "n": "19.04.2017"}]}, {"id": "ad2", "cat": "av_doc", "page": 0, "pages": [], "title": "2. Требования к локомотивным бригадам", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "2.1 К вождению соединенных поездов допускаются локомотивные бригады:", "b": false, "n": "2.1"}, {"t": "- прошедшие специальное обучение и сдавшие теоретические испытания по знанию настоящей Инструкции, Правил технического обслуживания тормозного оборудования и управления тормозами железнодорожного подвижного состава, утвержденные Советом по железнодорожному транспорту государств-участников Содружества (протокол от 6-7 мая 2014 года №60), утвержденные приказом Минтранса России №151 от 03.06.2014г, Инструкции по организации обращения грузовых поездов повышенной массы и длинны на железнодорожных путях общего пользования ОАО «РЖД», утвержденной распоряжением ОАО «РЖД» от 1 сентября 2016г. №1799р; Инструкции по организации обращения соединенных поездов с объединенной тормозной магистралью в границах Забайкальской железной дороги, утвержденной начальником Забжд ОАО «РЖД» от 19 апреля 2017г. №Заб-122;", "b": false, "n": ""}, {"t": "- получившие практические навыки по вождению соединенных поездов, имеющие соответствующее заключение машиниста-инструктора, записанное в служебном формуляре машиниста и прошедшие собеседование у начальника эксплуатационного локомотивного депо, а при его отсутствии - у заместителя начальника депо по эксплуатации, с записью в служебном формуляре по форме: «Проведено собеседование по особенностям работы и обеспечению безопасности движения с поездами СП. Разрешено вождение указанных поездов»;", "b": false, "n": ""}, {"t": "-машинисты, имеющие стаж практической работы в грузовом движении на данном участке не менее двух лет и класс квалификации машиниста должен быть не ниже третьего;", "b": false, "n": ""}, {"t": "- списки машинистов и помощников машиниста (с указанием стажа работы, класса квалификации) допущенных к вождению соединенных поездов, заверяются начальником локомотивного депо и утверждаются начальником дирекции тяги. Списки пересматриваются 2 раза в год к зимнему и летнему графикам работы. Утвержденные списки выдаются на рабочие места нарядчикам локомотивных бригад, дежурным по основному, оборотному депо, подменному пункту, а также дежурным по станциям, поездным и локомотивным диспетчерам участков обращения соединенных поездов; Письменное заключение машиниста-инструктора, утвержденное начальником депо после собеседования с локомотивной бригадой, передается в отдел кадров депо и хранится в личном деле работника. Вновь сформированная локомотивная бригада, выполняющая первую совместную поездку, не допускается к вождению соединенных поездов.", "b": false, "n": ""}]}, {"id": "ad3", "cat": "av_doc", "page": 0, "pages": [], "title": "3. Требования к локомотивам", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "3.1 Все локомотивы, предназначенные для вождения соединенных поездов, должны иметь исправно действующие:", "b": false, "n": "3.1"}, {"t": "- локомотивные устройства безопасности по перечню, установленному распоряжением ОАО «РЖД» от 13.08.2013г. №1754р;", "b": false, "n": ""}, {"t": "- сигнализаторы целостности тормозной магистрали 418;", "b": false, "n": ""}, {"t": "- краны машиниста усл. №394 с положением ручки крана машиниста 5А;", "b": false, "n": ""}, {"t": "- двухдиапазонные (КВ (2МГц) + УКВ (160 МГц)) радиостанции поездной радиосвязи - для обращения на участках, не оборудованных цифровыми системами поездной радиосвязи;", "b": false, "n": ""}, {"t": "- две носимые радиостанции УКВ (160 МГц) диапазона. а так же двух(ГМВ, МВ диапазоны) или трех- (ГМВ, МВ, ДМВ) диапазонными радиостанциями технологической радиосвязи (РЛСМ, РВ-1М, РВ-1МЦ, РВС1);", "b": false, "n": ""}, {"t": "- встроенные или отдельно смонтированные регистраторы переговоров локомотивных бригад. На локомотивах оборудованных скоростемерами 3СЛ2М, КПД должен быть установлен тумблер «К», при включении которого должна собираться схема тяги без включения ЭПК.", "b": false, "n": ""}, {"t": "3.2 При приемке локомотива машинист первого поезда обязан проверить работу радиосвязи в ГМВ диапазоне путем установления связи с дежурным по станции, а в МВ диапазоне с дежурным по станции и с машинистом второго поезда. Радиостанция на локомотиве для связи между локомотивами при движении такого поезда должна находиться в режиме приема (микротелефонная трубка постоянна снята). Действия локомотивных бригад при управлении соединенным поездом согласовывается по поездной радиосвязи.", "b": false, "n": "3.2"}, {"t": "3.3 Запрещается формировать соединенный поезд с постановкой локомотивов в голове и середине состава поезда, если хотя бы на одном из них дополнительно к неисправностям установленным пунктом 24 приложения №5 «Правил технической эксплуатации железных дорог Российской Федерации», утвержденных приказом Минтранса РФ от 21.12.2010 № 286, имеются неисправности: отсутствует или неисправен сигнализатор целостности тормозной магистрали 418; отсутствует или неисправна сигнальная лампа «ТМ»; неисправна или отсутствует радиосвязь ГМВ или МВ диапазона; при наличии записи о сбоях в работе АЛСН, КЛУБ, САУТ в журнале технического состояния локомотива формы ТУ-152, после последнего ТО-2; высота оси автосцепки над уровнем головки рельса, должна быть в пределах не более 1080мм, не менее 980мм.", "b": false, "n": "3.3"}, {"t": "3.4 В связи с разными электротяговыми характеристиками локомотивов, установить порядок вождения соединенных поездов с постановкой в голове и середине состава локомотивов одной серии (отчет ТЭЛ № 094-05-2013).", "b": false, "n": "3.4"}, {"t": "3.5 Максимальный ток по амперметрам обоих электровозов в соединенном поезде не должен превышать его продолжительного (880 А) значения на всех подъемах маршрута следования.", "b": false, "n": "3.5"}]}, {"id": "ad4", "cat": "av_doc", "page": 0, "pages": [], "title": "4. Требования к тормозному и автосцепному оборудованию", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "4.1 Запрещается ставить в состав поезда вагоны, у которых тормозное оборудование имеет хотя бы одну из следующих неисправностей: неисправные воздухораспределитель, авторежим, концевой или разобщительный кран, выпускной клапан, тормозной цилиндр, резервуар, рабочую камеру; повреждение воздухопроводов - трещины, прорывы, протертости и расслоение соединительных рукавов; трещины, надломы и вмятины на воздухопроводах, неплотность их соединений, ослабление трубопровода в местах крепления; неисправность механической части - траверс, триангелей, рычагов, тяг, подвесок, авторегулятора рычажной передачи, башмаков; трещины или изломы в деталях, откол проушин колодки, неправильное крепление колодки в башмаке; неисправные или отсутствующие предохранительные устройства и балки авторежимов, нетиповое крепление, нетиповые детали и шплинты в узлах; неисправный ручной тормоз; ослабление крепления деталей; не отрегулированная рычажная передача; толщина колодок менее указанной в п. 13, главы II приказа Минтранс №151", "b": false, "n": "4.1"}, {"t": "4.2 При подготовке поездов, назначенных для соединения, осмотрщики вагонов обязаны произвести замер высоты автосцепки над уровнем головки рельса у хвостового вагона первого поезда и у локомотива второго поезда. Высота автосцепки хвостового вагона первого поезда должна быть в пределах 980 - 1080 мм, при этом разница по высоте между продольными осями автосцепок локомотива второго поезда и хвостового вагона первого поезда допускается не более 100 мм. Эти данные занести в справку об обеспечении поезда тормозами и исправном их действии. При не соответствии высоты между продольными осями автосцепок, работник вагонного хозяйства обязан оповестить дежурного по станции о необходимости подбора хвостового вагона первого поезда. По согласованию с осмотрщиком вагонов дежурный по станции обязан произвести подбор хвостового вагона первого поезда соответствующего вышеуказанным требованиям. Высота автосцепки хвостового вагона должна быть указана на раме вагона.", "b": false, "n": "4.2"}, {"t": "4.3 Подготовку тормозного оборудования вагонов и порядок проведения опробования тормозов согласно пункта IV.4.3. приказа Минтранс №151 разрешается производить в составах на разных путях с обязательным полным опробованием автотормозов в каждом составе, подлежащим последующему сцеплению при формировании поезда. Полное опробование автотормозов поездов производить на станциях где имеются осмотрщики вагонов. Установить порядок опробования автотормозов соединенных поездов при следовании по гарантийному участку. На станции формирования соединенного поезда согласно, приложения № 3 главы № 1.2.4. приказа Минтранс №151, производится полное опробование автотормозов. После готовности поезд следует до станции смены локомотивных бригад. В случае отсутствия путей, по станции смены локомотивных бригад, имеющих полную вместимость соединенного поезда, поезда разъединяются и принимаются на разные пути приема. Производится смена локомотивных бригад, далее так как поезду проведено полное опробование автотормозов на станции формирования и дана гарантия на гарантийный участок, на станции смены локомотивных бригад производится объединение поездов, производится сокращенное опробование автотормозов, и следование поезда далее. Примечание: такой порядок производится, если поезда объединяются в такой же последовательности как были отправлены со станции формирования и прибыли на станцию смены локомотивных бригад составом соединенного поезда.", "b": false, "n": "4.3"}, {"t": "4.4 Участки обращения локомотивных бригад и гарантийные участки ПТО вагонов для всех поездов сохраняются без изменения, согласно приказа начальника дороги, для поездов нормальной длины согласно приказу начальника дороги. По станциям Магдагачи, Шимановская, Облучье смена локомотивных бригад может производится без разъединения поездов.", "b": false, "n": "4.4"}]}, {"id": "ad5", "cat": "av_doc", "page": 0, "pages": [], "title": "5. Формирование и места объединения", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "соединенных поездов, их", "b": false, "n": ""}, {"t": "5.1 Соединенные поезда формируются на станциях или перегонах из двух поездов, каждый из которых должен быть сформирован по массе и длине в соответствии действующим приказом от 8 ноября 2016 года № ЦТ-227 «Об установлении норм масс и длин пассажирских и грузовых поездов на участках, обслуживаемых Забайкальской дирекцией тяги», а также с учетом ограничения по силе тяги и мощности локомотива и устройств электроснабжения, температурного режима по участку, отсутствия ограничений скорости ниже 40км/ч, а перед лимитирующими подъемами ниже 60 км/ч.", "b": false, "n": "5.1"}, {"t": "5.2 Для вождения соединенных поездов применяются электровозы серии ВЛ80с, 2(3)ЭС5к с постановкой локомотива в голове и середине состава:", "b": false, "n": "5.2"}, {"t": "- весом от 6 до 12600 тысяч тонн, с числом осей не более 540 осей включительно (135 четырехосных вагоне), с объединенной тормозной магистралью (допускается объединение поездов весом не более 12600т при нажатии тормозных колодок не менее 33 тс на каждые 100 т массы поезда).", "b": false, "n": ""}, {"t": "- порожние поезда с числом осей не более 740 осей (включительно), на участке Белогорск-Облучье не более 680 осей (включительно),с объединенной тормозной магистралью,", "b": false, "n": ""}, {"t": "5.3 Участки обращения соединенных поездов: Четное направление: Белогорск – Облучье; Магдагачи – Белогорск. Нечетное направление: Белогорск – Магдагачи; Облучье – Белогорск.", "b": false, "n": "5.3"}, {"t": "5.4 Соединение поездов разрешается производить на станциях и перегонах: Четное направление: В любое время суток в освещенном месте: станция Магдагачи по 2 главному пути за маршрутным ЧМ2 на 7495км; станция Тыгда по 2 главному пути на 7558км; станция Ушумун по 2 главному пути на 7602км; станция Белогорск 1, 2 (кроме 7867-7869км) 2 путь, ст.Возжаевка. В светлое время суток: 7514-7515км, 7557-7560км, 7569-7570км, 7584км, 7593-7598км, 7607-7609км, 7624-7626км, перегон Белогорск 2 Возжаевка в любом месте. Нечетное направление: В любое время суток в освещенном месте: ст.Облучье, ст.Архара, ст.Домикан, ст.Бурея, ст.Тюкан, ст. Завитая по 1 главному пути напротив поста безопасности и на 7985км за маршрутным НМ1Б, ст. Поздеевка 7915км 3пк, ст.Белогорск 2, ст.Белогорск 1, ст.Серышево, ст.Арга, ст. Шимановская по 1 главному пути при следовании с нечетного парка (с 23, 25, 27, 29, 37 путей станции), ст.Берея, ст.Ту, ст.Сиваки, ст.Ушумун по 1 главному пути, ст.Чалганы, ст.Тыгда, ст.Красная Падь. В светлое время суток: 7976-7971км, 7968км, 7944км 6пк за выходным Н1 станции Екатеринославка, 7718-7706км, 7698-7693км, 7690-7685км, 76737634км, 7623-7625км, 7618-7619км, 7614км, 7606-7609км, 7594-7598км, 75837584км, 7556-7557км, 7514-7515км. Формирование соединенных поездов должно производиться на путях отправления с ограничением скорости не менее 40км/ч. Запрещается объединение поездов на стрелочных переводах станций.", "b": false, "n": "5.4"}, {"t": "5.5 Формирование и вождение соединенных поездов допускается в любое время суток при температуре не ниже минус 25°С, в условиях удовлетворительной видимости. Не допускается обращение соединенных поездов при образовании гололеда на контактной сети более 3 мм. Контроль за температурным режимом на участке следования соединенного поезда возлагается на поездного диспетчера.", "b": false, "n": "5.5"}, {"t": "5.6 Объединение поездов на перегонах разрешается осуществлять в любое время суток при условии, что в ночное время место соединения будет освещено и уклон профиля пути в месте соединения не превышает более 4‰, подъем более 6‰, также наличие кривой менее R=500м в месте остановки обоих поездов.", "b": false, "n": "5.6"}, {"t": "5.7 Разрешается соединение груженых поездов весом до 12,6 тысяч тонн сформированных из полувагонных маршрутов (уголь, руда, металл) с осевой нагрузкой не более 23,5 тс. Состав меньшей массы и длины необходимо размещать вторым в составе соединенного поезда. 5.8.При объединении на станции формирования двух порожних поездов отключение воздухораспределителей производится на 1/3 вагоне.", "b": false, "n": "5.7"}, {"t": "5.9 Автотормоза всех груженых вагонов в соединенном поезде должны быть включены на соответствующий режим. Фактическое тормозное нажатие в соединенном поезде принимается по наименьшему значению нажатия одного из соединяемых составов. Разница между фактическим нажатием соединяемых поездов должна быть не более 5 тс на 100 тс веса поезда. Тормозное нажатие в соединенном поезде должно быть не менее норм допускаемого минимального тормозного нажатия, указанного в пункте 11 таблицы III.2 раздела III приложения 2 приказа Минтранс №151. На последних пяти вагонах автотормоза должны быть включены и исправно действовать.", "b": false, "n": "5.9"}, {"t": "5.10 Не подлежат соединению поезда, имеющие в своем составе:  вагоны с людьми (кроме поездов с охраной);  вагоны пассажирского парка;  секции моторвагонного подвижного состава;  вагоны с негабаритными грузами нижней третьей и выше степенью негабаритности;  вагоны с негабаритными грузами боковой четвертой и выше степенью негабаритности;  вагоны со сверхнегабаритными грузами;  вагоны с взрывчатыми материалами, опасными грузами;  одиночные вагоны для перевозки легковесных грузов;  груженые и порожние транспортеры всех типов;  специальный самоходный подвижной состав;  подвижной состав, требующий ограничения скорости следования;  хоппер-дозаторные вертушки;  вагоны загрузкой менее 50 тонн нетто в первом поезде, сформированном из двух груженных поездов (Согласно отчета ТЭВЛ№09579798 о выполнении приказа №3109 от 03.03.08г. 1-го вице президента В.Н. Морозова по организации вождения соединенных поездов весом до 12600 тонн на участках Забайкальской ж.д.)  с тормозным нажатием одного из соединяемых поездов менее 28 тс на 100 тс веса поезда.", "b": false, "n": "5.10"}, {"t": "5.11 Не допускается соединение грузовых груженых поездов с грузовыми порожними поездами.", "b": false, "n": "5.11"}, {"t": "5.12 Запрещено соединять поезда при неблагоприятных погодных условиях (снег, метель и т.д.), когда видимость ограничена до 100 метров и менее.", "b": false, "n": "5.12"}]}, {"id": "ad6", "cat": "av_doc", "page": 0, "pages": [], "title": "6. Порядок объединения и ведения соединённого поезда", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "объединения и режиму ведения соединенного поезда", "b": false, "n": ""}, {"t": "6.1 При явке локомотивной бригады дежурный по депо обязан: по служебному формуляру и утвержденному списку проверить наличие у машиниста и помощника машиниста заключения на право вождения соединенных поездов; по спискам закрепления локомотивных бригад проверить формирование локомотивной бригады - вновь сформированная бригада, выполняющая первую совместную поездку, не допускается к ведению соединенного поезда; наличие необходимой рабочей документации (режимные карты, выписка из инструкций по обращению поездов, межпоездные интервалы, порядок действий в нестандартных ситуациях); сделать пометку в 5-ом разделе маршрута машиниста «Соединенный поезд»;", "b": false, "n": "6.1"}, {"t": "6.2 При прохождении предрейсового инструктажа должностное лицо, выполняющее инструктаж, при наличии в маршруте машиниста пометки «Соединенный поезд»: проводит под роспись в специальном журнале дополнительный инструктаж бригады об особенностях вождения соединенных поездов; проверяет уровень знаний локомотивной бригады, по тематике утвержденной начальником локомотивного депо, об особенностях вождения и работы с соединенными поездами с учетом погодных условий и действующих ограничений скорости движения; только после проверки знаний машинистом и помощником машиниста порядка действий заверяет их маршрут своей подписью и штампом.", "b": false, "n": "6.2"}, {"t": "6.3 При приемке электровоза каждый машинист соединенного поезда должен: установленным порядком произвести проверку работоспособности локомотивной радиостанции поездной радиосвязи (используя режим ТЕСТ-1 на радиостанции). Если при проверке радиостанции и выдачей на табло ПУ-ЛП информации со словом «БРАК» после выполнения двух подряд проверок по «Тест-1» или отсутствия двух сторонней радиосвязи с контрольной радиостанцией (ДСП, дежурный по депо) - радиостанция считается неисправной; результаты проверки записать в журнал технического состояния локомотива формы ТУ-152, запрещается принимать локомотив с неисправной радиостанцией; машинист второго поезда при приемке локомотива обязан лично осмотреть и проверить работу автосцепки своего локомотива.", "b": false, "n": "6.3"}, {"t": "6.4 В маршруте машиниста формы ТУ-3, в разделе №5 «Замечания», машинисты соединяемых грузовых поездов записывают номер диспетчерского приказа, время, температуру наружного воздуха, фамилию поездного диспетчера и краткое содержание приказа.", "b": false, "n": "6.4"}, {"t": "6.5 После получения приказа поездного диспетчера на соединение поездов машинисты соединяемых поездов обязаны установить между собой связь по радиостанции поездной радиосвязи, сообщить данные о номерах локомотивов, поездов, их весе, длины в осях, тормозного нажатия (по справке об обеспечении поезда тормозами и исправном их действии), свою фамилию и убеждаются по натурному листу каждого поезда, в том, что оба соединяемых поезда соответствуют требованиям настоящей Инструкции.", "b": false, "n": "6.5"}, {"t": "6.6 До места соединения, указанного в приказе поездного диспетчера, машинисты следуют, руководствуясь показаниями и требованиями сигналов или выданными им дежурным по станции разрешениями на право занятия перегона или участка пути.", "b": false, "n": "6.6"}, {"t": "6.7 Машинист локомотива первого поезда следует до места, указанного в приказе поездного диспетчера и по поездной радиосвязи сообщает машинисту второго поезда об остановке по форме: «Внимание, внимание, внимание! Машинисту поезда №__, фамилия__, локомотив №__. Я машинист поезда №__, фамилия__,локомотив №__остановился на__км__пк для формирования соединенного поезда.Условная длина поезда___» Вызов по поездной радиосвязи машиниста первого поезда производится до подтверждения полученной информации машинистом второго поезда.", "b": false, "n": "6.7"}, {"t": "6.8 Машинисту второго поезда после получения регистрируемого приказа на соединение разрешается проследовать проходной (входной, м
