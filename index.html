аршрутный) светофор с запрещающим показанием, ограждающий блок-участок, на котором находится первый из соединяемых поездов со скоростью не более 20 км/час, с особой бдительностью и готовностью немедленно остановиться, если встретится препятствие для дальнейшего движения согласно пункта 4, приложения 1 Инструкции по движению поездов и маневровой работе на железнодорожном транспорте Российской Федерации, утвержденной приказом Минтранса России от 04 июня 2012 г. № 162 .", "b": false, "n": "6.8"}, {"t": "6.9 Локомотивная бригада второго поезда при следовании на соединение обязана за 150-200 метров снизить скорость до 5 км/час и остановить свой поезд на расстоянии 10-15 метров до хвостового вагона впереди стоящего поезда.", "b": false, "n": "6.9"}, {"t": "6.10 Перед соединением поездов помощник машиниста второго поезда обязан осмотреть автосцепку хвостового вагона и локомотива, убедиться в готовности к сцеплению. Помощник машиниста должен снять с подвески концевой рукав тормозной магистрали локомотива и хвостового вагона, очистить головки рукавов от грязи и однократно на 8-10 секунд продуть через концевой кран тормозную магистраль локомотива и хвостового вагона впереди стоящего поезда. Машинисты при этом проверяют работу датчика обрыва тормозной магистрали усл. № 418 и сигнализацию лампы «ТМ». При срабатывании датчика усл. № 418 машинист первого поезда выполняет ступень торможения величиной 0,5-0,6 кг/см2. При срабатывании датчика усл. № 418 машинист второго поезда никаких манипуляций краном не производит. Перед началом сцепления поездов машинист второго поезда предупреждает об этом машиниста первого поезда и приводит поезд в движение (приводить поезд в движение без нахождения помощника машиниста в кабине управления запрещено). Машинист второго поезда производит сцепление локомотива с последним вагоном впереди стоящего поезда при скорости не более 3 км/час (осаживание первого поезда запрещено). После сцепления автосцепок локомотива с хвостовым вагоном первого поезда, машинист второго поезда должен привести в действие вспомогательный тормоз локомотива с максимальным давлением в тормозных цилиндрах локомотива. По команде машиниста, помощник машиниста второго поезда производит соединение воздушных рукавов ТМ между локомотивом и хвостовым вагоном и открытие концевых кранов. После этого докладывает машинисту головного локомотива по поездной радиосвязи: «Машинисту поезда №__, фамилия__, локомотив №__. Я машинист поезда №__, фамилия__, локомотив №__. Соединение с хвостовой частью поезда №__выполнил, отпускаем тормоза». Машинисты производят отпуск автотормозов с завышением давления в тормозной магистрали, на 0,3-0,5 кг/см2 выше установленного зарядного давления. После полной зарядке ТМ производится замер плотности тормозной сети поезда. При этом замер плотности производит машинист второго поезда после отключения компрессора обоих локомотивов. Результаты проверки плотности машинист второго поезда докладывает машинисту головного поезда. Для проверки плотности тормозной сети при поездном положении ручки крана машиниста принимать следующие допускаемые минимальные значения времени снижения давления в главных резервуарах на 0,5 кг/см 2 в зависимости от числа осей в составе на каждые 1000 л объема главных резервуаров: число осей 351-400 401-500 501-600 601-700 701-780 время, с Указанное время определяется путем деления суммы времени снижения давления в главных резервуарах всех локомотивов на их суммарный объем в тысячах литров. При плотности ТМ менее установленных нормативов отправление соединенного поезда запрещено. Ответственность за правильность сцепления между локомотивом второго поезда и последним вагоном первого поезда на перегоне, соединение рукавов тормозных магистралей и открытие концевых кранов несет машинист локомотива второго поезда, а на станции, работник вагонного хозяйства.", "b": false, "n": "6.10"}, {"t": "6.11 Автотормоза локомотивов должны быть включены в тормозную магистраль, комбинированные краны открыты и блокировка № 367 выключена (хвостовик смотрит вниз). Зарядное давление в тормозной магистрали груженых поездов: головной локомотив 5,2-5,3 кг/см2, второй локомотив 5,0-5,2 кг/см2. Зарядное давление в тормозной магистрали порожних поездов: головной локомотив 5,0 кг/см 2, второй локомотив 4,8 кг/см2. Зарядное давление в тормозной магистрали ведомого локомотива должно быть меньше зарядного давления ведущего локомотива на 0,15-0,2 кг/см2.", "b": false, "n": "6.11"}, {"t": "6.12 На локомотиве подготовленным для следования с первым поездом производится отключение прибора КОН путем отсоединения разъема от прибора КОН, САУТ-ЦМ переводится в режим АЛС и делается об этом запись в журнал формы ТУ-152. На локомотиве подготовленным для следования со вторым поездом производится отключение прибора КОН, САУТ-ЦМ переводится в режим АЛС, включается тумблер «К» (для ВЛ80), проверяется сбор схемы «Тяга» и делается об этом запись в журнал формы ТУ-152. При наличии на локомотивах прибора безопасности КЛУБ-У – на локомотиве подготовленным для следования с первым поездом КЛУБ-У работает в штатном режиме. На локомотиве подготовленным для следования со вторым поездом работа КЛУБ-У переводится в режим «Двойная тяга». Перевод КЛУБ-У в режим «Двойная тяга»: вводится команда К-799; вводится скорость на 10 км/час выше установленной по перегонам; машинист и помощник одновременно нажимают кнопки РБ и РБП и удерживают их в течении 1,5-2 секунды; после отпуска кнопок в течении 30 секунд кнопкой РМП, выбирается режим «П» мигающий; вводится команда К-262.", "b": false, "n": "6.12"}, {"t": "6.13 При опробовании автотормозов соединенного поезда машинист головного локомотива производит ступень торможения снижением давления в уравнительном резервуаре на 0,6-0,7 кгс/см2; после загорания сигнальной лампы «ТМ» на пульте локомотива в составе поезда машинист этого локомотива производит аналогичную ступень разрядки; убедившись в срабатывании автотормозов, машинист локомотива второго поезда извещает об этом по радиосвязи машиниста головного локомотива. Помощник машиниста ведомого локомотива проверяет срабатывание тормозов по двум (2) последним вагонам первого поезда и пяти (5) вагонам второго поезда и докладывает своему машинисту. Машинист ведомого поезда докладывает о срабатывании тормозов, по форме: «Тормоза сработали, готов к отпуску тормозов» По команде машиниста ведущего локомотива машинисты локомотивов производят отпуск тормозов с завышением давления в уравнительном резервуаре на величину 0,3-0,5 кгс/см2. Помощник машиниста ведомого локомотива проверяет отпуск тормозов по двух (2) последним вагонам первого поезда и пяти (5) вагонам второго поезда и докладывает своему машинисту. Машинист ведомого поезда докладывает об отпуске тормозов, по форме: «Тормоза опустили, готов к отправлению». Машинист ведущего локомотива докладывает ДНЦ на перегоне или ДСП на станции о проведении опробования тормозов, по форме: «ДНЦ ДСП ст…, я машинист поезда № … локомотива №… опробование тормозов произведено, готов к отправлению».", "b": false, "n": "6.13"}, {"t": "6.14 Перед отправлением соединенного поезда постановка ручки крана машиниста в 1-ое положение не требуется, согласно №Заб-122 от", "b": false, "n": "6.14"}, {"t": "19.04.17 года.", "b": false, "n": "19.04.17"}, {"t": "6.15 После отправления соединенных поездов выполняется проверка действия автотормозов поезда на эффективность путем снижения давления по уравнительному резервуару на 0,6-0,8 кгс/см2 для грузовых груженых поездов и на 0,4-0,6 кгс/см2 для грузовых порожних составов в установленных местах согласно приказа ТЧЭ-11 №465. Участок Начало Скорость, Тормозной опробования, км/ч путь, м км пк Нечетное направление Облучье - Ядрин 8188км 500 Архара - Домикан 8064км 1пк 500 Домикан - Бурея 8039км 3пк 500 Завитая - Тур 7978км 7пк 500 Тур - Екатеринославка 7971км 6пк 500 Екатеринославка7935км 10пк 500 Поздеевка Белогорск – Серышево 7847км 5пк 500 Серышево - Арга 7837км 5пк 500 Арга - Усть-Пера 7801км 1пк 500 Шимановская - Мухинская 7694км 5пк 455 Мухинская - Ту 7671км 7пк 455 Ту - Сиваки 7642км 2пк 455 Сиваки - Ушумун 7623км 2пк 455 Ушумун - Чалганы 7596км 2пк 455 Чалганы - Тыгда 7575км 1пк 500 Тыгда - Дактуй 7537км 5пк 455 Дактуй - Красная Падь 7515км 9пк 455 Красная Падь - Магдагачи 7506км 10пк 500 Четное направление Магдагачи - Красная Падь 7509км 5пк 850 Красная Падь - Ушумун 7587км 7пк 850 Ушумун - Сиваки 7610км 2пк 650 Сиваки - Ту 7638км 8пк 650 Магдагачи - Красная Падь 7509км 5пк 850 Белогорск – Возжаевка 7892км 5пк 650 Возжаевка – 7939км 8пк 850 Екатеринославка Для проверки действия автотормозов в пути следования машинист головного локомотива передает по поездной радиосвязи команду машинисту второго поезда и согласовано производят ступень торможения. Снижение скорости на 10 км/час должно происходить на расстоянии, не превышающем установленное данной инструкции. При невозможности проверить автотормоза на указанных киломметрах, проверку автотормозов в пути следования произвести на этом же перегоне, но далее установленного места (по мере увеличения скорости от 40 до 60 км/час) или на следующем перегоне или станционном пути, имеющем в профиле площадку или спуск при скорости от 40 до 60км/ч со снижением скорости на 10 км/час. Отпуск автотормозов в СП при проверке их действия производить только после того, как машинисты убедятся в нормальной эффективности работы автотормозов. В пути следования в случае выявления неудовлетворительной работы автотормозов поезд должен быть разъединен.", "b": false, "n": "6.15"}, {"t": "6.16 Максимальная скорость следования соединенного поезда по условиям обеспечения автотормозами не более 75 км/час.", "b": false, "n": "6.16"}, {"t": "6.17 Если первый локомотив соединенного поезда находится за выходным светофором, отправление такого поезда производится на перегон, оборудованный автоблокировкой, по регистрируемому приказу дежурного по станции, передаваемому машинисту по радиосвязи по форме и порядком, предусмотренным в пункте 14 приложения №1 Инструкции по движению поездов и маневровой работе на железнодорожном транспорте Российской Федерации, утвержденной приказом Минтранса России от 04 июня 2012 г. № 162.", "b": false, "n": "6.17"}, {"t": "6.18 Режим ведения поезда задается машинистом головного локомотива в соответствии с режимными картами. В этих картах во избежание перегрева проводов контактной сети, выдавливания вагонов и разрыва автосцепных устройств устанавливают предельные токи электродвигателей локомотивов, превышение которых при ведении поезда не допускается. Машинист первого поезда задает режим с указанием конкретного количества позиций контроллера (ВЛ80с), величины тока (ЭС5к), величины разрядки тормозной магистрали. Указания о торможении и отпуске тормозов в поездах машинист головного локомотива передает машинисту второго поезда по радиосвязи следующим порядком: «Машинист локомотива №__, соединенного поезда №__, ответьте», и после получения ответа сообщить о подготовке к торможению по форме: «Готовимся к торможению». Перед непосредственным торможением машинист головного локомотива повторно вызывает машиниста следующего в составе поезда и после получения ответа сообщает ему о начале торможения и величине разрядки ТМ по следующей примерной форме: «Тормозим разрядкой на __. (кгс/см2)». Машинист второго локомотива после получения команды на торможение обязан незамедлительно выполнить торможение с разрядкой УР на величину указанную машинистом головного локомотива. При отпуске тормозов команды выполняются аналогично, как и при торможении. При каждом торможении машинисты обязаны контролировать срабатывание сигнализатора разрыва тормозной магистрали усл. № 418 по кратковременному загоранию его лампы. Машинисту первого поезда при не получении ответа от машиниста второго поезда об отпуске автотормозов, отпускать тормоза запрещается. Для постоянного контроля исправности радиосвязи между машинистами обоих локомотивов, машинист головного локомотива на приближении к станциям обязан сообщать по радиосвязи машинисту второго локомотива о показании сигнала светофора, установленном режиме ведения поезда или его предстоящем изменении, а машинист второго локомотива обязан продублировать полученную информацию. Ведение переговоров по радиосвязи допускается выполнять помощниками машинистов, передавая информацию, полученную от своего машиниста.", "b": false, "n": "6.18"}, {"t": "6.19 Служебные и полные служебные торможения с головного локомотива и локомотива в составе поезда выполнять одновременно с выдержкой ручки крана машиниста в V положении до снижения давления в уравнительном резервуаре на 0,5-0,6 кгс/см2 и последующим переводом ручки в положение VA, а после достижения необходимой разрядки ручку перевести в IV положение. Повторные ступени с целью усиления торможения производить после прекращения выпуска воздуха из магистрали через кран машиниста переводом ручки крана в V положение. При выполнении регулировочных торможений машинисту второго поезда разрешается разряжать тормозную магистраль в составе поезда при ступенях торможения на 0,2-0,3 кгс/см2 меньше, чем на головном локомотиве.", "b": false, "n": "6.19"}, {"t": "6.20 Отпуск автотормозов производить с обоих локомотивов, с опережением начала отпуска на локомотиве, находящемся в составе поезда на 4-6 секунд. Машинист второго поезда после отпуска автотормозов докладывает об этом машинисту первого поезда. Ручку крана машиниста выдерживать в I положении до завышения давления в уравнительном резервуаре первого поезда на 0,4-0,5 кгс/см2, а второго поезда на 0,5 - 0,6 кгс/см 2 выше зарядного, с обязательным применением вспомогательного тормоза головного локомотива до давления в тормозных цилиндрах 1,0 - 2,0 кгс/см 2 (в зависимости от профиля пути). При скорости менее 30 км/ч отпуск автотормозов состава запрещается до полной остановки поезда. Машинист второго поезда в работу крана вспомогательного тормоза не вмешивается, кран работает в автоматическом режиме, как повторитель. Разрешается не применять вспомогательный тормоз локомотива после отпуска автотормозов при следовании поезда по прямому участку пути (в профиле), а также, если в процессе отпуска автотормозов головная часть поезда следует на подъем.", "b": false, "n": "6.20"}, {"t": "6.21 Для предотвращения разрыва поезда набор и сброс тяговых позиций производят таким образом, чтобы возрастание силы тяги с «0» до максимального значения и её снижение происходило не быстрее, чем за 25 секунд. На втором (в середине состава) локомотиве количество набранных позиций должно быть на 5-ть меньше, чем на первом для ВЛ80С или на 200А для 2(3)ЭС5к. При отправлении на площадке первым производит сбор тяги (3-4 позиции для ВЛ80С или 500 А для ЭС5к) машинист локомотива второго поезда с опережением на 3-6 секунд, а затем машинист локомотива первого поезда. При отправлении на спуске первым производит сбор тяги (2-3 позиции для ВЛ80С или 200-300 А для 2(3)ЭС5к) машинист локомотива второго поезда, машинист локомотива первого поезда придерживает, соединенный поезд, краном вспомогательного тормоза и после приведения всего поезда в движение отпускает ступенями вспомогательный тормоз, чтобы не допустить оттяжек в поезде. При отправлении на подъеме первым производит сбор тяги (3-4 позиции для ВЛ80С или 500 А для ЭС5к) машинист локомотива второго поезда с опережением на 3-6 секунд, а затем машинист локомотива первого поезда. Электрическое торможение для регулирования скорости применять при следовании всего поезда на спуске одновременно на обоих локомотивах либо только на локомотиве, находящегося в составе поезда, при этом;", "b": false, "n": "6.21"}, {"t": "– с массой груза 20т и менее с учетом приложения сжимающей силы не более 294 кН(30тс), для вагонов на тележках пассажирского типа не более 490 кН(50тс).", "b": false, "n": ""}, {"t": "– с массой груза более 20т (угольные, наливные, рудные и другие составы) с учетом приложения сжимающей силы не более 1176 кН(120тс). Сила электрического торможения не должна превышать 490кН(50тс). Команду на применение электрического торможения, а также величины токов возбуждения на обоих локомотивах задает машинист головного локомотива.", "b": false, "n": ""}, {"t": "6.22 Если в процессе ведения поезда на локомотиве в составе поезда сработает датчик «ТМ» или наблюдается понижение давления в тормозной магистрали без срабатывания датчика «ТМ», машинист должен сообщить об этом по радиосвязи машинисту головного локомотива о понижении давления в «ТМ», после чего по команде машиниста головного локомотива произвести ступень торможения 0,6 - 0,8 кгс/см 2 до полной остановки поезда. Произвести осмотр поездов и выяснить причину снижения давления. В случае не выяснения причины понижения давления в ТМ поезда дальнейшее следование осуществляется только после разъединения.", "b": false, "n": "6.22"}, {"t": "6.23 При стоянках поезда более 30 мин, или падении давления в главных резервуарах ниже 5,5 кгс/см2 произвести проверку автотормозов: проверить плотность тормозной сети при поездном положении ручки кранов машиниста, которая не должна отличаться от значения указанного в справке об обеспечении поезда тормозами и исправном их действии не более чем на 20% в сторону уменьшения или увеличения; машинист головного локомотива производит ступень торможения снижением давления в уравнительном резервуаре на 0,7-0,8 кгс/см 2; после загорания сигнальной лампы «ТМ» на пульте локомотива в составе поезда машинист этого локомотива производит аналогичную ступень разрядки; убедившись в срабатывании автотормозов, машинист локомотива второго поезда извещает об этом по радиосвязи машиниста головного локомотива, после чего они производят отпуск автотормозов.", "b": false, "n": "6.23"}, {"t": "6.24 Помощники машинистов проверяют действие автотормозов на торможение и отпуск по количеству вагонов с головы своего поезда указанных в приказе № Заб-135 от 17.04.2015 года.", "b": false, "n": "6.24"}, {"t": "6.25 С целью исключения автостопных торможений в случаях внезапного появления на локомотивном светофоре желтого с красным или красного огней из-за нарушения нормальной работы устройств АЛСН, при разрешающем показании напольного светофора и нажатии на рукоятку бдительности свисток автостопа не прекращается машинист головного локомотива немедленно передает машинисту второго поезда приказ убрать тягу и кратковременно на 57 секунд производит отключение ЭПК. Если после включения ЭПК на локомотивном светофоре не появится более разрешающее показание, машинист наряду с периодическим кратковременным отключением ЭПК и последующим его обязательным включением не менее чем на 3 секунды передает по радиосвязи информацию машинисту второго локомотива о выполнении служебного торможения и выполняет торможение краном машиниста снижением давления в уравнительном резервуаре на величину 0,6-0,7 кг/см 2. Если на локомотивном светофоре произойдет смена огней на разрешающее показание или скорость поезда снизиться до контролируемой, машинист в соответствии со скоростью поезда и профилем пути может выполнить отпуск тормозов с передачей соответствующей команды машинисту второго локомотива.", "b": false, "n": "6.25"}, {"t": "6.26 При перекрытии в пути следования входного, выходного, маршрутного, проходного светофоров машинист первого поезда немедленно производит сброс позиций и докладывает машинисту второго поезда по форме: «Машинист поезда №__, перекрытие сигнала, убирай тягу, тормозим экстренно до остановки», и после ответа машиниста производит экстренное торможение. Экстренное торможение, как правило, должно быть произведено синхронно по команде машиниста любого поезда в зависимости от обстоятельств. Экстренное и полное служебное торможение в один прием в таких поездах применяется только в случае необходимости внезапной остановки поезда, если его дальнейшему движению угрожает опасность. В этом случае при полном служебном торможении не допускать понижения давления в тормозной магистрали ниже 3,5 кгс/см². В случае невозможности применить синхронное экстренное торможение машинист головного локомотива для остановки поезда обязан произвести первую ступень торможения разрядкой уравнительного резервуара на величину 0,6 кгс/см², и по истечении 6-8сек, произвести вторую ступень разрядки уравнительного резервуара на 0,4-0,6 кгс/см². После применения полного служебного или экстренного торможения машинист ведущего локомотива немедленно передает ДСП, ограничивающим перегон, или ДНЦ по форме: «Я, машинист (фамилия)__ поезда №__ на__ км __ пикета применил полное служебное торможение (экстренное торможение) при скорости__км/ч». Дополнительно информирует машинистов встречных и вслед идущих поездов по форме: \"Внимание, все! Я машинист (фамилия)__ соединенного поезда №__ остановился на__километре__пикете четного (нечетного) пути перегона __ после применения экстренного (полного служебного) торможения. Сведений о нарушении габарита не имею. Будьте бдительны!\".", "b": false, "n": "6.26"}, {"t": "6.27 После остановки соединенного поезда с применением автотормозов необходимо выждать время с момента перевода ручки крана машиниста в 1-е положение до приведения локомотивов в движение: минуты после служебного торможения; минуты после полного служебного торможения; минут после экстренного торможения. В зимний период времени указанное время увеличивается в 1,5 раза.", "b": false, "n": "6.27"}, {"t": "6.28 Во избежание пережогов контактных проводов и поломок токоприемников электроподвижного состава запрещаются остановки и стоянки с поднятыми токоприемниками в местах токоразделов: на изолирующих сопряжениях анкерных участков (воздушных промежутках), секционных изоляторах контактной сети, а также на нейтральных вставках.", "b": false, "n": "6.28"}, {"t": "6.29 В случае непредвиденной остановки соединенного поезда и попадания электровоза на нейтральную вставку контактной сети, изолирующее сопряжение (воздушный промежуток), секционный изолятор, машинист немедленно опускает токоприемники, и сообщает об этом машинисту головного локомотива. В случае не возможности самостоятельного вывода соединенного поезда машинист головного локомотива сообщает энергодиспетчеру через поездного диспетчера или дежурного по станции. После принятия мер энергодиспетчером по включению мачтового разъединителя, подающего напряжение на нейтральную вставку и уведомления об этом поездного диспетчера, разрешается возобновить движение. При невозможности подачи напряжения на нейтральную вставку вывод соединенного поезда с электровозом, находящимся на нейтральной вставке, производится с помощью вспомогательного локомотива.", "b": false, "n": "6.29"}, {"t": "6.30 В пути следования машинисты локомотивов соединенного поезда выполняют проверку поездной радиосвязи между собой при отравлении и на каждом перегоне, особенно перед станциями, предупреждениями, искусственными сооружениями и при следовании на запрещающий сигнал, при этом первым посылает «вызов» машинист второго локомотива. При ведении объединенного поезда машинист головного локомотива обязан по радиосвязи информировать машиниста второго поезда о приближении к нейтральной вставки и местам с опусканием токоприемников (микротелефонная трубка на локомотивах постоянно снята).", "b": false, "n": "6.30"}, {"t": "6.31 Порядок проследования нейтральной вставки При отправлении на перегон, где имеется нейтральная вставка машинист первого поезда обязан предупредить машиниста второго поезда по форме: «Внимание на перегоне __, на __ км имеется нейтральная вставка». Машинист первого поезда при подъезде к нейтральной вставке производит отключение силовых и вспомогательных цепей и дает команду машинисту второго поезда на отключение силовых и вспомогательных цепей по форме «Внимание на __ км нейтральная вставка. Отключить ток». Машинисты соединенного поезда должны следовать со скоростью обеспечивающей проследование нейтральной вставки без остановки. После проследования нейтральной вставки машиниста первого поезда производит включение силовых и вспомогательных цепей и следует в зависимости от профиля участка пути. После того как локомотив второго поезда проследовал нейтральную вставку (определяет машинист первого поезда исходя из условной длины поезда), машинист первого поезда дает команду машинисту второго поезда на включение силовых и вспомогательных цепей локомотива по форме: «Внимание на __км нейтральную вставку проследовали. Включить ток». и определяет дальнейший порядок следования.", "b": false, "n": "6.31"}, {"t": "6.32 При возникновении неисправности контактной сети и необходимости проследования этого места с опущенными токоприемниками, машинист первого локомотива дает команду машинисту второго локомотива на выключение тяги и опускание токоприемников по форме: «Машинист поезда №__, фамилия__. Локомотива №__, на км__, пк__, опустить токоприемник». Машинист локомотива в составе поезда повторяет команду и опускает токоприемники. Подъем токоприемников осуществляется последовательно на каждом локомотиве по мере проследования места повреждения контактной сети.", "b": false, "n": "6.32"}, {"t": "6.33 В случае неисправности радиосвязи по всем диапазонам между локомотивами соединенного поезда, дальнейшее следование соединенного поезда запрещается. Машинист головного локомотива останавливает поезд служебным торможением, по возможности на площадке и прямом участке пути, машинист локомотива в составе поезда при загорании лампы «ТМ» или понижении давления в тормозной магистрали поезда действует в соответствии с пунктом 6.22 настоящей инструкции. Если после остановки поезда машинистам не удается установить между собой радиосвязь, поезд должен быть разъединен. После остановки машинисты обоих локомотивов направляют навстречу друг другу своих помощников для согласования действий по разъединению поездов. После чего соединенный поезд разъединяется. Дальнейшее следование поезда осуществляется в соответствии с пунктом 14 Общего раздела «Инструкции по движению поездов и маневровой работе на железнодорожном транспорте Российской Федерации», утвержденной приказом Минтранса России от 04 июня 2012 г. № 162.", "b": false, "n": "6.33"}, {"t": "6.34 Пропуск соединенных поездов осуществляется только по главным путям, в случае как исключение возможен пропуск по боковому направлению станции при наличии скорости не менее 40 км/час и с отклонением не более чем по одному стрелочному переводу или съезду. Отправление на перегон и следование соединённых поездов разрешается в соответствии с установленным межпоездным временным интервалом, утверждённым начальником службы энергоснабжения. Число поездов на фидерной зоне между тяговыми подстанциями должно быть не более заложенного в график, при этом соединенный поезд условно считается за два поезда (интервал не менее 30 минут).", "b": false, "n": "6.34"}, {"t": "6.35 Пропуск объединенных поездов разрешен с отклонением по стрелочному переводу на следующих станциях: Станция Дактуй Тыгда Чалганы Ушумун Сиваки Ту Мухинская Берея Шимановская Селеткан Ледяная Усть-Пёра Свободный Арга Серышево Украина Возжаевка Поздеевка Екатеринославка Тур Тюкан Бурея Домикан Архара - Облучье Номера боковых путей, выделенных для пропуска соединенных поездов Нечетные Четные 11А движение только по главным путям станций согласно распоряжения ДВОСТ-94р", "b": false, "n": "6.35"}, {"t": "6.36 Перечень опасных километров, где без необходимости не применять автотормоза, а производить заблаговременное торможение для регулирования скорости. На данных километрах высокая вероятность обрыва автосцепного устройства при трогании после остановки: 7495-7496, 7502-7501, 7514-7516, 7519 (в четном направлении),7527, 7529, 7538, 7540-7541, 7543, 7557, 7565-7566, 7569-7570, 7573, 7579-7580, 7604, 7606, 7612, 7616, 7621-7622, 7629, 7631-7632, 7676, 7681, 7693, 7698-7699, 7704, 7718, 77217722, 7724, 7726, 7729, 7732, 7747, 7751, 7761, 7764-7765, 7770, 7776, 7794-7795, 7803-7805, 7807, 7811, 7815, 7836, 7840-7845, 7857-7858, 7885-7886, 7894-7896, 7926-7927, 7949-7948, 7962-7961,7967-7968, 7970-7969, 7987-7985, 7999, 8001, 8005, 8008, 8050.", "b": false, "n": "6.36"}, {"t": "6.37 На двухпутных участках перегонов, пропуск соединенных поездов разрешается в неправильном направлении со скоростями, установленными как для поездов обычного формирования при их следовании в правильном направлении. При этом машинистам необходимо руководствоваться требованиям приказов №173-ДИ, №310-ЗабДИ «Об установлении допускаемых скоростей движения поездов по состоянию железнодорожного пути».", "b": false, "n": "6.37"}]}, {"id": "ad7", "cat": "av_doc", "page": 0, "pages": [], "title": "7. Опробование тормозов в соединённых поездах", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "7.1. На станциях формирования, при подготовке грузовых поездов предназначенных для последующего соединения, производится полное опробование тормозов каждого из составов, порядком изложенным в пункте 67 раздела IV приложения 2 Правил технического обслуживания тормозного оборудования и управления тормозами.", "b": false, "n": "7.1."}, {"t": "7.2. После соединения поездов, которым предварительно было выполнено полное опробование тормозов, производится сокращенное опробование тормозов, в том числе в случае, если соединение производится на станции формирования.", "b": false, "n": "7.2."}, {"t": "7.3. При сокращенном опробовании тормозов на станции, выполняемом осмотрщиками вагонов, производится проверка целостности тормозной магистрали путем открытия концевого крана ТМ хвостового вагона второго поезда на 8-10 секунд. После срабатывания сигнализатора разрыва ТМ машинист второго поезда выполняет ступень торможения с разрядкой УР на 0,5-0,6 кгс/см и сообщает машинисту первого поезда о выполненном торможении. Машинист первого поезда, после получения информации о торможении, убедившись в срабатывания сигнализатора разрыва ТМ, выполняет аналогичную ступень торможения и сообщает об этом машинисту второго поезда. После выполненного торможения машинисты обоих локомотивов, согласовав свои действия, производят отпуск тормозов переводом ручки крана машиниста в I положение до повышения давления в УР на 0,3-0,5 кгс/см выше предтормозного зарядного давления. После полной зарядки ТМ производится замер плотности тормозной сети поезда. После проверки плотности тормозной сети машинист второго поезда сообщает машинисту первого поезда о готовности к торможению. Машинист первого поезда производит торможение с разрядкой УР на величину 0,6-0,7 кгс/см^. Машинист второго поезда, после срабатывания сигнализатора разрыва ТМ и отклонения стрелки манометров ТМ, производит торможение с разрядкой УР на величину 0,6-0,7 кгс/см , после чего сообщает по радиосвязи машинисту головного поезда о выполненном торможении. После выполненного торможения осмотрщик вагонов хвостовой группы проверяет срабатывание тормозов хвостовых вагонов через 2 минуты после выполненного торможения. Отпуск тормозов производится не ранее 2-х минут после выполненного торможения по команде осмотрщика вагонов хвостовой группы. Машинист второго поезда сообщает машинисту первого поезда об отпуске тормозов и переводит ручку крана машиниста в I положение до повышения давления в УР на 0,3-0,5 кгс/см выше предтормозного зарядного. Машинист первого поезда, увидев отклонение стрелки манометра «ТМ» в сторону повышения давления производит отпуск тормозов переводом ручки крана машиниста в I положение до повышения давления в УР на 0.3-0.5 кгс/см^ выше предтормозного зарядного. После отпуска тормозов осмотрщик вагонов хвостовой группы сообщает о результатах проверки осмотрщику вагонов головной группы, который ставит отметку о выполненном опробовании тормозов в справке об обеспечении поезда тормозами и исправном их действии, находящейся у машиниста первого поезда. В случае если технологией работы станции предусмотрено отправление первого поезда до выходного (маршрутного) светофора или отправление первого поезда с последующей остановкой за выходным светофором, то после проведения сокращенного опробования тормозов отметку о выполненном опробовании тормозов в справке об обеспечении поезда тормозами и справном их действии, ставят машинисты локомотивов. При выполнении сокращенного опробования тормозов одним осмотрщиком вагонов, после проверки действия тормозов, отметку о выполнении сокращенного опробования тормозов в справке Об обеспечении поезда тормозами и исправном их действии ставят машинисты локомотивов. Разрешается проверять плотность ТМ соединенного поезда после объединения тормозных магистралей и полной зарядки тормозной сети поезда до проверки целостности ТМ и опробования тормозов.", "b": false, "n": "7.3."}, {"t": "7.4. После соединения поездов на перегоне или станциях где отсутствуют осмотрщики вагонов, опробование тормозов выполняется локомотивными бригадами порядком, аналогичном указанному в пункте 7.3. настоящей Инструкции кроме проверки целостности ТМ и выдержки времени в заторможенном состоянии 2 минуты. При этом сначала проверяется плотность ТМ, после чего выполняется торможение и отпуск тормозов. Проверку срабатывания тормозов в соединенном поезде производит помощник машиниста второго поезда путем осмотра действия автотормозов на двух хвостовых вагонах первого поезда и пяти головных вагонов второго поезда.", "b": false, "n": "7.4."}, {"t": "7.5. Замер плотности тормозной сети соединенного поезда выполнять следующим порядком: Предварительно согласовав свои действия, машинисты обоих локомотивов включают компрессоры до повышения давления в главных резервуарах (далее ГР) до максимального. После отключения компрессора на головном локомотиве машинист сообщает об этом машинисту второго локомотива, после чего машинист второго локомотива, производит замер плотности ТМ всего поезда. Проверка плотности соединенного поезда проверяется с локомотива находящегося в составе поезда по причине того, что кран машиниста питает ТМ второго поезда и часть объема ТМ впередистоящих вагонов, поэтому результат замера плотности будет более точным. При замере плотности ТМ машинист локомотива, находящегося в голове состава, не должен включать компрессоры до тех пор, пока не будет получен результат проверки плотности от машиниста второго локомотива. Порядок замера плотности ТМ соединенного поезда аналогичен порядку, указанному в пункте 48 раздела IV приложения 2 Правил технического обслуживания тормозного оборудования и управления тормозами. При плотности ТМ менее установленных нормативов отправление соединенного поезда запрещено.", "b": false, "n": "7.5."}, {"t": "7.6. Норматив плотности соединенного поезда приведен в таблице 1 настоящей Инструкции с учетом требований пункта 68 раздела IV приложения 2 Правил технического обслуживания тормозного оборудования и управления тормозами. При объеме ГР, отличном от представленного в таблице, время принимается по ближайшему наименьшему значению объема ГР. Общий объем ГР (в литрах) 2100 2500 3200 4200 5200 6200 7200 8200 Длина поезда в осях и время снижения давления на 0.5 кгс/см^, сек. (при зарядном давлении ТМ 5.0-5.2 кгс/см 351-400 401-500 501-600 601-700 701-780 (осей) (0сей) (осей) (осей) (осей) 108 123", "b": false, "n": "7.6."}, {"t": "7.7. В пути следования, машинист второго локомотива, производит замер плотности ТМ вышеуказанным порядком во всех случаях предусмотренных Правилами технического обслуживания тормозного оборудования и управления тормозами. Результат проверки плотности сообщается машинисту головного локомотива, после чего движение соединенного поезда возобновляется. Если полученный результат отличается от результата предыдущего замера ( в соединенном поезде) более чем на 20% в сторону увеличения или уменьшения, необходимо выполнить сокращенное опробование автотормозов порядком, указанным в пункте 7.3. настоящей Инструкции с проверкой целостности ТМ по открытию концевого крана хвостового вагона второго поезда.", "b": false, "n": "7.7."}, {"t": "7.8. Технологическое опробование тормозов в соединенном поезде выполняется во всех случаях предусмотренных пунктом 133 главы VIII Правил, порядком установленным пунктом 71 раздела IV приложения 2 Правил технического обслуживания тормозного оборудования и управления тормозами. После проверки действия автотормозов машинисты обоих локомотивов производят отпуск тормозов переводом ручки крана машиниста в I положение до повышения давления в УР на 0,5-0,76 кгс/см^ выше предтормозного зарядного давления. Помощник машиниста локомотива первого поезда должен произвести осмотр срабатывания и отпуска автотормозов у 5-ти вагонов с головы поезда, а помощник машиниста локомотива второго поезда должен произвести осмотр срабатывания и отпуска автотормозов у 5-ти головных вагонов второго поезда. При выполнении технологического опробования тормозов машинисты обоих локомотивов согласовывают свои действия по торможению и отпуску тормозов по радиосвязи.", "b": false, "n": "7.8."}]}, {"id": "ad8", "cat": "av_doc", "page": 0, "pages": [], "title": "7. Обработка соединённых поездов без разъединения при смене бригад", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "на Передача перевозочных документов и натурных листов поезда при смене локомотивных бригад производится с росписью машиниста принимающей бригады в 5 разделе маршрутного листа сдающей локомотивной бригады. После приемки локомотива (без продувки ТМ локомотива) локомотивная бригада докладывает ДСП о готовности к сокращенному опробованию автотормозов. Сокращенное опробование автотормозов в соединенном поезде производится осмотрщиками вагонов в два лица с проверкой состояния тормозной магистрали по действию тормозов 5-ти хвостовых и 5-ти головных вагонов. При сокращенном опробовании тормозов на станции, выполняемом осмотрщиками вагонов, производится проверка целостности тормозной магистрали путем открытия концевого крана ТМ хвостового вагона второго поезда на 8-10 секунд. После срабатывания сигнализатора разрыва ТМ машинист второго поезда выполняет ступень торможения с разрядкой УР на 0,5 - 0,6 кгс/см 2 и сообщает машинисту первого поезда о выполненном торможении. Машинист первого поезда, после получения информации о торможении, убедившись в срабатывания сигнализатора разрыва ТМ, выполняет аналогичную ступень торможения и сообщает об этом машинисту второго поезда. После выполненного торможения машинисты обоих локомотивов, согласовав свои действия, производят отпуск тормозов переводом ручки крана машиниста в I положение до повышения давления в УР на 0,3 - 0,5 кгс/см 2 выше зарядного давления. После полной зарядки ТМ производится замер плотности тормозной сети поезда. После проверки плотности тормозной сети машинист второго поезда сообщает машинисту первого поезда о готовности к торможению. Машинист первого поезда производит торможение с разрядкой УР на величину 0,6 - 0,7 кгс/см2. Машинист второго поезда, после срабатывания сигнализатора разрыва ТМ и отклонения стрелки манометров ТМ, производит торможение с разрядкой УР на величину 0,6 - 0,7 кгс/см 2, после чего сообщает по радиосвязи машинисту головного поезда о выполненном торможении. После выполненного торможения осмотрщик вагонов хвостовой группы проверяет срабатывание тормозов хвостовых вагонов через 2 мин. после выполненного торможения. Отпуск тормозов производится не ранее 2-х минут после выполненного торможения по команде осмотрщика вагонов хвостовой группы. Машинист второго поезда сообщает машинисту первого поезда об отпуске тормозов и переводит ручку крана машиниста в I положение до повышения давления в УР на 0,3 - 0,5 кгс/см2 выше зарядного. Машинист первого поезда, увидев отклонение стрелки манометра «ТМ» в сторону повышения давления производит отпуск тормозов переводом ручки крана машиниста в I положение до повышения давления в УР на 0,3 - 0,5 кгс/см2 выше зарядного. В случае если технологией работы станции предусмотрено отправление первого поезда до выходного (маршрутного) светофора или отправление первого поезда с последующей остановкой за выходным светофором, то после проведения сокращенного опробования тормозов отметку о выполненном опробовании тормозов в справке об обеспечении поезда тормозами и исправном их действии, ставят машинисты локомотивов.", "b": false, "n": ""}]}, {"id": "ad9", "cat": "av_doc", "page": 0, "pages": [], "title": "8. Нестандартные и аварийные ситуации", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "8.1 При возникновении нештатных ситуаций локомотивные бригады действуют порядком предусмотренным требованием Регламента взаимодействия локомотивных бригад с причастными работниками ОАО «РЖД», деятельность которых непосредственно связана с движением поездов, при возникновении аварийных и нестандартных ситуаций на инфраструктуре ОАО «РЖД», утвержденного распоряжением ОАО «РЖД» от 30.12.2010 г. № 2817р.", "b": false, "n": "8.1"}, {"t": "8.2 При возникновении неисправности устройств контактной сети или повреждения токоприемников машинисты должны действовать в соответствии с требованием Инструкции о порядке действий локомотивных бригад и работников дистанции электроснабжения при повреждениях токоприемников, контактной сети и комиссионном их рассмотрении, утвержденной МПС РФ от", "b": false, "n": "8.2"}, {"t": "09.10.2001 г. № ЦТ-ЦЭ-860. В случае повреждения токоприёмника на головном локомотиве соединенного поезда, машинист немедленно докладывает о повреждении машинисту второго локомотива и по согласованию друг с другом, принимают меры к остановке поезда с применением экстренного торможения, одновременно с этим машинист второго локомотива отключает силовые и вспомогательные цепи и опускает токоприёмник.", "b": false, "n": "09.10.2001"}, {"t": "8.3 В случае выявления в соединенном поезде неисправности устройств поездной радиосвязи дальнейшее следование соединенного поезда запрещается.", "b": false, "n": "8.3"}, {"t": "8.4 При вынужденной остановке соединенного поезда на участке с уклоном или подъемом и невозможности удержать поезд на тормозах локомотивная бригада обязана закрепить состав. На локомотиве приводятся в действие ручные тормоза, под вагоны укладываются тормозные башмаки, количество которых определяется исходя из конкретного уклона, на котором находится соединенный поезд. Укладка тормозных башмаков при закреплении поезда, состоящего из разнородных по весу вагонов, производится со стороны спуска под вагоны, имеющие нагрузку на ось не менее 10 тс. При закреплении соединенного поезда, находящегося на переломном профиле пути, укладку тормозных башмаков производить с головы и с хвоста поезда пропорционально расположению веса поезда соответственно оси перелома. Порядок укладки тормозных башмаков на перегоне аналогичен порядку указанному в пункте 50 раздела VI Приложения № 11 к Инструкции по движению поездов и маневровой работе на железнодорожном транспорте РФ, утвержденной приказом Минтранса России от 04.06.2012 г.", "b": false, "n": "8.4"}, {"t": "8.5 При вынужденной остановке соединенного поезда на перегоне, в связи с невозможностью дальнейшего следования, по причине неисправности головного локомотива, после прибытия вспомогательного локомотива для оказания помощи, производится разъединение соединенного поезда и дальнейшее следование поездов осуществляется раздельно. При вынужденной остановки поезда на перегоне, в связи с невозможностью дальнейшего следования, по причине неисправности локомотива в составе поезда, производится разъединение соединенного поезда. Дальнейшее движение первого поезда осуществляется обычным порядком, а машинисту локомотива второго поезда оказывается помощь вспомогательным локомотивом, порядком предусмотренным Приложением № 7 к Инструкции по движению поездов и маневровой работе на железнодорожном транспорте РФ, утвержденной приказом Минтранса России от 04.06.2012 г.", "b": false, "n": "8.5"}]}, {"id": "ad10", "cat": "av_doc", "page": 0, "pages": [], "title": "9. Разъединение поездов", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "9.1 Разъединение поездов производится в местах, с удобным профилем пути. Разъединение поездов производится в месте, указанном в приказе поездного диспетчера (не допускается остановка электровозов в пределах обозначенных мест секционирования контактной сети и на нейтральных вставках). В случаях, когда по сложившейся поездной ситуации необходимо изменить место разъединения соединенного поезда, машинистам локомотивов этого поезда передается новый приказ по форме: «Приказ №__, дата, время передачи приказа. Машинист поезда №__, фамилия__, локомотив №__ и Машинист поезда №__, фамилия__, локомотива №__. Во изменение приказа №__ , от __(дата) поезда №__и №__разъединить на __км главного пути перегона(станции) __. ДНЦ__». Не допускается остановка электровоза в пределах обозначенных мест секционирования контактной сети, нейтральных вставок, устройств ДИСК, ПОНАБ, КТСМ.", "b": false, "n": "9.1"}, {"t": "9.2 При разъединении поездов на перегоне допускается разъединение поездов на спусках до 0,004 и подъемах до 0,006 с соблюдением мер по предотвращению самопроизвольного ухода подвижного состава, включая применение вспомогательного тормоза локомотива, автотормозов поезда. При необходимости допускается укладка тормозных башмаков.", "b": false, "n": "9.2"}, {"t": "9.3 В случае если поездам, входившим в соединенный поезд, присваивались новые номера, то при разъединении им должна быть сохранена прежняя нумерация.", "b": false, "n": "9.3"}, {"t": "9.4 После остановки соединенного поезда для разъединения кран вспомогательного тормоза локомотива должен быть поставлен в крайнее тормозное положение, с максимальным давлением в ТЦ локомотива. Помощник машиниста второго локомотива до отпуска тормозов производит перекрытие концевых кранов тормозных магистралей (первым перекрывается концевой кран на хвостовом вагоне первого поезда), разъединяет концевые рукава, расцепляет автосцепки и закрепляет концевые краны вагона и локомотива от самопроизвольного открытия, подвешивает концевые рукава, о выполнении работ докладывает машинисту своего поезда.", "b": false, "n": "9.4"}, {"t": "9.5 После доклада помощника машиниста о готовности к разъединению поездов машинист второго поезда докладывает об этом машинисту первого поезда по форме: «Машинист поезда №__, фамилия__, локомотива №__. Концевые краны перекрыты, закреплены, рукава подвешены, можно отпустить тормоза».", "b": false, "n": "9.5"}, {"t": "9.6 После доклада о перекрытии кранов машинисты производят отпуск тормозов и зарядку тормозных магистралей первым положением ручки крана машиниста с завышением давления в уравнительном резервуаре на 0,3-0,7 кгс/см2 выше зарядного. После отпуска автотормозов и расцепки автосцепных устройств между вторым локомотивом и последним вагоном первого поезда, машинист первого поезда производит разрыв между поездами не менее 10-15 м со скоростью не более 3км/час. После разъединения поездов и полной зарядке ТМ в первом поезде выполняется сокращенное опробование автотормозов, с проверкой целостности ТМ и действие тормозов на двух хвостовых вагонах первого поезда. Во втором поезде выполняется технологическое опробование автотормозов согласно приказа Заб-№135 Н в зависимости от веса поезда:", "b": false, "n": "9.6"}, {"t": "9.7 Помощник машиниста второго поезда проверяет отпуск тормозов у двух хвостовых вагонов впереди стоящего поезда и по количеству вагонов своего поезда, о результатах проверки докладывает машинисту своего поезда.", "b": false, "n": "9.7"}, {"t": "9.8 Машинист второго поезда о результатах проверки отпуска тормозов докладывает машинисту впереди стоящего поезда по форме: «Машинист поезда №__, фамилия__, локомотива №__.Тормоза двух хвостовых вагонов отпустили, можете отправляться».", "b": false, "n": "9.8"}, {"t": "9.9 В случае не отпуска тормозов двух хвостовых вагонов впереди стоящего поезда выполняется регламент: «Машинист поезда №__, фамилия__, локомотива №__. Тормоза хвостовых вагонов не отпустили, произведите опробование автотормозов». Машинист первого локомотива отвечает: «Машинист поезда №__, фамилия__, локомотива №__. Понял, тормоза не отпустили, произвожу сокращенное опробование». После чего производит проверку тормозов установленным порядком. При этом помощник машиниста второго локомотива производит проверку целостности ТМ и действие тормозов двух хвостовых вагонов на торможение и отпуск (сокращенное опробование).", "b": false, "n": "9.9"}, {"t": "9.10 После разъединения поездов их отправление и следование производится по разрешающим показаниям сигналов автоблокировки. Машинист первого поезда переводит САУТ-ЦМ в режим САУТ, подключает КОН, машинист второго поезда после удаления первого поезда производит включение автоматов питания АЛСН, включает ЭПК, САУТ, подключает КОН (переводит КЛУБ-У на поездной режим).", "b": false, "n": "9.10"}, {"t": "9.11 После разъединения соединенного поезда опробование автотормозов не производится.", "b": false, "n": "9.11"}, {"t": "9.12 После завершения поездки машинист: указывает на скоростемерной ленте номер соединенного поезда; приказ на соединение; делает запись о следовании в голове или середине соединенного поезда; указывает номер своего локомотива, секции и фамилию другого машиниста состава соединенного поезда; кассета регистрации системы КЛУБ-У сдается вместе с маршрутом машиниста дежурному по депо", "b": false, "n": "9.12"}]}, {"id": "ad11", "cat": "av_doc", "page": 0, "pages": [], "title": "10. Предупреждение обрывов и выдавливания вагонов", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "10.1 Для предупреждения разрывов автосцепок и выдавливания вагонов составляется перечень опасных мест для поездов повышенного веса и длины, который объявляется локомотивным бригадам, дежурному и диспетчерскому аппарату. Дежурные по железнодорожным станциям или поездные диспетчеры заблаговременно информируют машинистов об изменении условий пропуска по перегонам и железнодорожным станциям поездов. В случае необходимости на основе полученной информации машинист своевременно принимает меры к остановке такого поезда на участке с благоприятным профилем.", "b": false, "n": "10.1"}, {"t": "10.2 При выполнении регулировочных торможений и торможений на остановку машинист производит регулировочное торможение с разрядкой уравнительного резервуара, порядком установленным Правилами технического обслуживания тормозного оборудования и управления тормозами железнодорожного подвижного состава, утверждёнными Советом по железнодорожному транспорту государств-участников Содружества (протокол от 6-7 мая 2014 года № 60). Экстренное и полное служебное торможение в один прием в таких поездах применяется только в случаях необходимости внезапной остановки поезда, если его дальнейшему движению угрожает опасность. В этом случае при полном служебном торможении не допускается понижение давления в тормозной магистрали ниже 3,5 кгс/см2.", "b": false, "n": "10.2"}, {"t": "10.3 При следовании по спуску машинист не должен допускать превышения установленной для данного участка скорости. Если скорость может увеличиться более установленной, обязательно применять автотормоза и после снижения скорости отпустить их с таким расчетом, чтобы выезжать на подъем с отпущенными тормозами и максимально допустимой скоростью. Включать контроллер разрешается только после полного отпуска тормозов.", "b": false, "n": "10.3"}, {"t": "10.4 При ведении поезда на спуске различной крутизны с выключенным контроллером, применять ступенчатое торможение вспомогательным тормозом локомотива при переходе со спуска меньшей крутизны на спуск большей крутизны.", "b": false, "n": "10.4"}, {"t": "10.5 При ведении поезда по спуску с переходом на площадку и снова на спуск с выключенным контроллером, при выходе локомотива на спуск после площадки привести в действие вспомогательный тормоз локомотива. При выходе на спуск всего поезда в зависимости от скорости движения отпустить ступенями вспомогательный тормоз локомотива. Если площадка после спуска длинная, то отпустить на спуске полностью все тормоза (если приводились в действие для снижения скорости) и следовать по площадке с отпущенными тормозами, при необходимости с включенным контроллером. При выходе локомотива на следующий спуск привести в действие вспомогательный тормоз и отпустить его ступенями при выходе всего поезда на спуск, если по условиям профиля не требуется применения тормозов.", "b": false, "n": "10.5"}, {"t": "10.6 Разрывы поездов и выдавливание вагонов по вине машинистов в большинстве случаев происходят из-за: неплавного трогания с места вследствие быстрого прироста силы тяги локомотива без учета длины поезда и профиля пути; приведение поезда в движение или подтягивание его без полного отпуска тормозов; трогание поезда с места после резкого сжатия локомотивом головной части поезда при его осаживании, не дождавшись возможной оттяжки хвостовой части поезда; ведение поезда по участку без учета особенностей перелома профиля пути, при котором возможны набегания вагонов и оттяжки в поезде, не использование режимных карт; неправильное применение электрического торможения машинистом локомотива в составе поезда; неправильного торможения или неправильно выбранный режим отпуска тормозов, как и несвоевременный отпуск тормозов при остановке поезда на станции или перегоне; нарушения плотности тормозной магистрали и не выполнении машинистами требований Приложения № 3, главы I Правил технического обслуживания тормозного оборудования и управления тормозами железнодорожного подвижного состава, утверждённых Советом по железнодорожному транспорту государств-участников Содружества (протокол от 6-7 мая 2014 года № 60).", "b": false, "n": "10.6"}]}, {"id": "ad12", "cat": "av_doc", "page": 0, "pages": [], "title": "11. Случаи, когда нужно разъединять поезда", "steps": [], "notes": [], "kind": "doc", "src": "Местная инструкция, 2017", "paras": [{"t": "11.1 При проверке тормозов на их действие в пути следования, большие продольно-динамические реакции в поезде.", "b": false, "n": "11.1"}, {"t": "11.2 В пути следования после повторного самопроизвольного срабатывания автотормозов, если причина срабатывания не выявлена;", "b": false, "n": "11.2"}, {"t": "- после повторного самопроизвольного срабатывания автотормозов по причине возникновения реакций в поезде вызванных неправильным выбором режима управления тягой локомотивов;", "b": false, "n": ""}, {"t": "- непредвиденная выдача ограничения скорости на пути проследования соединенного груженого поезда 25 км/ч и менее, а перед и (или) на руководящих подъёмах менее 60км/час.", "b": false, "n": ""}, {"t": "11.3 В пути следования произошел сбой АЛСН.", "b": false, "n": "11.3"}, {"t": "11.4 Срабатывание устройств технического диагностирования контроля КТСМ, КГН, УКСПС и т.д.", "b": false, "n": "11.4"}, {"t": "11.5 Не стабильное напряжение в контактной сети, при котором не обеспечивается плавность ведения поезда, а также не возможно реализовать требуемую мощность локомотива ( по согласованию с энергодиспетчером).", "b": false, "n": "11.5"}, {"t": "11.6 В пути следования выдано предупреждение ограничения скорости менее 40 км/час.", "b": false, "n": "11.6"}, {"t": "11.7 В период следования понижение температуры окружающего воздуха ниже 250 С. Данную информацию машинисты получают от ДНЦ участка.", "b": false, "n": "11.7"}, {"t": "11.8 При выполнении мероприятия «Красная точка». В случае необходимости разъединения соединенного поезда, машинисты обязаны доложить ДНЦ участка причины разъединения. Разъединение поездов производится по приказу ДНЦ на перегонах или станциях с благоприятным профилем пути.", "b": false, "n": "11.8"}]}]};

<script>
(function(){
const cats = DATA.cats.map(c=>[c[0],c[1]]), items = DATA.items;
const catName = Object.fromEntries(cats);
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs = new Set(LS.get('ermak.favs',[]));
let done = LS.get('ermak.done',{});
const secs = DATA.sections;
const catSec = Object.fromEntries(DATA.cats.map(c=>[c[0],c[2]]));
items.forEach(it=>it.sec=catSec[it.cat]);
let sec = LS.get('ermak.sec', secs[0][0]); if(!secs.some(x=>x[0]===sec)) sec=secs[0][0];
let cat = 'all';
const secsEl=document.getElementById('secs');
function renderSecs(){ secsEl.innerHTML=secs.map(([k,n,sub])=>`<button class="sec" role="tab" data-s="${k}" aria-selected="${k===sec}"><b>${n}</b><small>${sub}</small></button>`).join('') }
secsEl.addEventListener('click',e=>{const b=e.target.closest('.sec'); if(!b) return; setSec(b.dataset.s)});
function setSec(k){ sec=k; cat='all'; LS.set('ermak.sec',sec); renderSecs(); renderChips(); renderList(); window.scrollTo({top:0}) }

// Latin lookalikes -> Cyrillic so "kv44" finds "KV44", "km13" finds "КМ13"
const LAT = {a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[abcehkmoptxy]/g,c=>LAT[c]).replace(/[«»"“”]/g,'').replace(/\s+/g,' ');
items.forEach(it=>{ it.figs = it.imgs || it.pages.map(p=>({k:String(p),c:'Стр. '+p})); it._hay = norm([it.title, ...it.steps, ...it.notes, catName[it.cat], it.src||'', ...(it.paras||[]).map(p=>p.t), it.ft||'', ...(it.rows||[]).map(r=>[r.g,r.a,r.b,r.c,r.w].join(' '))].join(' '))});

const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CODE = /(?<![\p{L}\d])((?:KV|КV|KT|КТ|KM|КМ|KA|КА|KK|КК|КН|KH|КР|SF|SA|SQ|SP|QS|QF|QT|QP|РД|РС|PC|МН|MH|МВ|ТД|U|Y|F|Н|H|Э|Л|S|А|A|Т)\s?\d{1,3}(?:[–-]\d)?)(?![\p{L}\d])/gu;
function fmt(s, terms){
  let h = esc(s).replace(CODE,'<span class="code">$1</span>');
  return terms && terms.length ? mark(h, terms) : h;
}
function mark(html, terms){
  // highlight only outside tags
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(m,a,txt)=>{
    let out = txt, nt = norm(txt);
    const ranges=[];
    terms.forEach(t=>{let i=0;while(t&&(i=nt.indexOf(t,i))>-1){ranges.push([i,i+t.length]);i+=t.length}});
    if(!ranges.length) return m;
    ranges.sort((x,y)=>x[0]-y[0]);
    let res='',p=0;
    for(const [s,e] of ranges){ if(s<p) continue; res+=out.slice(p,s)+'<mark class="hit">'+out.slice(s,e)+'</mark>'; p=e; }
    return a+res+out.slice(p);
  });
}

// chips
const chipsEl = document.getElementById('chips');
function renderChips(){
  const counts = {}; const inSec=items.filter(i=>i.sec===sec); inSec.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  const nf=inSec.filter(i=>favs.has(i.id)).length;
  const list = [['all','Все',inSec.length],['fav','★ Избранное',nf], ...cats.filter(([k])=>catSec[k]===sec&&counts[k]).map(([k,n])=>[k,n.replace(/ \(.+\)/,''),counts[k]])];
  chipsEl.hidden = !inSec.length;
  chipsEl.innerHTML = list.map(([k,n,c])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${esc(n)}<span class="n">${c}</span></button>`).join('');
}
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; cat=b.dataset.c; renderChips(); renderList(); window.scrollTo({top:0})});

// list
const mainEl = document.getElementById('main'), qEl = document.getElementById('q'), clr = document.getElementById('clr');
function renderList(){
  const q = norm(qEl.value.trim());
  clr.hidden = !q;
  const terms = q ? q.split(' ').filter(Boolean) : [];
  const match = it=>terms.every(t=>it._hay.includes(t));
  const S = secs.find(x=>x[0]===sec);
  if(!items.some(it=>it.sec===sec)){
    mainEl.innerHTML = `<div class="soon"><b>${esc(S[1])}: ${esc(S[2])}</b><span>Раздел готовится. Материалы появятся здесь после следующего обновления — приложение обновится само.</span></div>`+footer();
    return;
  }
  let res = items.filter(it=>it.sec===sec && (cat==='all'||(cat==='fav'?favs.has(it.id):it.cat===cat)) && match(it));
  if(!res.length){
    const others = terms.length ? secs.filter(x=>x[0]!==sec).map(x=>[x,items.filter(it=>it.sec===x[0]&&match(it)).length]).filter(x=>x[1]) : [];
    if(others.length){ mainEl.innerHTML = `<p class="empty">В разделе «${esc(S[1])}» ничего не найдено. Есть совпадения в других разделах:</p><div class="other">${others.map(([x,n])=>`<button data-s="${x[0]}">${esc(x[1])} · ${n}</button>`).join('')}</div>`+footer(); mainEl.querySelectorAll('.other button').forEach(b=>b.onclick=()=>setSec(b.dataset.s)); return; }
    mainEl.innerHTML = `<p class="empty">${cat==='fav'&&!q?'Здесь будут неисправности, отмеченные звёздочкой. Откройте любую и нажмите ☆.':'Ничего не найдено. Попробуйте короче: номер аппарата (KV44, SF27) или одно слово из симптома.'}</p>`+footer();
    return;
  }
  let html='';
  if(cat==='all' && !terms.length){ cats.filter(([k])=>catSec[k]===sec && (k.endsWith('_lay')||k.endsWith('_sch'))).forEach(([k,n])=>{ const L=res.filter(x=>x.cat===k); if(!L.length) return; res=res.filter(x=>x.cat!==k); html+=`<button class="laybanner" data-c="${k}"><b>${esc(n)}</b><span>${L.map(x=>x.title.replace('Расположение оборудования: ','')).slice(0,4).map(esc).join(' · ')}${L.length>4?' и др.':''}</span><i>→</i></button>`; }); }
  const byCat = {}; res.forEach(it=>(byCat[it.cat]=byCat[it.cat]||[]).push(it));
  cats.forEach(([k,n])=>{ if(!byCat[k]) return;
    html += `<section class="group"><h2>${esc(n)}</h2><div class="list">`+byCat[k].map(it=>{
      const n = it.steps.length;
      return `<button class="item" data-id="${it.id}"><span class="t">${mark(esc(it.title),terms)}</span>${favs.has(it.id)?'<span class="star" aria-label="В избранном">★</span>':'<span></span>'}<span class="meta">${it.kind==='info'?'<span class="tag info">Справка</span>':it.rows?`<span class="tag info">${it.rows.length} перемыч${plural(it.rows.length,'ка','ки','ек')}</span>`:it.kind==='map'?'<span class="tag photo">Интерактивно</span>':it.kind==='doc'?'<span class="tag info">Правила</span>':n?`<span class="tag">${n} ${plural(n,'шаг','шага','шагов')}</span>`:''}${it.photo?'<span class="tag photo">Фото</span>':''}${it.src?`<span>${esc(it.src)}</span>`:it.pages.length?`<span>стр. ${it.pages.join(', ')}</span>`:''}</span></button>`;
    }).join('')+`</div></section>`;
  });
  mainEl.innerHTML = html + footer();
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function footer(){const S=secs.find(x=>x[0]===sec);return `<footer class="src">${S&&S[3]?`<span>${esc(S[3])}</span>`:''}<span>Фото на заставке: Sergey Nemtsev.</span><span>Это памятка для самоподготовки. В пути действуйте по действующим инструкциям и указаниям ДНЦ.</span></footer>`}
qEl.addEventListener('input',renderList);
clr.addEventListener('click',()=>{qEl.value='';renderList();qEl.focus()});
let pushed=false;
mainEl.addEventListener('click',e=>{const lb=e.target.closest('.laybanner'); if(lb){cat=lb.dataset.c; renderChips(); renderList(); window.scrollTo({top:0}); return;} const b=e.target.closest('.item'); if(b){pushed=true; location.hash=b.dataset.id}});

// detail
const det = document.getElementById('detail');
let cur = null;
function openDetail(id){
  const it = items.find(x=>x.id===id); if(!it){closeDetail();return}
  cur = it; if(it.sec!==sec){ sec=it.sec; LS.set('ermak.sec',sec); renderSecs(); renderChips(); renderList(); }
  const terms = norm(qEl.value.trim()).split(' ').filter(Boolean);
  const d = done[id]||[];
  const sib = items.filter(x=>x.cat===it.cat), k = sib.indexOf(it), prev=sib[k-1], next=sib[k+1];
  const figsFirst=it.cat.endsWith('_lay'); const FIGS=it.figs.length?`<div class="figs"><h3 class="sec-h">${it.figs.length>1?'Схемы и страницы':'Схема'}</h3>${it.figs.map(f=>IMG[f.k]?`<figure class="fig" data-p="${f.k}"><img alt="${esc(f.c)}" src="${IMG[f.k]}" loading="lazy" decoding="async"><figcaption><span>${esc(f.c)}</span><span>Нажмите, чтобы увеличить</span></figcaption></figure>`:'').join('')}</div>`:'';
  det.innerHTML = `
  <div class="dbar"><div class="wrap">
    <button class="iconbtn" id="back" aria-label="Назад к списку">← <span>Список</span></button>
    <span class="where">${esc((secs.find(x=>x[0]===it.sec)||[])[1]||"")} · ${esc(catName[it.cat])}</span>
    <button class="iconbtn" id="fav" aria-pressed="${favs.has(id)}" aria-label="Избранное"><span class="${favs.has(id)?'star-on':''}">${favs.has(id)?'★':'☆'}</span></button>
  </div></div>
  <div class="wrap dbody">
    <div style="display:grid;gap:8px">
      <h2 id="dtitle">${mark(esc(it.title),terms)}</h2>
      <div class="dmeta">${it.kind==='info'?'<span class="tag info">Справка</span>':''}${it.photo?'<span class="tag photo">Фото с локомотива</span>':''}${it.src?`<span>${esc(it.src)}</span>`:it.pages.length?`<span>Страница сборника: ${it.pages.join(', ')}</span>`:''}</div>${it.rel?it.rel.map(r=>{const x=items.find(y=>y.id===r);return x?`<button class="rel" data-rel="${r}">${x.photo?'Фото-инструкция: ':'См. также: '}${esc(x.title)} →</button>`:''}).join(''):''}
    </div>
    ${it.svg?`<div class="apprbox">${it.svg}</div>`:''}${it.map?`<div class="mapbox"><p class="hint" style="margin:0">Нажмите на отсек или аппарат — появится описание и неисправности, где он встречается.</p><div class="mapctl"><button class="iconbtn mz" data-z="-1" aria-label="Уменьшить">−</button><button class="iconbtn mz" data-z="1" aria-label="Увеличить">+</button></div><div class="mapwrap" id="mapwrap">${mapSvg(it.map)}</div><div class="minfo" id="minfo"></div></div>`:''}${figsFirst?FIGS:''}${it.steps.length?`<div style="display:grid;gap:10px"><h3 class="sec-h">Порядок действий</h3><p class="hint">Нажмите на шаг, чтобы отметить выполненным.</p><ol class="steps">${it.steps.map((s,i)=>`<li class="step${d.includes(i)?' done':''}" data-i="${i}" tabindex="0" role="checkbox" aria-checked="${d.includes(i)}"><span class="num" aria-hidden="true"></span><span class="txt">${fmt(s,terms)}${it.sp&&it.sp[i]?`<span class="sph">${it.sp[i].map(k=>`<img class="zoomable" data-k="${k}" src="${IMG[k]}" alt="Фото к шагу ${i+1}" loading="lazy">`).join('')}</span>`:''}</span></li>`).join('')}</ol>${d.length?'<button class="iconbtn" id="reset" style="color:var(--ink-2);justify-self:start">Сбросить отметки</button>':''}</div>`:''}
    ${it.rows?`<div class="jl">${[...new Set(it.rows.map(r=>r.g))].map(g=>`<h3 class="sec-h">${esc(g)}</h3>`+it.rows.filter(r=>r.g===g).map(r=>`<button class="jr" data-rel="${r.ref}"><span class="jw">${mark(esc(r.w),terms)}</span><span class="jp"><span class="code">${mark(esc(r.a),terms)}</span><span class="arr">→</span><span class="code">${mark(esc(r.b),terms)}</span></span><span class="jc">${esc(r.c)} · стр. ${r.p}</span></button>`).join('')).join('')}</div>`:''}${it.paras?`<div class="paras${it.kind==='doc'?' doc':''}">${it.paras.map(p=>p.b?`<h4>${fmt(p.t,terms)}</h4>`:`<p>${p.n?`<b class="pn">${p.n}</b> ${fmt(p.t.slice(p.n.length).trim(),terms)}`:fmt(p.t,terms)}</p>`).join('')}</div>`:''}${it.notes.length?`<div class="notes"><h3 class="sec-h">${it.steps.length?'Дополнительно':'Описание'}</h3>${it.notes.map(n=>`<div class="note">${fmt(n,terms).replace(/([.;:])\s+([А-ЖЗ]\))/g,'$1<br>$2')}</div>`).join('')}</div>`:''}
    ${figsFirst?'':FIGS}
    <div class="nav2">
      <button id="prev" ${prev?'':'disabled'}><small>← Предыдущая</small><span>${prev?esc(prev.title):''}</span></button>
      <button id="next" class="nx" ${next?'':'disabled'}><small>Следующая →</small><span>${next?esc(next.title):''}</span></button>
    </div>
  </div>`;
  det.hidden = false; det.scrollTop = 0; document.body.style.overflow='hidden';
  det.querySelector('#back').onclick = ()=>{ if(pushed){pushed=false;history.back()} else location.hash=''; };
  det.querySelector('#fav').onclick = ()=>{favs.has(id)?favs.delete(id):favs.add(id); LS.set('ermak.favs',[...favs]); openDetail(id); renderChips(); renderList()};
  if(prev) det.querySelector('#prev').onclick=()=>location.replace('#'+prev.id);
  if(next) det.querySelector('#next').onclick=()=>location.replace('#'+next.id);
  const r = det.querySelector('#reset'); if(r) r.onclick=()=>{delete done[id]; LS.set('ermak.done',done); openDetail(id)};
  det.querySelectorAll('.step').forEach(el=>{
    const tog=()=>{ if(getSelection().toString()) return; const i=+el.dataset.i; let a=done[id]||[]; a=a.includes(i)?a.filter(x=>x!==i):[...a,i]; done[id]=a; LS.set('ermak.done',done);
      el.classList.toggle('done'); el.setAttribute('aria-checked', a.includes(i)); if(!det.querySelector('#reset')&&a.length) openDetail(id) };
    el.addEventListener('click',tog); el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}});
  });
  det.querySelectorAll('.fig').forEach(f=>f.onclick=()=>openViewer(f.dataset.p));
  det.querySelectorAll('.zoomable').forEach(f=>f.onclick=e=>{e.stopPropagation();openViewer(f.dataset.k)});
  if(it.map) wireMap(it);
  det.querySelectorAll('.jr').forEach(b=>b.onclick=()=>{pushed=true;location.hash=b.dataset.rel});
  det.querySelectorAll('.rel').forEach(b=>b.onclick=()=>location.replace('#'+b.dataset.rel));
}

function mapSvg(M){
  const z=M.zones.map(z=>`<rect class="mzone" data-zone="${z.id}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}"></rect>`).join('');
  const walls=M.walls.map(w=>`<rect x="${w[0]}" y="${w[1]}" width="${w[2]}" height="${w[3]}" fill="#8cc63f"></rect>`).join('');
  const els=M.els.map((e,i)=>{
    const sh=e.s==='oval'?`<ellipse cx="${e.x+e.w/2}" cy="${e.y+e.h/2}" rx="${e.w/2}" ry="${e.h/2}" fill="${e.f}" stroke="#1d2a36" stroke-width="2"></ellipse>`:`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" fill="${e.f}" stroke="#1d2a36" stroke-width="2"></rect>`;
    const fs=Math.max(13,Math.min(40,(e.v?e.w:e.h)*0.55, ((e.v?e.h:e.w)*1.6)/Math.max(2,e.l.length)));
    const cx=e.x+e.w/2, cy=e.y+e.h/2;
    const tx=e.l?`<text x="${cx}" y="${cy}" font-size="${fs}" text-anchor="middle" dominant-baseline="central"${e.v?` transform="rotate(-90 ${cx} ${cy})"`:''}>${esc(e.l)}</text>`:'';
    return `<g class="mel" data-i="${i}" tabindex="0" role="button" aria-label="${esc(e.l||'')}">${sh}${tx}</g>`;
  }).join('');
  const labels=M.zones.filter(z=>['vvk1','vvk2','tr'].includes(z.id)).map(z=>`<text class="zl" x="${z.x+z.w/2}" y="${z.id==='tr'?525:50}" text-anchor="middle">${esc(z.n)}</text>`).join('');
  return `<svg viewBox="0 0 ${M.w} ${M.h}" class="msvg" id="msvg" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="8" width="1900" height="677" fill="#ffffff" stroke="#1d2a36" stroke-width="5"></rect><line x1="138" y1="8" x2="138" y2="685" stroke="#1d2a36" stroke-width="5"></line><line x1="138" y1="578" x2="1915" y2="578" stroke="#1d2a36" stroke-width="4"></line><line x1="1648" y1="8" x2="1648" y2="578" stroke="#1d2a36" stroke-width="4"></line>${walls}${z}${labels}${els}</svg>`;
}
function relatedTo(code, secKey){
  if(!code) return [];
  const n=norm(code); const re=new RegExp('(^|[^\\p{L}\\d])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\d])','u');
  return items.filter(x=>x.sec===secKey && x.kind!=='map' && re.test(x._hay)).slice(0,14);
}
function wireMap(it){
  const M=it.map, info=det.querySelector('#minfo'), wrap=det.querySelector('#mapwrap'), svg=det.querySelector('#msvg');
  let zoom=innerWidth<700?2.2:1; const applyZ=()=>{svg.style.width=(zoom*100)+'%'}; applyZ();
  det.querySelectorAll('.mz').forEach(b=>b.onclick=()=>{zoom=Math.min(4,Math.max(1,zoom+(+b.dataset.z)*0.6));applyZ()});
  const show=(title,text,code,rel)=>{
    const rs=relatedTo(code,it.sec);
    const relCard=rel&&items.find(x=>x.id===rel);
    info.innerHTML=`<h3>${esc(title)}</h3>${text?`<p>${fmt(text,[])}</p>`:''}${relCard?`<button class="rel" data-rel="${rel}">Подробнее: ${esc(relCard.title)} →</button>`:''}${code?(rs.length?`<h4 class="sec-h">Где встречается ${esc(code)}</h4><div class="mlist">${rs.map(x=>`<button class="mitem" data-rel="${x.id}">${esc(x.title)}</button>`).join('')}</div>`:`<p class="hint" style="margin:0">В карточках раздела ${esc(code)} не упоминается.</p>`):''}`;
    info.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{pushed=true;location.hash=b.dataset.rel});
    info.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  const sel=el=>{svg.querySelectorAll('.on').forEach(x=>x.classList.remove('on')); el&&el.classList.add('on')};
  svg.querySelectorAll('.mel').forEach(g=>{const e=M.els[+g.dataset.i]; const f=()=>{sel(g); const z=M.zones.find(z=>z.id===e.z); show(e.l+(z?' · '+z.n:''), e.i||(z?z.i:''), e.c, e.rel)};
    g.addEventListener('click',ev=>{ev.stopPropagation();f()}); g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();f()}})});
  svg.querySelectorAll('.mzone').forEach(r=>r.addEventListener('click',()=>{sel(r); const z=M.zones.find(z=>z.id===r.dataset.zone); show(z.n,z.i,'',null)}));
  info.innerHTML='<p class="hint" style="margin:0">Ничего не выбрано.</p>';
}
function closeDetail(){det.hidden=true;det.innerHTML='';cur=null;document.body.style.overflow=''}

// viewer
const vw = document.getElementById('viewer');
let zoom=1, vimg=null, pan=null;
function openViewer(p){
  vw.innerHTML = `<div class="vbar"><button class="iconbtn" id="vclose" aria-label="Закрыть">✕</button><span class="sp"></span><button class="iconbtn" id="zout" aria-label="Уменьшить">−</button><span class="z" id="zl"></span><button class="iconbtn" id="zin" aria-label="Увеличить">+</button><button class="iconbtn" id="zfit">Вписать</button></div><div class="pan" id="pan"><img src="${IMG[p]}" alt="Увеличенное изображение"></div>`;
  vw.hidden=false; pan=vw.querySelector('#pan'); vimg=pan.querySelector('img');
  const fit=()=>{zoom=1;apply()};
  vimg.onload=()=>{ zoom = innerWidth<700 ? 2 : 1; apply(); pan.scrollLeft=0 };
  if(vimg.complete) vimg.onload();
  vw.querySelector('#vclose').onclick=closeViewer;
  vw.querySelector('#zin').onclick=()=>setZoom(zoom*1.5);
  vw.querySelector('#zout').onclick=()=>setZoom(zoom/1.5);
  vw.querySelector('#zfit').onclick=fit;
  // drag to pan with mouse
  let drag=null;
  pan.onpointerdown=e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,y:e.clientY,l:pan.scrollLeft,t:pan.scrollTop};pan.style.cursor='grabbing'};
  window.onpointermove=e=>{if(!drag)return;pan.scrollLeft=drag.l-(e.clientX-drag.x);pan.scrollTop=drag.t-(e.clientY-drag.y)};
  window.onpointerup=()=>{drag=null;if(pan)pan.style.cursor=''};
  pan.ondblclick=()=>setZoom(zoom>=2?1:2.5);
}
function setZoom(z){
  const cx=(pan.scrollLeft+pan.clientWidth/2)/vimg.width, cy=(pan.scrollTop+pan.clientHeight/2)/vimg.height;
  zoom=Math.min(5,Math.max(1,z)); apply();
  pan.scrollLeft=cx*vimg.width-pan.clientWidth/2; pan.scrollTop=cy*vimg.height-pan.clientHeight/2;
}
function apply(){ vimg.style.width=(pan.clientWidth*zoom)+'px'; vw.querySelector('#zl').textContent=Math.round(zoom*100)+'%' }
function closeViewer(){vw.hidden=true;vw.innerHTML='';window.onpointermove=window.onpointerup=null}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!vw.hidden) closeViewer(); else if(!det.hidden) location.hash=''; } });
function route(){ const h=location.hash.slice(1); if(!vw.hidden) closeViewer(); if(h&&/^[a-z0-9_]+$/i.test(h)) openDetail(h); else closeDetail(); }
addEventListener('hashchange',route);

renderSecs(); renderChips(); renderList(); route();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(function(){
  const btn=document.getElementById('install'); let ev=null;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(!standalone)btn.hidden=false});
  btn.onclick=async()=>{ if(ev){ev.prompt();await ev.userChoice;ev=null;btn.hidden=true} else { tip() } };
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone){btn.hidden=false}
  function tip(){ if(document.querySelector('.ios-tip'))return; const m=document.getElementById('main'); const t=document.createElement('div'); t.className='ios-tip';
    t.innerHTML='<b>Как установить на iPhone:</b> откройте эту страницу в Safari, нажмите «Поделиться» (квадрат со стрелкой) и выберите «На экран Домой». Иконка появится на рабочем столе, приложение будет работать без интернета.'; m.prepend(t) }
})();
