лектрическое торможение;", "b": false, "n": ""}, {"t": "- при следовании поезда на электрическом торможении со спуска на площадку и вновь на спуск в конце первого спуска уменьшить ток возбуждения для повышения скорости, а после прохода площадки при вступлении на спуск снова увеличивать ток возбуждения;", "b": false, "n": ""}, {"t": "- не допускать превышения скорости поезда свыше установленной для данного спуска по автоматическим тормозам. В случае необходимости применять автоматические тормоза поезда совместно с электрическим тормозом;", "b": false, "n": ""}, {"t": "- не применять вспомогательный тормоз локомотива (кроме локомотивов, схемы которых предусматривают одновременное применение электрического и вспомогательного тормозов с ограниченным давлением в тормозных цилиндрах), за исключением случаев выполнения экстренного торможения;", "b": false, "n": ""}, {"t": "- следуя по спускам с большими токами при электрическом торможении, привести в действие песочницу локомотива для предупреждения юза колес по рельсам, особенно в кривых участках пути и переездах.", "b": false, "n": ""}, {"t": "- не допускать, чтобы тормозной ток якорей тяговых двигателей превышал ток возбуждения более, чем установлено конструкцией двигателя по максимальному ослаблению поля;", "b": false, "n": ""}, {"t": "- выключение электрического торможения производить постепенно, пока тормозной ток не уменьшится до нуля. В этот момент полностью выключить электрический тормоз;", "b": false, "n": ""}, {"t": "- если во время движения с рекуперативным торможением напряжение постоянного тока в контактной сети повысилось до 4 кВ, уменьшить ток возбуждения и, если требуется, привести в действие автоматические тормоза поезда; при снижении напряжения переменного тока в контактной сети до 19 кВ рекуперативное торможение не применять;", "b": false, "n": ""}, {"t": "- для уменьшения в грузовом поезде продольно-динамических сил перед переходом на электрическое торможение на затяжных спусках крутизной 0,018 и более в начале произвести ступень торможения автоматическими тормозами снижением давления на 0,06-0,07 МПа (0,6-0,7 кгс/см2), а после перехода на электрическое торможение при необходимости отпустить автотормоза поезда;", "b": false, "n": ""}, {"t": "- на спусках крутизной менее 0,018 в грузовых поездах перевод локомотива на режим электрического торможения разрешается производить без применения автотормозов состава при тормозном токе якоря, соответствующем не более 20% полной тормозной силы, с выдержкой этого тока в течение 10-15 секунд и последующим его увеличением до требуемого значения;", "b": false, "n": ""}, {"t": "- при ведении пассажирских и порожних грузовых поездов перед переходом на электрическое торможение не требуется применять автоматические тормоза, если скорость поезда не превышает предусмотренную автоматической характеристикой электрического торможения для установленного соединения тяговых двигателей;", "b": false, "n": ""}, {"t": "- не применять только электрическое торможение при вождении поездов повышенной длины, повышенного веса и длины, соединенных поездов на станциях, а также на перегонах при наличии кривых радиусом менее 300 м, расположенных на уклонах круче 0,012. Данные участки необходимо проследовать на пневматическом или комбинированном торможении (электрическое торможение совместно с пневматическим).", "b": false, "n": ""}, {"t": "10.12.4 Разрешается применение электрического тормоза локомотива без применения комбинированного торможения поезда при следовании к светофору с запрещающим показанием, но не ближе 400 м до светофора.", "b": false, "n": "10.12.4"}, {"t": "При комбинированном торможении разрешается применение электрического тормоза до остановки поезда у светофора с запрещающим показанием.", "b": false, "n": ""}, {"t": "10.12.5 Во всех случаях произвольного отключения электрического торможения немедленно привести в действие вспомогательный тормоз локомотива и перейти на торможение поезда автоматическими тормозами, после чего отпустить локомотивный тормоз и вновь включить электрическое торможение. Если произойдет повторное его отключение, то далее вести поезд только на автоматических тормозах.", "b": false, "n": "10.12.5"}, {"t": "10.12.6 При ведении поезда локомотивами по системе многих единиц электрическое торможение разрешается применять при условии полной исправности электрического тормоза на всех локомотивах, включенных в систему многих единиц.", "b": false, "n": "10.12.6"}, {"t": "10.12.7 Тормозная сила при электрическом торможении не должна превышать максимально допустимой по условиям ограничения сил продольной динамики в поезде устанавливаемая документами владельца инфраструктуры.", "b": false, "n": "10.12.7"}, {"t": "10.12.8 Для предупреждения отключения электрического тормоза во время применения экстренного торможения на электровозах, работающих на спусках крутизной 0,018 и более, шунтируют контакты автоматического выключателя управления на тормозной магистрали. Для предупреждения повреждения колесных пар локомотива необходимо одновременно с применением электрического торможения выпускать воздух из тормозных цилиндров локомотива.", "b": false, "n": "10.12.8"}, {"t": "10.12.9 Если при следовании поезда на электрическом торможении появились признаки возможного нарушения целостности тормозной магистрали (частые включения компрессоров или быстрое снижение давления в главных резервуарах после выключения компрессоров при неработающих приборах пескоподачи и тифонах, резкое замедление движения поезда, не соответствующее влиянию профиля пути, срабатывание датчика контроля состояния тормозной магистрали или самопроизвольное снижение давления в тормозной магистрали), следует перевести на 3 - 10 секунд ручку крана машиниста в положение «Перекрыша без питания» и наблюдать за давлением тормозной магистрали.", "b": false, "n": "10.12.9"}, {"t": "При этом в случае если:", "b": false, "n": ""}, {"t": "- не происходит быстрое и непрерывное снижение давления тормозной магистрали и резкое замедление движения поезда, следует выполнить служебное торможение с разрядкой тормозной магистрали на величину первой ступени, а затем отпустить автотормоза поезда установленным порядком;", "b": false, "n": ""}, {"t": "- происходит быстрое и непрерывное снижение давления в тормозной магистрали или резкое замедление движения поезда, не соответствующее влиянию профиля пути, следует выполнить служебное торможение на величину первой ступени, затем ручку крана машиниста перевести в положение «Перекрыша без питания».", "b": false, "n": ""}, {"t": "По мере снижения скорости, когда по амперметру значение тормозного тока якоря будет близко к нулевому, выключить электрическое торможение и привести в действие вспомогательный тормоз локомотива.", "b": false, "n": ""}, {"t": "На спусках крутизной 0,018 и более довести силу электрического торможения локомотива до максимально допустимого значения, предотвратить наполнение тормозных цилиндров локомотива.", "b": false, "n": ""}, {"t": "10.12.10 При повторном появлении признаков возможного нарушения целостности тормозной магистрали электрическое торможение не применять.", "b": false, "n": "10.12.10"}, {"t": "10.12.11 При следовании в режиме комбинированного торможения после отпуска автоматических тормозов применять вспомогательный тормоз локомотива не требуется.", "b": false, "n": "10.12.11"}, {"t": "10.12.12 Разрешается применять электрическое торможение на локомотивах, находящихся в голове или составе поезда, а также на обоих локомотивах. Места применения электрического торможения и предельные значения токов должны быть отражены в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "10.12.12"}]}, {"id": "tb10_13", "cat": "tm_ctrl", "page": 0, "pages": [], "title": "10.13 Действие локомотивной бригады и особенности управления тормозами поезда при переходе на резервное управление электронным краном машиниста", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 135–136", "paras": [{"t": "10.13.1 Переход на управление автоматическими тормозами поезда от крана резервного управления должен осуществляться при невозможности управления краном машиниста.", "b": false, "n": "10.13.1"}, {"t": "При выходе из строя крана машиниста для перехода на управление тормозами поезда от крана резервного управления машинист должен остановить поезд. После остановки привести в действие кран вспомогательного тормоза локомотива до полного давления в тормозных цилиндрах и установить ручку крана резервного управления в положение «Перекрыша». После этого необходимо осуществить переход в соответствии с руководством по эксплуатации конкретной модели локомотива.", "b": false, "n": ""}, {"t": "10.13.2 Произвести отпуск автоматических тормозов поезда постановкой рукоятки крана резервного управления в отпускное положение.", "b": false, "n": "10.13.2"}, {"t": "10.13.3 Поезд на управлении автоматическими тормозами краном резервного управления должен следовать, как правило, до ближайшей станции или разъезда, где необходимо устранить причины неисправностей для продолжения следования поезда на управлении автоматическими тормозами краном машиниста. При невозможности устранения неисправностей решение о дальнейшем пропуске поезда с управлением автоматическими тормозами краном резервного управления принимается с учетом конкретных условий (профиль пути, вес и длина состава и др.).", "b": false, "n": "10.13.3"}, {"t": "10.13.4 В грузовых поездах с составами длиной более 250 осей при снижении в процессе служебного торможения скорости менее 20 км/ч отпуск производить после полной остановки поезда. На участках где воздухораспределители включены на горный режим работы полный отпуск тормозов выполнять только после остановки поезда.", "b": false, "n": "10.13.4"}, {"t": "10.13.5 Управление тормозами поезда необходимо осуществлять ступенями для соответствующего вида поезда.", "b": false, "n": "10.13.5"}, {"t": "При этом время между торможениями для подзарядки тормозной сети поезда по возможности должно быть не менее 120 секунд (2 минуты).", "b": false, "n": ""}, {"t": "10.13.6 Полный отпуск автоматических тормозов после служебных торможений производить при максимально возможном давлении в главных резервуарах и работающих компрессорах.", "b": false, "n": "10.13.6"}, {"t": "10.13.7 После остановки поезда с применением автоматических тормозов руководствоваться временем с момента перевода ручки крана резервного управления в положение «Отпуск» до приведения локомотива в движение, увеличенным в 1,5 раза по сравнению с величинами, указанным в подпункте р) пункта 10.3.1, подпункте с) пункта 10.3.2, подпункте р) пункта 10.3.3 и пункте 10.4.11 настоящих Правил для грузовых поездов и пунктах 10.8.14 и 10.9.9 настоящих Правил для пассажирских поездов.", "b": false, "n": "10.13.7"}, {"t": "В зимнее время это время должно быть увеличено в 2,5 раза по сравнению с величинами, указанным в указанным в подпункте р) пункта 10.3.1, подпункте с) пункта 10.3.2, подпункте р) пункта 10.3.3 и пункте 10.4.11 настоящих Правил для грузовых поездов и пунктах 10.8.14 и 10.9.9 настоящих Правил для пассажирских поездов.", "b": false, "n": ""}, {"t": "10.13.8 При появлении признаков возможного нарушения целостности тормозной магистрали (частые включения компрессоров или быстрое снижение давления в главных резервуарах после выключения компрессоров при неработающих приборах пескоподачи и тифонах, срабатывание датчика контроля состояния тормозной магистрали, падение давления в тормозной магистрали) необходимо остановить поезд.", "b": false, "n": "10.13.8"}]}, {"id": "tb11", "cat": "tm_mvps", "page": 0, "pages": [], "title": "11 Техническое обслуживание мотор-вагонного подвижного состава", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 136–145", "paras": [{"t": "11.1 Техническое обслуживание тормозного оборудования МВПС производят при всех видах ремонта и технического обслуживания (кроме ТО1) моторвагонного подвижного состава.", "b": false, "n": "11.1"}, {"t": "Выполнение работ по проверке и регулировке тормозного оборудования МВПС при техническом обслуживании (кроме ТО-1) и плановых видах ремонта выполняет ответственный работник, назначенный приказом руководителя предприятия, имеющего право на осуществление данного вида деятельности. Результаты проверки отражаются в соответствующих учетных формах технической документации для каждого вида работ с подписью ответственного работника.", "b": false, "n": ""}, {"t": "Выполнение работ проверяет уполномоченное лицо с записью в журнале технического состояния МВПС установленной формы об исправном состоянии тормозного оборудования", "b": false, "n": ""}, {"t": "11.2 Обслуживание и проверку технического состояния тормозного оборудования при ТО-1 должны выполнять локомотивные бригады во время приемки-сдачи МВПС на путях основного и оборотного депо, в пунктах смены локомотивных бригад на станционных путях, при отстое и экипировке поезда.", "b": false, "n": "11.2"}, {"t": "11.3 По прибытии МВПС из рейса в основное или оборотное депо необходимо в отведенном месте выпустить конденсат из главных резервуаров и влагосборников, продуть питательную и тормозную магистрали путем последовательного открытия с двух сторон концевых кранов.", "b": false, "n": "11.3"}, {"t": "11.4 Запрещается выпускать в эксплуатацию МВПС если имеется хотя бы одна из следующих неисправностей:", "b": false, "n": "11.4"}, {"t": "- неисправный компрессорная установка и аппаратуры его управления;", "b": false, "n": ""}, {"t": "- неисправный: кран машиниста, воздухораспределитель, электровоздухораспределитель, электрическая цепь электропневматического тормоза, концевой или разобщительный кран, выпускной клапан, тормозной цилиндр, резервуары, блок тормозного оборудования, тормозной блок дискового тормоза;", "b": false, "n": ""}, {"t": "- повреждение воздухопроводов: трещины, прорывы, потертости и расслоение соединительных рукавов; трещины, надломы и вмятины на воздухопроводах, неплотность их соединений, ослабление трубопровода в местах крепления;", "b": false, "n": ""}, {"t": "- неисправность механической части: траверс, рычагов, тяг, подвесок, регуляторов тормозной рычажной передачи, башмаков; трещины или изломы в деталях, откол проушины тормозной колодки, неправильное крепление колодки (накладки) в башмаке, а так же неправильное положение колодки (накладки) относительно поверхности катания колесной пары (диска); неисправные или отсутствующие предохранительные устройства, нетиповое крепление, нетиповые детали и шплинты в узлах;", "b": false, "n": ""}, {"t": "- неисправный стояночный (в том числе и ручной) тормоз;", "b": false, "n": ""}, {"t": "- ослабление крепления деталей;", "b": false, "n": ""}, {"t": "- не отрегулированная рычажная передача;", "b": false, "n": ""}, {"t": "- толщина колодок (накладок) менее установленной нормы;", "b": false, "n": ""}, {"t": "- неисправность противоюзного устройства (при наличии);", "b": false, "n": ""}, {"t": "- неисправность электрической цепи (петли) безопасности (при наличии).", "b": false, "n": ""}, {"t": "11.5 Перечень работ, выполняемых при приемке, сдаче и обслуживании моторвагонного подвижного состава", "b": false, "n": "11.5"}, {"t": "11.5.1 При приемке МВПС из ремонтной организации при всех видах ремонта и технического обслуживания (кроме ТО-1) уполномоченным представителем владельца инфраструктуры необходимо удалить конденсат из главных и вспомогательных резервуаров, масловлагоотделителей и проверить:", "b": false, "n": "11.5.1"}, {"t": "- уровень масла (при наличии) в картерах компрессорных установок;", "b": false, "n": ""}, {"t": "- правильность положений ручек разобщительных кранов воздухопроводов;", "b": false, "n": ""}, {"t": "- наличие пломб;", "b": false, "n": ""}, {"t": "- производительность компрессорных установок;", "b": false, "n": ""}, {"t": "- состояние тормозной рычажной передачи;", "b": false, "n": ""}, {"t": "- действие стояночных тормозов;", "b": false, "n": ""}, {"t": "- проходимость воздуха через концевые краны тормозной и питательной магистралей;", "b": false, "n": ""}, {"t": "- наличие пломб на стоп-кранах;", "b": false, "n": ""}, {"t": "- режим включения воздухораспределителя;", "b": false, "n": ""}, {"t": "- пределы поддержания давлений в главных резервуарах при автоматическом возобновлении работы компрессоров и их отключении регулятором;", "b": false, "n": ""}, {"t": "- плотность питательной сети;", "b": false, "n": ""}, {"t": "- плотность тормозной сети;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара крана машиниста;", "b": false, "n": ""}, {"t": "- темп экстренной разрядки через кран машиниста;", "b": false, "n": ""}, {"t": "- проходимость воздуха через блокировочное устройство;", "b": false, "n": ""}, {"t": "- проходимость воздуха через кран машиниста при нахождении ручки крана машиниста в поездном положении;", "b": false, "n": ""}, {"t": "- зарядное давление в тормозной магистрали, которое должно соответствовать пределам, указанным в таблице 5 настоящих Правил; Таблица 5 – Зарядное давление в тормозной магистрали МВПС Зарядное давление, Характеристика поезда МПа (кгс/см2) 1 2 Электропоезда серий ЭР, ЭТ 0,44-0,46 (4,4-4,6) Электропоезда серий ЭД, ЭП 0,46-0,48 (4,6-4,8) Электропоезда ЭС1, ЭС2 в/и (до №044) 0,48-0,50 (4,8-5,0) Электропоезда ЭС1, ЭС2 в/и (с №045), ЭШ2, 0,50-0,52 (5,0-5,2) ЭС104, ЭГ2Тв, ЭГЭ2Тв Дизель-поезд ДДБ, ДТ1 0,44-0,46 (4,4-4,6) Дизель-поезд Д1 0,50-0,53 (5,0-5,3) Дизель-поезда ДР1, ДР1П 0,53-0,56 (5,3-5,6) Дизель-поезда ДР1А, ДР1Б, ДРБ 0,55-0,56 (5,5-5,6) 1 2 Рельсовый автобус РА1, РА2 0,48-0,50 (4,8-5,0) Рельсовый автобус РА3 0,50-0,52 (5,0-5,2) Моторвагонный, кроме электропоездов и дизель-поездов ДДБ, ДТ1, Д1, ДР1, ДР1П, 0,50-0,52 (5,0-5,2) ДР1А, ДР1Б, ДРБ, РА1, РА2, РА3", "b": false, "n": ""}, {"t": "Примечания. При наличии норм зарядного давления в тормозной магистрали, установленных руководством по эксплуатации, согласованное с владельцем инфраструктуры, руководствоваться этими нормами.", "b": false, "n": ""}, {"t": "- работу воздухораспределителей на торможение и отпуск;", "b": false, "n": ""}, {"t": "- работу схемы контроля отпуска тормозов вагонов поезда;", "b": false, "n": ""}, {"t": "- работу схемы контроля тормоза хвостового вагона;", "b": false, "n": ""}, {"t": "- действие электропневматического тормоза;", "b": false, "n": ""}, {"t": "- величины выходов штоков тормозных цилиндров при полном служебном торможении;", "b": false, "n": ""}, {"t": "- состояние и толщину тормозных колодок (накладок);", "b": false, "n": ""}, {"t": "- действие стояночного (ручного) тормоза;", "b": false, "n": ""}, {"t": "- работу электрической цепи (петли) безопасности (при наличии);", "b": false, "n": ""}, {"t": "- работу крана резервного управления (при наличии);", "b": false, "n": ""}, {"t": "- работу противоюзного устройства на всех вагонах (при наличии);", "b": false, "n": ""}, {"t": "- работу системы скоростного регулирования (при наличии);", "b": false, "n": ""}, {"t": "- работу вспомогательного тормоза (при наличии).", "b": false, "n": ""}, {"t": "11.5.2 При приемке МВПС оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском после ТО-1 и после отстоя без бригады необходимо удалить конденсат из главных и вспомогательных резервуаров, масловлагоотделителей и проверить:", "b": false, "n": "11.5.2"}, {"t": "- правильность положений ручек разобщительных кранов воздухопроводов на всех вагонах МВПС;", "b": false, "n": ""}, {"t": "- наличие пломб;", "b": false, "n": ""}, {"t": "- производительность компрессорных установок;", "b": false, "n": ""}, {"t": "- наличие пломбы на разобщительном кране к срывному клапану, который должен находиться в открытом положении;", "b": false, "n": ""}, {"t": "- наличие пломб на стоп-кранах;", "b": false, "n": ""}, {"t": "- плотность тормозной сети;", "b": false, "n": ""}, {"t": "- плотность питательной сети;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара крана машиниста;", "b": false, "n": ""}, {"t": "- зарядное давление в тормозной магистрали, которое должно соответствовать пределам, указанным в таблице 5 настоящих Правил;", "b": false, "n": ""}, {"t": "- работу воздухораспределителей на торможение и отпуск;", "b": false, "n": ""}, {"t": "- работу схемы контроля тормоза хвостового вагона;", "b": false, "n": ""}, {"t": "- действие электропневматического тормоза на возможность ступенчатого торможения и отпуска;", "b": false, "n": ""}, {"t": "- работу электрической цепи (петли) безопасности (при наличии).", "b": false, "n": ""}, {"t": "В зимнее время дополнительно проверить проходимость воздуха через концевые краны тормозной и питательной магистралей путем не менее чем трехкратного продолжительного их открытия при нахождении ручки крана машиниста в поездном положении.", "b": false, "n": ""}, {"t": "Проверку плотности тормозной и питательной сетей, работа воздухораспределителей на торможение и отпуск допускается проводить из одной кабины управления.", "b": false, "n": ""}, {"t": "Допускается при приемке МВПС оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском использовать показания системы диагностики тормозного оборудования, установленного на подвижном составе.", "b": false, "n": ""}, {"t": "Дополнительно проверить работу противоюзного устройства при оборудовании им МВПС.", "b": false, "n": ""}, {"t": "Конкретный порядок приемки тормозного оборудования МВПС устанавливается железнодорожной администрацией владельцем подвижного состава.", "b": false, "n": ""}, {"t": "11.6 Правила проверки и регулировки тормозного оборудования", "b": false, "n": "11.6"}, {"t": "11.6.1 Проверку наличия пломб необходимо проводить на следующем оборудовании: на разъемах блоков систем безопасности, на предохранительных клапанах, на фиксаторах открытого положения разобщительных кранов тормозной магистрали к электропневматическим клапанам автостопа (далее-ЭПК), на разобщительных кранах на питательном воздухопроводе и на воздухопроводе от воздухораспределителя к крану вспомогательного тормоза, на разобщительных кранах питательного воздухопровода к реле давления тормозных цилиндров (тормозных блоков), на разобщительном кране на воздухопроводе от тормозной магистрали к скоростемеру, к датчикам давления (при наличии), на манометрах, визуальный осмотр которых возможен без дополнительной работы.", "b": false, "n": "11.6.1"}, {"t": "11.6.2 При проверке производительности компрессорной установки необходимо замерить время наполнения главных резервуаров, которое должно быть не более, указанного в руководстве эксплуатации конкретной серии локомотива.", "b": false, "n": "11.6.2"}, {"t": "11.6.3 Проходимость воздуха через концевые краны тормозной и питательной магистралей проверяется путем не менее чем трехкратного продолжительного их открытия при нахождении ручки крана машиниста в поездном положении.", "b": false, "n": "11.6.3"}, {"t": "11.6.4 Пределы давлений в главных резервуарах при автоматическом возобновлении работы компрессорных установок и их отключении регулятором в соответствии с руководством по эксплуатации на моторвагонный подвижной состав. Отклонение от нормативного значения пределов давлений допускается ±0,02 МПа (±0,2 кгс/см2).", "b": false, "n": "11.6.4"}, {"t": "11.6.5 Плотность питательной сети проверяется при выключенной компрессорной установке путем измерения в течении 180 секунд (3 минут) величины снижения давления, которое должно быть не более 0,02 МПа (0,2 кгс/см2). Для рельсового автобуса РА-1 снижение давления должно быть не более 0,05 МПа (0,5 кгс/см2) за 600 секунд (10 минут).", "b": false, "n": "11.6.5"}, {"t": "11.6.6 Плотность тормозной сети проверяется при перекрытом разобщительном (комбинированном) кране от тормозной магистрали к крану машиниста путем измерения в течении 150 секунд (2,5 минут) величины снижения давления, которое должно быть не более 0,05 МПа (0,5 кгс/см2).", "b": false, "n": "11.6.6"}, {"t": "11.6.7 Плотность уравнительного резервуара при нахождении ручки крана машиниста в положении «Перекрыша с питанием» должно быть не более 0,01 МПа (0,1 кгс/см2) в течение 180 секунд (3 минут). Завышение давления в уравнительном резервуаре при этом не допускается;", "b": false, "n": "11.6.7"}, {"t": "11.6.8 Темп экстренной разрядки через кран машиниста, который должен быть не более 3 секунд при положении ручки крана машиниста в положении экстренного торможения. Замеряется время снижения давления в тормозной магистрали с 0,5 до 0,25 МПа (5,0 до 2,5 кгс/см2) которое должно быть не более 3 секунд.", "b": false, "n": "11.6.8"}, {"t": "11.6.9 Проходимость воздуха через блокировочное устройство проверяется при нахождении ручки крана машиниста в положении, обеспечивающем повышение давления в тормозной магистрали выше зарядного, и открытом концевом кране тормозной магистрали со стороны рабочей кабины. Проверку следует производить при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2) и выключенных компрессорных установках по времени снижения давления в главных резервуарах объемом 1000 л с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см2), которое должно быть в пределах 9 - 12 секунд. При большем объеме главных резервуаров время должно быть пропорционально увеличено;", "b": false, "n": "11.6.9"}, {"t": "11.6.10 Проходимость воздуха через кран машиниста при нахождении ручки крана машиниста в поездном положении и открытом концевом кране тормозной магистрали со стороны рабочей кабины, должно быть 16 - 20 секунд. Проверка должна осуществляться при начальном давлении в главных резервуарах не менее 0,80 МПа (8,0 кгс/см2), выключенных компрессорах и в диапазоне снижения давления в главных резервуарах объемом 1000 л с 0,60 до 0,50 МПа (с 6,0 до 5,0 кгс/см2). При большем объеме главных резервуаров локомотива время должно быть пропорционально увеличено.", "b": false, "n": "11.6.10"}, {"t": "11.6.11 Проверку воздухораспределителей на торможение и отпуск выполняют путем снижения давления в уравнительном резервуаре с зарядного давления на 0,05-0,06 МПа (0,5-0,6 кгс/см2). При этом воздухораспределители должны сработать и не давать самопроизвольного отпуска в течение 300 секунд (5 минут). После торможения убедиться штоки поршней вышли из тормозных цилиндров, а тормозные колодки (накладки) прижаты к колесам (тормозным дискам). После окончания проверки необходимо поставить ручку крана машиниста в поездное положение, при котором тормоз должен отпустить, а колодки (накладки) должны отойти от колес (тормозных дисков). На МВПС, оборудованном тормозными блоками, проверку действие на торможение и отпуск автоматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне", "b": false, "n": "11.6.11"}, {"t": "11.6.12 Работу схемы контроля тормоза хвостового вагона проверяют полной зарядки тормозной системы поезда и выключенном электропневматическом тормозе путем снижения давление в тормозной магистрали на величину 0,05-0,06 МПа (0,5-0,6 кгс/см2). При этом автоматические тормоза должны прийти в действие, а на пульте машиниста подаваться световые сигналы, контролирующие срабатывание тормозов на вагонах поезда и на хвостовом вагоне.", "b": false, "n": "11.6.12"}, {"t": "Затем необходимо отпустить тормоз только у хвостового вагона. При этом световой сигнал контроля срабатывания тормозов на хвостовом вагоне должен погаснуть.", "b": false, "n": ""}, {"t": "После этого произвести отпуск тормоза поезда. Отключение светового сигнала контроля срабатывания тормозов на пульте машиниста, покажет исправность данной системы.", "b": false, "n": ""}, {"t": "11.6.13 Действие электропневматического тормоза на возможность ступенчатого торможения до полного наполнения тормозных цилиндров (тормозных блоков) и последующего ступенчатого отпуска до полного выпуска воздуха из них. Должно быть выполнено не менее 3 ступеней торможения и 3 ступеней отпуска.", "b": false, "n": "11.6.13"}, {"t": "11.6.14 На МВПС, оборудованном отдельным устройством управления электропневматическим тормозом, его действие проверять при поездном положении ручки крана машиниста.", "b": false, "n": "11.6.14"}, {"t": "11.6.15 На МВПС, оборудованном тормозными блоками, проверку действие на торможение и отпуск электропневматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне", "b": false, "n": "11.6.15"}, {"t": "11.6.16 Выхода штоков тормозных цилиндров при полном служебном торможении должны быть в пределах, указанных в таблице 6.", "b": false, "n": "11.6.16"}, {"t": "Таблица 6 - Выход штока тормозного цилиндра на МВПС при полном служебном торможении Выход штока тормозного цилиндра, мм Нормы Максимально Вид подвижного состава нижнего и допустимый верхнего в пределов эксплуатации 1 2 3 Вагоны электропоездов ЭР2, ЭР9, ЭР9П", "b": false, "n": ""}, {"t": "- моторные 50–75 100", "b": false, "n": ""}, {"t": "- головные и прицепные 75–100 125 Головные, прицепные и моторные вагоны электропоездов ЭР2Т, ЭР2Р, ЭТ2 всех индексов, ЭД2Т, ЭД9 всех индексов, ЭД4 всех 50–75 100 индексов, ЭП2 всех индексов, ЭП3 всех индексовАЯ4Д Вагоны электропоездов остальных серий:", "b": false, "n": ""}, {"t": "- моторные 75–100 130", "b": false, "n": ""}, {"t": "- головные и прицепные 100–125 150 Рельсовые автобусы РА-1, РА-2 25-30 35 Рельсовый автобус РА-3** 4-6 7 Моторные и прицепные вагоны дизельпоездов:", "b": false, "n": ""}, {"t": "- с дисковыми тормозами 5–8 25*", "b": false, "n": ""}, {"t": "- с колодочными тормозами 125–140 150", "b": false, "n": ""}, {"t": "- прицепные вагоны ДДБ 55-65 75 Дизель-поезд АЧ2", "b": false, "n": ""}, {"t": "- моторный вагон 30-50 60", "b": false, "n": ""}, {"t": "- прицепной вагон 95-105 120 * В зимний период 12 мм;", "b": false, "n": ""}, {"t": "** по отходу колодки от поверхности катания.", "b": false, "n": ""}, {"t": "Примечания. 1 Выход штоков тормозных цилиндров электропоездов при ступени торможения принимать менее указанного на 30% при расположении тормозных цилиндров на кузове вагона и на 20% при расположении тормозных цилиндров на тележке.", "b": false, "n": ""}, {"t": "2 При наличии норм выходов штоков, установленных руководством по эксплуатации, согласованным с владельцем инфраструктуры, руководствоваться этими нормами. Максимальный допускаемый в эксплуатации выход штока устанавливать на 25% больше, чем верхний предел.", "b": false, "n": ""}, {"t": "3 При выпуске моторвагонного подвижного состава после ремонта и технического обслуживания (кроме ТО-1) рычажная передача должна быть отрегулирована с обеспечением минимально допускаемой нормы выхода штока. При оборудовании МВПС тормозными блоками выход их штоков должен соответствовать требованиям, указанным в руководстве по эксплуатации, согласованным с владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "При оборудовании МВПС дисковыми тормозами зазор между накладкой и тормозным диском должен быть в пределах от 2 до 6 мм, если иное не указано в руководстве по эксплуатации конкретной модели подвижного состава.", "b": false, "n": ""}, {"t": "11.6.17 Проверка состояния и толщин тормозных колодок (накладок). Минимальная толщина тормозных колодок, при которой они подлежат замене: чугунных тормозных колодок – 12 мм, композиционных – 14 мм, для рельсовых автобусов – 10 мм (колодки с сетчато-проволочным каркасом определяются по заполненному фрикционной массой ушку).", "b": false, "n": "11.6.17"}, {"t": "Выход тормозных колодок за наружную грань поверхности катания бандажа (обода колеса) в эксплуатации не допускается.", "b": false, "n": ""}, {"t": "Прижатие тормозной колодки к поверхности катания колеса при отпущенном состоянии тормоза не допускается.", "b": false, "n": ""}, {"t": "Колодки заменять при достижении предельной толщины, наличии по всей ширине колодки трещин, распространяющихся до стального каркаса, при клиновидном износе, если наименьшая допускаемая толщина находится от тонкого торца колодки на расстоянии 50 мм и более.", "b": false, "n": ""}, {"t": "Металлокерамические накладки толщиной 13 мм и менее и композиционные накладки толщиной 5 мм и менее по наружному радиусу накладок подлежат замене. Толщину накладки следует проверять в верхней и нижней части накладки в держателе накладки. Допускается разница толщин между верхней и нижней частью накладки в держателе накладки не более 3 мм.", "b": false, "n": ""}, {"t": "11.6.18 Проверку работы вспомогательного тормоза (при наличии) проводят на предельное давление в тормозных цилиндрах при полном торможении, которое должно быть в пределах, установленных в руководстве по эксплуатации конкретного типа подвижного состава, согласованное с владельцем инфраструктуры.", "b": false, "n": "11.6.18"}, {"t": "11.6.19 Для проверки работы системы скоростного регулирования необходимо выполнить экстренное торможение. После достижения в тормозных цилиндрах (тормозных блоках) локомотива максимального давления необходимо запустить программу проверки в каждой секции, при работе которой давление в тормозных цилиндрах (тормозных блоках) должно измениться до величины, указанной в руководстве по эксплуатации конкретного локомотива, согласованного владельцем инфраструктуры.", "b": false, "n": "11.6.19"}, {"t": "11.6.20 Для проверки работы противоюзного устройства необходимо выполнить полное служебное торможение. После достижения в тормозных цилиндрах (тормозных блоках) максимального давления необходимо запустить программу проверки, которая не должна по своему окончанию выдать ошибку работы данной системы.", "b": false, "n": "11.6.20"}, {"t": "11.7 Порядок проверки тормозного оборудования конкретной модели МВПС должен быть указан в технико-распорядительных документах владельца подвижного состава.", "b": false, "n": "11.7"}, {"t": "11.8 Требования по проверке тормозного оборудования МВПС с воздухораспределителями пассажирского типа со ступенчатым отпуском должны быть указаны в документе владельца подвижного состава, согласованном владельцем инфраструктуры.", "b": false, "n": "11.8"}]}, {"id": "tb12", "cat": "tm_mvps", "page": 0, "pages": [], "title": "12 Порядок смены кабин управления моторвагонного поезда", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 145–146", "paras": [{"t": "12.1 В оставляемой кабине управления машинист должен:", "b": false, "n": "12.1"}, {"t": "а) На МВПС, не оборудованным единым органом включения/выключения подвижного состава:", "b": false, "n": ""}, {"t": "- отключить источник питания электропневматического тормоза;", "b": false, "n": ""}, {"t": "- ручку крана машиниста перевести в положение служебного торможения и снизить давление в уравнительном резервуаре на величину 0,150,17 МПа (1,5-1,7 кгс/см2), а на рельсовом автобусе РА-1 в положение служебного торможения. Затем (кроме РА-1) перевести ручку крана машиниста в положение, не обеспечивающее поддержание заданного давления в тормозной магистрали после торможения;", "b": false, "n": ""}, {"t": "- после разрядки тормозной магистрали до заданного давления перекрыть разобщительные краны на питательной и тормозной магистралях;", "b": false, "n": ""}, {"t": "- ручку крана машиниста установить в положение экстренного торможения (на рельсовом автобусе РА-2 в положение полного служебного торможения, а на электропоездах, оборудованных краном машиниста №334Э в отпускное положение);", "b": false, "n": ""}, {"t": "- ручку крана вспомогательного тормоза (при наличии) перевести в последнее тормозное положение, и после установления в тормозных цилиндрах полного давления перекрыть разобщительный кран на воздухопроводе от крана вспомогательного тормоза к тормозным цилиндрам. Убедиться в отсутствии недопустимого снижения давления в тормозных цилиндрах (допускается снижение давления в тормозных цилиндрах не более 0,02 МПа (0,2 кгс/см2) в течение 60 секунд);", "b": false, "n": ""}, {"t": "- при наличии устройства управления автоматическим тормозом через приставку крана машиниста поставить его ручку в экстренное торможение.", "b": false, "n": ""}, {"t": "- привести в действие автоматический стояночный тормоз (при наличии);", "b": false, "n": ""}, {"t": "- переключить переключатель управления в положение для хвостовой кабины.", "b": false, "n": ""}, {"t": "б) На МВПС, оборудованным единым органом включения/выключения подвижного состава:", "b": false, "n": ""}, {"t": "- выключить электропневматический клапан автостопного торможения;", "b": false, "n": ""}, {"t": "- привести в действие автоматический стояночный тормоз;", "b": false, "n": ""}, {"t": "- повернуть органом включения/выключения подвижного состава в положение «Выключено».", "b": false, "n": ""}, {"t": "12.2 В вводимой кабине управления машинист должен:", "b": false, "n": "12.2"}, {"t": "а) На МВПС, не оборудованным единым органом включения/выключения подвижного состава:", "b": false, "n": ""}, {"t": "- переключить переключатель управления в положение для головной кабины;", "b": false, "n": ""}, {"t": "- открыть разобщительный кран на воздухопроводе от крана вспомогательного тормоза к тормозным цилиндрам (при наличии);", "b": false, "n": ""}, {"t": "- ручку крана машиниста перевести из положения экстренного торможения в поездное положение;", "b": false, "n": ""}, {"t": "- открыть разобщительные краны на питательной магистрали и произвести зарядку уравнительного резервуара (при наличии) до зарядного давления;", "b": false, "n": ""}, {"t": "- открыть разобщительный кран на тормозной магистрали и зарядить тормозную магистраль до зарядного давления;", "b": false, "n": ""}, {"t": "- выключить автоматический стояночный тормоз (при наличии);", "b": false, "n": ""}, {"t": "- включить источник питания электропневматических тормозов.", "b": false, "n": ""}, {"t": "б) На МВПС, оборудованным единым органом включения/выключения подвижного состава:", "b": false, "n": ""}, {"t": "- повернуть органом включения/выключения подвижного состава в положение «Включено»;", "b": false, "n": ""}, {"t": "- зарядить тормозную магистраль;", "b": false, "n": ""}, {"t": "- выключить автоматический стояночный тормоз;", "b": false, "n": ""}, {"t": "- включить электропневматический клапан автостопного торможения.", "b": false, "n": ""}]}, {"id": "tb13", "cat": "tm_mvps", "page": 0, "pages": [], "title": "13 Опробование тормозов моторвагонного подвижного состава", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 146–150", "paras": [{"t": "13.1 Установлены следующие виды опробования: полное и сокращенное.", "b": false, "n": "13.1"}, {"t": "13.2 Полное опробование тормозов МВПС производят локомотивные бригады после ремонта и технического обслуживания и после отстоя без бригады.", "b": false, "n": "13.2"}, {"t": "13.3 При полном опробовании тормозов МВПС оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском из одной кабины управления проверяют:", "b": false, "n": "13.3"}, {"t": "- плотность питательной сети. Снижение давления, замеряемое по питательной магистрали должно быть не более 0,02 МПа (0,2 кгс/см2) за 180 секунд (3,0 минуты);", "b": false, "n": ""}, {"t": "- плотность тормозной сети. Снижение давления, замеряемое по тормозной магистрали, должно быть не более 0,05 МПа (0,5 кгс/см2) в течение 150 секунд (2,5 минуты);", "b": false, "n": ""}, {"t": "- производительность его компрессорных установок по времени наполнения главных резервуаров. При этом потребители сжатого воздуха (кроме тормозного оборудования, прислонно-сдвижных дверей, когда их постоянное питание, предусмотрено конструкцией МВПС) должны быть отключены;", "b": false, "n": ""}, {"t": "- срабатывание воздухораспределителей на торможение и отпуск у каждого вагона. Проверку необходимо выполнять снижением давления в уравнительном резервуаре с зарядного давления на 0,05-0,06 МПа (0,5-0,6 кгс/см2) с последующей постановкой ручки крана машиниста в положение «Перекрыша с питанием». При этом воздухораспределители должны сработать и не давать самопроизвольного отпуска в течение 300 секунд (5 минут). После торможения убедиться в том, что тормозные колодки (накладки) прижаты к колесам (тормозным дискам) на каждом вагоне. После окончания проверки необходимо поставить ручку крана машиниста в поездное положение, при котором тормоз должен отпустить, а колодки (накладки) должны отойти от колес (тормозных дисков) на каждом вагоне.", "b": false, "n": ""}, {"t": "На МВПС, оборудованном тормозными блоками, проверку действие на торможение и отпуск автоматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне.", "b": false, "n": ""}, {"t": "Кроме того, из обеих кабин управления проверяется:", "b": false, "n": ""}, {"t": "- зарядное давление в тормозной магистрали, которое должно соответствовать пределам, указанным в таблице 5 настоящих Правил;", "b": false, "n": ""}, {"t": "- плотность уравнительного резервуара. Плотность уравнительного резервуара при нахождении ручки крана машиниста в положении «Перекрыша с питанием» должно быть не более 0,01 МПа (0,1 кгс/см2) в течение 180 секунд (3 минут). Завышение давления в уравнительном резервуаре при этом не допускается;", "b": false, "n": ""}, {"t": "- действие электропневматического тормоза на возможность ступенчатого торможения до полного наполнения тормозных цилиндров (тормозных блоков) и последующего ступенчатого отпуска до полного выпуска воздуха из тормозных цилиндров (тормозных блоков) каждого вагона.", "b": false, "n": ""}, {"t": "На МВПС, оборудованном отдельным устройством управления электропневматическим тормозом, его действие проверять при поездном положении ручки крана машиниста.", "b": false, "n": ""}, {"t": "После торможения убедиться в том, что тормозные колодки (накладки) прижаты к колесам (тормозным дискам) на каждом вагоне.", "b": false, "n": ""}, {"t": "На МВПС, оборудованном тормозными блоками, проверку действие на торможение и отпуск электропневматических тормозов допускается проверять по показаниям манометров и сигнализаторов торможения, расположенных на боковых стенах вагонов в видимой зоне;", "b": false, "n": ""}, {"t": "- работа световой индикации работы электропневматического тормоза.", "b": false, "n": ""}, {"t": "На МВПС, оборудованном отдельным устройством управления электропневматическим тормозом, его действие на возможность ступенчатого торможения и отпуска проверять при поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "- работа системы контроля тормоза хвостового вагона. После полной зарядки тормозной системы поезда необходимо снизить давление в тормозной магистрали на величину 0,05-0,06 МПа (0,5-0,6 кгс/см2). При этом автоматические тормоза должны прийти в действие, а на пульте машиниста подаваться световые сигналы, контролирующие срабатывание тормозов на вагонах поезда и на хвостовом вагоне. После этого произвести отпуск тормоза поезда. Отключение светового сигнала, контролирующего заторможенность данного хвостового вагона, на пульте машиниста, покажет исправность данной системы;", "b": false, "n": ""}, {"t": "- состояние и толщину тормозных колодок (накладок). Минимальная толщина тормозных колодок, при которой они подлежат замене: чугунных тормозных колодок – 12 мм, композиционных – 14 мм, для рельсовых автобусов – 10 мм (колодки с сетчато-проволочным каркасом определяются по заполненному фрикционной массой ушку).", "b": false, "n": ""}, {"t": "Выход тормозных колодок за наружную грань поверхности катания бандажа (обода колеса) в эксплуатации не допускается.", "b": false, "n": ""}, {"t": "Прижатие тормозной колодки к поверхности катания колеса при отпущенном состоянии тормоза не допускается.", "b": false, "n": ""}, {"t": "Металлокерамические накладки толщиной 13 мм и менее и композиционные накладки толщиной 5 мм и менее по наружному радиусу накладок подлежат замене. Толщину накладки следует проверять в верхней и нижней части накладки в держателе накладки. Допускается разница толщин между верхней и нижней частью накладки в держателе накладки не более 3 мм.", "b": false, "n": ""}, {"t": "Дополнительно необходимо проверить работу противоюзного устройства при оборудовании им МВПС.", "b": false, "n": ""}, {"t": "13.4 Требования по проведению полного опробования тормозов МВПС оборудованного воздухораспределителями пассажирского типа со ступенчатым отпуском должны быть указаны в документе владельца подвижного состава, согласованном владельцем инфраструктуры.", "b": false, "n": "13.4"}, {"t": "13.5 После каждого полного опробования тормозов в журнале технического состояния МВПС машинист вносит запись с обязательным указанием:", "b": false, "n": "13.5"}, {"t": "- даты, время и места проведения полного опробования тормозов;", "b": false, "n": ""}, {"t": "- работоспособность системы контроля состояния тормоза хвостового вагона;", "b": false, "n": ""}, {"t": "- фамилии и подписи машиниста и помощника машиниста.", "b": false, "n": ""}, {"t": "- пределы давления в главных резервуарах, поддерживаемого регулятором давления, а также давление в тормозной магистрали при поездном положении ручки крана машиниста;", "b": false, "n": ""}, {"t": "- плотность тормозной сети поезда (величину утечки воздуха из тормозной магистрали);", "b": false, "n": ""}, {"t": "- производительность компрессных установок.", "b": false, "n": ""}, {"t": "Конкретный порядок выполнения полного опробования тормозов должен быть указан в технико-распорядительном документе владельца инфраструктуры.", "b": false, "n": ""}, {"t": "13.6 Сокращенное опробование автотормозов МВПС производят:", "b": false, "n": "13.6"}, {"t": "- после перемены кабины управления;", "b": false, "n": ""}, {"t": "- после всякого разъединения рукавов или перекрытия концевых кранов в поезде;", "b": false, "n": ""}, {"t": "- после соединения/разъединения сдвоенного МВПС;", "b": false, "n": ""}, {"t": "- после стоянки поезда более 1800 секунд (30 минут);", "b": false, "n": ""}, {"t": "- после смены локомотивных бригад;", "b": false, "n": ""}, {"t": "- в случае снижении давления в главных резервуарах ниже зарядного давления.", "b": false, "n": ""}, {"t": "13.7 Сокращенное опробование электропневматических тормозов производить:", "b": false, "n": "13.7"}, {"t": "- после перемены кабины управления;", "b": false, "n": ""}, {"t": "- после всякого соединения/разъединения электрической цепи электропневматического тормоза;", "b": false, "n": ""}, {"t": "- после смены локомотивных бригад.", "b": false, "n": ""}, {"t": "13.8 При сокращенном опробовании МВПС, оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском проверяют состояние тормозной магистрали по изменению давления в тормозном цилиндре (тормозном блоке) хвостового вагона. Допускается проводить сокращенное опробование тормозов по показанию системы контроля состояния тормоза хвостового вагона при выполнении торможения и отпуска при условии наличия записи о ее работоспособности в журнале технического состояния МВПС или по показанию давлений в тормозных цилиндрах (тормозных блоках) поезда системами управления поезда, предусмотренных их конструкцией.", "b": false, "n": "13.8"}, {"t": "При сокращенном опробовании тормозов сначала проверяют электропневматические, а затем автоматические тормоза.", "b": false, "n": ""}, {"t": "13.9 Требования по проведению сокращенного опробования тормозов МВПС оборудованного воздухораспределителями пассажирского типа со ступенчатым отпуском должны быть указаны в документе владельца подвижного состава, согласованном владельцем инфраструктуры.", "b": false, "n": "13.9"}]}, {"id": "tb14", "cat": "tm_mvps", "page": 0, "pages": [], "title": "14 Обслуживание тормозов моторвагонного подвижного состава и управление ими в пути следования", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 150–160", "paras": [{"t": "14.1 Действие тормозов в пути следования МВПС проверять:", "b": false, "n": "14.1"}, {"t": "- после полного или сокращенного опробования тормозов;", "b": false, "n": ""}, {"t": "- после выключения автотормозов у отдельных вагонов;", "b": false, "n": ""}, {"t": "- при переходе с электропневматических тормозов на автоматические;", "b": false, "n": ""}, {"t": "- при переходе на управление краном резервного управления;", "b": false, "n": ""}, {"t": "- на перегоне перед станциями (конечными станциями прибытия поезда) имеющими тупиковые пути.", "b": false, "n": ""}, {"t": "14.2 В МВПС в пути следования сначала проверять действие автоматического тормоза, а затем электропневматического тормоза.", "b": false, "n": "14.2"}, {"t": "14.2.1 Для проверки действия тормозов МВПС в пути следования разрешается использовать:", "b": false, "n": "14.2.1"}, {"t": "- торможение, применяемое при подходе к первой от пункта отправления платформе, у которой расписанием движения поездов предусмотрена остановка;", "b": false, "n": ""}, {"t": "- торможения до подхода к первой платформе, определённые в техникораспорядительных документах владельца инфраструктуры ведения поезда, или выполняемые при подходе к сигналу или месту, требующему уменьшения скорости движения.", "b": false, "n": ""}, {"t": "14.2.2 Для МВПС, не имеющих остановки у первой от пункта отправления платформы действие тормозов проводить в установленном месте в соответствии с технико-распорядительными документами владельца инфраструктуры.", "b": false, "n": "14.2.2"}, {"t": "14.2.3 Места и скорости движения, а также расстояния, на которых должно происходить снижение скорости при проверке действия тормозов в пути следования, указываются в организационно-распорядительных документах, утвержденных владельцем инфраструктуры", "b": false, "n": "14.2.3"}, {"t": "14.2.4 После появления тормозного эффекта и снижения скорости на 10 км/ч произвести отпуск тормозов. Указанное снижение скорости должно происходить на расстоянии, не превышающем норм, установленных в технико-распорядительных документах владельца инфраструктуры.", "b": false, "n": "14.2.4"}, {"t": "14.2.5 Отпуск тормозов после проверки их в пути следования производить только после того, как машинист убедится в их нормальном действии.", "b": false, "n": "14.2.5"}, {"t": "14.2.6 Если после первой ступени торможения начальный эффект не будет получен в течение 10 секунд, немедленно произвести экстренное торможение и принять все меры к остановке поезда, а на МВПС, оборудованном вспомогательным тормозом, поставить ручку вспомогательного тормоза в последнее тормозное положение.", "b": false, "n": "14.2.6"}, {"t": "14.3 При проведении маневровых передвижений после полного и сокращённого опробования тормозов проверка действия автоматических тормозов МВПС выполняется по достижению скорости движения не более 3-7 км/ч непосредственно после начала движения до полной остановки поезда.", "b": false, "n": "14.3"}, {"t": "14.4 МВПС, оборудованный электрическим, (гидродинамическим) тормозом, должны эксплуатироваться с обязательным использованием этих тормозов. Режимы торможения и места применения электрического (гидродинамического) тормоза должны быть указаны в техникораспорядительных документах владельца инфраструктуры.", "b": false, "n": "14.4"}, {"t": "14.5 При следовании на запрещающий сигнал и подъезде к тупиковой призме категорически запрещается применение электрического или гидродинамического тормоза при отсутствии замещения его автоматическим или электропневматическим тормозами.", "b": false, "n": "14.5"}, {"t": "14.6 Запрещается в головных рабочих кабинах МВПС во время стоянок на станции, а также в пути следования перекрывать разобщительный кран на питательной магистрали или на тормозной магистрали, за исключением следующих случаев: при проверке плотности тормозной сети; при ремонте крана машиниста (на стоянке); при отпуске автотормозов в МВПС длиной менее 5 вагонов после экстренного торможения. МВПС в данном случае должен находиться в заторможенном состоянии или закреплен штатными средствами или автоматическим стояночным тормозом от самопроизвольного движения.", "b": false, "n": "14.6"}, {"t": "14.7 При подходе к станции, запрещающему сигналу, тупиковой призме и сигналу или месту уменьшения скорости, остановки поезда необходимо заблаговременно привести в действие тормоза и снизить скорость поезда так, чтобы не допустить проезда установленного места остановки на станции или перегоне, запрещающего сигнала, тупиковой призмы, предельного столбика, а сигнал или место уменьшения скорости и проследовать со скоростью, установленной для данного места.", "b": false, "n": "14.7"}, {"t": "14.8 Скорость следования при движении к запрещающему сигналу не должна превышать 20 км/ч не менее чем за 400 м до запрещающего сигнала.", "b": false, "n": "14.8"}, {"t": "Для МВПС, оборудованного устройствами, обеспечивающими контроль допустимой скорости движения в зависимости от расстояния до светофора и эффективности тормозных средств, скорость следования при движении к запрещающему сигналу должна быть установлена владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "14.9 Экстренное торможение во всех поездах и на любом профиле пути применять, когда требуется немедленная остановка поезда. Выполняется оно краном машиниста, контроллером тяги/торможения, кнопкой аварийноэкстренного торможения, краном резервного управления, стоп-краном, а также с помощью электропневматического клапана автостопа.", "b": false, "n": "14.9"}, {"t": "14.10 После применения экстренного торможения в движении необходимо выключить тягу и привести в действие систему пескоподачи (при наличии), а при скорости движения 8-10 км/ч необходимо прекратить работу системы пескоподачи.", "b": false, "n": "14.10"}, {"t": "14.11 В движении при разрыве тормозной магистрали, срабатывании электропневматического клапана автостопа машинист обязан перевести ручку крана машиниста в положение экстренного торможения.", "b": false, "n": "14.11"}, {"t": "14.12 В движении при открытии стоп-крана, напрямую воздействующего на тормозную магистраль, машинист обязан применить экстренное торможение до полной остановки МВПС.", "b": false, "n": "14.12"}, {"t": "При открытии стоп-крана, не воздействующего напрямую на тормозную магистраль, машинист обязан:", "b": false, "n": ""}, {"t": "- при скорости движения 15 км/ч и менее применить экстренное торможение до полной остановки;", "b": false, "n": ""}, {"t": "- при скорости более 15 км/ч в случае получения информации о включении пассажирского «Стоп-крана» в поезде машинист может в течение определенного времени блокировать его действие или применить экстренное торможение в зависимости от поездной обстановки. После выяснения причины включения пассажирского «Стоп-крана» (в случае его блокирования) машинист принимает решение об остановке поезда или восстановлении штатного положения пассажирского «Стоп-крана» и дальнейшего продолжения движения. Блокирование действия пассажирского «Стоп-крана» машинист имеет право только на высоких насыпях, мостах, виадуках, тоннелях (не далее чем 100 метров от входа и выхода из тоннеля), в пределах границ воздушных промежутков опор контактной сети или щитов, установленных на границах воздушных промежутков, а также в случаях угрожающих безопасности движения или жизни и здоровью людей.", "b": false, "n": ""}, {"t": "В любом случае, машинисту запрещается оставлять не выясненной причину включения (активации) пассажирского «Стоп-крана».", "b": false, "n": ""}, {"t": "14.13 Время с момента перевода ручки крана машиниста в положение отпуска до приведения в движение МВПС после экстренного торможения, не оборудованного или с неисправной системой контроля состояния тормоза хвостового вагона (системой контроля состояния тормозов вагонов), должно быть не менее 60 секунд (в зависимости от типа крана машиниста и количества единиц подвижного состава в поезде устанавливается руководством по эксплуатации конкретного типа подвижного состава).", "b": false, "n": "14.13"}, {"t": "14.14 Машинист и помощник машиниста обязаны наблюдать за работой тормозов в поезде в течение всего рейса контролируя поддержание установленного зарядного давления в тормозной магистрали, не допуская её истощения и перезарядки в соответствии с таблицей 5.", "b": false, "n": "14.14"}, {"t": "14.15 В случае обнаружения искрения в составе поезда при отпущенных тормозах остановить поезд служебным торможением для проверки состава поезда и устранения неисправности, вызвавшей искрение.", "b": false, "n": "14.15"}, {"t": "14.16 При необходимости отпустить вручную тормоз и выключить воздухораспределитель у неисправного вагона МВПС, убедиться в полном выпуске воздуха из запасного резервуара и открыть его кран.", "b": false, "n": "14.16"}, {"t": "14.17 Для обнаружения ползунов (выбоин) тщательно осмотреть поверхности катания колес, при необходимости произвести протяжку состава.", "b": false, "n": "14.17"}, {"t": "14.18 О выключении тормоза машинист должен сделать соответствующую отметку в журнале технического состояния МВПС установленной формы.", "b": false, "n": "14.18"}, {"t": "Скорость следования МВПС при наличии ползунов (выбоин) указана в Правилах технической эксплуатации железных дорог железнодорожной администрации.", "b": false, "n": ""}, {"t": "14.19 В случае обнаружения отказа автотормозов (при отсутствии тормозного эффекта в течении 10 секунд) необходимо произвести экстренное торможение и принять меры к остановке поезда. При невозможности остановить поезд – подавать сигнал общей тревоги и по поездной радиосвязи, немедленно сообщить дежурному впереди находящейся станции или диспетчеру о случившемся, чтобы они могли принять меры к свободному приему поезда на станцию или пропуску поезда через станцию, а также машинистам поездов, находящихся на перегоне.", "b": false, "n": "14.19"}, {"t": "После остановки поезда выяснить причину неудовлетворительной работы тормозов. Если устранить неисправность или восстановить действие тормозов на месте невозможно, то дальнейшее управление тормозами поезда производить в соответствии c технико - распорядительными документами владельца инфраструктуры.", "b": false, "n": ""}, {"t": "14.20 Управление автоматическими тормозами моторвагонного подвижного состава", "b": false, "n": "14.20"}, {"t": "14.20.1 Проверку действия автоматических тормозов в пути следования производить снижением давления в уравнительном резервуаре на величину 0,05-0,06 МПа (0,5 - 0,6 кгс/см2), установленную для опробования тормозов, с последующей постановкой ручки крана машиниста в положение поддержания в тормозной магистрали давления после торможения независимо от утечек сжатого воздуха из тормозной магистрали.", "b": false, "n": "14.20.1"}, {"t": "Для рельсового автобуса РА-1 проверку действия автоматического тормоза производить на величину ступени торможения постановкой ручки крана машиниста в тормозное положение, обеспечивающее снижение давления в тормозной магистрали до 0,43 МПа (4,3 кгс/см2).", "b": false, "n": ""}, {"t": "14.20.2 В рабочей кабине ручка крана машиниста должна находиться в поездном положении.", "b": false, "n": "14.20.2"}, {"t": "14.20.3 Для служебного торможения в пути следования ручку крана машиниста перевести из поездного положения в положение служебного торможения и снизить давление в уравнительном резервуаре от установленного зарядного давления при первой ступени на 0,03 - 0,06 МПа (0,3-0,6 кгс/см2), независимо от длины поезда.", "b": false, "n": "14.20.3"}, {"t": "После снижения давления в уравнительном резервуаре на требуемую величину перевести ручку крана машиниста в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения.", "b": false, "n": ""}, {"t": "В случае необходимости следующую ступень торможения выполнять после того, как закончится выпуск воздуха из магистрали через кран машиниста.", "b": false, "n": ""}, {"t": "Для служебного торможения рельсового автобуса РА-1 перевести ручку крана машиниста из поездного положения в тормозное положение с фиксированным давлением в тормозной магистрали 0,42 МПа (4,3 кгс/см2) и далее вплоть до положения полного служебного торможения. Подход к месту остановки рельсового автобуса регулировать ступенчатым торможением и отпуском. Стоянка автобуса осуществляется при постановке ручки крана машиниста в тормозное положение с фиксированным давлением в тормозной магистрали 0,42 МПа (4,3 кгс/см2). Отпуск тормоза производить после набора тяговой позиции силового модуля.", "b": false, "n": ""}, {"t": "14.20.4 Во избежание повреждения колёсных пар избегать глубоких разрядок тормозной магистрали при скоростях движения менее 20 км/ч.", "b": false, "n": "14.20.4"}, {"t": "14.20.5 При подходе к запрещающим сигналам, остановкам на станциях и у остановочных платформ после прекращения выпуска воздуха из тормозной магистрали через кран машиниста перевести его ручку в положение не обеспечивающее восстановление утечек сжатого воздуха из тормозной магистрали после торможения", "b": false, "n": "14.20.5"}, {"t": "14.20.6 Полное служебное торможение в один прием выполнять снижением давления в уравнительном резервуаре на величину 0,15-0,17 МПа (1,5-1,7 кгс/см2). Этот вид торможения применять при необходимости остановки поезда или снижения его скорости на более коротком расстоянии, чем при выполнении ступенчатого торможения.", "b": false, "n": "14.20.6"}, {"t": "14.20.7 Экстренное торможение выполнять переводом ручки крана машиниста из поездного положения в положение экстренного торможения. Запрещено прерывать начавшееся экстренное торможение до полной остановки поезда. Дальнейшее следование поезда разрешается только после устранения причин, вызвавших остановку поезда, отпуска и зарядки тормозов.", "b": false, "n": "14.20.7"}, {"t": "14.20.8 Во избежание истощения автотормозов и, как следствие, уменьшения тормозного эффекта не производить частых торможений без подзарядки тормозной магистрали поезда.", "b": false, "n": "14.20.8"}, {"t": "14.20.9 Отпуск автоматических тормозов после служебных торможений, в т.ч. и после проверки автотормозов в пути следования МВПС, оборудованном воздухораспределителем пассажирского типа с бесступенчатым отпуском, в поездах 6 и более вагонов производить переводом ручки крана машиниста из положения поддержания в тормозной магистрали установленного давления после торможения независимо от утечек сжатого воздуха из тормозной магистрали после торможения в положение временного повышения давления сжатого воздуха в тормозной магистрали до величины, установленного зарядного давления с последующим переводом в поездное положение, а в поездах менее шести вагонов - постановкой ручки крана машиниста в положение обеспечивающее повышение давления в тормозной магистрали выше зарядного значения на 1-2 секунды с последующим перемещением ее в поездное положение.", "b": false, "n": "14.20.9"}, {"t": "14.20.10 В поездах, состоящих из 6 и более вагонов при отпуске автоматических тормозов после экстренного торможения ручку крана машиниста выдержать в положении, обеспечивающем повышение давления в тормозной магистрали выше зарядного значения до получения давления в уравнительном резервуаре до 0,15 МПа (1,5 кгс/см2) после чего ручку крана машиниста перевести в поездное положение, а в поездах состоящих из менее 6 вагонов - после экстренного торможения временно перекрыть разобщительный кран на тормозной магистрали, орган управления крана машиниста перевести в положение, обеспечивающее повышение давления в тормозной магистрали выше зарядного значения и после повышения давления в уравнительном резервуаре до установленного зарядного давления орган управления крана машиниста перевести в поездное положение и открыть разобщительный кран на тормозной магистрали и зарядить тормозную магистраль поезда.", "b": false, "n": "14.20.10"}, {"t": "14.20.11 Для обеспечения точности торможения к месту остановки при скоростях движения менее 20 км/ч при зелёном сигнале разрешается применять отпуск автотормозов путём кратковременного перевода ручки крана машиниста в поездное положение на 2-3 секунды с последующим переводом в положение перекрыши.", "b": false, "n": "14.20.11"}, {"t": "14.20.12 Отпуск автотормозов после служебных и экстренных торможений, в т.ч. и после проверки автотормозов в пути следования МВПС, оборудованном воздухораспределителем пассажирского типа со ступенчатым отпуском производить постановкой ручки управления тормозами в поездное положение или иное, указанное в руководстве по эксплуатации конкретного типа подвижного состава.", "b": false, "n": "14.20.12"}, {"t": "14.21 Управление электропневматическими тормозами моторвагонного подвижного состава", "b": false, "n": "14.21"}, {"t": "14.21.1 Для проверки действия электропневматических тормозов в пути следования МВПС, оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском, выполнить ступень торможения кратковременным перемещением ручки крана машиниста (или другого органа управления электропневматическим тормозом) из поездного положения в положение служебного торможения электропневматическим тормозом, до создания давления воздуха в тормозных цилиндрах (тормозных блоках) головного вагона 0,10 - 0,15 МПа (1,0-1,5 кгс/см2), после чего ручку крана машиниста перевести в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения (при управлении электропневматическим тормозом с отдельного устройства – в положение «Перекрыша», а для МВПС, оборудованного воздухораспределителем пассажирского типа со ступенчатым отпуском поставить в положение в соответствии с требованиями руководства по эксплуатации, согласованном владельцем инфраструктуры.", "b": false, "n": "14.21.1"}, {"t": "После появления тормозного эффекта и снижения скорости на 10 км/ч выполнить отпуск тормозов кроме торможения применяемого при подходе к первому остановочному пункту.", "b": false, "n": ""}, {"t": "14.21.2 После отпуска электропневматического тормоза орган управления тормозами должен находиться в поездном положении. При этом машинисту непрерывно должна предоставляться информация (подачей светового сигнала, информация от системы диагностики или др. путем) о исправности электрической цепи электропневматического тормоза.", "b": false, "n": "14.21.2"}, {"t": "14.21.3 Если при торможении или в пути следования поступит информация о неисправности цепи электропневматического тормоза, необходимо перейти на автоматические тормоза, выключив электропневматический тормоз.", "b": false, "n": "14.21.3"}, {"t": "14.21.4 При движении поезда по перегону, в случае невозможности применения электрического или гидродинамического тормоза, для регулирования скорости и остановки производить ступенчатое торможение и ступенчатый отпуск тормозов, причем первую ступень торможения в зависимости от скорости и условий сцепления колес с рельсами выполнять повышением давления в тормозных цилиндрах (тормозных блоках) до 0,15 МПа (1,5 кгс/см2) с последующим повышением (при необходимости) ступенями до полного давления.", "b": false, "n": "14.21.4"}, {"t": "Ступенчатое торможение электропневматическим тормозом МВПС, оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском выполнять кратковременным перемещением ручки крана машиниста из поездного положения в положение служебного торможения электропневматическим тормозом. По достижении в тормозных цилиндрах (тормозных блоках) требуемого давления орган управления электропневматическим тормозом перевести в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения. На МВПС, оборудованном отдельным устройством управления электропневматическим тормозом, ступенчатое торможение выполнять кратковременным перемещением органа управления электропневматическим тормозом из поездного положения в положение «Торможение», а при достижении в тормозных цилиндрах (тормозных блоках) требуемого давления - в положение «Перекрыша».", "b": false, "n": ""}, {"t": "Ступенчатое торможение МВПС, оборудованного воздухораспределителем пассажирского типа со ступенчатым отпуском выполнять путем установки органа управления тормозами в необходимое положение в соответствии с руководством по эксплуатации конкретного типа подвижного состава, согласованного владельцем инфраструктуры.", "b": false, "n": ""}, {"t": "14.21.5 Полный отпуск электропневматических тормозов после служебных торможений МВПС оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском, в т.ч. и после проверки электропневматических тормозов в пути следования, производить переводом органа управления крана машиниста в положение, обеспечивающее повышение давления в тормозной магистрали выше зарядного значения на 1 - 2 секунды с последующим переводом органа управления крана машиниста в поездное положение. Отпуск тормозов контролировать по индикатору системы контроля тормоза хвостового вагона и данным давления тормозного цилиндра (тормозного блока) головного вагона.", "b": false, "n": "14.21.5"}, {"t": "При управлении электропневматическим тормозом органами управления, не связанными с краном машиниста, кран машиниста должен находиться в поездном положении, а полный отпуск производить установкой в положение «Отпуск».", "b": false, "n": ""}, {"t": "Таким же порядком производиться отпуск тормозов при срабатывании электрических схем дотормаживания и замещения при управлении электрическим или гидродинамическим тормозом.", "b": false, "n": ""}, {"t": "Полный отпуск электропневматических тормозов после служебных торможений МВПС, оборудованного воздухораспределителем пассажирского типа со ступенчатым отпуском в т.ч. и после проверки электропневматических тормозов в пути следования, выполнять постановкой органа управления тормозами поездное положение.", "b": false, "n": ""}, {"t": "14.21.6 При остановке на уклоне отпуск тормозов МВПС необходимо выполнять с расчётом начала движения его при минимальном давлении в тормозном цилиндре 0,03 - 0,05 МПа (0,3 - 0,5 кгс/см2).", "b": false, "n": "14.21.6"}, {"t": "14.21.7 Полное служебное торможение МВПС оборудованного воздухораспределителем пассажирского типа с бесступенчатым отпуском в один приём выполнять перемещением органа управления крана машиниста (или другого органа управления электропневматическим тормозом) в положение служебного торможения электропневматическим тормозом до получения полного давления в тормозных цилиндрах (тормозных блоках), с последующим переводом её в положение, обеспечивающее поддержание заданного давления в тормозной магистрали после торможения, а орган управления электропневматического тормоза - в положение «Перекрыша». Этот вид торможения применять при необходимости остановки поезда или снижения его скорости на более коротком расстоянии, чем при выполнении ступенчатого торможения.", "b": false, "n": "14.21.7"}, {"t": "Полное служебное торможение МВПС оборудованного воздухораспределителем пассажирского типа со ступенчатым отпуском выполнять путем перемещения органа управления тормозами в положение служебного торможения.", "b": false, "n": ""}, {"t": "14.21.8 В пути следования машинист должен контролировать нормальное действие электропневматического тормоза по сигнальным лампам или информации системы диагностики тормозов МВПС.", "b": false, "n": "14.21.8"}, {"t": "При недостаточной эффективности действия электропневматического тормоза или неудовлетворительной плавности торможения, самопроизвольном отпуске при следовании в режиме торможения, а также при поступлении информации о неисправности или отказе необходимо перейти на автоматические тормоза.", "b": false, "n": ""}, {"t": "14.21.9 При остановочных торможениях МВПС оборудованного краном машиниста воздухораспределителем пассажирского типа с бесступенчатым отпуском перед запрещающими сигналами, а также при следовании на тупиковый путь после выполнения ступени торможения следует выполнять постановкой ручки крана машиниста в положение служебного торможения с применением электропневматического тормоза; по достижении необходимого давления в тормозных цилиндрах (тормозных блоках) ручку крана машиниста следует устанавливать в положение, не обеспечивающее поддержание заданного давления в тормозной магистрали после торможения.", "b": false, "n": "14.21.9"}, {"t": "Остановочные торможения МВПС воздухораспределителем пассажирского типа со ступенчатым отпуском перед запрещающими сигналами, а также при следовании на тупиковый путь необходимо выполнять постановкой ручки крана машиниста в положение служебного торможения.", "b": false, "n": ""}, {"t": "14.21.10 Разрешается применение электрического тормоза МВПС без применения комбинированного торможения поезда при следовании к светофору с запрещающим показанием, но не ближе 400 м до светофора.", "b": false, "n": "14.21.10"}, {"t": "При комбинированном торможении разрешается применение электрического (гидродинамического) тормоза до остановки поезда у светофора с запрещающим показанием.", "b": false, "n": ""}, {"t": "При подъезде к запрещающему сигналу или предельному столбику полный отпуск тормозов выполнять только после остановки поезда.", "b": false, "n": ""}, {"t": "14.22 Управление вспомогательными тормозами моторвагонного подвижного состава", "b": false, "n": "14.22"}, {"t": "14.22.1 При наличии на МВПС крана вспомогательного тормоза он должен быть использован в пути следования при отказе автоматического и электропневматического тормозов.", "b": false, "n": "14.22.1"}, {"t": "14.22.2 Машинист при отказе автоматического и электропневматического тормозов должен остановить МВПС переводом органа управления крана вспомогательного тормоза в крайнее тормозное положение.", "b": false, "n": "14.22.2"}, {"t": "14.22.3 Дальнейшее управление тормозом осуществлять краном вспомогательного тормоза. При этом при следовании двумя вагонами и более скорость движения должна быть не более 30 км/ч, при условии, что автоматические тормоза остальных вагонов (рельсовых автобусов) исправны.", "b": false, "n": "14.22.3"}, {"t": "14.23 Требования по обслуживанию тормозов МВПС оборудованного воздухораспределителями пассажирского типа со ступенчатым отпуском и управление ими в пути следования должны быть указаны в документе владельца подвижного состава, согласованном владельцем инфраструктуры.", "b": false, "n": "14.23"}]}, {"id": "tb15", "cat": "tm_mvps", "page": 0, "pages": [], "title": "15 Особенности технического обслуживания и управления тормозами моторвагоного подвижного состав в зимнее время", "steps": [], "notes": [], "kind": "doc", "src": "Правила по тормозам, 2025, стр. 160–162", "paras": [{"t": "15.1 Для обеспечения исправности тормозного оборудования МВПС в зимних условиях необходимо образовавшийся на деталях тормоза и рычажной передачи локомотива (МВПС) лед должен быть удален при первой возможности (при стоянке на станции, в оборотном пункте и т. д.).", "b": false, "n": "15.1"}, {"t": "15.2 Порядок отогревания замерзших мест тормозного оборудования.", "b": false, "n": "15.2"}, {"t": "15.2.1 На электропоездах разрешается отогревать главные резервуары, нагнетательные, питательные, перепускные трубы и магистральный воздухопровод открытым огнем при условии соблюдения правил пожарной безопасности, исключающих возможность воспламенения конструктивных элементов.", "b": false, "n": "15.2.1"}, {"t": "15.2.2 На дизель-поездах, рельсовых автобусах допускается применение открытого огня только для отогревания в тормозной системе тех замерзших мест, которые находятся на расстоянии не менее 2 метров от баков топлива, топливо- и маслоподающей арматуры, масло- и топливопроводов, аккумуляторных батарей.", "b": false, "n": "15.2.2"}, {"t": "15.2.3 Запрещается пользоваться открытым огнем для отогревания тормозного оборудования МВПС в местах их стоянки при наличии разлитых на путях легковоспламеняющихся и горючих жидкостей в пунктах экипировки локомотивов жидким топливом, вблизи сливно-наливных устройств, парков с резервуарами для нефтепродуктов, складов легкогорючих материалов и других пожароопасных мест, а также при наличии на соседних путях вагонов с разрядными, огнеопасными и наливными грузами.", "b": false, "n": "15.2.3"}, {"t": "15.2.4 В случае замерзания магистрального воздухопровода, прежде всего, необходимо обстучать его легкими ударами молотка - глухой звук указывает на наличие ледяной пробки. Такое место воздухопровода надо отогреть, после чего продуть магистраль через концевые краны до полного удаления ледяной пробки.", "b": false, "n": "15.2.4"}, {"t": "15.2.5 Отогревать огнем главные резервуары, нагнетательную, питательную и перепускную трубы можно только после выпуска из них сжатого воздуха и при закрытых выпускных кранах. Открывать краны разрешается только после удаления огня.", "b": false, "n": "15.2.5"}, {"t": "15.2.6 Замерзшие соединительные рукава воздухопроводов снять, отогреть и вновь поставить или заменить запасными.", "b": false, "n": "15.2.6"}, {"t": "15.2.7 При замерзании воздухораспределителя выключить его и выпустить воздух из рабочих объемов выпускным клапаном до полного ухода штока тормозного цилиндра, после чего воздухораспределитель заменить на ближайшем пункте технического обслуживания.", "b": false, "n": "15.2.7"}, {"t": "Запрещается отогревать открытым огнем замерзшие тормозные приборы и их узлы.", "b": false, "n": ""}, {"t": "15.2.8 При замерзании одного из тормозных цилиндров (тормозного блока) необходимо воздухораспределитель оставить включенным и продолжать работать с оставшимися тормозными цилиндрами (тормозными блоками). По прибытии в депо неисправность тормозного цилиндра (тормозного блока) устранить.", "b": false, "n": "15.2.8"}, {"t": "15.2.9 Во всех случаях обнаружения неисправности тормоза при невозможности ее устранения машинист лично должен выключить тормоз, полностью выпустить воздух выпускными клапанами и проверить отход тормозных колодок от колес (накладок от дисков).", "b": false, "n": "15.2.9"}, {"t": "Неисправность тормозного оборудования должна быть устранена на ближайших станциях, где имеется депо или пункт технического обслуживания.", "b": false, "n": ""}, {"t": "15.3 Особенности управления тормозами зимой", "b": false, "n": "15.3"}, {"t": "15.3.1 В МВПС при проверке действия автотормозов в пути следования снижать давление в уравнительном резервуаре на 0,05 - 0,06 МПа (0,5 - 0,6 кгс/см2), а при проверке действия электропневматических тормозов давление в тормозных цилиндрах (тормозного блока) головного вагона МВПС должно быть 0,10 - 0,15 МПа (1,0 - 1,5 кгс/см2).", "b": false, "n": "15.3.1"}, {"t": "В МВПС оборудованного композиционными тормозными колодками или при наличии в составе вагонов с дисковыми тормозами проверку действия автотормозов производить снижением давления в уравнительном резервуаре на 0,06 - 0,07 МПа (0,6 - 0,7 кгс/см2), а электропневматических тормозов – при давлении в тормозных цилиндрах (тормозных блоках) головного вагона МВПС 0,20 - 0,25 МПа (2,0 - 2,5 кгс/см2).", "b": false, "n": ""}, {"t": "15.3.2 У рельсовых автобусов РА-1 в зимний период эксплуатации проверку действия автоматического тормоза в пути следования производить постановкой органа управления крана машиниста в четвертое положение, обеспечивающее снижение давления в тормозной магистрали до 0,39 МПа (4,0кгс/см2).", "b": false, "n": "15.3.2"}, {"t": "15.3.3 При наличии снежного покрова выше головки рельса, перед проверкой действия автотормозов поездов выполнять торможение для удаления снега и льда с поверхности трения колодок или накладок. Если такое торможение до проверки действия невозможно, то отсчет расстояния, проходимого поездом в процессе снижения скорости на 10 км/ч, или времени этого снижения производить с начала снижения скорости, но не позже проследования поездом расстояния 200 - 250 м после начала торможения.", "b": false, "n": "15.3.3"}, {"t": "15.3.4 При снегопаде, свежевыпавшем снеге, уровень которого превышает уровень головок рельсов, пурге, снежных заносах до торможения перед входом на станцию или перед следованием по спуску выполнять торможение для проверки работы автотормозов, если время следования поезда без торможения до этого превышает 1200 секунд (20 минут), а рельсового автобуса РА-1, РА 2 и РА3 – 300 секунд (5 минут).", "b": false, "n": "15.3.4"}, {"t": "15.3.5 При ступени торможения более 0,10 МПа (1,0 кгс/см2) при инее, гололеде, когда сила сцепления колес с рельсами снижается, необходимо предварительно за 50-100 м до начала торможения приводить в действие песочницу и подавать на рельсы песок до остановки поезда или о
